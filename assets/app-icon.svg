<!-- P2-05: the app icon's ONE source -- "KB" from the KNUCKLEBALL wordmark (Black Ops One, white on --brand-bg), Joel
     Oct 15 2026, standing in until his logo. Every icon size and every iOS splash image is rendered from this by
     scripts/splash.js -- replace this file, re-run the script, bump CACHE_VERSION. Square, full bleed (no transparency:
     iOS fills it black); the letters stay inside the middle 80% so the Android "maskable" crop never cuts them. -->
