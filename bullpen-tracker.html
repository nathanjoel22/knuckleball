  const pitch = state.activeSession.pitches[realIdx];
  if(!pitch){ state.editDraftRow = null; render(); return; }
  const typeEl = document.getElementById('edit-draft-type');
  const veloEl = document.getElementById('edit-draft-velo');
  if(typeEl && typeEl.value) pitch.type = typeEl.value;
  if(veloEl){
    const raw = veloEl.value.trim();
    if(raw === '' || !Number.isFinite(Number(raw))){
      pitch.velo = null;                       // blank or non-numeric: no reading, never 0
    } else {
      const n = Number(raw);
      if(!Number.isInteger(n) || n < VELO_MIN || n > VELO_MAX){
        state.editVeloError = `Enter a whole number from ${VELO_MIN} to ${VELO_MAX} mph.`;
        state.editVeloDraft = raw;
        render();
        return;                                // rejected: nothing is saved
      }
      pitch.velo = n;
    }
  }
  state.editVeloError = '';
  state.editDraftRow = null;
  await storSet(draftKey(), state.activeSession);
  render();
};
// Back-compat: the newest-row quick action used to be "Undo".
window.undoLastPitch = function(){ return window.removePitch(state.activeSession.pitches.length - 1); };

window.endSession = async function(){
  if(!state.activeSession.pitches.length){ state.hint = 'Log at least one pitch before ending the session'; render(); return; }
  // Setting saving=true and painting it before any await closes the only
  // reentrancy gap a double-tap could hit here (storSet below is async but
  // does no real I/O, so this is mostly belt-and-suspenders).
  state.saving = true;
  state.hint = '';
  render();

  // Ending a session never waits on the network: it moves straight into
  // the offline outbox (queue-and-sync, P1-01) and the UI moves on
  // immediately. A background sync attempt follows, and reconnecting later
  // (or reopening the app, or tapping "Sync now") retries anything still
  // queued -- see syncOutbox().
  const sessionId = genUUID();
  const item = {
    id: sessionId,
    pitcherId: state.currentPitcherId,
    teamId: state.currentTeamId,
    loggedBy: state.profile.id,
    startedAt: state.activeSession.startedAt,
    endedAt: Date.now(),
    pitches: state.activeSession.pitches,
    chartingPerspective: sessionPerspective(state.activeSession),
    queuedAt: Date.now(),
    lastError: null,
    lastAttemptAt: null
  };
  await enqueueOutboxItem(state.session.user.id, item);
  await storDelete(draftKey());

  await appendVeloHistory(item.pitcherId, item.teamId, item.pitches);

  state.activeSession = await freshActiveSession();
  state.selectedType = null;
  state.pendingTarget = null;
  state.veloTargetIdx = null;
  state.editDraftRow = null;
  state.saving = false;
  await refreshOutboxState();
  state.view = 'history';
  state.expandedSessionId = sessionId;
  render();

  triggerSync();
};

/* ---------- DELETE A SAVED SESSION (P1-15) ----------
   Synced sessions only. Soft-deletes the session (a tombstone stays in
   history) and hard-deletes its pitches, atomically, via the
   delete_session RPC -- which re-checks entitlement under the caller's
   own RLS. Pitch data is never editable after save; this is the only
   post-save mutation. A queued/unsynced session isn't in the DB yet, so
   none of this touches the P1-01 outbox. */
window.startDeleteSession = function(sessionId){
  state.deletingSessionId = sessionId;
  state.deleteConfirmText = '';
  state.deleteError = null;
  render();
};
window.cancelDeleteSession = function(){
  clearDeleteState();
  render();
};
window.onDeleteConfirmInput = function(v){ state.deleteConfirmText = v; };
window.confirmDeleteSession = async function(){
  const el = document.getElementById('delete-confirm-input');
  if(el) state.deleteConfirmText = el.value;
  if(state.deleteConfirmText.trim().toUpperCase() !== 'DELETE'){
    state.deleteError = 'Type DELETE to confirm.';
    render();
    return;
  }
  const id = state.deletingSessionId;
  state.deleteBusy = true;
  state.deleteError = null;
  render();

  const { data, error } = await supabaseClient.rpc('delete_session', { p_session_id: id });
  state.deleteBusy = false;
  if(error || (data && data.error)){
    state.deleteError = 'Could not delete: ' + ((error && error.message) || data.error);
    render();
    return;
  }

  clearDeleteState();
  if(state.expandedSessionId === id) state.expandedSessionId = null;
  await loadSessionsForCurrentSelection();
  render();
};

/* ---------- OFFLINE OUTBOX + SYNC (P1-01) ----------
   A completed session lands here the instant "End session" is tapped, so
   finishing a session never blocks on the network. Each item's id is the
   session's own client-generated UUID and every write below is an upsert
   keyed on that id (pitches keyed on their own ids), so a sync that runs
   twice -- a retry, two triggers overlapping, a reconnect mid-attempt --
   just re-upserts the same rows instead of duplicating them. Scoped per
   signed-in user (not per pitcher/team) so a coach's device can queue
   sessions for several pitchers at once and a shared device switching
   accounts doesn't mix their queues. */
function outboxKey(userId){ return 'outbox:' + userId; }
async function loadOutbox(userId){ return (await storGet(outboxKey(userId))) || []; }
async function enqueueOutboxItem(userId, item){
  const items = await loadOutbox(userId);
  items.push(item);
  await storSet(outboxKey(userId), items);
}
async function updateOutboxItem(userId, updated){
  const items = await loadOutbox(userId);
  const idx = items.findIndex(i => i.id === updated.id);
  if(idx >= 0){ items[idx] = updated; await storSet(outboxKey(userId), items); }
}
async function removeOutboxItem(userId, id){
  const items = await loadOutbox(userId);
  await storSet(outboxKey(userId), items.filter(i => i.id !== id));
}
async function refreshOutboxState(){
  state.outbox = state.session ? await loadOutbox(state.session.user.id) : [];
}
function pendingSessionsForCurrentSelection(){
  return state.outbox
    .filter(item => item.pitcherId === state.currentPitcherId && item.teamId === state.currentTeamId)
    .map(item => ({
      id: item.id,
      date: item.endedAt,
      loggedByCoach: item.loggedBy !== item.pitcherId,
      pitches: item.pitches,
      pending: true,
      lastError: item.lastError
    }));
}

let syncInFlight = null;
window.triggerSync = function(){
  if(!syncInFlight){
    syncInFlight = syncOutbox()
      .catch(err => console.error('syncOutbox failed', err))
      .finally(() => { syncInFlight = null; });
  }
  return syncInFlight;
};

async function syncOutbox(){
  if(!state.session) return;
  // Fail fast instead of hanging on a fetch that has no real network to
  // time out against -- navigator.onLine is only a heuristic (it can say
  // true with no real internet), so this is purely a fast-exit when it's
  // confidently false; a false positive just falls through to the normal
  // attempt-and-fail path below, same as without this check.
  if(typeof navigator !== 'undefined' && navigator.onLine === false) return;
  const userId = state.session.user.id;

  // A device that's been offline long enough for its access token to
  // expire needs a fresh one before Supabase will accept these writes --
  // try that first so a reconnect after a long outage doesn't need an
  // extra manual retry. Harmless no-op if the session is still fresh.
  // Bounded (P1-13): getSession() retries a failed refresh for ~20-30s,
  // and this runs at startup via finishInit() -- don't let it stall the
  // "Syncing…" state on a dead network; the upserts below fail fast enough.
  try{
    const { data: refreshed } = await netTimeout(supabaseClient.auth.getSession());
    if(refreshed && refreshed.session) state.session = refreshed.session;
  }catch(e){ /* keep the current session and let the writes below try */ }

  const items = await loadOutbox(userId);
  if(!items.length) return;

  state.syncing = true;
  render();

  for(const item of items){
    const sessionRow = {
      id: item.id,
      pitcher_id: item.pitcherId,
      team_id: item.teamId,
      logged_by: item.loggedBy,
      started_at: new Date(item.startedAt).toISOString(),
      ended_at: new Date(item.endedAt).toISOString(),
      // Defensive fallback: an outbox item queued before U5 shipped won't
      // carry this field.
      charting_perspective: item.chartingPerspective || 'behind_catcher'
    };
    const pitchRows = item.pitches.map(p => ({
      id: p.id,
      session_id: item.id, type: p.type, velo: p.velo,
      target_row: p.targetRow, target_col: p.targetCol,
      actual_row: p.actualRow, actual_col: p.actualCol,
      accuracy_mode: p.accuracyMode || null,
      in_accuracy_zone: (p.inAccuracyZone === true || p.inAccuracyZone === false) ? p.inAccuracyZone : null,
      accuracy_zone_cells: p.accuracyZoneCells || null,
      // U2a: per-pitch, not per-session (see the migration's comment) --
      // null for a pitch queued before this shipped, same defensive
      // fallback pattern as charting_perspective above.
      batter_side: p.batterSide || null,
      ts: new Date(p.ts).toISOString()
    }));
    try{
      const { error: sessErr } = await supabaseClient.from('sessions').upsert(sessionRow, { onConflict: 'id' });
      if(sessErr) throw sessErr;
      const { error: pitchErr } = await supabaseClient.from('pitches').upsert(pitchRows, { onConflict: 'id' });
      if(pitchErr) throw pitchErr;
      await removeOutboxItem(userId, item.id);
    } catch(err){
      await updateOutboxItem(userId, Object.assign({}, item, {
        lastError: (err && err.message) || String(err),
        lastAttemptAt: Date.now()
      }));
    }
  }

  await refreshOutboxState();
  await loadSessionsForCurrentSelection();
  state.syncing = false;
  render();
}

/* ---------- LOAD SESSIONS (works for coach viewing a pitcher, or a pitcher viewing self) ---------- */
async function loadSessionsForCurrentSelection(){
  const pitcherId = state.currentPitcherId;
  const teamId = state.currentTeamId;
  if(!pitcherId || !teamId){ state.sessions = []; state.deletedSessions = []; return; }
  const { data, error } = await supabaseClient
    .from('sessions')
    .select('id, started_at, pitcher_id, logged_by, deleted_at, deleted_by_role, pitch_count, charting_perspective, report_path, pitches(type, velo, target_row, target_col, actual_row, actual_col, accuracy_mode, batter_side, in_accuracy_zone, accuracy_zone_cells, ts)')
    .eq('pitcher_id', pitcherId)
    .eq('team_id', teamId)
    .order('started_at', { ascending: false });
  if(error){ console.error(error); state.sessions = []; state.deletedSessions = []; return; }
  const all = (data || []).map(s => ({
    id: s.id,
    date: new Date(s.started_at).getTime(),
    loggedByCoach: s.logged_by !== s.pitcher_id,
    deletedAt: s.deleted_at ? new Date(s.deleted_at).getTime() : null,
    deletedByRole: s.deleted_by_role || null,
    pitchCount: s.pitch_count,
    // Not used to adjust rendering (history/heat-map always shows canonical
    // coordinates unmirrored, see mirrorCol's comment) -- carried through
    // for data fidelity and SQL-verifiability only.
    chartingPerspective: s.charting_perspective,
    // U4b: set the first time a report is generated for this session, never
    // after -- send-session-report reuses the same frozen file on every
    // resend. Non-null means "View report" can open it directly, no email
    // round-trip required.
    reportPath: s.report_path || null,
    pitches: (s.pitches || []).map(p => ({
      type: p.type, velo: p.velo,
      targetRow: p.target_row, targetCol: p.target_col,
      actualRow: p.actual_row, actualCol: p.actual_col,
      accuracyMode: p.accuracy_mode || null,
      inAccuracyZone: (p.in_accuracy_zone === true || p.in_accuracy_zone === false) ? p.in_accuracy_zone : null,
      accuracyZoneCells: p.accuracy_zone_cells || null,
      // U2a: NULL on legacy pitches, on purpose (no default, no backfill --
      // see the migration). isRelativelyAccurate falls back to 'R' itself
      // when this is absent, so legacy sessions keep reporting exactly as
      // they did before this shipped.
      batterSide: p.batter_side || null,
      ts: new Date(p.ts).getTime()
    }))
  }));
  // P1-15: soft-deleted sessions never enter state.sessions, so every existing
  // calc (stats, trends, report history) excludes them for free. They render
  // only as tombstones in the history view.
  state.sessions = all.filter(s => !s.deletedAt);
  rebuildVeloHistory(state.sessions).catch(e => console.error('velo history cache failed', e));
  state.deletedSessions = all.filter(s => s.deletedAt);
}

/* ---------- NAV ---------- */
// Drop a half-finished delete confirmation (P1-15) whenever the session
// context changes.
function clearDeleteState(){
  state.deletingSessionId = null;
  state.deleteConfirmText = '';
  state.deleteError = null;
}
window.setView = function(v){
  if(v === 'leaderboard' && !hasLeaderboard()) v = 'session';
  state.view = v; state.profileMsg = ''; state.uniformEditKey = null; state.lbExcludeOpen = null; clearDeleteState(); render();
  if(v === 'leaderboard') loadLeaderboard();
};
window.toggleSessionExpand = function(id){
  state.expandedSessionId = state.expandedSessionId === id ? null : id;
  clearDeleteState();
  render();
};

/* ---------- STATS HELPERS ---------- */
function sessionStats(pitches){
  const total = pitches.length;
  const strikes = pitches.filter(p => isStrikeCell(p.actualRow, p.actualCol)).length;
  const accurate = pitches.filter(isAccurate).length;
  const relativeAccurate = pitches.filter(isRelativelyAccurate).length;
  const usesRelativeMode = pitches.some(p => p.accuracyMode);
  // U7B: relative accuracy (zone-based) reads the STORED result (never recomputed from today's zones), and only
  // over pitches that had a zone -- so the denominator is shown alongside the percentage.
  const zonePitches = pitches.filter(p => p.inAccuracyZone === true || p.inAccuracyZone === false);
  const zoneTotal = zonePitches.length;
  const zoneHits = zonePitches.filter(p => p.inAccuracyZone === true).length;
  const velos = pitches.filter(p => !isDefaultVeloReading(p)).map(p => p.velo).filter(v => v !== null && v !== undefined);
  const hasVelo = velos.length > 0;
  const avgVelo = hasVelo ? Math.round(velos.reduce((a,b)=>a+b,0) / velos.length) : null;
  const minVelo = hasVelo ? Math.min(...velos) : null;
  const maxVelo = hasVelo ? Math.max(...velos) : null;
  const byType = {};
  pitches.forEach(p => {
    if(!byType[p.type]) byType[p.type] = { count:0, velos:[], strikes:0, accurate:0, relativeAccurate:0, zoneTotal:0, zoneHits:0 };
    if(p.inAccuracyZone === true || p.inAccuracyZone === false){ byType[p.type].zoneTotal++; if(p.inAccuracyZone) byType[p.type].zoneHits++; }
    byType[p.type].count++;
    if(p.velo !== null && p.velo !== undefined && !isDefaultVeloReading(p)) byType[p.type].velos.push(p.velo);
    if(isStrikeCell(p.actualRow, p.actualCol)) byType[p.type].strikes++;
    if(isAccurate(p)) byType[p.type].accurate++;
    if(isRelativelyAccurate(p)) byType[p.type].relativeAccurate++;
  });
  Object.values(byType).forEach(t => {
    t.hasVelo = t.velos.length > 0;
    t.avgVelo = t.hasVelo ? Math.round(t.velos.reduce((a,b)=>a+b,0) / t.velos.length) : null;
    t.minVelo = t.hasVelo ? Math.min(...t.velos) : null;
    t.maxVelo = t.hasVelo ? Math.max(...t.velos) : null;
    t.strikePct = Math.round((t.strikes / t.count) * 100);
    t.accuracyPct = Math.round((t.accurate / t.count) * 100);
    t.relativeAccuracyPct = Math.round((t.relativeAccurate / t.count) * 100);
    t.hasZone = t.zoneTotal > 0;
    t.zoneAccuracyPct = t.hasZone ? Math.round((t.zoneHits / t.zoneTotal) * 100) : null;
  });
  return {
    total, strikes, strikePct: total ? Math.round((strikes/total)*100) : 0,
    accurate, accuracyPct: total ? Math.round((accurate/total)*100) : 0,
    relativeAccurate, relativeAccuracyPct: total ? Math.round((relativeAccurate/total)*100) : 0,
    usesRelativeMode,
    hasZone: zoneTotal > 0, zoneTotal, zoneHits, zoneAccuracyPct: zoneTotal ? Math.round((zoneHits / zoneTotal) * 100) : null,
    hasVelo, avgVelo, minVelo, maxVelo, byType
  };
}
function heatCounts(pitches){
  const grid = {};
  pitches.forEach(p => { const k = p.actualRow + '-' + p.actualCol; grid[k] = (grid[k] || 0) + 1; });
  return grid;
}
function heatColor(intensity){
  const from = { r:142, g:197, b:232 };
  const to = { r:208, g:60, b:60 };
  const r = Math.round(from.r + (to.r - from.r) * intensity);
  const g = Math.round(from.g + (to.g - from.g) * intensity);
  const b = Math.round(from.b + (to.b - from.b) * intensity);
  return `rgb(${r},${g},${b})`;
}

/* ---------- RENDER: ZONE GRID ---------- */
function renderZoneGrid(pitches, clickable, flashCell, pendingTarget, chartingPerspective, batterSide){
  let cells = '';
  if(clickable){
    // U7B: on tap 1, light the pitcher's zone for (this pitch type, current batter side).
    // Zones are stored in catcher frame; the grid is drawn in the charter's screen frame.
    const gp = currentPitcher();
    const zoneNow = (pendingTarget && state.selectedType && gp && gp.relativeAccuracy)
      ? zoneCellsFor(state.currentPitcherId, state.selectedType, batterSide) : null;
    const glowCells = zoneNow
      ? new Set(zoneNow.map(k => { const [zr, zc] = k.split('-').map(Number); return zr + '-' + perspectiveCol(zc, chartingPerspective); }))
      : null;
    for(let row=0; row<GRID_SIZE; row++){
      for(let col=0; col<GRID_SIZE; col++){
        const inZone = isStrikeCell(row,col);
        // D8: the label at this SCREEN cell is whatever number its
        // catcher-frame equivalent would get -- the same perspectiveCol
        // conversion used at capture, so the number shown here is always
        // exactly the number that will end up in the pitch log for a tap
        // here (see the pitch-log comment below). Live batterSide, since
        // this is "what would the NEXT tap here be labeled right now."
        const num = zoneNumberFor(row, perspectiveCol(col, chartingPerspective), batterSide);
        const isTarget = pendingTarget && pendingTarget.row === row && pendingTarget.col === col;
        const isFlash = flashCell && flashCell.row === row && flashCell.col === col;
        const isGlow = glowCells && glowCells.has(row+'-'+col);
        let cls = 'zone-cell' + (inZone ? ' in-zone' : '') + ' clickable';
        let inner = num !== null ? `<span class="zone-number">${num}</span>` : '';
        if(isGlow) inner += `<span class="rel-glow-overlay"></span>`;
        if(isTarget){ cls += ' zone-cell-target'; inner += `<span class="target-dot"><span class="target-dot-core"></span></span>`; }
        if(isFlash){
          cls += flashCell.strike ? ' zone-cell-flash flash-strike' : ' zone-cell-flash flash-ball';
          inner += `<span class="flash-letter">${flashCell.strike ? 'K' : 'B'}</span>`;
        }
        cells += `<div class="${cls}" onclick="handleZoneTap(${row},${col})">${inner}</div>`;
      }
    }
  } else {
    const heat = heatCounts(pitches);
    const maxCount = Math.max(1, ...Object.values(heat));
    for(let row=0; row<GRID_SIZE; row++){
      for(let col=0; col<GRID_SIZE; col++){
        const key = row+'-'+col;
        const count = heat[key] || 0;
        const inZone = isStrikeCell(row,col);
        // D8: history/heat-map rows ARE stored (catcher-frame) coordinates
        // already -- no transform, always "Catcher's view" (see caption).
        const num = zoneNumberFor(row, col);
        const intensity = count / maxCount;
        const bg = `background:${heatColor(intensity)};opacity:${0.4 + 0.5*intensity};`;
        const cls = 'zone-cell' + (inZone ? ' in-zone' : '');
        const numLabel = num !== null ? `<span class="zone-number zone-number-heat">${num}</span>` : '';
        const countLabel = count > 0 ? `<span class="zone-count">${count}</span>` : '';
        cells += `<div class="${cls}" style="${bg}">${numLabel}${countLabel}</div>`;
      }
    }
  }
  const plate = renderHomePlate(chartingPerspective);
  // U2a: the silhouette is ALWAYS an absolutely-positioned child inside
  // .zone-grid (never a layout sibling -- that shipped once and pushed the
  // home plate out of position), only for the live/clickable grid. History
  // never passes a batterSide, so this is '' there, unchanged from before.
  const silhouette = clickable
    ? renderBatterSilhouette(batterSide, insideColumnOnScreenLeft(chartingPerspective, batterSide))
    : '';
  // Both live perspectives now draw the plate INSIDE .zone-grid (an extra
  // absolutely-positioned child, overlaying the cells) -- anchored to the
  // grid element itself, never to .zone-wrap (which carries the phone-only
  // margin-bottom reserving the batter-side pill's band; a percentage-
  // positioned plate against THAT would drift on phone widths). History
  // never passes a chartingPerspective, so it always falls through to the
  // unchanged, below-grid, non-translucent markup.
  return chartingPerspective
    ? `<div class="zone-grid">${cells}${plate}${silhouette}</div>`
    : `<div class="zone-grid">${cells}${silhouette}</div>${plate}`;
}

/* One pentagon shape for the live grid, in both perspectives -- CSS
   modifier classes (.behind-pitcher / .behind-catcher, see their own
   comments) reposition/rotate it, never a second hand-authored polygon.
   History/heat-map (chartingPerspective falsy) instead gets the original,
   unchanged, opaque below-grid plate -- that view always shows canonical,
   unmirrored data (see mirrorCol's comment), independent of any session's
   own perspective, so its plate stays independent of perspective too. */
function renderHomePlate(chartingPerspective){
  if(!chartingPerspective){
    return `<div class="home-plate-wrap"><svg class="home-plate" viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Home plate">
      <polygon points="4,4 96,4 96,32 50,56 4,32"></polygon>
    </svg></div>`;
  }
  const modeClass = chartingPerspective === 'behind_pitcher' ? 'behind-pitcher' : 'behind-catcher';
  const sideLabel = chartingPerspective === 'behind_pitcher' ? 'behind pitcher' : 'behind catcher';
  return `<svg class="home-plate-overlay ${modeClass}" viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Home plate (${sideLabel})">
    <polygon points="4,4 96,4 96,32 50,56 4,32"></polygon>
  </svg>`;
}

/* ---------- RENDER: SESSION VIEW (pitcher only) ---------- */
// U5: session-start "prompt" is a persistent, always-visible toggle (this
// codebase has no modal/dialog pattern anywhere) rather than a one-shot
// dismissible dialog -- pre-filled from the device's remembered last
// choice, locked once the first pitch is logged so the tap->storage mirror
// never has more than its one capture-time call site to worry about.
function renderPerspectiveToggle(){
  const current = sessionPerspective(state.activeSession);
  const locked = state.activeSession.pitches.length > 0;
  const opts = [
    { key: 'behind_catcher', label: 'Behind the catcher' },
    { key: 'behind_pitcher', label: 'Behind the pitcher' }
  ];
  const chips = opts.map(o => {
    const selected = current === o.key;
    // Unselected reads as plain, neutral chrome (dark ink text, not yellow -- yellow text
    // on the new light card background would fail the "accent only" rule); selected still
    // uses the amber fill with dark ink text, an allowed accent use.
    const style = selected ? `background:var(--amber);border-color:var(--amber);` : `color:var(--ink-faint);border-color:var(--border-strong);`;
    return `<button class="type-chip${selected?' selected':''}" style="${style}" ${locked?'disabled':''} onclick="selectPerspective('${o.key}')">${o.label}</button>`;
  }).join('');
  const lockedNote = locked ? `<p style="color:var(--ink-faint);font-size:11.5px;margin:6px 0 0;">Locked after the first pitch.</p>` : '';
  return `<div><div class="field-label" style="margin-bottom:8px;">Charting perspective</div><div class="chip-row">${chips}</div>${lockedNote}</div>`;
}

// U2a (D8): box "1" is always the inside column. Asking zoneNumberFor
// directly whether screen col 1 (the zone's leftmost) is currently
// labeled "1" -- through the SAME perspectiveCol conversion every other
// label uses -- is what makes the silhouette's side provably the same
// side as the 1/4/7 labels, with no second side-picking expression.
function insideColumnOnScreenLeft(chartingPerspective, batterSide){
  return zoneNumberFor(1, perspectiveCol(1, chartingPerspective), batterSide) === 1;
}

function renderSessionView(){
  const p = currentPitcher();
  if(state.draftAvailable){
    return `
      <div class="draft-banner">
        <p><strong>Unfinished session found</strong> — ${state.pendingDraft.pitches.length} pitch(es) logged. Resume where you left off, or discard and start fresh.</p>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-primary" onclick="resumeDraft()">Resume session</button>
          <button class="btn btn-ghost" onclick="discardDraft()">Discard</button>
        </div>
      </div>`;
  }
  const pitches = state.activeSession.pitches;
  const stats = sessionStats(pitches);
  const chartingPerspective = sessionPerspective(state.activeSession);
  const currentBatterSide = sessionBatterSide(state.activeSession);
  const typeChips = pitchTypesFor(p).map(t => {
    const color = colorForType(p, t);
    const selected = state.selectedType === t;
    return `<button class="type-chip${selected?' selected':''}" style="${selected ? `background:${color};border-color:${color};color:${readableTextOn(color)};` : `color:${color};border-color:${color}55;`}" onclick="selectType(${escHtml(JSON.stringify(t))})">${pitchLabel(t)}</button>`;
  }).join('');

  const logRows = pitches.slice().reverse().slice(0, 12).map((pt, i) => {
    const realIdx = pitches.length - 1 - i;
    const color = colorForType(p, pt.type);
    if(state.editDraftRow === realIdx){
      const typeOpts = pitchTypesFor(p).map(t =>
        `<option value="${escHtml(t)}" ${t===pt.type?'selected':''}>${pitchLabel(t)}</option>`).join('');
      return `<div class="pitch-log-row editing">
        <div class="edit-row-fields">
          <select id="edit-draft-type" class="edit-mini">${typeOpts}</select>
          <input id="edit-draft-velo" class="edit-mini edit-velo" type="number" inputmode="numeric" min="${VELO_MIN}" max="${VELO_MAX}" step="1"
            placeholder="mph" value="${state.editVeloError ? state.editVeloDraft : ((pt.velo!==null&&pt.velo!==undefined)?pt.velo:'')}">
        </div>
        ${state.editVeloError ? `<p class="edit-error">${state.editVeloError}</p>` : ''}
        <div class="edit-row-actions">
          <button class="undo-btn" onclick="saveEditDraftRow(${realIdx})">Save</button>
          <button class="undo-btn" onclick="cancelEditDraftRow()">Cancel</button>
        </div>
      </div>`;
    }
    const strike = isStrikeCell(pt.actualRow, pt.actualCol);
    const accurate = isAccurate(pt);
    const relAccurate = isRelativelyAccurate(pt);
    const veloText = (pt.velo !== null && pt.velo !== undefined) ? `${pt.velo} mph · ` : '— · ';
    // D8: pt.targetCol/actualCol are ALREADY catcher-frame (stored), so no
    // conversion here -- zoneNumberFor on the stored value directly
    // reproduces exactly the number the grid showed at the moment this
    // pitch was tapped (see the grid-legend comment above). Converting
    // again here (U5's original approach, before D8) would un-mirror it
    // back toward screen space and disagree with the grid's own label for
    // the same pitch.
    // U2a: THIS pitch's own recorded batterSide, not the live toggle --
    // flipping the toggle later must not relabel already-logged rows.
    const targetNum = zoneNumberFor(pt.targetRow, pt.targetCol, pt.batterSide || 'R');
    const actualNum = zoneNumberFor(pt.actualRow, pt.actualCol, pt.batterSide || 'R');
    const modeTag = pt.accuracyMode ? ` <span style="color:#7C9CBF;">[${ACCURACY_MODE_LABELS[pt.accuracyMode]}${relAccurate ? ' ✓' : ''}]</span>`
      : (pt.inAccuracyZone === true || pt.inAccuracyZone === false) ? ` <span style="color:#7C9CBF;">[Relative${pt.inAccuracyZone ? ' ✓' : ''}]</span>` : '';
    const locText = `${targetNum ? 'aimed '+targetNum : 'aimed ball'} → ${actualNum ? 'landed '+actualNum : 'landed ball'}${accurate ? ' ✓' : ''}${modeTag}`;
    return `<div class="pitch-log-row">
      <span><span class="plr-dot" style="background:${color}"></span><span class="mono">${pitchLabel(pt.type)}</span> · ${veloText}${strike ? 'Strike' : 'Ball'} · <span style="color:var(--ink-faint);">${locText}</span></span>
      <span class="pitch-row-actions">
        <button class="undo-btn" onclick="startEditDraftRow(${realIdx})">edit</button>
        <button class="row-x-btn" onclick="removePitch(${realIdx})" title="Remove this pitch" aria-label="Remove this pitch">✕</button>
      </span>
    </div>`;
  }).join('') || `<p style="color:var(--ink-faint);font-size:12.5px;">No pitches logged yet. Pick a type, then tap the zone.</p>`;

  const zoneCaption = state.pendingTarget
    ? `Now tap where it actually landed <a href="#" onclick="resetTarget();return false;" style="color:var(--amber);">(reset target)</a>`
    : `Tap where you're aiming`;

  return `
    <div class="session-grid-layout">
      <div class="panel controls-panel">
        ${renderPerspectiveToggle()}
        <div>
          <div class="field-label" style="margin-bottom:8px;">Pitch type</div>
          <div class="chip-row">${typeChips}</div>
          ${(p.pitchTypes && p.pitchTypes.length) ? '' : `<p class="mix-prompt">${isCoach()
            ? `${escHtml(p.name)} hasn't added any pitches yet. Add them in their profile to start charting.`
            : 'Add your pitches in Profile to start charting.'}</p>
          <button class="btn btn-ghost" onclick="${isCoach() ? 'openPitcherProfile()' : "setView('profile')"}">${isCoach() ? 'Open pitcher profile' : 'Open Profile'}</button>`}
        </div>
        <div class="accuracy-count-row">
          <div class="pitch-counter">
            <span class="pitch-counter-num pitch-count-badge mono">${stats.total}</span>
            <span class="field-label">Pitch count</span>
          </div>
        </div>
        <div class="hint-msg">${state.hint}</div>
        <div>
          <div class="zone-wrap">
            ${renderZoneGrid(pitches, true, state.flashCell, state.pendingTarget, chartingPerspective, currentBatterSide)}
            <div class="zone-caption">${zoneCaption}</div>
          </div>
        </div>
        ${sessionUsesRadarGun(state.activeSession) ? `<div>
          <div class="field-label" style="margin-bottom:8px;">Velocity</div>
          ${renderVeloStrip()}
        </div>` : ''}
      </div>
      <div class="panel log-panel">
        <div class="stat-readout">
          <div class="stat-box"><span class="stat-num mono">${stats.total}</span><span class="stat-lbl">Pitches</span></div>
          <div class="stat-box"><span class="stat-num mono">${stats.strikePct}%</span><span class="stat-lbl">Strikes</span></div>
          <div class="stat-box"><span class="stat-num mono">${stats.accuracyPct}%</span><span class="stat-lbl">Accuracy</span></div>
          ${(stats.usesRelativeMode && !stats.hasZone) ? `<div class="stat-box"><span class="stat-num mono">${stats.relativeAccuracyPct}%</span><span class="stat-lbl">Relative Acc.</span></div>` : ''}
          ${stats.hasZone ? `<div class="stat-box"><span class="stat-num mono">${stats.zoneAccuracyPct}%</span><span class="stat-lbl">Relative Acc. (${stats.zoneTotal})</span></div>` : ''}
          <div class="stat-box"><span class="stat-num mono">${stats.hasVelo ? stats.avgVelo : '—'}</span><span class="stat-lbl">Avg mph</span></div>
          <div class="stat-box"><span class="stat-num mono">${stats.hasVelo ? stats.minVelo+'–'+stats.maxVelo : '—'}</span><span class="stat-lbl">Range</span></div>
        </div>
        <div class="field-label">Recent pitches</div>
        <div class="pitch-log">${logRows}</div>
        <button class="btn btn-primary end-session-btn" ${state.saving ? 'disabled' : ''} onclick="endSession()">${state.saving ? 'Saving…' : 'End session & save'}</button>
      </div>
    </div>`;
}

  return `<span class="offline-pill">Offline · saved on this device</span>`;
}

      <span>${n} session${n === 1 ? '' : 's'} pending sync</span>

/* ---------- RENDER: ACCOUNT SETUP RECOVERY (P1-12) ---------- */
function renderAccountSetupScreen(){
  const attr = v => String(v || '').replace(/"/g, '&quot;');
  const busy = state.setupBusy ? 'disabled' : '';
  const err = state.setupError
    ? `<p class="invite-status invite-status-error">${state.setupError}</p>` : '';

  let title, blurb, fields, buttons;
  if(state.setupNeeded === 'team'){
    title = 'Create your team';
    blurb = 'Your account is set up, but it has no team yet. Name your team or program to finish.';
    fields = `
      <div><span class="field-label">Team / program name</span>
        <input id="setup-team" class="text-input" style="margin-top:5px;" value="${attr(state.setupTeam)}" placeholder="e.g. Cairn University Baseball"></div>`;
    buttons = `<button class="btn btn-primary" ${busy} onclick="submitAccountSetup('coach')">${state.setupBusy ? 'Creating…' : 'Create team'}</button>`;
  } else {
    title = 'Finish setting up your account';
    blurb = 'We couldn’t tell whether this account is a coach or a pitcher. Pick one and add your name to continue.';
    fields = `
      <div><span class="field-label">Your name</span>
        <input id="setup-name" class="text-input" style="margin-top:5px;" value="${attr(state.setupName)}" placeholder="Full name"></div>
      <div><span class="field-label">Team / program name <span style="text-transform:none;letter-spacing:0;">(coaches only)</span></span>
        <input id="setup-team" class="text-input" style="margin-top:5px;" value="${attr(state.setupTeam)}" placeholder="e.g. Cairn University Baseball"></div>`;
    buttons = `
      <button class="btn btn-primary" ${busy} onclick="submitAccountSetup('coach')">${state.setupBusy ? 'Setting up…' : 'I’m a coach'}</button>
      <button class="btn btn-ghost" ${busy} onclick="submitAccountSetup('pitcher')">I’m a pitcher</button>`;
  }

  return `
    <div class="main">
      <div class="empty-state" style="max-width:420px;margin:0 auto;">
        <div class="display" style="font-size:32px;">${title}</div>
        <p style="color:var(--ink-dim);font-size:14px;margin:0;">${blurb}</p>
        <div class="invite-form" style="width:100%;text-align:left;">
          ${fields}
          <div class="form-row-buttons">${buttons}</div>
          ${err}
        </div>
        <button class="sign-out-btn" style="margin-top:6px;" onclick="signOut()">Sign out</button>
      </div>
    </div>`;
}

/* ---------- RENDER: HISTORY VIEW ---------- */
function renderHistoryView(){
  const p = currentPitcher();
  if(!p){ return `<div class="empty-hist">No pitcher selected.</div>`; }
  const tombstones = state.deletedSessions.map(s => ({ ...s, tombstone: true }));
  const combined = pendingSessionsForCurrentSelection()
    .concat(state.sessions).concat(tombstones)
    .sort((a,b) => b.date - a.date);
  if(!combined.length){
    return `<div class="empty-hist">No saved sessions yet for ${escHtml(p.name)}${isCoach() ? '' : ' — finish a bullpen session to see it here'}.</div>`;
  }
  return combined.map(s => {
    const dateStr = new Date(s.date).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });

    // P1-15: a deleted session is a tombstone -- not expandable, no stats,
    // no report. It only records that an outing happened and was removed.
    if(s.tombstone){
      const by = s.deletedByRole === 'coach' ? 'the team' : 'the player';
      const delDate = s.deletedAt ? new Date(s.deletedAt).toLocaleDateString(undefined, { month:'short', day:'numeric' }) : '';
      return `
        <div class="session-card session-card-deleted">
          <div class="session-card-head" style="cursor:default;">
            <div class="session-date">${dateStr} <span class="deleted-tag">Deleted</span></div>
            <div class="deleted-meta">${s.pitchCount != null ? s.pitchCount : '—'} pitch${s.pitchCount === 1 ? '' : 'es'} thrown · removed by ${by}${delDate ? ' · ' + delDate : ''}</div>
          </div>
        </div>`;
    }

    const stats = sessionStats(s.pitches);
    const expanded = state.expandedSessionId === s.id;
    const typeRows = Object.entries(stats.byType).map(([type, t]) => {
      const color = colorForType(p, type);
      return `<tr><td><span class="plr-dot" style="background:${color}"></span>${escHtml(type)}</td><td class="mono">${t.count}</td><td class="mono">${t.hasVelo ? t.avgVelo+' mph' : '—'}</td><td class="mono">${t.hasVelo ? t.minVelo+'–'+t.maxVelo : '—'}</td><td class="mono">${t.strikePct}%</td><td class="mono">${t.accuracyPct}%</td><td class="mono">${stats.hasZone ? (t.hasZone ? t.zoneAccuracyPct + '% (' + t.zoneTotal + ')' : '—') : t.relativeAccuracyPct + '%'}</td></tr>`;
    }).join('');

    const contacts = p.contactEmails || {};
    // R0 item (g), revised after check 8 on staging, extended U4b Phase 2:
    // the block is on the WHOLE send, not just the pitcher's own address --
    // a report for an ineligible pitcher's session doesn't go to a coach or
    // pitching-coach address either, since the data's provenance isn't
    // trustworthy until the identity behind it is verified, AND (new) this
    // is a deliberate temporary restriction to team-affiliated pitchers
    // only, until solo accounts are supported. This is the UI half only;
    // the real enforcement is server-side in send-session-report, gated on
    // is_pitcher_report_eligible (a client can't bypass it by
    // hand-crafting a payload -- see that function).
    const pVerified = currentPitcherVerified(p);
    const pOnTeam = currentPitcherOnTeam(p);
    const callerVerified = currentCallerVerified();
    const pEligible = pVerified && pOnTeam && callerVerified;
    const emailList = pEligible
      ? [contacts.coach, contacts.pitchingCoach, contacts.pitcher].map(e => (e||'').trim()).filter(Boolean)
      : [];
    const rs = state.reportStatus && state.reportStatus.sessionId === s.id ? state.reportStatus : null;
    // U4b follow-up: viewing doesn't need any contact emails set (only
    // sending does) -- once a report exists it's a plain link; before that,
    // it's a button that generates one (gated on the same eligibility as
    // sending, since generating is the same server call either way).
    const viewControl = s.reportPath
      ? `<a class="btn btn-ghost" href="report.html?r=${encodeURIComponent(s.reportPath)}" target="_blank" rel="noopener">View report</a>`
      : (pEligible ? `<button class="btn btn-ghost" onclick="viewSessionReport('${s.id}')">View report</button>` : '');
    const reportPanel = s.pending ? `
      <div class="report-panel">
        <div class="field-label">Email this report</div>
        <p class="report-recipients">Available once this session has synced.</p>
        <button class="btn btn-primary" disabled>Send report</button>
      </div>` : `
      <div class="report-panel">
        <div class="field-label">Email this report</div>
        ${!pEligible
          ? `<p class="report-recipients" style="color:var(--clay);">${!pVerified
              ? `No report can be sent until ${escHtml(p.name)} verifies their email.`
              : !pOnTeam
                ? `No report can be sent until ${escHtml(p.name)} is on a team.`
                : `No report can be sent until you verify your own account email.`}</p>`
          : emailList.length
            ? `<p class="report-recipients">To: ${escHtml(emailList.join(', '))}</p>`
            : `<p class="report-recipients">No contact emails set for ${escHtml(p.name)} yet${isCoach() ? '' : ' — add them under Contacts above'}.</p>`}
        <div class="report-actions">
          <button class="btn btn-primary" ${emailList.length ? '' : 'disabled'} onclick="sendSessionReport('${s.id}')">Send report</button>
          ${viewControl}
        </div>
        ${rs ? `<p class="report-status report-status-${rs.status}">${rs.message}</p>` : ''}
      </div>`;

    const pendingTag = s.pending
      ? ` <span class="coach-logged-tag pending-tag">Pending sync${s.lastError ? ' · retrying' : ''}</span>`
      : '';

    // P1-15: delete a saved (synced) session. Pending sessions are left to
    // P1-01. No pitch editing anywhere -- delete is the only post-save action.
    const deleteZone = s.pending ? '' : (state.deletingSessionId === s.id ? `
      <div class="delete-zone">
        <p class="delete-warn">This permanently removes the ${stats.total} pitch${stats.total === 1 ? '' : 'es'} from the ${dateStr} session. A "deleted" marker stays in history. This can't be undone.</p>
        ${state.deleteError ? `<p class="report-status report-status-error" style="margin:0 0 8px;">${state.deleteError}</p>` : ''}
        <div class="delete-row">
          <input id="delete-confirm-input" class="text-input" style="max-width:150px;" placeholder="Type DELETE"
            value="${String(state.deleteConfirmText).replace(/"/g,'&quot;')}" oninput="onDeleteConfirmInput(this.value)">
          <button class="btn btn-primary" style="background:var(--red-bg);color:var(--chalk);" ${state.deleteBusy ? 'disabled' : ''} onclick="confirmDeleteSession()">${state.deleteBusy ? 'Deleting…' : 'Delete session'}</button>
          <button class="btn btn-ghost" ${state.deleteBusy ? 'disabled' : ''} onclick="cancelDeleteSession()">Cancel</button>
        </div>
      </div>` : `
      <div class="delete-zone"><button class="undo-btn" onclick="startDeleteSession('${s.id}')">Delete this session</button></div>`);

    return `
      <div class="session-card">
        <div class="session-card-head" onclick="toggleSessionExpand('${s.id}')">
          <div class="session-date">${dateStr}${s.loggedByCoach ? ' <span class="coach-logged-tag">Logged by coach</span>' : ''}${pendingTag}</div>
          <div class="session-meta">
            <div class="meta-item"><span class="meta-num mono">${stats.total}</span><span class="meta-lbl">Pitches</span></div>
            <div class="meta-item"><span class="meta-num mono">${stats.strikePct}%</span><span class="meta-lbl">Strikes</span></div>
            ${stats.hasZone
              ? `<div class="meta-item"><span class="meta-num mono">${stats.zoneAccuracyPct}%</span><span class="meta-lbl">Relative Acc. (${stats.zoneTotal})</span></div>
                 <div class="meta-item"><span class="meta-num mono">${stats.accuracyPct}%</span><span class="meta-lbl">Exact hit</span></div>`
              : `<div class="meta-item"><span class="meta-num mono">${stats.accuracyPct}%</span><span class="meta-lbl">Accuracy</span></div>`}
            <div class="meta-item"><span class="meta-num mono">${stats.hasVelo ? stats.avgVelo : '—'}</span><span class="meta-lbl">Avg mph</span></div>
          </div>
        </div>
        ${expanded ? `
        <div class="session-card-body">
          <div class="zone-wrap">${renderZoneGrid(s.pitches, false)}<div class="zone-caption">Location heat map · Catcher's view</div></div>
          <div style="flex:1;min-width:220px;">
            <table class="breakdown-table">
              <thead><tr><th>Type</th><th>Count</th><th>Avg</th><th>Range</th><th>Strike%</th><th>Accuracy%</th><th>Relative Acc%</th></tr></thead>
              <tbody>${typeRows}</tbody>
            </table>
            ${reportPanel}
            ${deleteZone}
          </div>
        </div>` : ''}
      </div>`;
  }).join('');
}

/* ---------- ACCURACY ZONE PAINTER (Profile) ---------- */
window.setRelativeAccuracy = async function(on){
  const p = currentPitcher();
  if(!p) return;
  let ok = false;
  if(isCoach()){
    const { error } = await supabaseClient.rpc('coach_set_relative_accuracy', { p_pitcher_id: p.id, p_enabled: !!on });
    ok = !error;
    if(ok) p.relativeAccuracy = !!on;
  } else {
    const { error } = await supabaseClient.from('profiles').update({ relative_accuracy_enabled: !!on }).eq('id', state.profile.id);
    ok = !error;
    if(ok) state.profile.relative_accuracy_enabled = !!on;
  }
  state.profileMsg = ok ? '' : 'Could not save. Check your connection and try again.';
  if(!on) state.zonePaint = null;
  if(ok) await saveLastKnownContext();
  render();
};
window.openZonePaint = function(type){
  const p = currentPitcher();
  if(!p) return;
  state.zonePaint = { pitcherId: p.id, type, side: 'R', cells: (zoneCellsFor(p.id, type, 'R') || []).slice() };
  state.zoneMsg = '';
  render();
};
window.zonePaintSide = function(side){
  const zp = state.zonePaint;
  if(!zp || zp.side === side) return;
  zp.side = side;
  zp.cells = (zoneCellsFor(zp.pitcherId, zp.type, side) || []).slice();
  state.zoneMsg = '';
  render();
};
window.zonePaintFlipSide = function(){
  const zp = state.zonePaint;
  if(zp) window.zonePaintSide(zp.side === 'R' ? 'L' : 'R');
};
window.paintZoneCell = function(row, col){
  const zp = state.zonePaint;
  if(!zp) return;
  const k = row + '-' + col;
  const i = zp.cells.indexOf(k);
  if(i >= 0) zp.cells.splice(i, 1); else zp.cells.push(k);
  render();
};
window.cancelZonePaint = function(){ state.zonePaint = null; state.zoneMsg = ''; render(); };
function setLocalZone(pitcherId, type, side, cells){
  const byType = (state.zones[pitcherId] = state.zones[pitcherId] || {});
  const bySide = (byType[type] = byType[type] || {});
  if(cells) bySide[side] = cells; else delete bySide[side];
}
window.saveZonePaint = async function(){
  const zp = state.zonePaint;
  if(!zp) return;
  if(!zp.cells.length){ state.zoneMsg = 'Tap at least one cell, or use Clear to remove this zone.'; render(); return; }
  const { error } = await supabaseClient.from('accuracy_zones').upsert(
    { pitcher_id: zp.pitcherId, pitch_type: zp.type, batter_side: zp.side, cells: zp.cells },
    { onConflict: 'pitcher_id,pitch_type,batter_side' });
  if(error){ state.zoneMsg = 'Could not save. Check your connection and try again.'; render(); return; }
  setLocalZone(zp.pitcherId, zp.type, zp.side, zp.cells.slice());
  state.zoneMsg = 'Saved.';
  await saveLastKnownContext();   // charting reads zones offline from this snapshot
  render();
};
window.clearZonePaint = async function(){
  const zp = state.zonePaint;
  if(!zp) return;
  const { error } = await supabaseClient.from('accuracy_zones').delete()
    .eq('pitcher_id', zp.pitcherId).eq('pitch_type', zp.type).eq('batter_side', zp.side);
  if(error){ state.zoneMsg = 'Could not clear. Check your connection and try again.'; render(); return; }
  setLocalZone(zp.pitcherId, zp.type, zp.side, null);
  zp.cells = [];
  state.zoneMsg = 'Cleared.';
  await saveLastKnownContext();
  render();
};
function renderZonePainter(){
  const zp = state.zonePaint;
  let cells = '';
  for(let row = 0; row < GRID_SIZE; row++){
    for(let col = 0; col < GRID_SIZE; col++){
      const num = zoneNumberFor(row, col, zp.side);
      const painted = zp.cells.indexOf(row + '-' + col) >= 0;
      const cls = 'zone-cell' + (isStrikeCell(row, col) ? ' in-zone' : '') + ' clickable' + (painted ? ' zone-painted' : '');
      cells += `<div class="${cls}" onclick="paintZoneCell(${row},${col})">${num !== null ? `<span class="zone-number">${num}</span>` : ''}</div>`;
    }
  }
  // Catcher's view: a RHB stands on the LEFT, a LHB on the right (D8).
  const onLeft = insideColumnOnScreenLeft('behind_catcher', zp.side);
  const grid = `<div class="zone-grid">${cells}${renderHomePlate('behind_catcher')}${renderBatterSilhouette(zp.side, onLeft, 'zonePaintFlipSide()')}</div>`;
  const saved = zoneCellsFor(zp.pitcherId, zp.type, zp.side);
  return `<div class="zone-paint">
    <div class="profile-row">
      <button class="throws-btn${zp.side === 'R' ? ' selected' : ''}" onclick="zonePaintSide('R')">vs RHB</button>
      <button class="throws-btn${zp.side === 'L' ? ' selected' : ''}" onclick="zonePaintSide('L')">vs LHB</button>
    </div>
    <div class="zone-wrap">${grid}<div class="zone-caption">Catcher's view · tap the cells that count as accurate</div></div>
    <div class="profile-row">
      <button class="btn btn-primary" onclick="saveZonePaint()">Save zone</button>
      <button class="btn btn-ghost" onclick="clearZonePaint()" ${saved ? '' : 'disabled'}>Clear</button>
      <button class="btn btn-ghost" onclick="cancelZonePaint()">Close</button>
    </div>
    ${state.zoneMsg ? `<p class="profile-note">${state.zoneMsg}</p>` : ''}
  </div>`;
}
function renderRelAccuracySection(p){
  const on = !!p.relativeAccuracy;
  let zones = '';
  if(on){
    zones = (p.pitchTypes || []).map(t => {
      const r = zoneCellsFor(p.id, t, 'R'), l = zoneCellsFor(p.id, t, 'L');
      const stat = (label, c) => `${label}: ${c ? c.length + ' cell' + (c.length === 1 ? '' : 's') : 'Not set (exact accuracy will be used)'}`;
      const open = state.zonePaint && state.zonePaint.pitcherId === p.id && state.zonePaint.type === t;
      return `<div class="zone-row">
        <div class="profile-row"><strong>${pitchLabel(t)}</strong>
          <button class="btn btn-ghost" onclick="${open ? 'cancelZonePaint()' : `openZonePaint(${escHtml(JSON.stringify(t))})`}">${open ? 'Close' : 'Edit zones'}</button></div>
        <p class="profile-note">${stat('vs RHB', r)} · ${stat('vs LHB', l)}</p>
        ${open ? renderZonePainter() : ''}
      </div>`;
    }).join('') || '<p class="profile-note">Add pitches to your pitch mix first, then paint their zones.</p>';
  }
  return `<div class="profile-section"><h3>Relative accuracy</h3>
    <label class="profile-row" style="gap:10px;font-size:14px;">
      <input type="checkbox" ${on ? 'checked' : ''} onchange="setRelativeAccuracy(this.checked)"> ${on ? 'On' : 'Off'}
    </label>
    <p class="profile-note">Off: a pitch is accurate only if it lands on the exact target cell. On: paint the zone that counts for each pitch, separately against right- and left-handed hitters.</p>
    ${zones}
  </div>`;
}

/* ---------- LEADERBOARD (U8) ----------
   One server call, get_team_leaderboard(team, window), returns per-pitcher aggregates only
   (the function checks membership; nothing here widens what a pitcher can read). The last
   board loaded is cached on-device per team and window, so offline it still shows, labelled
   "as of". None of this ever runs on the charting path. */
const LB_WINDOWS = [['week', 'Week'], ['month', 'Month'], ['all', 'All-time']];
const LB_CATS = [['velocity', 'Velocity'], ['accuracy', 'Accuracy'], ['strike', 'Strike %']];
function hasLeaderboard(){ return state.teams.length > 0; }   // cached membership: works offline
function escHtml(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function lbUserKey(){ return state.session ? state.session.user.id : ''; }
function lbCacheKey(teamId, win){ return 'lb:' + lbUserKey() + ':' + teamId + ':' + win; }
async function lbActiveTeamId(){
  const ids = state.teams.map(t => t.id);
  if(state.lbTeamId && ids.includes(state.lbTeamId)) return state.lbTeamId;
  let remembered = null;
  try{ remembered = await storGet('lbTeam:' + lbUserKey()); }catch(e){}
  if(remembered && ids.includes(remembered)) return remembered;
  return ids.includes(state.currentTeamId) ? state.currentTeamId : (ids[0] || null);
}
async function loadLeaderboard(){
  if(!hasLeaderboard() || !state.session) return;
  const teamId = await lbActiveTeamId();
  if(!teamId) return;
  state.lbTeamId = teamId;
  const win = state.lbWindow;
  let cached = null;
  try{ cached = await storGet(lbCacheKey(teamId, win)); }catch(e){}
  state.lb = { teamId, win, data: cached ? cached.data : null, fetchedAt: cached ? cached.fetchedAt : null, status: isOnline() ? 'loading' : 'offline', error: '' };
  render();
  if(!isOnline()) return;                       // offline: show the cached board, "as of"
  const fresh = (extra) => Object.assign({}, state.lb, extra);
  const still = () => state.lb && state.lb.teamId === teamId && state.lb.win === win;
  try{
    const { data, error } = await supabaseClient.rpc('get_team_leaderboard', { p_team_id: teamId, p_window: win });
    if(error) throw error;
    const rec = { data, fetchedAt: Date.now() };
    await storSet(lbCacheKey(teamId, win), rec);
    if(still()){ state.lb = fresh({ data, fetchedAt: rec.fetchedAt, status: 'ok' }); render(); }
  }catch(e){
    const refused = e && /not allowed|not authenticated/i.test(e.message || '');
    if(still()){ state.lb = fresh({ status: refused ? 'refused' : (state.lb.data ? 'stale' : 'error'), error: (e && e.message) || '' }); render(); }
  }
}
window.setLbTeam = async function(teamId){
  state.lbTeamId = teamId;
  state.lbExcludeOpen = null;
  try{ await storSet('lbTeam:' + lbUserKey(), teamId); }catch(e){}
  loadLeaderboard();
};
window.setLbWindow = function(win){
  state.lbWindow = win;
  state.lbExcludeOpen = null;
  loadLeaderboard();
};
window.setLbCat = function(cat){
  state.lbCat = cat;
  state.lbExcludeOpen = null;
  render();      // same data, different list: no reload
};
window.openLbExclude = function(pitchId){ state.lbExcludeOpen = (state.lbExcludeOpen === pitchId) ? null : pitchId; render(); };
window.excludeLbReading = async function(pitchId){
  if(state.lbBusy || !state.lb) return;
  state.lbBusy = true; render();
  const { error } = await supabaseClient.from('leaderboard_exclusions').insert({ pitch_id: pitchId, team_id: state.lb.teamId });
  state.lbBusy = false;
  state.lbExcludeOpen = null;
  if(error){ state.lb = Object.assign({}, state.lb, { error: 'Could not exclude that reading. Try again.' }); render(); return; }
  await loadLeaderboard();
};
window.restoreLbReading = async function(pitchId){
  if(state.lbBusy || !state.lb) return;
  state.lbBusy = true; render();
  const { error } = await supabaseClient.from('leaderboard_exclusions').delete().eq('pitch_id', pitchId).eq('team_id', state.lb.teamId);
  state.lbBusy = false;
  if(error){ state.lb = Object.assign({}, state.lb, { error: 'Could not restore that reading. Try again.' }); render(); return; }
  await loadLeaderboard();
};
// Inline SVG stars (no images, no icon library): gold, silver, bronze for ranks 1-3.
// Lockstep with :root's --gold/--silver/--bronze (an SVG presentation attribute can't
// read a CSS custom property reliably across browsers, so the values are duplicated
// here, same pattern as TYPE_PALETTE/TYPE_PALETTE_HEX above). Gold reuses the accent
// yellow itself (the visual refresh's "leaderboard gold" is the same color as every
// other yellow accent, not a separate literal); silver/bronze are darkened from their
// original values (#A8A9AD, #CD7F32), which read at 2.3:1 and 3.1:1 against the new
// white card background -- these clear 3.4:1 and 3.6:1.
function lbStar(rank){
  const fill = rank === 1 ? '#E8A83D' : rank === 2 ? '#7C8B85' : rank === 3 ? '#A8621F' : null;
  if(!fill) return '<span class="lb-star-gap"></span>';
  const label = rank === 1 ? 'First place' : rank === 2 ? 'Second place' : 'Third place';
  return `<svg class="lb-star" viewBox="0 0 24 24" role="img" aria-label="${label}"><path fill="${fill}" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>`;
}
function lbWhen(ms){
  return new Date(ms).toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
}
function lbDate(iso){
  return new Date(iso).toLocaleDateString('en-US', { timeZone:'America/New_York', month:'short', day:'numeric', year:'numeric' });
}
function lbRow(r, unit, minimum, isCoach, cat){
  const unq = r.qualified === false;
  const rank = (r.rank === undefined || r.rank === null) ? '' : r.rank;
  const num = (r.number === undefined || r.number === null) ? '' : ` <span class="lb-num">#${escHtml(r.number)}</span>`;
  let val;
  if(unq){
    val = `<span class="lb-val lb-unq-note">not enough pitches (${r.pitch_count} of ${minimum})</span>`;
  } else if(cat === 'velocity' && isCoach && rank === 1 && r.peak_pitch_id){
    val = `<button class="lb-val lb-val-btn" onclick="openLbExclude('${escHtml(r.peak_pitch_id)}')" title="Review this reading">${escHtml(r.value)}${unit}</button>`;
  } else {
    val = `<span class="lb-val">${escHtml(r.value)}${unit}</span>`;
  }
  let extra = '';
  if(cat === 'velocity' && isCoach && state.lbExcludeOpen && state.lbExcludeOpen === r.peak_pitch_id){
    extra = `<div class="lb-exclude-panel">
      <span>Peak reading: <strong>${escHtml(r.value)} mph</strong> on ${escHtml(lbDate(r.peak_pitch_ts))}.</span>
      <span class="lb-exclude-actions">
        <button class="btn btn-primary" style="background:var(--red-bg);color:var(--chalk);" ${state.lbBusy ? 'disabled' : ''} onclick="excludeLbReading('${escHtml(r.peak_pitch_id)}')">${state.lbBusy ? 'Excluding…' : 'Exclude this reading'}</button>
        <button class="btn btn-ghost" onclick="openLbExclude(null)">Cancel</button>
      </span>
      <span class="lb-exclude-note">The pitch itself is not changed in History or reports. The next-highest reading takes over.</span>
    </div>`;
  }
  return `<div class="lb-row${r.is_me ? ' me' : ''}${unq ? ' unq' : ''}">
    <span class="lb-rank">${rank}</span><span class="lb-star-cell">${unq ? '' : lbStar(rank)}</span>
    <span class="lb-name">${escHtml(r.name)}${num}</span>${val}
    <span class="lb-n">${unq ? '' : `${r.pitch_count} pitch${r.pitch_count === 1 ? '' : 'es'}`}</span>
    ${extra}
  </div>`;
}
function lbSection(title, rows, unit, minimum, isCoach, cat, emptyMsg){
  return `<div class="panel lb-section">${title ? `<h3 class="lb-title">${title}</h3>` : ''}
    ${rows.length ? rows.map(r => lbRow(r, unit, minimum, isCoach, cat)).join('') : `<p class="lb-empty">${emptyMsg}</p>`}
  </div>`;
}
function renderLeaderboardView(){
  if(!hasLeaderboard()) return `<div class="empty-hist">Join a team to see its leaderboard.</div>`;
  const lb = state.lb;
  const teams = state.teams;
  const teamId = (lb && lb.teamId) || state.lbTeamId || state.currentTeamId || (teams[0] && teams[0].id);
  const picker = teams.length > 1
    ? `<select class="team-select lb-team-select" onchange="setLbTeam(this.value)">${teams.map(t => `<option value="${escHtml(t.id)}" ${t.id === teamId ? 'selected' : ''}>${escHtml(t.name)}</option>`).join('')}</select>`
    : '';
  const toggle = `<div class="lb-toggle">${LB_WINDOWS.map(([k, label]) => `<button class="throws-btn${state.lbWindow === k ? ' selected' : ''}" onclick="setLbWindow('${k}')">${label}</button>`).join('')}</div>`;
  const catToggle = `<div class="lb-toggle lb-cats">${LB_CATS.map(([k, label]) => `<button class="throws-btn${state.lbCat === k ? ' selected' : ''}" onclick="setLbCat('${k}')">${label}</button>`).join('')}</div>`;
  let body;
  const data = lb && lb.data;
  if(!lb || (!data && (lb.status === 'loading'))){
    body = `<p class="lb-empty">Loading the leaderboard…</p>`;
  } else if(lb.status === 'refused'){
    body = `<p class="lb-empty">The leaderboard isn't available for this team.</p>`;
  } else if(!data){
    body = `<p class="lb-empty">${lb.status === 'offline' ? "You're offline, and this board hasn't been loaded on this device yet." : "Couldn't load the leaderboard. Try again in a moment."}</p>`;
  } else {
    const min = data.minimum;
    const windowLabel = data.window === 'week' ? 'This week' : data.window === 'month' ? 'This month' : 'All time';
    const stamp = data.generated_at ? new Date(data.generated_at).getTime() : lb.fetchedAt;
    const stale = lb.status === 'offline' || lb.status === 'stale';
    const cat = state.lbCat;
    const listRows = cat === 'accuracy' ? (data.accuracy || []) : cat === 'strike' ? (data.strike || []) : (data.velocity || []);
    const unit = cat === 'velocity' ? ' mph' : '%';
    const emptyMsg = cat === 'velocity' ? 'No velocity readings yet.' : 'No pitches charted yet.';
    body = `
      <p class="lb-sub">${windowLabel}${cat === 'velocity' ? ' · highest recorded velocity' : ` · needs ${min} pitches to be ranked`}</p>
      ${stale ? `<p class="lb-asof">${lb.status === 'offline' ? "You're offline. " : "Couldn't refresh. "}Showing the last board, as of ${escHtml(lbWhen(stamp))}.</p>` : ''}
      ${lbSection('', listRows, unit, min, data.is_coach, cat, emptyMsg)}
      ${cat === 'velocity' && data.is_coach && (data.excluded || []).length ? `<div class="panel lb-section"><h3 class="lb-title">Excluded readings</h3>
        ${(data.excluded).map(e => `<div class="lb-row"><span class="lb-name">${escHtml(e.name)}</span>
          <span class="lb-val">${escHtml(e.value)} mph</span><span class="lb-n">${escHtml(lbDate(e.pitch_ts))}</span>
          <button class="btn btn-ghost lb-undo" ${state.lbBusy ? 'disabled' : ''} onclick="restoreLbReading('${escHtml(e.pitch_id)}')">Undo</button></div>`).join('')}
      </div>` : ''}`;
  }
  return `<div class="lb-page">
    <div class="lb-controls">${picker}${toggle}</div>
    ${catToggle}
    ${lb && lb.error && lb.status !== 'refused' && lb.status !== 'stale' && lb.status !== 'error' ? `<p class="profile-msg">${escHtml(lb.error)}</p>` : ''}
    ${body}
  </div>`;
}

function renderThrowsSection(p){

/* ---------- EMAIL REPORT ---------- */
// Shared by sendSessionReport and viewSessionReport -- both hit the same
// endpoint with the same session payload, differing only in whether
// `emails` is non-empty. Kept as ONE function so the two call sites can't
// drift (the U6-nulling / history-shape rules only need stating once).
function buildReportPayload(session, p){
  const team = state.teams.find(t => t.id === state.currentTeamId);

  // U4b: the renderer computes everything itself from raw pitches -- no
  // more precomputed stats/per-type history. isDefaultVeloReading is
  // applied here, once, client-side, exactly as U6 designed: the renderer
  // trusts velo as given and never carries its own copy of the cutoff.
  const pitchesForReport = session.pitches.map(pt =>
    isDefaultVeloReading(pt) ? { ...pt, velo: null } : pt
  );

  // Prior sessions only (never the one being reported) -- matches the
  // renderer's own "3+ PRIOR sessions or omit" trend rule. Just the
  // per-session aggregates the Trends section actually reads, not the old
  // per-type breakdown the PDF's trend charts used.
  const history = state.sessions
    .filter(s => s.id !== session.id)
    .slice().sort((a,b) => a.date - b.date)
    .map(s => {
      const sStats = sessionStats(s.pitches);
      return {
        date: s.date,
        dateLabel: new Date(s.date).toLocaleDateString(undefined, { month:'numeric', day:'numeric' }),
        total: sStats.total,
        strikePct: sStats.strikePct,
        commandPct: sStats.hasZone ? sStats.zoneAccuracyPct : sStats.accuracyPct,
        hasVelo: sStats.hasVelo,
        avgVelo: sStats.avgVelo
      };
    });

  return {
    sessionId: session.id,
    pitcherId: p.id,
    pitcherName: p.name,
    // A pitcher viewing their own profile never gets uniformNumber from
    // mapProfile() (always null there) -- it lives on their OWN team
    // membership row instead (state.teams[].uniform_number). A coach's
    // roster-sourced p.uniformNumber already has the real value.
    uniformNumber: (p.uniformNumber != null) ? p.uniformNumber : (team && team.uniform_number != null ? team.uniform_number : null),
    date: session.date,
    teamName: team ? team.name : '',
    chartingPerspective: session.chartingPerspective,
    loggedByCoach: session.loggedByCoach,
    pitchTypes: p.pitchTypes,
    pitches: pitchesForReport,
    history
  };
}

async function callSendReportFunction(payload){
  if(typeof SEND_REPORT_URL === 'undefined' || SEND_REPORT_URL.indexOf('YOUR_') === 0){
    throw new Error('not configured');
  }
  const res = await fetch(SEND_REPORT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.session.access_token },
    body: JSON.stringify(payload)
  });
  const body = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(body.error || ('server responded ' + res.status));
  return body;
}

window.sendSessionReport = async function(sessionId){
  const p = currentPitcher();
  const session = state.sessions.find(s => s.id === sessionId);
  if(!session || !p) return;
  const contacts = p.contactEmails || {};
  // R0 item (g), revised after check 8 on staging, extended U4b Phase 2 and
  // its coach-gate follow-up: matches renderHistoryView's own filter -- an
  // ineligible pitcher (unverified email, OR not currently on a team) OR
  // an unverified CALLING COACH blocks the WHOLE send client-side, not
  // just the pitcher's own address. The server-side checks (pitcherId
  // below, gated on is_pitcher_report_eligible, plus the caller's own
  // my_verification_status check) are what actually can't be bypassed;
  // this just keeps normal usage from ever hitting that path.
  const pEligible = currentPitcherVerified(p) && currentPitcherOnTeam(p) && currentCallerVerified();
  const emails = pEligible
    ? [contacts.coach, contacts.pitchingCoach, contacts.pitcher].map(e => (e||'').trim()).filter(Boolean)
    : [];
  if(!emails.length) return;

  state.reportStatus = { sessionId, status: 'sending', message: 'Sending…' };
  render();
  try{
    const body = await callSendReportFunction(Object.assign({ emails }, buildReportPayload(session, p)));
    if(body.reportPath) session.reportPath = body.reportPath;
    state.reportStatus = { sessionId, status: 'sent', message: 'Report sent to ' + emails.length + ' recipient(s).' };
  } catch(err){
    state.reportStatus = { sessionId, status: 'error', message: err.message || 'Could not send — email backend may not be deployed yet. See SETUP.md.' };
  }
  render();
};

// U4b follow-up (Joel, Sept 2026): "View report" shouldn't require sending
// an email first -- generation and sending were always two separate steps
// server-side, just never split at the API level until now. This calls the
// SAME function with an empty emails array (generate/store, skip Resend
// entirely -- see index.ts), then the panel's own re-render turns this
// same control into the real report.html link once session.reportPath is
// set. No popup-blocker games (opening a tab after an await is unreliable
// on iOS Safari) -- one extra click on first view is a fine trade for that.
window.viewSessionReport = async function(sessionId){
  const session = state.sessions.find(s => s.id === sessionId);
  if(!session || session.reportPath) return; // already rendered as a real link -- nothing to do
  const p = currentPitcher();
  if(!p) return;

  state.reportStatus = { sessionId, status: 'sending', message: 'Generating report…' };
  render();
  try{
    const body = await callSendReportFunction(Object.assign({ emails: [] }, buildReportPayload(session, p)));
    if(body.reportPath) session.reportPath = body.reportPath;
    state.reportStatus = null;
  } catch(err){
    state.reportStatus = { sessionId, status: 'error', message: err.message || 'Could not generate report.' };
  }
  render();
};

        <div class="brand"><span class="brand-mark"></span><h1 class="display">Knuckleball<span>.</span></h1></div>
        <span class="tagline">Always a Step Ahead</span>
        <span class="role-badge">${isCoach() ? 'Coach' : 'Pitcher'}</span>
        ${renderOfflinePill()}
      </div>
      ${sidebarBody}
      ${renderOutboxBadge()}
      <button class="sign-out-btn${isCoach() ? ' hide-phone' : ''}" onclick="signOut()">Sign out</button>
    </div>`;

  const p = currentPitcher();
  let main;
  if(!p){
    // U9: 'pitcherProfile' with no pitcher selected has its own message
    // ("Select a pitcher to see his profile," not this generic one) --
    // renderPitcherProfileView() already handles p === null itself.
    main = renderTabs() + (state.view === 'profile'
      ? renderProfileView()
      : state.view === 'leaderboard' ? renderLeaderboardView()
      : state.view === 'pitcherProfile' ? renderPitcherProfileView()
      : `<div class="empty-state"><div class="display">No pitcher selected</div><p>Invite a pitcher to this team to get started.</p></div>`);
  } else {
    const arsenalChips = p.pitchTypes.map(t => {
      const c = colorForType(p, t);
      return `<span class="pitch-chip" style="background:${c};">${pitchLabel(t)}</span>`;
    }).join('') || `<span style="color:var(--ink-faint);font-size:12.5px;">No pitches set yet</span>`;

    const contacts = p.contactEmails || {};
    const coachFieldValue = contacts.coach || '';
    // R0: "your email" is no longer free-text -- it's always this account's
    // real email, so the report-recipient gate in send-session-report
    // (item g) is checking something a client can't just type around.
    // Read-only here; the ONLY way to change it is the verify banner's
    // Change Email action above, which is the actual account email change.
    const myEmail = state.myVerification.email || '';
    const contactsPanel = (!isCoach() && state.contactsOpen) ? `
      <div class="contacts-panel">
        <div class="field"><span class="field-label">Coach email</span><input class="text-input" id="contact-coach" value="${escHtml(coachFieldValue)}" placeholder="coach@example.com"></div>
        <div class="field"><span class="field-label">Additional contact (optional)</span><input class="text-input" id="contact-pitching-coach" value="${escHtml(contacts.pitchingCoach||'')}" placeholder="e.g. pitching coach"></div>
        <div class="field">
          <span class="field-label">Your email</span>
          <input class="text-input" value="${escHtml(myEmail)}${state.myVerification.emailConfirmed ? '' : ' (unverified)'}" disabled style="opacity:0.7;">
        </div>
        <p style="flex-basis:100%;margin:-4px 0 0;font-size:11.5px;color:var(--ink-faint);">Coach email is who the report is also cc'd to — edit or clear it as needed. Your own email always follows your account (change it above if it's wrong).</p>
        <div class="contacts-save-row">
          <button class="btn btn-primary" onclick="saveContactEmails()">Save</button>
          ${state.contactsSavedAt ? '<span class="contacts-saved-msg">Saved</span>' : ''}
        </div>
      </div>` : '';

    const tabs = renderTabs();

    // R0 item (e): persistent banner, never a blocking modal -- a pitcher
    // can look around while unverified. Item (f): Change Email is one tap
    // from here, not a separate settings hunt.
    const verifyBanner = (!isCoach() && !state.myVerification.emailConfirmed) ? `
      <div class="verify-banner">
        <p>Verify your email so we can send you your reports. ${state.verifyResendStatus === 'sent' ? 'Verification email sent — check your inbox.' : ''}${state.verifyResendStatus === 'error' ? 'Could not resend — try again in a moment.' : ''}</p>
        <div class="verify-banner-actions">
          <button class="btn btn-ghost" ${state.verifyResendStatus === 'sending' ? 'disabled' : ''} onclick="resendVerification()">${state.verifyResendStatus === 'sending' ? 'Sending…' : 'Resend'}</button>
          <button class="btn btn-ghost" onclick="goToProfileEmail()">Wrong email? Change it in Profile</button>
        </div>
      </div>` : '';

    // U9 acceptance 7: verification wins if both would apply -- a stacked
    // wall of banners is worse than picking one, and an unverified email
    // is the more urgent of the two.
    const setupReminderBanner = verifyBanner ? '' : renderSetupReminderBanner();

    const headerHtml = `
      <div class="pitcher-header">
        <div>
          <h2 class="display">${escHtml(p.name)}</h2>
          <div class="pitcher-sub">${arsenalChips}</div>
        </div>
        <div class="pitcher-header-actions">
          ${isCoach()
            ? `<button class="btn btn-ghost" onclick="setView('profile')">Profile</button>`
            : `<button class="btn btn-ghost" onclick="toggleContactsPanel()">${state.contactsOpen ? 'Hide' : ''} Contacts</button>`}
        </div>
      </div>
      ${contactsPanel}`;

    main = `
      ${verifyBanner}
      ${setupReminderBanner}
      ${(state.view === 'profile' || state.view === 'leaderboard' || state.view === 'setup') ? '' : headerHtml}
      ${tabs}
      ${state.view === 'session' ? renderSessionView()
        : state.view === 'profile' ? renderProfileView()
        : state.view === 'leaderboard' ? renderLeaderboardView()
        : state.view === 'pitcherProfile' ? renderPitcherProfileView()
        : state.view === 'setup' ? renderSetupView()
        : renderHistoryView()}
    `;
  }

  app.innerHTML = sidebar + `<div class="main">${main}</div>` + phoneFooter;
  attachVeloStrip();
}

init();
</script>
</body>
</html>
