<script type="text/x-dc" data-dc-script data-props='{"sport":{"editor":"enum","options":["Baseball","Softball"],"default":"Baseball"},"$preview":{"width":1232,"height":860}}'>
class Component extends DCLogic {
renderVals() {
const cells = [];
for (let r = 0; r < 5; r++) {
for (let c = 0; c < 5; c++) {
const zone = r >= 1 && r <= 3 && c >= 1 && c <= 3;
const style = zone ? 'background: rgba(10,26,20,0.34); border: 1px solid rgba(255,255,255,0.9)' : 'background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.6)';
cells.push({ n: zone ? String((r - 1) * 3 + (4 - c)) : '', style: style });
}
}
const sb = (this.props.sport ?? 'Baseball') === 'Softball';
return {
cells: cells, isSB: sb, isBB: !sb, bar: sb ? '#2B4468' : '#334B45',
wall: sb ? '#16385C' : '#1F4D3A', stands: sb ? '#3A4656' : '#39483F',
p1: sb ? 'FB' : '4SFB', p2: sb ? 'RISE' : 'CB', p3: 'CH'
};
}
}
</script>
