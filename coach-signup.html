<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Knuckleball</title>
<script>
  // R7 (Joel, Nov 19 2026): there's one New account form now (login.html#new). This old address is in emails, Help,
  // bookmarks and join pages, so it stays -- as a forward, with the account type (coach) preselected and the sport and a
  // join link (next=) carried along.
  (function(){
    var q = new URLSearchParams(location.search), out = new URLSearchParams({ new: '1', role: 'coach' });
    var sp = q.get('sport'); if(sp === 'baseball' || sp === 'softball') out.set('sport', sp);
    var n = q.get('next'); if(n) out.set('next', n);
    location.replace('login.html?' + out.toString() + '#new');
  })();
</script>
</head>
<body>
  <p><a href="login.html#new">Create your Knuckleball account</a></p>
</body>
</html>
