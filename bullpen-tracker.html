  @media (max-width: 860px){
    #app{ flex-direction:column; }
    .sidebar{ width:100%; border-right:none; border-bottom:1px solid var(--border); max-height:none; }
    .roster-list{ max-height:220px; }
    /* Visual refresh: the extra padding/gaps added for "more white space" (session-grid
       gap, controls-panel gap, panel padding) measurably pushed the charting grid and
       the velocity strip further down at this width -- checked in a real browser: ~40px
       lower than before the refresh, on an iPhone-width screen with the roster collapsed.
       Below 860px (iPad portrait and every phone), give the more spacious values back
       to keep the grid/strip exactly as reachable as before; the wider gains still apply
       above 860px, where there's plenty of headroom. */
    .session-grid-layout{ gap:26px; }
    .controls-panel{ gap:14px; }
    .panel{ padding:18px; }
    .sidebar{ gap:16px; }
    .brand-block{ padding:12px 18px; }
    .main{ padding:20px 16px; }
    /* Fixed-length (15vw) tracks previously demanded ~75vw of width while the
       grid's own box was capped at max-width:320px -- on iPad portrait that
       mismatch (~576px of track vs a 320px box) overflowed the grid past its
       container and over the log panel beside it. fr tracks size to the box
       itself, so the box's own width (bounded below) is what's ever drawn. */
    .zone-grid{
      grid-template-columns:repeat(5, minmax(0, 1fr)); grid-template-rows:repeat(5, minmax(0, 1fr));
      width:100%; max-width:320px; aspect-ratio:1/1;
    }
    /* Same 3-of-5-columns proportion as the desktop 162px value, but derived
       from the grid's own responsive width (100% up to 320px) instead of a
       fixed cell size: strike-zone width = 0.6 * gridWidth - 4.8px, where
       0.6 = 3/5 columns and 4.8px accounts for the padding/gap difference
       between 3 cells and 5 (see the desktop comment above for the algebra). */
    .home-plate-wrap{ width:calc(0.6 * min(100%, 320px) - 4.8px); }
  }

  @media (max-width:500px){
    /* Coach on a phone: invite link + Sign out live at the bottom of the page, not the top. */
    .hide-phone{ display:none !important; }
    .phone-footer{ display:flex; flex-direction:column; gap:14px; padding:4px 16px 28px; }
    /* RESERVED BAND for the phone pitch-pill (see .kb-batter's media block
       above). .zone-grid IS the real "grid wrapper" the silhouette is
       positioned against (already position:relative, see its comment) --
       batter-silhouette.html's own .zone-grid-wrap placeholder maps to
       this class in this codebase.
       margin-bottom, NOT padding-bottom: .zone-grid already uses
       aspect-ratio:1/1 (in the rule above) under box-sizing:border-box
       (global *{box-sizing:border-box}), so the square ratio applies to
       the BORDER box. padding-bottom there would keep the border box
       square and eat the new space out of the grid's own CONTENT height
       instead -- squishing the 5 rows shorter, not adding room below them
       (this was tried and visibly broke the grid: rows collapsed to 2px
       each -- acceptance check 4 requires the grid stay the same size).
       margin is outside the box-sizing model entirely, so it reserves
       flow space (pushing .zone-caption and everything after it down)
       with ZERO effect on .zone-grid's own square box -- the grid is
       pixel-identical to before this rule exists; only the space below it
       changes. The pill (an absolutely-positioned child of .zone-grid)
       then reaches into that margin with a negative `bottom` offset (see
       .kb-batter's phone-mode rule above) since margin sits outside the
       padding box that `bottom` normally measures against.
       --kb-pill-h/--kb-pill-clear are declared here (not on .kb-batter)
       because custom properties only inherit DOWNWARD -- .kb-batter is a
       child of .zone-grid, so declaring them on the parent lets both this
       rule and .kb-batter's own phone-mode rule (above) read the same
       values; declaring them on the child would leave this rule unable to
       see them at all. */
    .zone-grid{
      --kb-pill-h:48px; --kb-pill-clear:18px;
      margin-bottom:calc(var(--kb-pill-clear) + var(--kb-pill-h) + 8px);
    }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- CONSTANTS ---------- */
// The only pitches a pitcher can add. `name` is what gets stored in
// profiles.pitch_types and on each pitch row (unchanged plain strings, so
// reports and history are unaffected); `abbr` is display-only and is what
// the app shows everywhere except the add-a-pitch dropdown. Pitches saved before this list existed (free text) still render
// as typed -- pitchLabel falls back to the raw string.
const PITCH_CATALOG = [
  { abbr:'4SFB', name:'Four Seam Fastball' },
  { abbr:'2SFB', name:'Two Seam Fastball' },
  { abbr:'CU',   name:'Cutter' },
  { abbr:'SK',   name:'Sinker' },
  { abbr:'CH',   name:'Changeup' },
  { abbr:'CB',   name:'Curveball' },
  { abbr:'SL',   name:'Slider' },
  { abbr:'KN',   name:'Knuckleball' },
  { abbr:'SW',   name:'Sweeper' },
  { abbr:'SV',   name:'Slurve' },
  { abbr:'FR',   name:'Forkball' },
  { abbr:'SP',   name:'Splitter' }
];
function pitchLabel(name){
  const c = PITCH_CATALOG.find(x => x.name === name);
  return c ? c.abbr : escHtml(name);   // unknown (legacy free-text) names are user input
}
const TYPE_PALETTE = ['#E8A83D','#6FA287','#C17A45','#C0453B','#7C9CBF','#B98CCB','#D4C15B','#4FA8A8'];
const GRID_SIZE = 5;

/* ---------- LOCAL DRAFT SAFETY NET ----------
   Only used as an in-progress-session cache on this device, so a page
   refresh mid-bullpen doesn't lose pitches already tapped in. The
   permanent record of a finished session always lives in Supabase. */
async function storGet(key){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
async function storSet(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }
  catch(e){ console.error('storage set failed', key, e); }
}
async function storDelete(key){
  try{ localStorage.removeItem(key); } catch(e){}
}

/* ---------- STATE ---------- */
let state = {
  session: null,
  profile: null,          // raw row: id, role, full_name, pitch_types, contact_emails
  teams: [],               // [{id, name}]
  currentTeamId: null,
  roster: [],               // (coach view) mapped pitcher objects on current team
  currentPitcherId: null,
  myVerification: { email: null, emailConfirmed: false },   // R0: fail closed until my_verification_status() says otherwise
  changeEmailOpen: false,
  changeEmailStatus: null,
  verifyResendStatus: null,
  inviteCopyStatus: null,
  regenerateArmed: false,
  regenerateBusy: false,
  removeArmedPitcherId: null,
  removeBusy: false,
  sessions: [],
  view: 'session',          // session | history | profile | pitcherProfile (coach editing the selected pitcher)
  activeSession: null,
  selectedType: null,
  veloTargetIdx: null,      // U6: index of the last recorded pitch that may still take a velocity (null = locked)
  veloHistory: null,        // U6: on-device { 'pitcherId:teamId': { pitchType: [recent velos, oldest->newest] } }
  veloStripKey: null,       // U6: what the strip was last centered for, so re-renders keep its scroll position
  veloScrollLeft: 0,
  flashCell: null,
  pendingTarget: null,
  expandedSessionId: null,
  hint: '',
  draftAvailable: false,
  pendingDraft: null,
  contactsOpen: false,
  lbTeamId: null,           // U8: which team's board is showing (remembered per device)
  lbWindow: 'week',         // U8: week | month | all
  lbCat: 'velocity',        // U8: velocity | accuracy | strike -- which ranked list is showing
  lb: null,                 // U8: { teamId, win, data, fetchedAt, status: loading|ok|offline|error, error }
  lbExcludeOpen: null,      // U8 (coach): pitch id whose 'Exclude this reading' panel is open
  lbBusy: false,
  rosterCollapsed: false,   // coach only: roster list rolled up once a pitcher is selected
  editVeloError: '',        // (g) inline message when the edit-pitch velocity is rejected
  editVeloDraft: '',
  uniformEditKey: null,     // 'pitcherId:teamId' while the uniform-number editor is open
  uniformMsg: '',           // one-line notice, e.g. after a conflict
  uniformMsgKey: null,      // which 'pitcherId:teamId' row the notice belongs to
  profileMsg: '',           // U7: one-line notice on the Profile pages
  nameEditOpen: false,      // U9: name-change form open, on whichever profile is showing
  nameStatus: null,         // U9: null | 'saving' | 'saved' | 'error:<msg>'
  setupReminderDismissed: false,   // U9: per-session only, never persisted -- resets on reload
  zones: {},                // U7B: { pitcherId: { pitchType: { R: ['row-col', ...], L: [...] } } }, catcher frame
  zonePaint: null,          // U7B: the zone being painted { pitcherId, type, side, cells }
  zoneMsg: '',
  passwordStatus: null,     // U7: null | 'sending' | 'saved' | 'error:<msg>'
  contactsSavedAt: null,
  inviteOpen: false,
  inviteStatus: null,
  saving: false,
  loaded: false,
  outbox: [],        // completed sessions not yet synced to Supabase (P1-01)
  syncing: false,
  setupNeeded: null, // null | 'role' | 'team' -- account-setup recovery UI (P1-12)
  bootError: null,   // null | 'offline-no-context' | 'load-failed' -- boot-screen dead ends (P1-13)
  setupBusy: false,
  setupError: null,
  setupName: '',
  setupTeam: '',
  editDraftRow: null,       // index into activeSession.pitches being edited in-session (P1-05)
  deletedSessions: [],      // soft-deleted sessions for the current selection -- tombstones only (P1-15)
  deletingSessionId: null,  // session with an open typed-confirm delete form (P1-15)
  deleteConfirmText: '',
  deleteBusy: false,
  deleteError: null
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
// crypto.randomUUID() needs a newer WebKit than some field devices have
// (e.g. older iPhones running Chrome, which is WebKit under the hood on
// iOS) -- this has no such dependency and produces the same valid-uuid
// format Postgres uuid columns require.
function genUUID(){
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
    const r = Math.random() * 16 | 0;
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}
function mapProfile(row){
  // U9: usesRadarGun is the PITCHER's own setting -- read here once, same as
  // pitchTypes/throws, so it flows into saveLastKnownContext()'s offline
  // snapshot for free and never gets re-read mid-session (an already-open
  // charting page keeps whatever it read at load, so a toggle change can
  // never affect the current pen).
  return { id: row.id, name: row.full_name, pitchTypes: row.pitch_types || [], contactEmails: row.contact_emails || {}, throws: row.throws || null, relativeAccuracy: !!row.relative_accuracy_enabled, usesRadarGun: !!row.uses_radar_gun, setupDismissedAt: row.setup_dismissed_at || null, uniformNumber: null };
}
function isCoach(){ return state.profile && state.profile.role === 'coach'; }
// The pitch types New Session offers: exactly the pitcher's own mix. A pitcher who
// hasn't added any pitches yet has none to chart until they do (Joel, Sept 21: no
// fallback list) -- New Session shows a prompt pointing at Profile instead.
function pitchTypesFor(p){
  return (p && p.pitchTypes) ? p.pitchTypes : [];
}
function colorForType(pitcher, type){
  const idx = pitchTypesFor(pitcher).indexOf(type);
  return TYPE_PALETTE[idx >= 0 ? idx % TYPE_PALETTE.length : 0];
}
// Visual refresh: TYPE_PALETTE can't change (must keep matching send-session-report's
// copy), but which TEXT color reads clearly on top of a given palette color CAN --
// per-color luminance, not a fixed choice, since 7 of the 8 read fine with dark ink
// text (ink on TYPE_PALETTE[3], the red, is only 3.2:1 -- short of AA's 4.5:1). Used
// only for the selected pitch-type chip's own label.
function readableTextOn(hex){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16)/255, g = parseInt(h.substring(2,4),16)/255, b = parseInt(h.substring(4,6),16)/255;
  const lin = c => c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
  const L = 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b);
  // contrast of L against ink's (~0.012) and chalk's (~0.86) luminance -- pick whichever clears more.
  const cInk = (L+0.05)/(0.0117+0.05), cChalk = (0.86+0.05)/(L+0.05);
  return cInk >= cChalk ? 'var(--field-dark)' : 'var(--chalk)';
}
function currentPitcher(){
  if(!isCoach()) return mapProfile(state.profile);
  return state.roster.find(p => p.id === state.currentPitcherId) || null;
}
// R0 item (g), UI half: whether the currently-viewed pitcher's OWN account
// email is confirmed -- source differs by who's asking, since currentPitcher()
// returns two different shapes (state.roster has emailConfirmed per pitcher,
// from get_roster_verification; a pitcher viewing their own profile isn't
// in their own roster array at all, so that comes from my_verification_status
// via state.myVerification instead). The server-side gate in
// send-session-report is the real enforcement; this only drives what the
// UI shows and sends -- see that function's own comment.
function currentPitcherVerified(p){
  return isCoach() ? !!(p && p.emailConfirmed) : !!state.myVerification.emailConfirmed;
}
// U4b Phase 2, UI half: whether the currently-viewed pitcher currently has
// ANY team membership -- the second half of the report-eligibility gate
// (see is_pitcher_report_eligible; this is a deliberate, temporary
// restriction until solo/team-less pitcher accounts are supported). A
// coach viewing a session is always looking at it through a specific
// team's roster/session query, so the pitcher is on a team by construction
// in that context -- only a pitcher viewing their own sessions needs an
// actual check, against their own loaded team list.
function currentPitcherOnTeam(p){
  return isCoach() ? true : !!(state.teams && state.teams.length);
}
// U4b coach-gate (Joel, Sept 2026, after a staging investigation found an
// unverified coach could sign up, get an invite link, have a verified
// pitcher join and chart a pen, and still generate/view/send that pen's
// report -- nothing ever checked the COACH's own identity). Mirrors the
// server-side check in send-session-report exactly: when a COACH is
// viewing someone else's session, THEIR OWN email must be verified too.
// A pitcher viewing their own session doesn't need this separately --
// currentPitcherVerified(p) already reads state.myVerification for that
// case, since there p IS the caller.
function currentCallerVerified(){
  return isCoach() ? !!state.myVerification.emailConfirmed : true;
}
function isStrikeCell(row, col){ return row >= 1 && row <= 3 && col >= 1 && col <= 3; }
// Zone numbering protocol (D8, Sept 9 2026): 1/4/7 = inside, 2/5/8 = middle,
// 3/6/9 = outside, ALWAYS. Rows never flip. Inputs are CATCHER-FRAME
// coordinates (the stored frame) -- callers convert screen coordinates to
// catcher-frame via the existing U5 transform (perspectiveCol) first; this
// function itself has no perspective awareness, on purpose, so there is
// only one mirror expression in the whole file. batterSide: 'R' (default
// until U2) | 'L'. Returns 1-9 for strike-zone cells, null otherwise.
// Never stored -- a zone number is a display label, not a cell identity.
function zoneNumberFor(cRow, cCol, batterSide = 'R'){
  if(cRow < 1 || cRow > 3 || cCol < 1 || cCol > 3) return null;
  const colFromInside = batterSide === 'R' ? cCol : 4 - cCol; // RHB inside = catcher-frame LEFT
  return (cRow - 1) * 3 + colFromInside;
}
function isAccurate(pitch){
  return pitch.targetRow === pitch.actualRow && pitch.targetCol === pitch.actualCol;
}

// U5 -- charting perspective. Row never mirrors (up is up from both views);
// only the column does. mirrorCol is its own inverse, so the same function
// converts screen->canonical at capture and canonical->screen for anything
// re-derived from stored coordinates and drawn back for the CURRENT
// charter to look at (the live glow, the live pitch log) -- never for
// history/heat-map rendering, which always shows canonical coordinates
// unmirrored so two sessions charted from opposite sides land on the same
// cell (see isRelativelyAccurate's own comment below: it needs zero
// perspective awareness precisely because capture already normalized it).
function mirrorCol(col){ return (GRID_SIZE - 1) - col; }
function perspectiveCol(col, chartingPerspective){
  return chartingPerspective === 'behind_pitcher' ? mirrorCol(col) : col;
}
function sessionPerspective(session){
  return (session && session.chartingPerspective) || 'behind_catcher';
}
const PERSPECTIVE_PREF_KEY = 'lastChartingPerspective';

// U2a -- batter side. Live (in-session, not-yet-saved) value defaults to
// 'R'; NOT remembered across sessions like chartingPerspective is (Joel,
// Sept 9: perspective is a habit of where a coach stands, batter side
// varies freely within one pen, so a remembered value would be wrong as
// often as right). Reads state.activeSession.currentBatterSide, which is
// part of the persisted draft object (same mechanism chartingPerspective
// already relies on), not a separate top-level UI field -- so it survives
// a tab-kill mid-LHB-sequence instead of silently resetting to RHB.
function sessionBatterSide(session){
  return (session && session.currentBatterSide) || 'R';
}
// U9: "changing it takes effect on the next session, never mid-pen"
// (Joel) -- but freezing it the moment the (possibly still-EMPTY) session
// object gets constructed was too early: toggling the setting in Profile
// and then just clicking the New Session tab looked like a glitch,
// needing a full reload to pick it up, since nothing had actually been
// charted yet. The real rule is simpler -- once at least one pitch
// exists, this pen has genuinely started and the setting freezes for the
// rest of it (reads the snapshot on the session/draft object, defaulting
// live for a draft that predates this field); until then, an empty
// session always tracks the CURRENT toggle, so switching to it after a
// change just works.
function sessionUsesRadarGun(session){
  const p = currentPitcher();
  const live = !!(p && p.usesRadarGun);
  if(session && session.pitches && session.pitches.length > 0){
    return session.usesRadarGun !== undefined ? session.usesRadarGun : live;
  }
  return live;
}

const ACCURACY_MODE_LABELS = {
  ring: 'Accuracy Ring',
  nothingUp: 'Low',
  nothingLow: 'High',
  nothingAway: 'Inside',
  nothingInside: 'Outside'
};

// Relative accuracy: an alternate, per-pitch "was this good enough"
// rule, distinct from exact bullseye. Directional modes judge the
// pitch's actual location alone (regardless of target) — a deliberate
// choice matching how a coach might say "just stay down" for a
// session, rather than demanding an exact spot.
// U2a: inside/outside now follows the pitch's OWN recorded batter side
// (falls back to 'R' for legacy pitches with no batter_side -- CLAUDE.md
// landmine 9, a stale cached client could also post a pitch missing this
// field). Read off the pitch object itself, not a second function
// parameter -- several callers below pass this function bare to
// .filter(), which would otherwise silently receive the array index as a
// second argument. This exact pair of tests shipped inverted once already
// (fixed Sept 8) and must change in lockstep with the identical copy in
// supabase/functions/send-session-report/index.ts -- same trap as
// TYPE_PALETTE_HEX.
function isRelativelyAccurate(pitch){
  const mode = pitch.accuracyMode;
  if(!mode) return isAccurate(pitch);
  const batterSide = pitch.batterSide || 'R';
  switch(mode){
    case 'ring': {
      const dRow = Math.abs(pitch.actualRow - pitch.targetRow);
      const dCol = Math.abs(pitch.actualCol - pitch.targetCol);
      return Math.max(dRow, dCol) <= 1;
    }
    case 'nothingUp': return pitch.actualRow >= 3;       // bottom two rows only
    case 'nothingLow': return pitch.actualRow <= 1;      // top two rows only
    // "Inside" (key nothingAway) / "Outside" (key nothingInside): for a
    // RHB, inside is the catcher-frame LEFT columns (0-1); for a LHB the
    // same physical side of the plate is the RIGHT columns (3-4) -- the
    // rule flips with batter side, the column numbers it tests do not.
    case 'nothingAway': return batterSide === 'R' ? pitch.actualCol <= 1 : pitch.actualCol >= 3;
    case 'nothingInside': return batterSide === 'R' ? pitch.actualCol >= 3 : pitch.actualCol <= 1;
    default: return isAccurate(pitch);
  }
}

/* ---------- INIT / AUTH GUARD ---------- */
// P1-13: nothing on the path to first paint may await the network.
// supabase-js's auth.getSession() retries a failed token refresh with
// exponential backoff for ~20-30s (and forever on a black-holed
// network) before returning, and until this task init() awaited it
// before painting anything -- so an offline cold launch showed a blank
// screen for that whole time. Now:
//   1. the session is read from localStorage only (no network refresh)
//   2. with a cached context we paint the real charting UI immediately
//      and reconcile with the server in the background
//   3. every startup network call that survives is wrapped in a short
//      timeout so a connected-but-dead network can't stall startup either
const STARTUP_NET_TIMEOUT_MS = 3000;

function isOnline(){ return !(typeof navigator !== 'undefined' && navigator.onLine === false); }

// Race a promise (or supabase thenable) against a timeout. The underlying
// request keeps running -- we just stop waiting on it.
function netTimeout(thenable, ms){
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error('startup network timeout')), ms || STARTUP_NET_TIMEOUT_MS);
  });
  return Promise.race([Promise.resolve(thenable), timeout]).finally(() => clearTimeout(timer));
}

function applyCachedContext(cached){
  state.profile = cached.profile;
  state.teams = cached.teams || [];
  state.roster = cached.roster || [];
  state.zones = cached.zones || {};
  state.currentTeamId = cached.currentTeamId;
  state.currentPitcherId = cached.currentPitcherId;
  state.myVerification = cached.myVerification || { email: null, emailConfirmed: false };
  state.view = 'session';   // U7: always open on New Session (a draft, if any, shows Resume Session)
}

async function init(){
  renderBoot();   // instant -- never leave #app blank while auth resolves

  // supabase-js only clears the stored session on a genuine credential
  // rejection (400/401); a refresh that merely couldn't reach the network
  // leaves it in place. So a stored session here means "logged in, maybe
  // offline" -- trust it, and never block on a network refresh to confirm.
  const urlHasToken = typeof window !== 'undefined' && /[#&]access_token=/.test(window.location.hash || '');
  let session = readPersistedSessionRaw();
  if(!session && (isOnline() || urlHasToken)){
    // Nothing stored -- e.g. a fresh redirect back from an auth link.
    // Give supabase-js one bounded chance to produce a session.
    try{
      const { data } = await netTimeout(supabaseClient.auth.getSession());
      session = data && data.session;
    }catch(e){ /* timed out or threw -> treat as logged out */ }
  }
  if(!session){
    // Genuinely logged out (or a real rejection wiped storage). Signing in
    // needs the network anyway and there's no local charting state for an
    // unknown user. .replace() so Back doesn't land on a torn-down tracker.
    window.location.replace('login.html');
    return;
  }
  state.session = session;
  state.setupNeeded = null;
  await refreshOutboxState();

  await loadVeloHistory();   // U6: on-device velocity history, so the strip can center with no network
  const cached = await storGet(lastKnownKey(session.user.id));
  const online = isOnline();

  if(cached && cached.profile){
    // ---- Fast path: paint the real charting UI from the last context we
    //      saw online. No network awaited before charting is usable. ----
    applyCachedContext(cached);
    state.sessions = [];        // server history isn't reachable offline; queued sessions still show via the outbox
    state.deletedSessions = []; // (P1-15) tombstones come from the server too
    await refreshDraftState();
    state.loaded = true;
    finishInit();
    if(online) resolveOnline(true).catch(err => console.error('background reconcile failed', err));
    return;
  }

  // ---- No cached context yet (first load after login, or cleared storage). ----
  if(!online){
    state.bootError = 'offline-no-context';
    renderBoot();
    return;
  }
  await resolveOnline(false);
}

// The online half of startup, off the first-paint path. Confirms the
// session with the auth server (bounded), then loads profile/teams/roster.
// `alreadyPainted` is true when the cached charting UI is already up: a
// failure then is silent and keeps the cache. When false (nothing painted
// yet -- fresh login, or cleared storage) a hard failure shows a clear
// boot message instead of a dead spinner.
async function resolveOnline(alreadyPainted){
  // Confirm / refresh the session. supabase-js clears storage on a genuine
  // credential rejection (400/401) and leaves it alone on a mere network
  // failure -- so "no session AND storage now empty" means a real online
  // sign-out/revocation, and anything else (timeout, transient) is
  // inconclusive and must not bounce a charter.
  let fresh;
  try{
    const { data } = await netTimeout(supabaseClient.auth.getSession());
    fresh = data && data.session;
  }catch(e){
    if(alreadyPainted) return;            // keep the cached view
    state.bootError = 'load-failed';
    renderBoot();
    return;
  }
  if(!fresh){
    if(isOnline() && !readPersistedSessionRaw()){
      // Genuine revocation. Any in-progress charting is already in the
      // localStorage draft, so nothing is lost by redirecting now.
      try{ await supabaseClient.auth.signOut(); }catch(e){}
      window.location.replace('login.html');
      return;
    }
    if(alreadyPainted) return;
    window.location.replace('login.html');
    return;
  }
  state.session = fresh;
  await loadFullContextOnline(alreadyPainted);
}

// The full online load: profile -> server-side setup check (P1-12) ->
// teams -> first team's roster/sessions. Runs only after resolveOnline()
// has a confirmed session. `alreadyPainted` true = the cached charting UI
// is already up, so a failure here is silent and keeps the cache; false =
// nothing painted yet, so a hard failure shows a clear boot message.
async function loadFullContextOnline(alreadyPainted){
  const session = state.session;
  const giveUp = () => {
    if(alreadyPainted) return true;       // keep the cached UI already shown
    state.bootError = 'load-failed';
    renderBoot();
    return true;
  };

  let profile;
  try{
    ({ data: profile } = await netTimeout(
      supabaseClient.from('profiles').select('*').eq('id', session.user.id).single()));
  }catch(e){ if(giveUp()) return; }

  // Account setup is guaranteed server-side (P1-12): the auth.users trigger
  // covers coach signups; ensure_account_setup() -- idempotent, a safe
  // no-op for a healthy account -- covers invited pitchers and older
  // accounts. Only call it when the profile is actually missing.
  let setupRes = null;
  if(!profile){
    try{
      const { data } = await netTimeout(supabaseClient.rpc('ensure_account_setup'));
      setupRes = data || null;
      ({ data: profile } = await netTimeout(
        supabaseClient.from('profiles').select('*').eq('id', session.user.id).single()));
    }catch(e){ if(giveUp()) return; }
  }

  if(!profile && setupRes && setupRes.needs_role){
    state.setupNeeded = 'role';
    state.loaded = true;
    finishInit();
    return;
  }
  if(!profile){
    if(alreadyPainted) return;   // keep the cached view rather than sign out mid-bullpen
    alert('Could not load your account profile. Please try logging in again, or contact support if this keeps happening.');
    await supabaseClient.auth.signOut();
    window.location.href = 'login.html';
    return;
  }
  state.profile = profile;

  // R0: best-effort, matches profile/teams/roster's own "cached fast path
  // shows stale, this reconcile pass refreshes it" treatment -- a failure
  // here just leaves whatever was cached (fail closed: still unverified
  // until proven otherwise, never the other way).
  try{
    const { data: verRows } = await netTimeout(supabaseClient.rpc('my_verification_status'));
    if(verRows && verRows.length){
      state.myVerification = { email: verRows[0].email, emailConfirmed: verRows[0].email_confirmed };
    }
  }catch(e){ /* keep whatever was cached */ }

  try{ await netTimeout(loadTeams()); }
  catch(e){ if(giveUp()) return; }

  // A coach with a profile but no team: try to finish setup from signup
  // metadata, then fall back to the create-team form.
  if(isCoach() && !state.teams.length){
    try{
      await netTimeout(supabaseClient.rpc('ensure_account_setup'));
      await netTimeout(loadTeams());
    }catch(e){ /* fall through to the setup form */ }
    if(!state.teams.length){
      state.setupNeeded = 'team';
      state.loaded = true;
      finishInit();
      return;
    }
  }

  if(state.teams.length){
    try{ await netTimeout(onTeamChange(state.teams[0].id, true)); }
    catch(e){ if(giveUp()) return; }
  }

  // U9: land a brand-new pitcher on the setup page once (setup_dismissed_at
  // is null only for a profile created after this shipped -- every
  // pre-existing profile was backfilled non-null by the migration, so no
  // returning user is ever surprised by this). Never interrupts an
  // in-progress pen: refreshDraftState() (inside onTeamChange, just above)
  // has already populated draftAvailable by this point, so a pitcher
  // reloading mid-charting resumes their draft exactly as before instead
  // of landing here.
  if(!isCoach() && state.profile && !state.profile.setup_dismissed_at && !state.draftAvailable){
    state.view = 'setup';
  }

  state.setupNeeded = null;
  state.loaded = true;
  await saveLastKnownContext();   // so the next cold start has a fresh cache to paint from
  finishInit();
}

// Instant boot screen -- shown before auth resolves, and for the two
// dead-end cases where there's nothing to paint.
function renderBoot(){
  const app = document.getElementById('app');
  if(!app) return;
  let msg;
  if(state.bootError === 'offline-no-context'){
    msg = `<p class="boot-msg boot-offline">You're offline and this device has no saved bullpen yet.<br>Connect to the internet once to finish signing in.</p>`;
  } else if(state.bootError === 'load-failed'){
    msg = `<p class="boot-msg">Couldn't load your account. Check your connection and reload.</p>`;
  } else if(!isOnline()){
    msg = `<p class="boot-msg boot-offline">Offline — opening your saved bullpen…</p>`;
  } else {
    msg = `<p class="boot-msg">Loading…</p>`;
  }
  app.innerHTML = `<div class="boot-screen">
    <div class="brand"><span class="brand-mark"></span><h1 class="display">Knuckleball<span>.</span></h1></div>
    ${msg}
  </div>`;
}

// Common tail for every init() path: paint the app, then wire up the passive
// sync triggers (reconnect, and "we just finished loading") -- manual "Sync
// now" is wired separately, on the button itself. Guarded so re-running init()
// (e.g. after the account-setup form completes) doesn't stack listeners.
let syncTriggersWired = false;
function finishInit(){
  render();
  if(!syncTriggersWired){
    syncTriggersWired = true;
    // Reconnecting: re-render (drop the offline indicator) and flush the outbox.
    window.addEventListener('online', () => { render(); triggerSync(); });
    // Going offline: re-render so the offline indicator appears right away.
    window.addEventListener('offline', () => render());
  }
  triggerSync();
}

// supabase-js (no custom storageKey configured -- see supabase-config.js)
// persists the session under `sb-<project-ref>-auth-token`, with `user`
// embedded directly in that same object. Recomputed here from SUPABASE_URL
// rather than hard-coded so it can't drift from whatever project this page
// is actually pointed at (production vs. staging).
function authStorageKey(){
  return 'sb-' + new URL(SUPABASE_URL).hostname.split('.')[0] + '-auth-token';
}
function readPersistedSessionRaw(){
  try{
    const raw = localStorage.getItem(authStorageKey());
    if(!raw) return null;
    const sess = JSON.parse(raw);
    if(sess && sess.access_token && sess.user && sess.user.id) return sess;
    return null;
  } catch(e){ return null; }
}

async function loadTeams(){
  if(isCoach()){
    // R0: invite_token is on this same row, readable under the existing
    // "Coaches manage own teams" policy -- no new RPC needed for a coach
    // to see their OWN team's token (only the logged-out join page, which
    // can't rely on RLS at all, goes through resolve_team_invite instead).
    const { data } = await supabaseClient.from('teams').select('id, name, invite_token').eq('coach_id', state.profile.id).order('created_at');
    state.teams = data || [];
  } else {
    const { data } = await supabaseClient.from('pitcher_teams').select('team_id, uniform_number, teams(id, name)').eq('pitcher_id', state.profile.id);
    state.teams = (data || []).filter(r => r.teams).map(r => ({ ...r.teams, uniform_number: r.uniform_number }));
  }
}

// Best-effort, last-known snapshot of profile/teams/roster and current
// selection -- NOT an authoritative data cache (out of scope: caching
// Supabase responses). Its only job is letting init() recover enough
// context to reach the P0-03 draft-restore check when a profile/teams
// fetch fails offline, instead of alerting and signing the user out
// before ever looking at localStorage.
function lastKnownKey(userId){ return 'lastKnownContext:' + userId; }
async function saveLastKnownContext(){
  if(!state.session || !state.profile) return;
  await storSet(lastKnownKey(state.session.user.id), {
    profile: state.profile,
    teams: state.teams,
    roster: state.roster,
    zones: state.zones,
    currentTeamId: state.currentTeamId,
    currentPitcherId: state.currentPitcherId,
    myVerification: state.myVerification
  });
}

window.signOut = async function(){
  try{ await supabaseClient.auth.signOut(); } catch(e){ console.error('Sign out error', e); }
  window.location.href = 'login.html';
};

/* ---------- TEAM / ROSTER ---------- */
window.onTeamChange = async function(teamId, skipRender){
  state.currentTeamId = teamId;
  state.uniformEditKey = null; state.uniformMsg = '';
  state.expandedSessionId = null;
  state.regenerateArmed = false;
  state.hint = '';
  clearDeleteState();

  if(isCoach()){
    await loadRosterForTeam(teamId);
    state.currentPitcherId = state.roster.length ? state.roster[0].id : null;
    if(skipRender) adoptDraftPitcher();   // launch: land on the pitcher whose session is in progress
    state.rosterCollapsed = false;   // a fresh team load always starts with the roster open
    // Launch (skipRender) always opens on New Session; a coach who switches teams
    // from the dropdown still lands on History, as before.
    state.view = skipRender ? 'session' : 'history';
  } else {
    state.currentPitcherId = state.profile.id;
    state.view = 'session';
  }
  await loadSessionsForCurrentSelection();
  await loadZones();
  await refreshDraftState();
  await saveLastKnownContext();
  if(!skipRender) render();
};
// On-device only (localStorage, no network): if the coach has an unfinished draft
// for a rostered pitcher on this team, select that pitcher so launch opens into it.
function adoptDraftPitcher(){
  if(!isCoach() || !state.currentTeamId) return;
  const has = id => { try{ const d = JSON.parse(localStorage.getItem('draft:' + id + ':' + state.currentTeamId)); return !!(d && d.pitches && d.pitches.length); }catch(e){ return false; } };
  if(state.currentPitcherId && has(state.currentPitcherId)) return;
  const hit = state.roster.find(r => has(r.id));
  if(hit) state.currentPitcherId = hit.id;
}

/* ---------- ACCURACY ZONES (U7 Phase B) ----------
   Per pitcher, per pitch type, per batter side: the catcher-frame cells ('row-col')
   that count as accurate. The pitcher's relative-accuracy switch and zones apply no
   matter who is charting. Cached with the roster snapshot so charting reads them
   with no network. */
function zoneCellsFor(pitcherId, type, side){
  const z = state.zones[pitcherId];
  const c = z && z[type] && z[type][side];
  return (c && c.length) ? c : null;
}
async function loadZones(){
  try{
    const ids = isCoach() ? state.roster.map(r => r.id) : (state.profile ? [state.profile.id] : []);
    if(!ids.length) return;
    const { data, error } = await supabaseClient.from('accuracy_zones').select('pitcher_id, pitch_type, batter_side, cells').in('pitcher_id', ids);
    if(error || !data) return;                    // offline / failed: keep the cached zones
    const fresh = {};
    ids.forEach(id => { fresh[id] = {}; });
    data.forEach(r => {
      const byType = fresh[r.pitcher_id] || (fresh[r.pitcher_id] = {});
      (byType[r.pitch_type] = byType[r.pitch_type] || {})[r.batter_side] = r.cells || [];
    });
    state.zones = Object.assign({}, state.zones, fresh);
  }catch(e){ /* best-effort */ }
}

// Numerical order by uniform number; pitchers who haven't set one yet go last
// (alphabetical among themselves) so the list stays stable.
function sortRoster(){
  state.roster.sort((a, b) => {
    const an = a.uniformNumber, bn = b.uniformNumber;
    if(an !== null && bn !== null && an !== bn) return an - bn;
    if(an !== null && bn === null) return -1;
    if(an === null && bn !== null) return 1;
    return String(a.name).localeCompare(String(b.name));
  });
}

async function loadRosterForTeam(teamId){
  const { data, error } = await supabaseClient
    .from('pitcher_teams')
    .select('uniform_number, profiles(id, full_name, pitch_types, contact_emails, throws, relative_accuracy_enabled, uses_radar_gun)')
    .eq('team_id', teamId);
  if(error){ console.error('loadRosterForTeam failed', error); state.roster = []; return; }
  state.roster = (data || []).filter(r => r.profiles).map(r => {
    const p = mapProfile(r.profiles);
    p.uniformNumber = (r.uniform_number === null || r.uniform_number === undefined) ? null : r.uniform_number;
    return p;
  });
  sortRoster();

  // R0: verification status per pitcher, via the one sanctioned read path
  // (get_roster_verification -- auth.users itself is never exposed to
  // PostgREST/RLS). Best-effort: a failure here shouldn't block the
  // roster from rendering, just leaves emailConfirmed undefined, which
  // the UI treats the same as "unverified" (fail closed, never show a
  // report-recipient as usable when its status is unknown).
  const { data: verRows } = await supabaseClient.rpc('get_roster_verification', { p_team_id: teamId });
  const verByPitcher = {};
  (verRows || []).forEach(v => { verByPitcher[v.pitcher_id] = v; });
  state.roster.forEach(p => {
    const v = verByPitcher[p.id];
    p.accountEmail = v ? v.email : null;
    p.emailConfirmed = v ? v.email_confirmed : false;
  });
}

window.toggleRosterCollapsed = function(){
  state.rosterCollapsed = !state.rosterCollapsed;
  render();
};
window.selectPitcher = async function(pitcherId){
  state.currentPitcherId = pitcherId;
  state.rosterCollapsed = true;   // picking a pitcher rolls the list up; unchanged otherwise
  state.uniformEditKey = null; state.uniformMsg = '';
  state.expandedSessionId = null;
  clearDeleteState();
  await loadSessionsForCurrentSelection();
  await refreshDraftState();
  await saveLastKnownContext();
  render();
};

/* ---------- INVITE LINK (coach only, R0) ----------
   Replaces the old per-email invite -- see CLAUDE.md D11 / u4-html-reports.md's
   sibling packet: institutional mail gateways silently quarantine invites
   from a young sending domain, so onboarding can't depend on email
   reaching an inbox at all. One link per team, shareable however works
   (text, GroupMe, read aloud, a QR code); regenerating instantly kills the
   old one via teams.invite_token's UNIQUE constraint. */
function inviteLinkFor(team){
  return window.location.origin + '/join.html?t=' + team.invite_token;
}
// navigator.clipboard is unavailable or rejected in some contexts (non-HTTPS,
// certain in-app browsers / PWA modes), so fall back to a selected textarea +
// execCommand('copy'), which needs no permission but must run synchronously
// inside the click.
function copyTextFallback(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px;';
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, text.length);
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
  document.body.removeChild(ta);
  return ok;
}
window.copyInviteLink = async function(){
  const team = state.teams.find(t => t.id === state.currentTeamId);
  if(!team) return;
  const link = inviteLinkFor(team);
  let ok = false;
  try{
    await navigator.clipboard.writeText(link);
    ok = true;
  }catch(e){
    ok = copyTextFallback(link);
  }
  state.inviteCopyStatus = ok ? 'copied' : 'error';
  render();
  setTimeout(() => { state.inviteCopyStatus = null; render(); }, ok ? 2000 : 4000);
};
window.armRegenerateInvite = function(){
  state.regenerateArmed = true;
  render();
};
window.cancelRegenerateInvite = function(){
  state.regenerateArmed = false;
  render();
};
window.confirmRegenerateInvite = async function(){
  const team = state.teams.find(t => t.id === state.currentTeamId);
  if(!team) return;
  state.regenerateBusy = true;
  render();
  const { data: newToken, error } = await supabaseClient.rpc('rotate_team_invite', { p_team_id: team.id });
  state.regenerateBusy = false;
  state.regenerateArmed = false;
  if(!error && newToken){
    team.invite_token = newToken;
  }
  render();
};

/* ---------- ROSTER REMOVE (coach only, R0) ----------
   The delete itself is already covered by the existing "Coaches remove
   pitchers from their team" RLS policy on pitcher_teams -- no new
   server-side logic needed for that part. Removing a membership doesn't
   touch the player's own sessions (they belong to the pitcher
   permanently, per CLAUDE.md's roster model) -- only this team's view of
   them.
   Two-step arm/confirm (no native confirm()), matching the invite-link
   Regenerate pattern -- fixes a real gap against CLAUDE.md's own Roster &
   visibility model, which already calls for "explicit confirmation" on
   removal; this was a plain unconfirmed delete until caught live during
   the R0 staging walkthrough.
   confirmRemoveRosterPitcher also fires a best-effort notification email
   to the removed player BEFORE deleting the row -- get_removal_notice_info
   needs the pitcher_teams row to still exist to verify who's being
   notified and on whose authority, so the notice attempt has to happen
   first. The removal itself proceeds regardless of whether that call or
   the email send succeeds -- never block a coach's removal on a Resend
   hiccup. */
window.armRemoveRosterPitcher = function(pitcherId){
  state.removeArmedPitcherId = pitcherId;
  render();
};
window.cancelRemoveRosterPitcher = function(){
  state.removeArmedPitcherId = null;
  render();
};
window.confirmRemoveRosterPitcher = async function(pitcherId){
  const team = state.teams.find(t => t.id === state.currentTeamId);
  if(!team) return;
  state.removeBusy = true;
  render();
  try{
    if(typeof REMOVAL_NOTICE_URL !== 'undefined' && REMOVAL_NOTICE_URL.indexOf('YOUR_') !== 0){
      await fetch(REMOVAL_NOTICE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.session.access_token },
        body: JSON.stringify({ pitcherId, teamId: team.id })
      });
    }
  }catch(e){ /* best-effort -- removal proceeds regardless */ }
  const { error } = await supabaseClient
    .from('pitcher_teams')
    .delete()
    .eq('pitcher_id', pitcherId)
    .eq('team_id', team.id);
  state.removeBusy = false;
  state.removeArmedPitcherId = null;
  if(error){ console.error('removeRosterPitcher failed', error); render(); return; }
  await loadRosterForTeam(team.id);
  if(state.currentPitcherId === pitcherId){
    state.currentPitcherId = state.roster.length ? state.roster[0].id : null;
  }
  render();
};

/* ---------- DEFERRED VERIFICATION (R0) ----------
   Banner state + actions for a pitcher whose account email isn't
   confirmed yet. Resend uses the same signup-confirmation email Supabase
   already sends; Change Email is the actual point of this packet (item f)
   -- one tap, self-service, no coach or support needed. */
window.resendVerification = async function(){
  if(!state.myVerification.email) return;
  state.verifyResendStatus = 'sending';
  render();
  // R0 follow-up: this used to call supabaseClient.auth.resend({type:'signup'}),
  // Supabase's OWN confirmation resend -- with "Confirm email" off, Supabase
  // never sent that email in the first place, so that call would silently
  // no-op forever. Verification is ours now; resend goes through our own
  // send-verification-email function, same auth pattern as sendSessionReport.
  try{
    if(typeof VERIFY_EMAIL_URL === 'undefined' || VERIFY_EMAIL_URL.indexOf('YOUR_') === 0){
      throw new Error('not configured');
    }
    const res = await fetch(VERIFY_EMAIL_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.session.access_token }
    });
    if(!res.ok) throw new Error('send failed');
    state.verifyResendStatus = 'sent';
  }catch(e){
    state.verifyResendStatus = 'error';
  }
  render();
};
window.toggleChangeEmail = function(){
  state.changeEmailOpen = !state.changeEmailOpen;
  state.changeEmailStatus = null;
  render();
};
window.submitChangeEmail = async function(){
  const input = document.getElementById('change-email-input');
  const email = (input && input.value || '').trim();
  if(!email) return;
  state.changeEmailStatus = 'sending';
  render();
  const { error } = await supabaseClient.auth.updateUser({ email });
  if(error){
    state.changeEmailStatus = 'error:' + error.message;
    render();
    return;
  }
  // R0 follow-up: safe to fire our own verification email right away only
  // because staging has "Secure email change" off, so updateUser() above
  // already applied auth.users.email synchronously -- with that setting
  // on, this would fire to the address being REPLACED, not the new one
  // (confirmed empirically during the staging walkthrough; see the
  // migration that added the email_verified_at reset to
  // generate_email_verify_token for the full account of that failure
  // mode). Never re-enable that setting without revisiting this.
  try{
    if(typeof VERIFY_EMAIL_URL !== 'undefined' && VERIFY_EMAIL_URL.indexOf('YOUR_') !== 0){
      await fetch(VERIFY_EMAIL_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.session.access_token }
      });
    }
  }catch(e){ /* recoverable via the Resend button */ }
  state.changeEmailStatus = 'sent';
  // Reflect the change immediately rather than waiting for the next
  // background reconcile -- the banner should show the new (unverified)
  // address right away, matching what generate_email_verify_token just did.
  state.myVerification = { email, emailConfirmed: false };
  render();
};

/* ---------- ACCOUNT SETUP RECOVERY (P1-12) ----------
   Shown when init() reached the server but the account is still incomplete:
   'role' -> no profile and no usable signup metadata (ask coach/pitcher + name);
   'team' -> a coach with a profile but no team. Both submit to the same
   idempotent RPC that the server-side trigger and init() use. */
window.submitAccountSetup = async function(role){
  // Stash typed values so an error re-render doesn't wipe them.
  const nameEl = document.getElementById('setup-name');
  const teamEl = document.getElementById('setup-team');
  if(nameEl) state.setupName = nameEl.value;
  if(teamEl) state.setupTeam = teamEl.value;

  const payload = {};
  if(state.setupNeeded === 'role'){
    const name = state.setupName.trim();
    if(!name){ state.setupError = 'Enter your name.'; render(); return; }
    payload.p_role = role;
    payload.p_full_name = name;
    if(role === 'coach'){
      const team = state.setupTeam.trim();
      if(!team){ state.setupError = 'Enter a team or program name.'; render(); return; }
      payload.p_team_name = team;
    }
  } else {
    const team = state.setupTeam.trim();
    if(!team){ state.setupError = 'Enter a team or program name.'; render(); return; }
    payload.p_team_name = team;
  }

  state.setupBusy = true;
  state.setupError = null;
  render();

  const { data, error } = await supabaseClient.rpc('ensure_account_setup', payload);
  state.setupBusy = false;
  if(error){
    state.setupError = 'Setup failed: ' + error.message;
    render();
    return;
  }
  if(data && (data.needs_role || data.needs_team)){
    state.setupError = 'That didn’t complete setup — please check the fields and try again.';
    render();
    return;
  }

  // Rows exist now -- re-run init() from the top to load the app normally.
  state.setupNeeded = null;
  state.setupName = '';
  state.setupTeam = '';
  state.loaded = false;
  render();
  await init();
};

/* ---------- PITCH MIX + THROWS (Profile pages; pitcher edits own, coach edits a rostered pitcher) ----------
   A pitcher writes their own row directly (pitch_types / throws are the only
   profile columns clients may update); a coach goes through coach_set_pitch_types /
   coach_set_throws, which only accept a pitcher on one of the coach's own teams. */
async function savePitchMix(types){
  let ok = false;
  if(isCoach()){
    const p = currentPitcher();
    if(!p) return false;
    const { error } = await supabaseClient.rpc('coach_set_pitch_types', { p_pitcher_id: p.id, p_types: types });
    ok = !error;
    if(ok) p.pitchTypes = types;
  } else {
    const { error } = await supabaseClient.from('profiles').update({ pitch_types: types }).eq('id', state.profile.id);
    ok = !error;
    if(ok) state.profile.pitch_types = types;
  }
  state.profileMsg = ok ? '' : 'Could not save. Check your connection and try again.';
  if(ok) await saveLastKnownContext();   // New Session reads the mix offline from this snapshot
  return ok;
}
window.addPitchType = async function(){
  const input = document.getElementById('new-type-input');
  const val = (input && input.value || '').trim();
  const p = currentPitcher();

/* ---------- VELOCITY STRIP (U6) ----------
   Velocity is added AFTER a pitch is recorded: tap 2 (where it landed) records
   the pitch with velocity null, and until the next pitch's first tap the strip
   attaches a tapped value to that last pitch. Not tapping leaves it null (shown
   as a dash). The strip centers on this pitcher's typical velocity for the pitch
   type -- 75 until they have 3 recorded, then an exponential moving average of
   their most recent 100. Nothing is ever pre-selected. */
const VELO_MIN = 40, VELO_MAX = 105, VELO_DEFAULT_CENTER = 75, VELO_MIN_SAMPLES = 3, VELO_RECENT = 100;
// How fast the center follows new pitches (exponential moving average). 0.15 puts
// half the weight on roughly the last 4-5 recorded pitches: quick enough to track
// a pitcher warming up or tiring within a pen, slow enough that one wild pitch
// doesn't yank the strip. Raise for faster, lower for steadier.
const VELO_EMA_ALPHA = 0.15;
// Before U6 the slider recorded an untouched default of 65 into real sessions
// (81% of recorded velocities in production were exactly 65). Those can't be
// told apart from real 65s, so a velocity of exactly 65 on a pitch charted
// before this timestamp is left out of the centering average. Pitches charted
// after it count normally.
const U6_CUTOFF_TS = 1789965601000;
// LOCKSTEP PAIR with public.is_default_velo_reading() in
// supabase/migrations/20260921090000_u8_team_leaderboard.sql (same value, 65, and the same
// cutoff: 1789965601 s = 2026-09-21 04:40:01 UTC). The team leaderboard applies the SQL copy;
// everything in this file uses this one. A velocity of exactly 65 on a pitch charted before
// the cutoff is the old slider's untouched default, i.e. NO reading. Stored pitches are never
// changed -- this only decides what counts. Change both together or a pitcher's numbers will
// differ between the app and the leaderboard.
function isDefaultVeloReading(pt){ return pt.velo === 65 && pt.ts < U6_CUTOFF_TS; }
function veloVisible(){ return window.matchMedia('(max-width:500px)').matches ? 5 : 7; }
// Exponential moving average of the pitcher's most recent 100 recorded velocities
// for this pitch type (oldest -> newest). Seeded with the plain average of the
// first 3, then every later pitch is folded in as it is recorded, so recent
// pitches count most. Fewer than 3 recorded: the 75 default.
function veloCenter(velos){
  if(velos.length < VELO_MIN_SAMPLES) return VELO_DEFAULT_CENTER;
  const recent = velos.slice(-VELO_RECENT);
  let ema = recent.slice(0, VELO_MIN_SAMPLES).reduce((a, b) => a + b, 0) / VELO_MIN_SAMPLES;
  for(let i = VELO_MIN_SAMPLES; i < recent.length; i++){
    ema += VELO_EMA_ALPHA * (recent[i] - ema);
  }
  return Math.max(VELO_MIN, Math.min(VELO_MAX, Math.round(ema)));
}
function veloHistoryKey(){ return 'veloHistory:' + (state.session ? state.session.user.id : ''); }
async function loadVeloHistory(){
  if(state.veloHistory) return;
  state.veloHistory = (await storGet(veloHistoryKey())) || {};
}
function veloBucketKey(){ return state.currentPitcherId + ':' + state.currentTeamId; }
// Rebuild this pitcher+team's cached velocities from data we just loaded from the
// server plus any sessions still queued to sync. Only ever called after a
// successful server load, so an offline start can't wipe the cache.
async function rebuildVeloHistory(serverSessions){
  await loadVeloHistory();
  const seen = new Set();
  const rows = [];
  const take = (sessionId, pitches) => {
    if(seen.has(sessionId)) return;
    seen.add(sessionId);
    (pitches || []).forEach(pt => {
      if(pt.velo === null || pt.velo === undefined) return;
      if(isDefaultVeloReading(pt)) return;
      rows.push({ type: pt.type, velo: pt.velo, ts: pt.ts });
    });
  };
  (serverSessions || []).forEach(sess => take(sess.id, sess.pitches));
  (state.outbox || []).filter(it => it.pitcherId === state.currentPitcherId && it.teamId === state.currentTeamId)
    .forEach(it => take(it.id, it.pitches));
  rows.sort((a, b) => a.ts - b.ts);
  const byType = {};
  rows.forEach(r => { (byType[r.type] = byType[r.type] || []).push(r.velo); });
  Object.keys(byType).forEach(t => { byType[t] = byType[t].slice(-VELO_RECENT); });

}
// Offline-safe: add a just-ended session's velocities to the cache directly.
async function appendVeloHistory(pitcherId, teamId, pitches){
  await loadVeloHistory();

  const byType = state.veloHistory[k] || (state.veloHistory[k] = {});
  (pitches || []).slice().sort((a, b) => a.ts - b.ts).forEach(pt => {
    if(pt.velo === null || pt.velo === undefined) return;
    (byType[pt.type] = byType[pt.type] || []).push(pt.velo);
    byType[pt.type] = byType[pt.type].slice(-VELO_RECENT);
  });
  await storSet(veloHistoryKey(), state.veloHistory);
}

function attachVeloStrip(){

window.handleZoneTap = async function(row, col){
  if(state.editDraftRow !== null){ state.hint = 'Finish editing that pitch first'; render(); return; }
  if(!state.selectedType){ state.hint = 'Select a pitch type first'; render(); return; }
  state.hint = '';

  if(!state.pendingTarget){
    // Tap 1 of a new pitch: the previous pitch's velocity is now locked as it
    // stands, and the strip stays off until this pitch's tap 2.
    state.pendingTarget = { row, col };
    state.veloTargetIdx = null;
    render();
    return;
  }

  const target = state.pendingTarget;
  const strike = isStrikeCell(row, col);
  // U5: the single normalize-at-capture point. Tapped (screen-frame)
  // columns are converted to the canonical catcher frame right here, once,
  // before anything reaches storage -- see mirrorCol's comment above.
  const chartingPerspective = sessionPerspective(state.activeSession);
  // U2a: batterSide is frozen onto the pitch at the moment of capture, read
  // from whatever the live toggle currently says -- permanently theirs
  // regardless of how many times the toggle flips later in the same
  // session (approach g).
  const batterSide = sessionBatterSide(state.activeSession);
  // U7B: score against the PITCHER's zone for this pitch type and batter side, if their
  // relative-accuracy switch is on and one is painted. Stored on the pitch now (with a copy
  // of the cells) so repainting a zone later never changes a saved session. Zones are in
  // catcher frame, and the tapped column is normalized to it here, like every coordinate.
  const chartPitcher = currentPitcher();
  const zoneCells = (chartPitcher && chartPitcher.relativeAccuracy)
    ? zoneCellsFor(state.currentPitcherId, state.selectedType, batterSide) : null;
  const inAccuracyZone = zoneCells ? zoneCells.includes(row + '-' + perspectiveCol(col, chartingPerspective)) : null;
  // U9: this is the actual freeze point for the radar-gun setting -- right
  // before the FIRST pitch of the pen lands, while sessionUsesRadarGun()
  // still reads live (pitches.length is still 0 here). From this line on,
  // pitches.length > 0 and every later call reads this stored value
  // instead, so a toggle flip mid-pen can't affect it -- but nothing before
  // this moment was ever frozen, so switching to New Session right after
  // changing the toggle in Profile shows the new value immediately, no
  // reload needed.
  if(state.activeSession.pitches.length === 0){
    state.activeSession.usesRadarGun = sessionUsesRadarGun(state.activeSession);
  }
  state.activeSession.pitches.push({
    id: genUUID(),
    type: state.selectedType, velo: null,
    targetRow: target.row, targetCol: perspectiveCol(target.col, chartingPerspective),
    actualRow: row, actualCol: perspectiveCol(col, chartingPerspective),
    accuracyMode: null,   // U7B: the old per-session modes are retired for new pitches; zone result below
    inAccuracyZone,
    accuracyZoneCells: zoneCells ? zoneCells.slice() : null,
    batterSide,
    ts: Date.now()
  });
  state.pendingTarget = null;
  state.veloTargetIdx = state.activeSession.pitches.length - 1;
  await storSet(draftKey(), state.activeSession);
  const flashKey = uid();
  state.flashCell = { row, col, strike, key: flashKey };
  render();
  setTimeout(() => {
    if(state.flashCell && state.flashCell.key === flashKey){
      state.flashCell = null;
      render();
    }
  }, 1400);
};
