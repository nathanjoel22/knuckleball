<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bullpen Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --field-dark:#0F241B;
    --field-panel:#183527;
    --field-panel-2:#1F4230;
    --chalk:#F1ECDD;
    --chalk-dim:#B7C2B4;
    --chalk-faint:#7C8C82;
    --clay:#C17A45;
    --amber:#E8A83D;
    --amber-bright:#F5C365;
    --border:rgba(241,236,221,0.12);
    --border-strong:rgba(241,236,221,0.22);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--field-dark);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(232,168,61,0.08), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(193,122,69,0.08), transparent 45%);
    color:var(--chalk);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  ::selection{ background:var(--amber); color:var(--field-dark); }
  .display{ font-family:'Teko', sans-serif; font-weight:600; letter-spacing:0.01em; }
  a{ color:inherit; }
  button:focus-visible, a:focus-visible{ outline:2px solid var(--amber-bright); outline-offset:3px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

  .wrap{ width:100%; max-width:760px; display:flex; flex-direction:column; align-items:center; gap:44px; text-align:center; }

  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand-mark{ width:11px; height:11px; border-radius:2px; background:var(--amber); transform:rotate(45deg); margin-bottom:3px; }
  .brand h1{ font-size:26px; line-height:1; margin:0; letter-spacing:0.02em; }
  .brand span{ color:var(--amber); }

  h2.display{ font-size:64px; line-height:1; margin:0; }
  .subtitle{ color:var(--chalk-dim); font-size:15px; margin-top:-24px; max-width:420px; }

  .options{ display:flex; gap:22px; width:100%; flex-wrap:wrap; justify-content:center; }
  .option-card{
    flex:1; min-width:230px; max-width:300px;
    background:var(--field-panel);
    border:1.5px solid var(--border-strong);
    border-radius:14px;
    padding:36px 26px;
    display:flex; flex-direction:column; align-items:center; gap:14px;
    cursor:pointer;
    text-decoration:none;
    transition:border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
  }
  .option-card:hover{
    border-color:var(--amber);
    background:var(--field-panel-2);
    transform:translateY(-3px);
  }
  .option-icon{
    width:56px; height:56px; border-radius:50%;
    background:var(--field-dark); border:1.5px solid var(--border-strong);
    display:flex; align-items:center; justify-content:center;
  }
  .option-card:hover .option-icon{ border-color:var(--amber); }
  .option-icon svg{ width:26px; height:26px; }
  .option-title{ font-family:'Teko',sans-serif; font-size:30px; font-weight:600; }
  .option-desc{ font-size:13px; color:var(--chalk-faint); line-height:1.5; }

  .foot{ font-size:11px; color:var(--chalk-faint); letter-spacing:0.06em; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="brand-mark"></span><h1 class="display">Bullpen<span>.</span></h1></div>

    <div>
      <h2 class="display">Who are you?</h2>
      <p class="subtitle">We'll take you to the right side of the mound.</p>
    </div>

    <div class="options">
      <a class="option-card" href="login.html?role=pitcher">
        <div class="option-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9" stroke="#E8A83D" stroke-width="1.6"/>
            <path d="M7 9.5c1.5 1.5 2.5 2 5 2s3.5-.5 5-2M7 14.5c1.5-1.5 2.5-2 5-2s3.5.5 5 2" stroke="#E8A83D" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="option-title">Pitcher</div>
        <div class="option-desc">Track your own bullpen sessions — pitch types, velocity, and location.</div>
      </a>

      <a class="option-card" href="login.html?role=coach">
        <div class="option-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3l7 3v5c0 4.5-2.9 7.9-7 10-4.1-2.1-7-5.5-7-10V6l7-3z" stroke="#E8A83D" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M9 12l2 2 4-4" stroke="#E8A83D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="option-title">Coach</div>
        <div class="option-desc">Manage your roster and review every pitcher's session history.</div>
      </a>
    </div>

    <div class="foot">Bullpen Tracker · Session Log</div>
  </div>
</body>
</html>
