<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in · Knuckleball</title>
<script>
  // Already signed in on this device? Skip the form and go to the tracker.
  // A logged-in charter who lands here with no network would otherwise be
  // stuck: the form can't submit offline (P1-01). Purely a local read of
  // the stored Supabase session -- bullpen-tracker.html's init() stays the
  // single authority on the online/offline auth decision, and this
  // validity check mirrors its readPersistedSessionRaw() so a malformed
  // stored blob can't cause a redirect loop.
  (function(){
    try{
      for(var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if(!k || !/^sb-.+-auth-token$/.test(k)) continue;
        var raw = localStorage.getItem(k);
        if(!raw) continue;
        var s = JSON.parse(raw);
        if(s && s.access_token && s.user && s.user.id){
          window.location.replace('bullpen-tracker.html');
          return;
        }
      }
    } catch(e){ /* storage blocked / bad JSON -> just show the form */ }
  })();
</script>
<script src="vendor/supabase.js"></script>
<script>
  // Offline app shell (P0-06) -- lets this page load with no network.
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW registration failed', err));
    });
  }
</script>
<script>
  // S1: theme before first paint. A ?sport= on the URL wins (every link to
  // sign-in / signup carries one) and is remembered; otherwise this device's
  // remembered choice. Join pages re-theme from the team's sport.
  (function(){
    var sp = null;
    try{
      var q = new URLSearchParams(location.search).get('sport');
      if(q === 'baseball' || q === 'softball'){ sp = q; localStorage.setItem('kb:sport', q); }
      else sp = localStorage.getItem('kb:sport');
    }catch(e){}
    window.KB_SPORT_KNOWN = (sp === 'baseball' || sp === 'softball');
    // Sign-in is always one sport's (Joel, Oct 1). Sport unknown -> choose it first.
    if(!window.KB_SPORT_KNOWN){ location.replace('index.html?choose=1'); return; }
    window.KB_SPORT = sp === 'softball' ? 'softball' : 'baseball';
    document.documentElement.setAttribute('data-sport', window.KB_SPORT);
  })();
</script>
<style>
  @import url('vendor/fonts/fonts.css');

  :root{
    --field-dark:#0F241B;
    --field-panel:#183527;
    --field-panel-2:#1F4230;
    --chalk:#F1ECDD;
    --chalk-dim:#B7C2B4;
    --chalk-faint:#7C8C82;
    --clay:#C17A45;
    --amber:#E8A83D;
    --amber-bright:#F5C365;
    --red:#C0453B;
    --border:rgba(241,236,221,0.12);
    --border-strong:rgba(241,236,221,0.22);
    --glow-a:rgba(232,168,61,0.08);
    --glow-b:rgba(193,122,69,0.08);
    --amber-rgb:232,168,61;
  }
  /* S1: softball (docs/softball-theme-reference.html). Only variables change. */
  html[data-sport="softball"]{
    --field-dark:#234B6E;
    --field-panel:#2B5A82;
    --field-panel-2:#336896;
    --chalk-dim:#C4D3E0;
    --chalk-faint:#9FB5C9;
    --amber:#F2A7C3;
    --amber-bright:#F7C3D7;
    --amber-rgb:242,167,195;
    --glow-a:rgba(242,167,195,0.10);
    --glow-b:rgba(127,184,224,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--field-dark);
    background-image:
      radial-gradient(circle at 15% 0%, var(--glow-a), transparent 40%),
      radial-gradient(circle at 85% 100%, var(--glow-b), transparent 45%);
    color:var(--chalk);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  ::selection{ background:var(--amber); color:var(--field-dark); }
  .display{ font-family:'Teko', sans-serif; font-weight:600; letter-spacing:0.01em; }
  a{ color:var(--chalk-faint); text-decoration:none; font-size:13px; }
  a:hover{ color:var(--chalk); }
  button{ font-family:inherit; cursor:pointer; }
  input{ font-family:inherit; }
  button:focus-visible, input:focus-visible, a:focus-visible{ outline:2px solid var(--amber-bright); outline-offset:3px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

  .card{
    width:100%; max-width:380px;
    background:var(--field-panel);
    border:1.5px solid var(--border-strong);
    border-radius:14px;
    padding:38px 34px;
    display:flex; flex-direction:column; gap:22px;
  }
  .brand-block{ display:flex; flex-direction:column; gap:4px; }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  /* Joel, Oct 8: the wordmark is KNUCKLEBALL in Black Ops One -- no diamond, no period */
  .brand-word{ font-family:'Black Ops One', 'Teko', sans-serif !important; font-weight:400 !important; letter-spacing:0.02em; white-space:nowrap; }
  .brand-mark{ width:10px; height:10px; border-radius:2px; background:var(--amber); transform:rotate(45deg); margin-bottom:3px; }
  .brand h1{ font-size:22px; line-height:1; margin:0; letter-spacing:0.02em; }
  .brand span{ color:var(--amber); }
  .tagline{ font-size:10px; text-transform:uppercase; letter-spacing:0.16em; color:var(--chalk-faint); }

  .role-tag{
    align-self:flex-start;
    font-size:11px; text-transform:uppercase; letter-spacing:0.1em;
    color:var(--amber-bright);
    background:rgba(var(--amber-rgb),0.12);
    border:1px solid rgba(var(--amber-rgb),0.3);
    padding:4px 10px; border-radius:20px;
  }

  h2.display{ font-size:38px; margin:0; line-height:1; }

  .field{ display:flex; flex-direction:column; gap:6px; }
  .field-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--chalk-faint); }
  .text-input{
    background:var(--field-dark); border:1px solid var(--border-strong); border-radius:6px;
    color:var(--chalk); padding:11px 12px; font-size:14px; width:100%;
  }
  .text-input::placeholder{ color:var(--chalk-faint); }
  .text-input:focus{ border-color:var(--amber); }

  .btn-primary{
    background:var(--amber); color:var(--field-dark); border:none; border-radius:7px;
    padding:12px 14px; font-size:14px; font-weight:700; letter-spacing:0.02em;
  }
  .btn-primary:hover{ background:var(--amber-bright); }
  .btn-primary:disabled{ opacity:0.6; cursor:not-allowed; }

  .error-msg{ font-size:12.5px; color:var(--red); min-height:16px; }

  .forgot-link{ align-self:flex-end; font-size:12px; }

  .foot-row{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }

  .site-footer{ font-size:11.5px; color:var(--chalk-faint); text-align:center; margin-top:4px; }
  body{ flex-direction:column; gap:14px; }   /* P1-10: the footer sits under the card */
  /* A form taller than the screen starts at the top and scrolls -- centering
     pushed its top (logo, first fields) off-screen where it couldn't be reached. */
  html,body{ height:auto; }
  body{ justify-content:flex-start; }
  body::before, body::after{ content:''; flex:1 1 0; }
  .site-footer a{ font-size:11.5px; }
</style>
</head>
<body>
  <form class="card" id="login-form" autocomplete="off">
    <div class="brand-block">
      <div class="brand"><h1 class="display brand-word">KNUCKLEBALL</h1></div>
      <span class="tagline">Always a Step Ahead</span>
    </div>

    <div>
      <span class="role-tag" id="role-tag">Sign in</span>
      <h2 class="display" style="margin-top:10px;">Welcome back</h2>
    </div>

    <div class="field">
      <label class="field-label" for="email">Email</label>
      <input class="text-input" id="email" name="email" type="email" placeholder="you@example.com" autofocus autocomplete="email">
    </div>
    <div class="field">
      <label class="field-label" for="password">Password</label>
      <input class="text-input" id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password">
      <a href="reset-password.html" class="forgot-link">Forgot password?</a>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <button type="submit" class="btn-primary" id="submit-btn">Log in</button>

    <div class="foot-row">
      <a href="index.html?choose=1">&larr; Back</a>
      <a href="coach-signup.html" id="coach-signup-link">New coach? Create an account</a>
      <a href="pitcher-signup.html" id="pitcher-signup-link">New pitcher? Create an account</a>
    </div>
    <a href="parent-signup.html" id="parent-signup-link" style="text-align:center;">Parent or guardian? Set up your player</a>
  </form>

<script src="supabase-config.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const role = params.get('role');
  const roleTag = document.getElementById('role-tag');
  const sportName = (window.KB_SPORT === 'softball') ? 'Softball' : 'Baseball';
  if(role === 'coach'){ roleTag.textContent = sportName + ' · Coach sign in'; }
  else if(role === 'pitcher'){ roleTag.textContent = sportName + ' · Pitcher sign in'; }
  else { roleTag.textContent = sportName + ' sign in'; }

  const form = document.getElementById('login-form');
  const errorEl = document.getElementById('error-msg');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    errorEl.textContent = '';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if(!email || !password){
      errorEl.textContent = 'Enter both email and password.';
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in…';

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if(error){
      // Tell a connectivity failure apart from a real credential rejection
      // so an offline user isn't told their password is wrong.
      const looksOffline = (typeof navigator !== 'undefined' && navigator.onLine === false)
        || /failed to fetch|network|load failed|fetch/i.test(error.message || '');
      errorEl.textContent = looksOffline
        ? "Can't reach the server — check your connection and try again."
        : error.message;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in';
      return;
    }

    // S4 A8 (Joel, Oct 2): one login can own a baseball AND a softball
    // profile, so sign-in never refuses for sport or role any more. It just
    // tells the app which side the person came in on; the app opens the
    // matching profile, asks "Who's charting?" when there are several, or
    // offers "Add <sport>" when there are none.
    try{
      const chosen = localStorage.getItem('kb:sport');
      if(chosen === 'baseball' || chosen === 'softball') localStorage.setItem('kb:signinSport', chosen);
      if(role === 'coach' || role === 'pitcher') localStorage.setItem('kb:signinRole', role); else localStorage.removeItem('kb:signinRole');
    }catch(e){}

    window.location.href = 'bullpen-tracker.html';
  });
</script>
<script>
  // S1: every link to sign-in or signup goes to THIS sport's page.
  (function(){
    var sp = window.KB_SPORT || 'baseball';
    document.querySelectorAll('a[href="login.html"], a[href="coach-signup.html"], a[href="pitcher-signup.html"], a[href="parent-signup.html"]').forEach(function(a){
      a.setAttribute('href', a.getAttribute('href') + '?sport=' + sp);
    });
  })();
</script>
<script>
  // P1-10: show the signup link for the side this sign-in page is for.
  (function(){ var r = new URLSearchParams(location.search).get('role');
    if(r === 'coach'){ var x = document.getElementById('pitcher-signup-link'); if(x) x.style.display = 'none'; var z = document.getElementById('parent-signup-link'); if(z) z.style.display = 'none'; }
    if(r === 'pitcher'){ var y = document.getElementById('coach-signup-link'); if(y) y.style.display = 'none'; } })();
</script>
<p class="site-footer">Knuckleball LLC 2026 &middot; <a href="privacy.html">Privacy</a> &middot; <a href="terms.html">Terms</a></p>
<script>
  // P1-10: the policy pages theme themselves from the link's #sport.
  (function(){ var sp = window.KB_SPORT === 'softball' ? 'softball' : 'baseball';
    document.querySelectorAll('.site-footer a[href^="privacy.html"], .site-footer a[href^="terms.html"]').forEach(function(a){ a.setAttribute('href', a.getAttribute('href').split('#')[0] + '#' + sp); }); })();
</script>
</body>
</html>
