<!-- ============================================================
     Knuckleball — batter silhouette + batter-side control (U2a)
     Traced from Joel's source image, Sept 9 2026. Single path,
     inlined — no external file, no network request, works offline.

     WHAT CARRIES THE STATE
     The "vs RHB" / "vs LHB" pill is the indicator, NOT the figure.
     A batter silhouette is ambiguous between handedness and viewpoint
     (an RHB seen from behind and an LHB seen from the front are the
     same shape), so the text is the only unambiguous signal. The
     figure is a spatial cue and a tap target, nothing more.

     FACING
     The traced figure FACES LEFT and must always face the grid:
       silhouette LEFT of the grid  -> class "is-left"  (mirrored, faces right)
       silhouette RIGHT of the grid -> class "is-right" (as traced, faces left)
     Which side it stands on is NOT decided here — it comes from the
     existing U5 perspective transform, same as the zone labels, which
     is what keeps it beside the 1/4/7 column in all four cases.

     LAYOUT — BINDING
     position:absolute, participates in NO layout flow. Nothing else on
     the page may move because of it. An earlier version was inserted as
     a layout sibling and pushed the home plate out of position.

     PHONES (<=500px)
     The figure is dropped entirely — there is no room, and it is not the
     indicator. The pill becomes a large centred control sitting in a
     RESERVED BAND below the grid, so it cannot be mis-tapped while
     aiming at the grid and cannot overlap the velocity slider.
     >>> The grid wrapper needs padding-bottom on phones to create that
     >>> band. See the .zone-grid-wrap rule at the bottom — apply it to
     >>> whatever the real wrapper class is.
     ============================================================ -->

<style>
/* The grid wrapper must be positioned. Add this ONLY if it isn't already,
   and do not change its box model:
     .zone-grid-wrap { position: relative; }                            */

.kb-batter {
  position: absolute;
  bottom: 0;                       /* feet level with the bottom of the grid */

  /* --- tunables --- */
  --kb-batter-h: 112%;             /* figure height relative to the grid */
  --kb-batter-gap: 6px;            /* space between figure and grid edge */
  --kb-pill-h: 48px;               /* phone: pill height */
  --kb-pill-clear: 18px;           /* phone: gap between grid and pill */

  height: var(--kb-batter-h);
  aspect-ratio: 167 / 504;

  min-width: 44px;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;

  color: #1a1a1a;
  opacity: .85;
  transition: opacity .12s ease;
}
.kb-batter:active { opacity: 1; }

.kb-batter.is-left  { right: 100%; margin-right: var(--kb-batter-gap); }
.kb-batter.is-right { left:  100%; margin-left:  var(--kb-batter-gap); }

/* Face the grid. Source faces LEFT, so mirror it when standing on the left. */
.kb-batter.is-left .kb-batter__fig { transform: scaleX(-1); }

.kb-batter__fig {
  display: block;
  width: 100%;
  height: 100%;
  fill: currentColor;
}

.kb-batter__label {
  /* The state indicator. Must read at a glance. Do not shrink it. */
  position: absolute;
  left: 50%;
  top: calc(100% + 4px);
  transform: translateX(-50%);
  white-space: nowrap;

  font-size: 14px;
  font-weight: 800;
  letter-spacing: .02em;
  line-height: 1;
  padding: 5px 9px;
  border-radius: 999px;
  background: #1a1a1a;
  color: #fff;
  pointer-events: none;
}

/* ============================================================
   PHONES — figure gone, pill becomes the whole control.
   ============================================================ */
@media (max-width: 500px) {

  /* No silhouette at all: no room, and it never carried the state. */
  .kb-batter__fig { display: none; }

  /* The button stops being a figure-shaped box and becomes just the pill,
     centred in the reserved band under the grid. Still absolute, so it
     still moves nothing. */
  .kb-batter,
  .kb-batter.is-left,
  .kb-batter.is-right {
    height: auto;
    width: auto;
    aspect-ratio: auto;
    top: auto;
    bottom: 8px;                   /* sits inside the reserved band */
    left: 50%;
    right: auto;
    margin: 0;
    transform: translateX(-50%);
    opacity: 1;
  }

  .kb-batter__label {
    position: static;
    transform: none;
    display: flex;
    align-items: center;
    justify-content: center;

    min-height: var(--kb-pill-h);  /* comfortably above the 44px minimum */
    min-width: 140px;
    padding: 0 22px;
    font-size: 16px;
    font-weight: 800;
    border-radius: 999px;
    pointer-events: auto;
  }
}

/* ============================================================
   RESERVED BAND — apply to the REAL grid wrapper class.
   Without this the pill overlaps the velocity slider. With it, the
   wrapper grows by a fixed, predictable amount on phones only, and
   nothing else needs to move.
   ============================================================ */
@media (max-width: 500px) {
  .zone-grid-wrap {
    padding-bottom: calc(var(--kb-pill-h, 48px) + var(--kb-pill-clear, 18px) + 8px);
  }
}
</style>
