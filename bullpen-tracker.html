<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knuckleball</title>
<script src="vendor/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="report-config.js"></script>
<script>
  // S1 (softball): theme before first paint -- the signed-in profile's sport
  // from the offline cold-launch cache (lastKnownContext, P1-13), else the
  // landing page's remembered choice, else baseball. Synchronous, no network.
  (function(){
    var sport = 'baseball';
    try{
      var raw = localStorage.getItem('sb-' + new URL(SUPABASE_URL).hostname.split('.')[0] + '-auth-token');
      var uid = raw && JSON.parse(raw).user && JSON.parse(raw).user.id;
      var ctx = uid && JSON.parse(localStorage.getItem('lastKnownContext:' + uid) || 'null');
      if(ctx && ctx.profile && ctx.profile.sport) sport = ctx.profile.sport;
      else if(localStorage.getItem('kb:sport') === 'softball') sport = 'softball';
    }catch(e){}
    document.documentElement.setAttribute('data-sport', sport === 'softball' ? 'softball' : 'baseball');
  })();
</script>
<script>
  // Offline app shell (P0-06) -- lets this page load with no network.
  // Never blocks page load: registration happens after the page's own
  // load event, and any failure is just logged, not surfaced to the user.
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW registration failed', err));
    });
  }
</script>
<!-- Fonts load non-render-blocking (P1-13): a CSS @import here stalls first
     paint until it resolves or fails, which on a connected-but-dead network
     (indoor facility wifi with no route) can be many seconds. The stylesheet
     swaps in when it arrives; offline it simply never does and the fallback
     stacks (sans-serif / monospace) are used. -->
<link rel="preload" as="style"
      href="vendor/fonts/fonts.css"
      onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="vendor/fonts/fonts.css"></noscript>
<style>
  /* Visual refresh (light theme). Every color the app uses lives here now --
     the several dozen hard-coded hexes that used to be scattered through
     individual rules (a duplicate --field-panel-2 value on .sidebar, a
     one-off #152B21 for the in-zone cells, medal colors written straight
     into the JS, etc.) are gone; change a color once, here.
     TYPE_PALETTE (below, in the script) is NOT part of this system -- it
     must keep matching send-session-report/index.ts's copy exactly, so it
     stays its own separate, hard-coded array, unchanged by this refresh. */
  :root{
    /* ---- Surfaces, light to dark ---- */
    --page-bg:        #F7FAF8;   /* page background */
    --card-bg:        #FFFFFF;   /* cards, the charting/heat-map grid, form wells */
    --surface:        #E8F3EC;   /* light green: sidebar/roster panel, card headers, active-tab bg */
    --surface-border: #CFE6D7;   /* light green: borders, selected/active rows */

    /* ---- Ink (dark green -- unchanged value; #0F241B is kept in the
       --field-dark name for the smallest diff against the rest of this
       file, but its ROLE has flipped: it is no longer any card's or the
       page's own background, only the brand strip's background plus
       heading/body text everywhere else). ---- */
    --field-dark: #0F241B;
    --ink-dim:    #2E4A40;   /* secondary text -- 9.7:1 on white */
    --ink-faint:  #527065;   /* tertiary/meta/label text -- 5.4:1 on white, 4.8:1 on --surface */

    /* ---- Near-white text/icon tones -- used ONLY on the still-dark brand
       strip now (.brand-block and its children); everything that used to
       read chalk-on-dark elsewhere reads ink-on-light instead. ---- */
    --chalk:       #F1ECDD;
    --chalk-dim:   #B7C2B4;
    --chalk-faint: #7C8C82;
    --border-on-dark: rgba(241,236,221,0.16);   /* the one border that's still light-on-dark */

    /* ---- Status ---- */
    --clay:      #96551F;   /* darkened from the prior #C17A45: that value only cleared 3.4:1 on
                                white/light-green, short of AA's 4.5:1 for text -- this clears
                                5.8:1 on white and 5.1:1 on --surface. Not one of the two colors
                                this refresh was told to keep unchanged. */
    --clay-dim:  #8A5732;   /* unchanged -- already 6.0:1 on white */
    --red:       #C0453B;   /* unchanged -- already 5.1:1 on white as TEXT (status messages, links) */
    --red-bg:    #A83A31;   /* darker, for SOLID destructive-button backgrounds: white/near-white
                                button text on the plain --red only reaches ~3.2-4.3:1; this clears
                                5.4:1 with --chalk text on it */

    /* ---- Accent yellow: UNCHANGED VALUES, exactly as before this refresh.
       Restricted to: the selected pitch-type chip (via its own TYPE_PALETTE
       color, unaffected by this token block), the one primary action per
       screen (.btn-primary), the active-tab indicator, and leaderboard
       gold. See the contrast report: at these values, amber does not clear
       3:1 against the new light backgrounds when used as a small icon/line
       (the active-tab underline, the leaderboard star) -- flagged, not
       changed, per the same instruction that applies to TYPE_PALETTE. ---- */
    --amber:        #E8A83D;
    --amber-bright: #F5C365;

    /* ---- G1b-r2a: docs/game-screen-reference.html is the Live Game screen's
       visual spec. Two colors there don't match anything above -- introduced
       as their own tokens (not magic hex in the rules that use them),
       exactly the reference's own values, scoped to the game screen only:
       a chip border a shade darker/greener than --surface-border, and a
       deeper gold than --amber for the Next Pitch button/position-swipe
       badge/scorebook cell accents. Everything else the reference uses
       (status-bar dark, panel/status text, chip.soft bg/border) already
       matches an existing token exactly (--field-dark, --surface,
       --surface-border) and reuses it directly, no new variable. ---- */
    --game-chip-border: #9DBBA9;
    --game-gold:        #C9A227;
    --game-panel-bg:    #F7F5EF;

    /* ---- Leaderboard medals: gold reuses the accent color (the spec lists
       "leaderboard gold" under the yellow-accent role, not as a separate
       color); silver/bronze are darkened from their original literals
       (#A8A9AD, #CD7F32) which read 2.3:1 and 3.1:1 on white -- these clear
       3.4:1 and 3.6:1, since a medal's whole job is to be told apart from
       the other ranks and from the page. ---- */
    --gold:   var(--amber);
    --silver: #7C8B85;
    --bronze: #A8621F;

    --border:        rgba(15,36,27,0.10);   /* was rgba(chalk, 0.12) -- translucent chalk-on-dark
                                                flipped to translucent ink-on-light */
    --border-strong: rgba(15,36,27,0.22);   /* was rgba(chalk, 0.22) */
    /* ---- S1: theme values that used to be literals (rgb triples are for
       rgba(var(--x), a) tints and shadows). Data colors -- pitch palette,
       strike/ball flash, sent/warning statuses, Live Game's gg-* -- stay
       literal on purpose. ---- */
    --amber-rgb: 232,168,61;
    --ink-rgb: 15,36,27;
    --primary-bg: var(--amber);        /* .btn-primary */
    --primary-fg: var(--field-dark);
    --primary-bg-hover: var(--amber-bright);
    --kind-btn: #3D7A57;               /* Bullpen / Live Game chooser */
    --kind-btn-hover: #2E6345;
    --kind-btn-active: #245036;
    --accent-text: var(--amber);       /* accent-colored text (baseball keeps its yellow link) */
  }


  /* ---------- G1b-r5: phone session layout (docs/game- and pen-phone-layout-reference.html) ----------
     All of these classes are only rendered at phone width (phoneSessionMode). */
  .ph-main{ padding:0 8px 16px !important; gap:8px !important; }
  .sess-head{
    display:flex; align-items:center; gap:8px; min-height:44px; padding:0 6px 0 4px;
    background:var(--field-dark); color:var(--chalk); border-radius:10px; margin:8px 0 0;
  }
  .sess-back{ all:unset; cursor:pointer; display:flex; align-items:center; gap:4px; min-height:44px; padding:0 6px;
    font-size:16px; color:var(--chalk); max-width:32%; min-width:0; }
  .sess-team{ font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sess-who{ display:flex; align-items:center; gap:8px; min-width:0; flex:1; }
  .sess-who .headshot{ width:28px; height:28px; font-size:11px; flex:none; }
  .sess-name{ font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:2.5em; }
  .sess-num{ font-size:14px; color:var(--chalk-dim); flex:none; }
  .sess-offline{ flex:none; width:9px; height:9px; border-radius:50%; background:var(--amber-bright); }   /* offline: a dot, so the name keeps its room */
  .sess-more{ all:unset; cursor:pointer; min-width:44px; min-height:44px; display:flex; align-items:center; justify-content:center;
    font-size:22px; color:var(--chalk-dim); }
  .dots9{ display:grid; grid-template-columns:repeat(3, 4px); gap:3px; }
  .dots9 i{ width:4px; height:4px; border-radius:50%; background:var(--chalk); }
  .ph-layout .controls-panel.ph-controls{ padding:6px; gap:8px; border:0; box-shadow:none; background:transparent; }
  .ph-layout{ gap:12px !important; }
  .ph-status{
    display:flex; align-items:center; gap:14px; min-height:44px; padding:0 14px;
    background:var(--field-dark); color:var(--chalk); border-radius:10px; font-weight:700; font-size:17px;
  }
  .ph-status .ph-inn{ font-size:18px; }
  .ph-status .ph-diamond{ margin-left:2px; display:flex; align-items:center; }
  .ph-status .ph-diamond .runner-diamond-btn{ min-height:40px; }
  .ph-count{ display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:50%;
    background:var(--chalk); color:var(--field-dark); font-size:15px; }
  .ph-lbl{ font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--chalk-dim); margin-left:-6px; }
  .ph-persp{ margin-left:auto; font-size:14px; color:var(--chalk); }
  .ph-persp.locked{ color:var(--chalk-dim); }
  /* one grid square on a phone: the grid is min(screen - 28px, 320px) wide,
     3px padding each side and 3px gaps, five across */
  .ph-layout{ --chip:calc((min(100vw - 28px, 320px) - 18px) / 5); }
  .deliv-row{ display:flex; align-items:center; gap:4px; min-height:var(--chip); }
  /* Joel, Oct 1: Set and Windup are the same width */
  .deliv-one{ flex:none; width:78px; height:var(--chip); text-align:center; padding:0 10px; border-radius:10px; font:inherit; font-weight:700; font-size:15px;
    background:var(--card-bg); color:var(--field-dark); border:1.5px solid var(--field-dark); cursor:pointer; }
  .deliv-one.on{ background:var(--field-dark); color:var(--chalk); }
  .ttp-btn.ttp-compact{ flex:none; min-width:36px; height:var(--chip); padding:0 4px; border-radius:10px; font-size:14px; }
  .pstrip-wrap{ flex:1; min-width:0; display:flex; align-items:center; gap:2px; }
  .pstrip-arrow{ flex:none; width:16px; height:var(--chip); padding:0; border:0; background:none; font:inherit; font-size:22px; font-weight:800;
    color:var(--field-dark); cursor:pointer; }
  .pstrip-arrow:disabled{ opacity:0.25; cursor:default; }
  .pstrip{ flex:1; min-width:0; display:flex; gap:4px; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
  .pstrip::-webkit-scrollbar{ display:none; }
  /* Joel, Oct 1: pitch squares are the size of a 5x5 grid square, rounded,
     abbreviations in capitals */
  .pstrip-chip{ flex:0 0 var(--chip); width:var(--chip); height:var(--chip); min-width:0; overflow:hidden; text-overflow:clip; scroll-snap-align:start; border-radius:10px; text-transform:uppercase; border:1.5px solid var(--border-strong);
    background:var(--card-bg); font:inherit; font-weight:800; font-size:13px; letter-spacing:0; cursor:pointer; padding:0 1px; white-space:nowrap; }
  .pstrip-chip.selected{ box-shadow:inset 0 0 0 2.5px rgba(0,0,0,0.28); }   /* inside the square, so the strip's edge never clips it */
  .ph-grid-wrap{ position:relative; margin-top:6px; }
  /* Joel, Oct 1: a bigger grid on phones (340px, was 320) -- as big as it
     can get with everything through the velocity strip still under 700px;
     the pitch and velocity squares keep their size (--chip). */
  .ph-layout .zone-grid{ max-width:340px !important; width:100%; }
  .ph-layout .home-plate-wrap{ width:calc(0.6 * min(100%, 340px) - 4.8px); }
  .ph-hint{ position:absolute; top:-2px; left:0; right:0; z-index:5; text-align:center; font-size:12px; font-weight:600;
    color:var(--clay); pointer-events:none; }
  .ph-layout .zone-caption{ margin-top:-2px; }
  .pb-zone .zone-grid{ margin-bottom:0 !important; }
  .pb-zone .kb-batter{ display:none !important; }
  .pb-pill-row{ display:flex; justify-content:center; }
  .pb-pill{ min-width:160px; height:48px; padding:0 24px; border-radius:999px; font:inherit; font-size:16px; font-weight:800; cursor:pointer;
    background:var(--field-dark); color:var(--chalk); border:1.5px solid var(--field-dark); }
  .pb-pill.none{ background:var(--card-bg); color:var(--ink-dim); border-color:var(--border-strong); font-weight:700; }
  .ph-actions{ display:flex; gap:8px; }
  .ph-act{ flex:1; min-height:44px; border-radius:10px; border:1.5px solid var(--border-strong); background:var(--card-bg);
    font:inherit; font-size:14px; font-weight:700; color:var(--field-dark); cursor:pointer; padding:0 4px; }
  .velo-slim{ display:flex; align-items:center; gap:6px; min-height:52px; padding:4px 8px; background:var(--surface); border-radius:10px; }
  .velo-slim-lbl{ flex:none; max-width:56px; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); line-height:1.2; }
  .velo-slim-strip{ flex:1; min-width:0; }
  .velo-slim .velo-help{ display:none; }
  .velo-slim .velo-strip{ --velo-visible:3; }
  .velo-slim .velo-arrow{ flex-basis:22px; min-height:var(--chip); }
  .velo-slim .velo-cell{ min-height:var(--chip); border-radius:10px; }
  .velo-slim-reset{ flex:none; border:0; background:none; font:inherit; font-size:11px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--ink-dim); min-height:40px; cursor:pointer; padding:0 2px; }
  .velo-slim-reset:disabled{ opacity:0.4; cursor:default; }
  .ph-statline{ font-size:12.5px; font-weight:700; margin-bottom:6px; }
  .sheet-overlay{ align-items:flex-end; padding:0; }
  .sess-sheet{ width:100%; max-width:520px; background:var(--card-bg); border-radius:16px 16px 0 0; padding:18px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    display:flex; flex-direction:column; gap:12px; max-height:85vh; overflow:auto; }
  .sess-sheet-title{ font-weight:800; font-size:16px; }
  /* Joel, Oct 1: End session & save, Discard and Close are the same size */
  .sess-sheet .btn{ width:100%; min-height:48px; margin:0; font-size:15px; text-align:center; }
  .sess-sheet .delete-row{ display:flex; flex-direction:column; gap:12px; }
  /* ---------- S1: the softball theme (docs/softball-theme-reference.html) ----------
     Only theme variables change; pitch colors, strike/ball colors and the
     plate overlay are identical in both sports. Pink is an accent like
     baseball's yellow: fills, chips, buttons -- never pink text on light. */
  html[data-sport="softball"]{
    --page-bg:        #F7FAFD;
    --card-bg:        #FFFFFF;
    --surface:        #EAF4FB;
    --surface-border: #BFDCEF;
    --field-dark:     #234B6E;
    --ink-dim:        #3A5A78;
    --ink-faint:      #5F7A91;
    --chalk-dim:      #BCCBD8;
    --chalk-faint:    #8094A6;
    --amber:          #F2A7C3;
    --amber-bright:   #F7C3D7;
    --amber-rgb:      242,167,195;
    --ink-rgb:        35,75,110;
    --border:         rgba(35,75,110,0.10);
    --border-strong:  rgba(35,75,110,0.22);
    --primary-bg:     #E27BA2;
    --primary-fg:     #FFFFFF;
    --primary-bg-hover: #D4688F;
    --kind-btn:       #E27BA2;
    --kind-btn-hover: #D4688F;
    --kind-btn-active:#C2567D;
    --accent-text:    var(--field-dark);   /* never pink text on light */
    --game-chip-border: #9FC3DD;
    /* S2 (Joel, Oct 1): Live Game in softball colors. */
    --game-gold:        #E98DB0;
    --game-panel-bg:    #F4F8FC;
  }
  html[data-sport="softball"] .game-panel-header .stat-lbl{ color:rgba(234,244,251,0.7); }
  html[data-sport="softball"] .game-panel-handle{ color:rgba(234,244,251,0.75); }
  html[data-sport="softball"] .gg-field{
    --gg-fence:#BFDCEF; --gg-grass:#CFE4F5; --gg-infield:#BCD7EC; --gg-dirt:#C9A97C; --gg-mound:#B8956A;
    --gg-ink:#1B3550; --gg-border:#9FC3DD; --gg-gold:#E98DB0; --gg-muted:#5F7A91;
    --gg-on-fg:#EAF4FB; --gg-on-cap:#BFDCEF; --gg-line:#234B6E;
  }
  .zone-note{ font-size:11.5px; color:var(--ink-faint); text-align:center; margin-top:-4px; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--page-bg);
    color:var(--field-dark);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  ::selection{ background:var(--amber); color:var(--field-dark); }
  button{ font-family:inherit; cursor:pointer; }
  input, select{ font-family:inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--amber-bright);
    outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  .display{ font-family:'Teko', sans-serif; font-weight:600; letter-spacing:0.01em; }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  #app{ display:flex; min-height:100vh; max-width:1320px; margin:0 auto; }

  /* SIDEBAR */
  .sidebar{
    width:280px; flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:20px; /* was 22px 18px -- see .brand-block below, which now carries its own inset padding */
    display:flex; flex-direction:column; gap:18px;
  }
  /* The dark "top bar" role: an inset strip at the top of the (now light-green)
     sidebar panel, carrying the brand mark, tagline and role/offline pills --
     the only surface besides accent buttons/badges that stays dark-green. Its
     own text color is set explicitly (var(--chalk), near-white) since body's
     default text color is now dark ink, which would otherwise make the bare
     "Knuckleball" wordmark invisible against this strip. */
  .brand-block{
    display:flex; flex-direction:column; gap:4px;
    background:var(--field-dark); color:var(--chalk);
    border-radius:10px; padding:16px 18px;
  }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand-mark{
    width:10px; height:10px; border-radius:2px; background:var(--amber);
    transform:rotate(45deg); flex-shrink:0; margin-bottom:3px;
  }
  .brand h1{ font-size:30px; line-height:1; margin:0; letter-spacing:0.02em; }
  .brand span{ color:var(--amber); }
  .tagline{ font-size:10px; text-transform:uppercase; letter-spacing:0.14em; color:var(--chalk-faint); }

  .role-badge{
    align-self:flex-start; font-size:10px; text-transform:uppercase; letter-spacing:0.1em;
    color:var(--amber-bright); background:rgba(var(--amber-rgb),0.12);
    border:1px solid rgba(var(--amber-rgb),0.3); padding:3px 9px; border-radius:20px; margin-top:2px;
  }

  /* Offline indicator + instant boot screen (P1-13) */
  .offline-pill{
    align-self:flex-start; display:inline-flex; align-items:center; gap:6px; margin-top:6px;
    font-size:10px; text-transform:uppercase; letter-spacing:0.09em;
    color:var(--amber-bright); background:rgba(var(--amber-rgb),0.12);
    border:1px solid rgba(var(--amber-rgb),0.3); padding:3px 9px; border-radius:20px;
  }
  .offline-pill::before{
    content:''; width:6px; height:6px; border-radius:50%; background:var(--amber-bright); flex-shrink:0;
  }
  .boot-screen{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:40px 24px;
  }
  .boot-screen .brand h1{ font-size:34px; }
  .boot-msg{ font-size:13px; color:var(--ink-faint); margin:0; line-height:1.5; }
  .boot-msg.boot-offline{ color:var(--clay); font-weight:600; }

  .team-select-wrap{ display:flex; flex-direction:column; gap:5px; }
  .team-select{
    background:var(--card-bg); border:1px solid var(--border-strong); border-radius:6px;
    color:var(--field-dark); padding:9px 10px; font-size:13.5px; width:100%;
  }
  /* U10 (9): coach's team line. Above phone width the Profile button here is
     hidden (.show-phone) and the row holds only the team selector, laid out
     exactly as before; on phones it's the coach's Profile control, and the
     one in the pitcher header is hidden instead (.hide-phone). */
  .team-line{ display:flex; align-items:flex-end; gap:10px; }
  .team-line .team-select-wrap{ flex:1 1 auto; min-width:0; }
  .show-phone{ display:none !important; }
  @media (max-width:500px){
    .show-phone{ display:inline-flex !important; }
    .team-line .coach-profile-link{ min-height:44px; align-items:center; flex:none; }
  }

  .roster-label{
    font-size:11px; text-transform:uppercase; letter-spacing:0.12em;
    color:var(--ink-faint); margin:4px 0 -4px;
  }
  .roster-toggle-btn{
    all:unset; display:flex; align-items:center; justify-content:space-between; gap:8px;
    cursor:pointer; padding:4px 0; margin:0 0 -4px; min-height:32px;
  }
  .roster-toggle-btn .roster-label{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .roster-chevron{
    flex-shrink:0; color:var(--ink-faint); font-size:11px; line-height:1;
    transition:transform 200ms ease; transform:rotate(0deg);
  }
  .roster-chevron.open{ transform:rotate(180deg); }
  .persp-rollup{
    all:unset; box-sizing:border-box; display:flex; align-items:center; gap:8px; width:100%;
    min-height:36px; cursor:pointer;
  }
  .persp-rollup:disabled{ cursor:default; }
  .persp-current{ margin-left:auto; font-size:13px; font-weight:700; color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  /* Collapse animation: overflow-hidden max-height + opacity, ~200ms, so the list
     visibly rolls up/down rather than just vanishing. max-height's open value only
     needs to exceed the tallest real roster; it doesn't have to match exactly. */
  .roster-collapse{
    max-height:2000px; opacity:1; overflow:hidden;
    transition:max-height 200ms ease, opacity 150ms ease, margin-top 200ms ease;
  }
  .roster-collapse.collapsed{ max-height:0; opacity:0; margin-top:-6px; }
  .roster-list{ display:flex; flex-direction:column; gap:6px; overflow-y:auto; }
  .roster-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:transparent; border:1px solid transparent; border-radius:6px;
    padding:12px 12px; text-align:left; color:var(--field-dark); cursor:pointer; width:100%;
  }
  .roster-item:hover{ background:var(--surface-border); }
  .roster-item.active{ background:var(--surface-border); border-color:var(--surface-border); }
  .roster-item.active .roster-item-num{ color:var(--field-dark); font-weight:700; }
  .roster-item-main{ display:flex; flex-direction:column; gap:2px; min-width:0; flex:1; }
  .roster-item-name{ font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .throws-tag{ margin-left:7px; font-size:10.5px; font-weight:700; letter-spacing:.05em; color:var(--amber); vertical-align:1px; }
  .roster-item-types{ font-size:11px; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .roster-item-num{ font-family:'Teko',sans-serif; font-size:20px; color:var(--ink-faint); flex-shrink:0; }
  /* U10 (3) revised: the roster red dot -- sits in the item's left padding,
     so names never shift when a dot comes or goes. */
  /* Joel, Sept 30: more room between the dot and the name -- every item
     gets the wider left padding, dot or not, so names stay lined up. */
  .roster-item{ position:relative; padding-left:22px; }
  .roster-dot{
    position:absolute; left:6px; top:50%; margin-top:-4px;
    width:8px; height:8px; border-radius:50%; background:var(--red);
  }
  .roster-dot-count{
    display:inline-flex; align-items:center; justify-content:center; flex:none;
    min-width:18px; height:18px; padding:0 5px; margin-left:6px; border-radius:9px;
    background:var(--red); color:#fff; font-size:11px; font-weight:700; letter-spacing:0; line-height:1;
  }
  .tab-dot, .session-dot{
    display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--red);
    vertical-align:1px;
  }
  .tab-dot{ margin-left:6px; }
  .session-dot{ margin-right:7px; }

  .invite-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    background:transparent; border:1px dashed var(--border-strong);
    color:var(--ink-dim); border-radius:6px; padding:10px; font-size:13px; font-weight:600;
  }
  .invite-btn:hover{ border-color:var(--field-dark); color:var(--field-dark); }

  /* R0: invite LINK panel, replacing the old email-invite box. */
  .invite-link-panel{
    background:var(--card-bg); border:1px solid var(--border-strong);
    border-radius:8px; padding:14px; display:flex; flex-direction:column; gap:8px;
  }
  .invite-link-row{ display:flex; gap:6px; }
  .invite-link-text{
    flex:1; min-width:0; background:var(--page-bg); border:1px solid var(--border-strong);
    border-radius:5px; color:var(--ink-dim); padding:7px 9px; font-size:11.5px;
    font-family:'IBM Plex Mono',monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    user-select:all; -webkit-user-select:all;
  }
  .invite-link-copy-btn{
    flex-shrink:0; background:var(--page-bg); border:1px solid var(--border-strong);
    color:var(--ink-dim); border-radius:5px; padding:7px 10px; font-size:11.5px; font-weight:600;
  }
  .invite-link-copy-btn:hover{ border-color:var(--field-dark); color:var(--field-dark); }
  .invite-regen-row{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .invite-regen-btn{
    background:none; border:none; color:var(--ink-faint); font-size:11.5px;
    text-decoration:underline; padding:0;
  }
  .invite-regen-btn:hover{ color:var(--red); }
  .invite-regen-warn{
    font-size:12px; color:var(--ink-dim); line-height:1.5; margin:0;
  }
  .invite-regen-confirm-row{ display:flex; gap:8px; margin-top:6px; }

  /* R0: verification badge + remove control on a coach's roster items. */
  .verify-badge{
    font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
    padding:2px 6px; border-radius:20px; background:rgba(193,122,69,0.18); color:var(--clay);
    margin-left:6px; flex-shrink:0;
  }
  /* U9 follow-up: was inline inside .roster-item-name, sharing its
     white-space:nowrap/ellipsis -- a long name + throws-tag could clip the
     badge mid-pill right where it ran into the uniform number (Joel:
     "runs into the number 25"). Now its own row under the pitch-type line,
     never subject to that truncation regardless of name length. */
  .roster-verify-badge{ align-self:flex-start; margin-left:0; margin-top:1px; }
  .roster-item-remove{
    background:none; border:none; color:var(--ink-faint); font-size:12px;
    padding:2px 4px; flex-shrink:0;
  }
  .roster-item-remove:hover{ color:var(--red); }

  /* R0: deferred-verification banner, shown to a pitcher whose account
     email isn't confirmed. Persistent, never a blocking modal (Joel's own
     requirement -- they can look around). */
  .verify-banner{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    background:rgba(193,122,69,0.12); border:1px solid var(--clay-dim); border-radius:8px;
    padding:12px 16px; margin-bottom:16px;
  }
  .verify-banner p{ margin:0; font-size:13px; color:var(--ink-dim); flex:1; min-width:220px; }
  .verify-banner-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .change-email-form{
    background:var(--card-bg); border:1px solid var(--border-strong);
    border-radius:8px; padding:16px; display:flex; flex-direction:column; gap:10px; margin-bottom:16px;
  }

  .sign-out-btn{
    margin-top:auto; background:transparent; border:1px solid var(--border);
    color:var(--ink-faint); border-radius:6px; padding:9px; font-size:12.5px;
    font-weight:600; text-align:center;
  }
  .sign-out-btn:hover{ border-color:var(--red); color:var(--red); }
  .phone-footer{ display:none; }   /* shown on phones only, see the max-width:500px block */

  .outbox-badge{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:rgba(193,122,69,0.12); border:1px solid var(--clay-dim); border-radius:6px;
    padding:8px 10px; font-size:12px; color:var(--ink-dim);
  }
  .outbox-badge .btn{ padding:5px 10px; font-size:11.5px; flex-shrink:0; }

  .invite-form{
    background:var(--card-bg); border:1px solid var(--border-strong);
    border-radius:8px; padding:16px; display:flex; flex-direction:column; gap:10px;
  }
  .field-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--ink-faint); }
  .text-input{
    background:var(--card-bg); border:1px solid var(--border-strong); border-radius:5px;
    color:var(--field-dark); padding:8px 10px; font-size:14px; width:100%;
  }
  .text-input::placeholder{ color:var(--ink-faint); }
  .form-row-buttons{ display:flex; gap:8px; margin-top:2px; }
  .btn{ border-radius:6px; padding:9px 14px; font-size:13px; font-weight:600; border:1px solid transparent; display:inline-block; text-decoration:none; }
  .btn-primary{ background:var(--primary-bg); color:var(--primary-fg); }
  .btn-primary:hover{ background:var(--primary-bg-hover); }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-ghost{ background:transparent; border-color:var(--border-strong); color:var(--ink-dim); }
  .btn-ghost:hover{ border-color:var(--ink-dim); color:var(--field-dark); }
  .invite-status{ font-size:12px; margin:0; }
  .invite-status-sending{ color:var(--ink-faint); }
  .invite-status-sent{ color:#6FA287; }
  .invite-status-error{ color:var(--red); }
  .invite-status-info{ color:var(--clay); }

  /* MAIN */
  .main{ flex:1; min-width:0; padding:32px 40px; display:flex; flex-direction:column; gap:24px; }
  .empty-state{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:10px; color:var(--ink-faint); padding:60px 20px;
  }
  .empty-state .display{ font-size:42px; color:var(--ink-dim); }

  .pitcher-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .pitcher-header h2{ font-family:'Teko',sans-serif; font-size:44px; font-weight:600; margin:0; line-height:1; }
  .pitcher-header-actions{ display:flex; gap:10px; align-items:flex-end; }
  .uniform-field{ display:flex; flex-direction:column; gap:4px; }
  .uniform-field input{ width:72px; padding:6px 8px; text-align:center; }
  .uniform-locked{ display:flex; gap:8px; align-items:center; }
  .uniform-locked-num{ font-family:'Teko',sans-serif; font-size:26px; line-height:1; min-width:36px; text-align:center; color:var(--field-dark); }
  .uniform-msg{ font-size:11.5px; color:var(--ink-faint); max-width:260px; }
  .pitcher-sub{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  /* U10 (8): player header -- photo (or initials), name, "#12". */
  .pitcher-ident{ display:flex; align-items:center; gap:14px; min-width:0; }
  /* "Take photo" only where there's a camera to open (touch devices); on a
     laptop the capture hint is ignored and it would just repeat Upload. */
  .touch-only{ display:none; }
  .headshot-setup-row{ display:flex; align-items:flex-start; gap:14px; }
  .headshot-setup-row .profile-row{ margin-top:0 !important; }
  @media (pointer:coarse){ .touch-only{ display:inline-block; } }
  .pitcher-ident-text{ min-width:0; }
  .pitcher-num{ margin-left:10px; color:var(--ink-faint); font-weight:500; }
  .headshot{
    flex:none; width:64px; height:64px; border-radius:50%; object-fit:cover;
    background:var(--surface); border:1px solid var(--border);
  }
  .headshot-initials{
    display:inline-flex; align-items:center; justify-content:center;
    font-weight:700; font-size:22px; color:var(--ink-dim); letter-spacing:0.02em;
  }
  /* Phones: one compact row -- 40px photo, name and number on one line
     (ellipsis if long), chips hidden -- no taller than ~56px, so the
     charting area loses as little room as possible. */
  @media (max-width:500px){
    .pitcher-header{ flex-wrap:nowrap; align-items:center; gap:10px; }
    .pitcher-header .pitcher-ident{ flex:1 1 auto; gap:10px; }
    .pitcher-header .headshot{ width:40px; height:40px; }
    .pitcher-header .headshot-initials{ font-size:15px; }
    .pitcher-header h2{ font-size:28px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pitcher-header .pitcher-sub{ display:none; }
    .pitcher-header-actions{ flex:none; }
  }
  .pitch-chip{
    font-size:11px; font-weight:600; padding:4px 9px; border-radius:20px; letter-spacing:0.02em;
    border:1px solid var(--border-strong); color:var(--field-dark);
  }
  /* gap:4px is the ONLY inter-tab spacing (the .tab-btn margin-right below was a redundant
     18px stacked on top of it -- removing it is what makes 4 tabs, including "Leaderboard",
     fit on one line at 375px, the narrowest supported width (iPhone SE/mini); see the same
     removal for letter-spacing and the reduced horizontal padding below).
     padding-right adds real clearance from the true screen edge (not just .main's own
     padding) and grows under env(safe-area-inset-right) for a landscape notch/rounded
     corner -- inert today since no page here sets viewport-fit=cover, so the env() call
     currently always resolves to 0 and only the 8px floor applies; kept as forward-compatible
     groundwork per the request. */
  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); padding-right:max(8px, env(safe-area-inset-right)); }
  .tab-btn{
    background:none; border:none; color:var(--ink-faint); font-size:13px; font-weight:600;
    padding:10px 3px; border-bottom:2px solid transparent; text-transform:uppercase; white-space:nowrap;
  }
  .tab-btn:hover{ color:var(--field-dark); }
  .tab-btn.active{ color:var(--field-dark); font-weight:700; border-bottom-color:var(--amber); }
  /* U9: "Player Profile" is the longest tab label this app has ever had,
     and it now shares the row with the corner control -- confirmed
     overflowing at 375px with the full label (measured: 429px of content
     in a 343px row). Swap to "Player" below the existing phone breakpoint
     (max-width:500px, same one the velocity strip already uses) rather
     than shrinking font/padding further, which would affect every tab. */
  .tab-label-short{ display:none; }
  @media (max-width:500px){
    .tab-label-full{ display:none; }
    .tab-label-short{ display:inline; }
  }

  /* SESSION VIEW */
  /* Always stacked -- one layout, not a row-above-some-width/column-below-it
     split. Previously `flex-wrap:wrap` let .controls-panel and .log-panel
     sit side by side whenever the container was wide enough to fit both
     min-widths; removing wrap (and flex-start, which would otherwise
     shrink both panels to their own content width once direction is
     column) means they always stack full-width, matching what iPhone
     already did by accident of running out of room. */
  .session-grid-layout{ display:flex; flex-direction:column; gap:32px; }
  /* G1: the Bullpen/Live Game chooser. "Bigger than Gmail's Compose
     button" (Joel) -- 64px+ tall tap targets, full width stacked on
     phone, side by side on iPad (matches the existing >=861px breakpoint
     used elsewhere in this file for phone-vs-tablet layout calls). Both
     buttons share one fixed width (never sized off their own text) so
     "Bullpen" and "Live Game" (Beta tag removed, Joel, Oct 1) --
     never make the two read as different sizes; align-items/justify-
     content center the pair under the question in both layouts. */
  .kind-chooser{ display:flex; flex-direction:column; align-items:center; padding:48px 16px; }
  .kind-chooser-buttons{ display:flex; flex-direction:column; align-items:center; gap:16px; width:100%; }
  .kind-choice-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; max-width:280px; min-height:72px; border-radius:12px; border:none; background:var(--kind-btn);
    color:#fff; font-family:'Teko',sans-serif; font-size:28px; font-weight:600;
    letter-spacing:0.02em; box-shadow:0 2px 6px rgba(var(--ink-rgb),0.15);
  }
  .kind-choice-btn:hover{ background:var(--kind-btn-hover); }
  .kind-choice-btn:active{ background:var(--kind-btn-active); }
  @media (min-width:861px){ .kind-chooser-buttons{ flex-direction:row; justify-content:center; } .kind-choice-btn{ width:220px; } }
  /* U10 (1): back to the chooser. Above phone width it's a plain
     .btn.btn-ghost in the pitcher header's action row -- no extra rules, so
     it's exactly the size of Contacts/Profile beside it (Joel: "same
     height"). On phones it's the brand-strip button below. */
  /* Phone spot: overlaid on the brand strip's right end (position:absolute,
     so it adds no height to the strip), light-on-dark like the strip. */
  .brand-block{ position:relative; }
  .back-to-chooser-brand{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    min-height:44px; align-items:center; padding:0 14px; border-radius:6px;
    background:transparent; border:1px solid var(--border-on-dark, rgba(241,236,221,0.25));
    color:var(--chalk); font:inherit; font-size:13px; font-weight:600; cursor:pointer;
  }
  /* G1: the profile-setup modal. This file has no other modal/dialog
     pattern (see renderPerspectiveToggle's own comment) -- one is
     introduced here rather than reused from anywhere else. Scrollable on
     phone (max-height + overflow-y), safe-area aware so it never sits
     under a notch/home-indicator. */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(var(--ink-rgb),0.55);
    display:flex; align-items:center; justify-content:center;
    padding:24px 16px; z-index:1000;
    padding-top:calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .modal-panel{
    position:relative; background:var(--card-bg); border-radius:14px;
    max-width:560px; width:100%; max-height:100%; overflow-y:auto;
    padding:32px 24px 24px; box-shadow:0 8px 32px rgba(var(--ink-rgb),0.35);
  }
  .modal-close-x{
    position:absolute; top:10px; right:10px; width:32px; height:32px;
    border-radius:50%; border:none; background:transparent; color:var(--ink-faint);
    font-size:18px; cursor:pointer; line-height:1;
  }
  .modal-close-x:hover{ background:rgba(var(--ink-rgb),0.08); }
  .panel{ background:var(--card-bg); border:1px solid var(--border); border-radius:10px; padding:22px; box-shadow:0 1px 3px rgba(var(--ink-rgb),0.06); }
  .controls-panel{ display:flex; flex-direction:column; gap:18px; min-width:260px; flex:1; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:10px; }
  /* .pitch-count-badge shares this block's shape/border/sizing so the pitch-count
     badge (below) and the pitch-type chips stay visually consistent -- see its own
     comment for the one thing it overrides (a fixed width instead of a minimum). */
  .type-chip, .pitch-count-badge{
    display:inline-flex; align-items:center; justify-content:center;
    min-height:44px; min-width:44px; padding:10px 16px; border-radius:22px; font-size:14px; font-weight:600;
    border:1.5px solid var(--border-strong); background:transparent; color:var(--ink-dim);
  }
  .type-chip.selected{ color:var(--field-dark); border-color:transparent; }
  .type-chip:disabled{ opacity:0.5; cursor:not-allowed; }
  /* Used to hold this pitch counter beside a "Relative accuracy" dropdown
     (removed in U7 -- relative accuracy now lives in Profile); kept as the
     wrapper since renderSessionView still nests .pitch-counter inside it. */
  .accuracy-count-row{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
  /* Row, not stacked: the badge sits left of the label, flush with the pitch-type
     chips and the grid below (not centered under its own label -- Joel, Sept 22:
     that read as inset/indented against everything else in this column). */
  .pitch-counter{ display:flex; flex-direction:row; align-items:center; gap:10px; flex-shrink:0; }
  .pitch-counter-num{ font-family:'Teko',sans-serif; font-size:22px; line-height:1; color:var(--field-dark); }
  .pitch-count-badge{
    width:44px; height:44px; padding:0;
    background:var(--surface); /* same green as the 3x3 strike-zone cells, see .zone-cell.in-zone */
  }
  .add-type-inline{ display:flex; gap:6px; align-items:center; }
  .add-type-inline input, .add-type-inline select{ flex:1; padding:6px 8px; font-size:12.5px; }
  .add-type-inline button{ background:none; border:1px solid var(--border-strong); color:var(--ink-dim); border-radius:5px; padding:6px 10px; font-size:12px; }
  .add-type-inline button:hover{ color:var(--field-dark); border-color:var(--field-dark); }

  /* U6 velocity strip: 7 whole-mph values visible (5 on phones), scrolls across 40-105 with snap. */
  .velo-strip-wrap{ display:flex; align-items:stretch; gap:6px; }
  .velo-strip-wrap.disabled{ opacity:0.4; }
  .velo-strip{
    flex:1; min-width:0; display:flex; overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory; scrollbar-width:none; -webkit-overflow-scrolling:touch;
    border:1px solid var(--border-strong); border-radius:8px; background:var(--card-bg);
  }
  .velo-strip::-webkit-scrollbar{ display:none; }
  .velo-strip{ --velo-visible:7; }
  @media (max-width:500px){ .velo-strip{ --velo-visible:5; } }   /* phones: 5 cells so each stays >= 44px wide */
  .velo-cell{
    flex:0 0 calc(100% / var(--velo-visible, 7)); scroll-snap-align:center; min-height:48px;
    background:transparent; border:0; border-right:1px solid var(--border-strong);
    color:var(--ink-dim); font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:600; padding:0;
  }
  .velo-cell:last-child{ border-right:0; }
  .velo-cell.typical{ box-shadow:inset 0 0 0 2px var(--amber); color:var(--field-dark); font-weight:700; }
  .velo-cell.selected{ background:var(--amber); color:var(--field-dark); box-shadow:none; }
  .velo-cell:disabled{ cursor:not-allowed; }
  .velo-arrow{
    flex:0 0 32px; min-height:48px; background:var(--card-bg); border:1px solid var(--border-strong);
    border-radius:8px; color:var(--ink-dim); font-size:20px; padding:0;
  }
  .velo-arrow:disabled{ cursor:not-allowed; }
  .velo-help{ margin-top:6px; font-size:11.5px; color:var(--ink-faint); }
  /* G1b-r2a: game-only wrapper (see renderGameVeloStrip) -- reference's own
     .velo/.velo .strip b.on: a light-green well and a dark (not amber)
     selected cell. Scoped so bullpen's own velo strip is untouched. */
  .game-velo{ background:var(--surface); border-radius:10px; padding:8px 10px; }
  .game-velo .velo-cell.selected{ background:var(--field-dark); color:var(--surface); }

  .hint-msg{ font-size:12px; color:var(--clay); min-height:16px; }

  .zone-wrap{ display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; }
  /* CHANGE 2 fix: reserve gutters for the batter silhouette so it never
     overlaps a sibling -- in row #app layout (>860px), that sibling is the
     pitcher-list sidebar sitting immediately left of .main. .zone-grid is a
     FIXED 278px square in this width range (see its own rule, below) --
     height:112% x aspect-ratio 167/504 puts the silhouette at ~103px wide,
     plus --kb-batter-gap's 6px, so each side needs ~109px; 115px below
     gives a small safety margin. (If --kb-batter-h or --kb-batter-gap is
     ever retuned, per .kb-batter's own comment, this number needs
     rechecking -- it's a hand computation, not a live calc() off those
     custom properties, since they're declared scoped to .kb-batter itself.)
     Deliberately max-width (a fixed px figure), NOT width:fit-content:
     .zone-wrap also contains .zone-caption, whose text length changes as
     pitches log ("Tap where you're aiming" vs "Now tap where it actually
     landed...") -- fit-content sizing would sniff the caption's own
     max-content width as an input, so the reserved gutter would shift
     width depending on which caption happened to be showing. A fixed
     max-width (278px grid + 2x115px gutter = 508px) is immune to that: the
     caption just wraps inside the same 278px content column the grid
     occupies, never influencing the box's size.
     max-width, not width: .zone-wrap can still be its normal width:100% up
     to that cap, so at ANY .controls-panel width above 508px (guaranteed
     across the whole >860px range -- checked the narrowest case, 861px
     total viewport, and .controls-panel is already ~517px there) the extra
     space becomes ADDITIONAL margin via align-self:center, never less than
     the guaranteed 115px. Under border-box (global *), max-width includes
     the padding, so content width inside = 508 - 2x115 = 278px exactly --
     zero slack left for flex's own centering math to redistribute, which
     is what makes the padding an actual guarantee rather than get
     cancelled out by .zone-wrap's width:100%+align-items:center (a plain
     percentage width leaves centering to freely split ALL leftover space,
     padding included, so padding alone on an unconstrained width does NOT
     reliably reserve anything -- tested this by hand before landing here).
     >860px only: below it #app itself stacks (sidebar moves above .main,
     not beside it), so there is no sibling left to overlap, and the
     existing width:100% centering already has generous incidental
     clearance there (checked: iPad portrait alone leaves >200px spare on
     each side) -- no equivalent fixed-px treatment needed. This uses the
     SAME 860px breakpoint .zone-grid's own rule already keys off, not a
     new one. */
  @media (min-width:861px){
    .zone-wrap{ max-width:508px; padding:0 115px; align-self:center; }
  }
  /* U2a batter silhouette (Joel's traced source, Sept 9 2026 -- rules are
     in batter-silhouette.html's own history/comments, binding). position:
     absolute against .zone-grid (already position:relative, see below) and
     takes part in NO layout flow -- a layout-sibling version shipped once
     and pushed the home plate out of position; do not repeat that. Only
     --kb-batter-h and --kb-batter-gap are meant to be tuned. */
  .kb-batter{
    position:absolute; bottom:0;
    --kb-batter-h:112%; --kb-batter-gap:6px;
    height:var(--kb-batter-h); aspect-ratio:167/504;
    min-width:44px; padding:0; border:0; background:none; cursor:pointer;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    color:var(--ink-faint); opacity:1; transition:opacity .12s ease;
  }
  .kb-batter:active{ opacity:1; }
  .kb-batter.is-left{ right:100%; margin-right:var(--kb-batter-gap); }
  .kb-batter.is-right{ left:100%; margin-left:var(--kb-batter-gap); }
  /* Source figure faces left; mirror it to face the grid when standing on the left. */
  .kb-batter.is-left .kb-batter__fig{ transform:scaleX(-1); }
  .kb-batter__fig{ display:block; width:100%; height:100%; fill:currentColor; }
  .kb-batter__label{
    /* THIS is the state indicator, not the silhouette -- an RHB seen from
       behind and an LHB seen from the front are the same shape. Never
       shrink or bury it. */
    position:absolute; left:50%; top:calc(100% + 4px); transform:translateX(-50%);
    white-space:nowrap; font-size:14px; font-weight:800; letter-spacing:.02em; line-height:1;
    padding:5px 9px; border-radius:999px; background:var(--field-dark); color:var(--chalk); pointer-events:none;
  }
  @media (max-width:500px){
    /* Phones: no room for the figure beside the grid, and the figure never
       carried the state anyway -- drop it entirely. The pill becomes the
       whole control: a large, centered target sitting in a RESERVED BAND
       below the grid (.zone-grid's own margin-bottom, below), so it can't
       be mis-tapped while aiming and can't overlap the velocity strip.
       Replaces the previous <=430px low-opacity-overlay treatment.
       bottom is NEGATIVE here on purpose: the reserved band lives in
       .zone-grid's MARGIN (see the .zone-grid rule below), which sits
       outside the padding box that `bottom` is normally measured against
       -- a negative value is what reaches past that edge into the band.
       clear+pillH positions the pill's TOP at margin-top of the band
       (clear px below the grid's actual bottom edge); its own height
       (pillH) then fills down from there, leaving the remaining 8px of
       the band empty below it, before whatever comes next in flow. */
    .kb-batter__fig{ display:none; }
    .kb-batter,
    .kb-batter.is-left,
    .kb-batter.is-right{
      height:auto; width:auto; aspect-ratio:auto;
      top:auto; bottom:calc(-1 * (var(--kb-pill-clear) + var(--kb-pill-h)));
      left:50%; right:auto; margin:0;
      transform:translateX(-50%); opacity:1;
    }
    .kb-batter__label{
      position:static; transform:none; display:flex; align-items:center; justify-content:center;
      min-height:var(--kb-pill-h); min-width:140px; padding:0 22px;
      font-size:16px; font-weight:800; border-radius:999px; pointer-events:auto;
    }
  }
  .zone-grid{
    display:grid; grid-template-columns:repeat(5, 52px); grid-template-rows:repeat(5, 52px);
    gap:3px; background:var(--surface-border); padding:3px; border-radius:6px;
    position:relative; /* containing block for .home-plate-overlay (U5) */
  }
  .zone-cell{
    background:var(--card-bg); border-radius:3px; position:relative; border:1px solid transparent;
    transition:background-color 0.3s ease;
  }
  .zone-cell.in-zone{ background:var(--surface); border-color:var(--border-strong); }
  .zone-cell.clickable{ cursor:pointer; }
  .zone-cell.clickable:hover{ outline:2px solid var(--amber); outline-offset:-2px; }
  .zone-caption{ font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.1em; }

  /* G1b-r2: the field picture is gone entirely (GameChanger's patent
     filings) -- every .field-* rule that drew or positioned it (.field-wrap,
     .field-ball-marker, .field-pitch-btn + its pulse keyframes,
     .field-crossfade + its keyframes, the two field-wrap breakpoints) is
     removed here, not hidden. docs/field-diagram.svg stays in the repo for
     G2's spray chart only -- nothing in the charting screen reads it or its
     FIELD_POSITIONS coordinates for drawing any more (FIELD_POSITIONS
     itself stays, in JS, purely as the bb_x/bb_y anchor lookup G1b-r's
     decision 5 still uses). */
  .walkthrough-summary{
    font-size:13px; color:var(--ink-dim); line-height:1.5; margin:10px 0 0;
    display:flex; align-items:center; justify-content:center; gap:10px; text-align:center; flex-wrap:wrap;
  }
  .walkthrough-disabled-reason{ font-size:11.5px; color:var(--clay); margin:6px 0 0; text-align:center; }
  /* G1b-r2e retired Fix -- "What happened to the runners?" is always shown
     inline now, so there's nothing left for a separate reveal control to
     do. .fix-link is gone with it (was the reference's own pill button). */
  /* G1b (f): the status-bar diamond -- tap to Adjust Runners. min 44px hit
     area even though the SVG glyph itself is drawn smaller. */
  .runner-diamond-btn{
    display:flex; align-items:center; justify-content:center;
    width:44px; height:44px; min-width:44px; min-height:44px; padding:0;
    border:none; background:transparent; cursor:pointer;
  }
  .runner-diamond-btn:disabled{ cursor:not-allowed; opacity:0.55; }
  .adjust-runners-panel{ margin-top:4px; padding:14px; }
  /* G1b-r2a: re-matched to docs/game-screen-reference.html's own .g2/.gc --
     border var(--game-chip-border) (was --border-strong, a translucent dark
     rather than the reference's solid sage), tighter padding, and a smaller
     icon (~26px, was 40px). This deliberately supersedes the G1b-r2 update
     message's own "icons render at least 40px wide" -- the reference is the
     newer, more specific visual spec and shows a noticeably smaller icon;
     flagged in the report rather than silently overridden. Still a real
     >=44px tap target (min-height unchanged) with a small-caps caption
     beneath, legible at 320px (chip-row wraps the row across two lines
     there rather than shrinking anything). '+' (More) stays a real text
     glyph, in the bullpen's own B/K font (.flash-letter's family/weight,
     Teko 700). */
  .scorebook-row{ gap:6px; }
  .scorebook-btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    flex:1; min-width:56px; min-height:44px; padding:6px 4px 5px;
    color:var(--field-dark); background:var(--card-bg); border:1.5px solid var(--game-chip-border);
    border-radius:8px; cursor:pointer;
  }
  .scorebook-btn:active{ background:var(--field-dark); border-color:var(--field-dark); color:var(--surface); }
  .scorebook-btn-icon{
    display:block; width:26px; height:22px; background-color:currentColor;
    -webkit-mask-size:contain; -webkit-mask-repeat:no-repeat; -webkit-mask-position:center;
    mask-size:contain; mask-repeat:no-repeat; mask-position:center;
  }
  .scorebook-btn-glyph{
    display:block; font-family:'Teko',sans-serif; font-size:22px; font-weight:700; line-height:1;
  }
  .scorebook-btn-caption{
    font-size:8.5px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--ink-dim); opacity:0.75; line-height:1.1;
  }

  /* G1b-r addendum (layout, unchanged by G1b-r2): perspective + delivery
     share one row -- each keeps its own label+chip-row block
     (renderPerspectiveToggle/renderDeliveryToggle, both UNCHANGED), this
     just lays the two blocks out side by side with room to wrap on a
     narrow phone. Game mode only. */
  .perspective-delivery-row{ display:flex; flex-wrap:wrap; gap:20px; }
  .perspective-delivery-row > div{ flex:1; min-width:180px; }
  /* U11 (7): the stopwatch sits with Windup / Set. Disabled (greyed) unless Set. */
  .ttp-btn{
    font:inherit; font-size:13px; font-weight:700; padding:7px 12px; border-radius:20px; cursor:pointer;
    background:var(--card-bg); color:var(--field-dark); border:1.5px solid var(--border-strong); min-width:84px;
  }
  .ttp-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .ttp-btn.ttp-running{ border-color:var(--amber); color:var(--field-dark); }
  .ttp-btn.ttp-ok{ background:var(--field-dark); color:var(--surface); border-color:var(--field-dark); }
  .ttp-btn.ttp-bad{ color:var(--red); border-color:var(--red); }
  /* U11 (5): no batter -- the RHB frame stays, the silhouette flip doesn't. */
  .no-batter .kb-batter{ display:none; }
  /* Reserved band for the result row, directly above the grid (G1b-r2:
     "above the grid" now literally -- the grid itself never leaves the
     screen, since In Play no longer replaces it with a field). min-height,
     not a fixed height, so a taller sub-panel (the + grid's two rows, or
     the walkthrough's own Hit/Out/Error/FC question) can grow the band and
     push what's below it down, rather than overlapping. Height re-measured
     against the icon-over-caption row (the G1b-r2 icon update made each
     button noticeably taller than the old single-line letter row): natural
     height measured at 78.95px, so 80px is the floor both the idle (empty)
     and populated states clamp to -- caught a real sub-pixel mismatch at
     78px (78 vs 78.95, NOT identical) before landing on this number. */
  .result-band{ min-height:80px; }
  /* G1b-r2: scorebook cells sit beside the walkthrough on iPad/desktop
     (>=700px) and above it on phone (this block's own mobile-first default,
     column, cells row then walkthrough) -- acceptance 28's own layout. */
  .walkthrough-layout{ display:flex; flex-direction:column; gap:14px; }
  .walkthrough-rows{ min-width:0; }
  @media (min-width:700px){
    .walkthrough-layout{ flex-direction:row; align-items:flex-start; gap:20px; }
    .walkthrough-layout .scorebook-cells-wrap{ flex:0 0 auto; }
    .walkthrough-rows{ flex:1; }
  }
  /* G1b-r2a item 2: the drop-down panel. .game-panel-header IS the status
     bar (renderGameStatusBar, content unchanged) restyled to the
     reference's dark .status, plus a small handle and, while open, Undo at
     the right. .game-panel-body sits absolutely over .gridwrap (which gets
     its height from .zone-wrap/the grid alone, since an absolutely
     positioned child doesn't contribute to it) -- clip-path, not
     max-height, animates the reveal so the transition is a fixed duration
     regardless of how tall the actual content is. */
  .game-panel-header{
    position:relative; background:var(--field-dark); border-radius:8px;
    padding:8px 12px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .game-panel-header .stat-readout{ gap:14px; }
  .game-panel-header .stat-num{ color:var(--surface); }
  .game-panel-header .stat-lbl{ color:rgba(232,243,236,0.65); }
  .game-panel-handle{ color:rgba(232,243,236,0.7); font-size:12px; letter-spacing:0.08em; flex:0 0 auto; }
  .game-panel-undo{
    flex:0 0 auto; font-size:11px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--surface); background:transparent; border:1.5px solid rgba(232,243,236,0.4);
    border-radius:14px; padding:4px 10px; cursor:pointer;
  }
  .gridwrap{ position:relative; }
  .game-panel-body{
    position:absolute; inset:0; z-index:2; overflow-y:auto; box-sizing:border-box;
    background:var(--game-panel-bg); border-radius:12px; box-shadow:0 10px 26px rgba(var(--ink-rgb),0.28);
    border:1px solid var(--surface-border); padding:12px;
    clip-path:inset(0 0 100% 0); pointer-events:none;
    transition:clip-path 220ms ease;
  }
  .game-panel-body.open{ clip-path:inset(0 0 0% 0); pointer-events:auto; }
  @media (prefers-reduced-motion: reduce){
    .game-panel-body{ transition:none; }
  }
  /* Next Pitch (renamed from Pitch): the reference's own gold .pitch. */
  .next-pitch-btn{
    display:block; width:100%; margin-top:10px; background:var(--game-gold); color:var(--field-dark);
    border:none; border-radius:10px; text-align:center; font-weight:800; padding:11px;
    font-size:15px; letter-spacing:0.05em; text-transform:uppercase; cursor:pointer;
  }
  .next-pitch-btn:disabled{ background:var(--surface-border); color:var(--ink-faint); cursor:not-allowed; }
  /* The position swipe row (replaces the field's own tap targets): one
     scrollable line, no visible scrollbar, chips sized 64x46px minimum
     (acceptance 34) so it's usable with a thumb on a 320px phone; scroll-
     snap makes each chip settle into view instead of stopping mid-chip.
     Deliberately NOT centered/justified -- the last chip needs to sit
     partially cut off at the right edge at 320px so the row reads as
     scrollable rather than as "that's all of them." */
  .position-swipe-row{
    display:flex; gap:8px; overflow-x:auto; overflow-y:hidden; padding-bottom:4px;
    scroll-snap-type:x proximity; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .position-swipe-row::-webkit-scrollbar{ display:none; }
  .position-swipe-chip{
    position:relative; flex:0 0 auto; scroll-snap-align:start;
    min-width:64px; min-height:46px; padding:0 14px; border-radius:8px;
    font-size:15px; font-weight:700; border:1.5px solid var(--game-chip-border);
    background:var(--card-bg); color:var(--ink-dim); cursor:pointer;
  }
  /* G1b-r2a: matches the reference's .chip.on -- solid dark, not amber. */
  .position-swipe-chip.selected{ background:var(--field-dark); border-color:var(--field-dark); color:var(--surface); }
  /* G1b-r2a: a gold pill (reference's .seq), not a plain dark circle.
     Moved fully inside the chip (was top:-7px, poking above it) -- the row
     it sits in has overflow-y:hidden (needed to suppress a vertical
     scrollbar from the horizontal scroller), which was clipping the top
     half of the badge whenever it hung above the chip's own edge. */
  .position-swipe-badge{
    position:absolute; top:3px; right:3px; border-radius:10px;
    background:var(--game-gold); color:var(--field-dark); font-size:10px; font-weight:800;
    padding:1px 5px; line-height:1.2;
  }
  /* Scorebook cells: inline SVG, display-only (acceptance 36 -- no onclick
     anywhere in this block), theme via CSS variables so dark mode repaints
     it for free. One big cell for the batter, one small cell per occupied
     base to its left/above depending on width. */
  /* G1b-r2a: sized/colored to match docs/game-screen-reference.html's own
     .book/.cell/.lbl -- bottom-aligned row (the small runner cell and the
     big batter cell share a baseline), bigger cells (170/80, was 72/48),
     ink-colored 1.5px border (was --border, much lighter), small cells
     dimmed to 85% opacity (a secondary reading next to the batter's own),
     and an uppercase small-caps label above each cell matching .lbl. */
  .scorebook-cells-wrap{ display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; }
  .scorebook-cell-label{
    font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-faint);
    text-align:center; margin-bottom:2px;
  }
  .scorebook-cell{ background:var(--card-bg); border:1.5px solid var(--field-dark); border-radius:4px; padding:0; box-sizing:border-box; }
  .scorebook-cell.small{ opacity:0.85; }
  .scorebook-cell svg{ display:block; }
  .scorebook-cell-code{ font-family:'IBM Plex Mono',monospace; font-size:9px; font-weight:700; }
  .scorebook-cell-code.strong{ fill:var(--field-dark); }
  .scorebook-cell-code.muted{ fill:var(--ink-faint); font-weight:600; }
  .scorebook-cell-diamond{ fill:none; stroke:var(--field-dark); stroke-width:1.5; }
  .scorebook-cell-path{ fill:none; stroke-linecap:round; stroke-width:5; }
  .scorebook-cell-path.committed{ stroke:var(--field-dark); }
  .scorebook-cell-path.pending{ stroke:var(--game-gold); }
  .scorebook-cell-scored{ stroke:none; }
  .scorebook-cell-scored.committed{ fill:var(--field-dark); }
  .scorebook-cell-scored.pending{ fill:var(--game-gold); }
  .scorebook-cell-out-circle{ fill:var(--card-bg); stroke:var(--field-dark); stroke-width:1.8; }
  .scorebook-cell-out-num{ font-family:'IBM Plex Sans',sans-serif; font-size:14px; font-weight:700; fill:var(--field-dark); text-anchor:middle; }

  /* Sized to match the strike zone (the inner 3x3 of cells, rows/cols 1-3 --
     see isStrikeCell), not the full 5x5 grid: 3 cells + 2 internal 3px gaps
     = 3*52 + 2*3 = 162px at the fixed desktop cell size.
     HISTORY/HEAT-MAP ONLY as of this change (see mirrorCol's comment: that
     view always shows canonical, unmirrored data, so its plate stays the
     original opaque below-grid treatment regardless of any session's own
     perspective). The LIVE grid uses .home-plate-overlay in both
     perspectives now -- see below. */
  .home-plate-wrap{ width:162px; display:flex; justify-content:center; }
  .home-plate{ display:block; width:100%; }
  .home-plate polygon{ fill:var(--surface); stroke:var(--field-dark); stroke-width:2; }

  /* Live grid, both perspectives: one pentagon shape, drawn OVER the grid
     as a translucent spatial cue, repositioned/rotated per mode -- never a
     second hand-authored polygon. Percentages are the desktop grid's own
     box geometry (278px total; cell pitch 55px, padding 3px), so they
     resolve correctly at both breakpoints (.zone-grid is square at both --
     aspect-ratio:1/1 under the mobile media query below) without a
     separate calc(). pointer-events:none in both modes -- it sits on top
     of charting cells and must never swallow a tap. */
  .home-plate-overlay{
    position:absolute; pointer-events:none;
    left:20.86%; width:58.27%;
  }
  .home-plate-overlay polygon{ fill:var(--field-dark); fill-opacity:0.12; stroke:var(--field-dark); stroke-opacity:0.35; stroke-width:2; }
  /* behind_pitcher: point near box 2 (top), wide edge across the middle of
     boxes 7/8/9 (bottom) -- the raw polygon (wide edge at its own top,
     point at its own bottom) rotated 180deg to flip that. Unchanged from
     before this task. */
  .home-plate-overlay.behind-pitcher{ top:30.22%; height:39.56%; transform:rotate(180deg); }
  /* behind_catcher (new): point down, landing in the outer-ring cell
     directly below box 8 (row 4, col 2 0-indexed) -- one full cell-pitch
     (55px = 19.78% of 278px) below the behind_pitcher point's row, hence
     30.22% + 19.78% = 50.00%. Wide edge across the middle of boxes 4/5/6,
     the strike zone's own middle row -- also its own vertical center
     (50.00%), one row above the tip. No rotation: the raw polygon's
     natural orientation (wide edge at its own top, point at its own
     bottom) already matches point-down without any transform. */
  .home-plate-overlay.behind-catcher{ top:50%; height:39.57%; }

  .zone-cell-flash{ --flash-fg:#F1ECDD; animation:cellFlash 1.4s ease forwards; }
  .zone-cell-flash.flash-strike{ --flash-bg:#2E8B57; }
  .zone-cell-flash.flash-ball{ --flash-bg:#C0453B; }
  @keyframes cellFlash{
    0%{ background-color:var(--flash-bg); }
    55%{ background-color:var(--flash-bg); }
    100%{ background-color:transparent; }
  }
  .flash-letter{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Teko',sans-serif; font-size:26px; font-weight:700; color:var(--flash-fg);
    animation:letterFade 1.4s ease forwards;
  }
  @keyframes letterFade{ 0%{ opacity:1; } 55%{ opacity:1; } 100%{ opacity:0; } }

  .zone-number{
    position:absolute; top:3px; left:5px; font-family:'IBM Plex Mono',monospace;
    font-size:9.5px; color:rgba(var(--ink-rgb),0.35); pointer-events:none; line-height:1;
  }
  .zone-number-heat{ color:rgba(var(--ink-rgb),0.55); font-weight:600; }
  .zone-count{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; color:var(--field-dark);
  }
  .zone-cell-target{ outline:2px solid var(--amber); outline-offset:-2px; background:rgba(var(--amber-rgb),0.16); }
  .target-dot{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .target-dot-core{
    width:12px; height:12px; border-radius:50%; background:var(--amber);
    box-shadow:0 0 0 4px rgba(var(--amber-rgb),0.28); animation:targetPulse 1.1s ease-in-out infinite;
  }
  @keyframes targetPulse{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.15); opacity:0.75; } }

  .rel-glow-overlay{
    position:absolute; inset:0; border-radius:2px; background:var(--field-dark);
    pointer-events:none; animation:relGlowPulse 1.1s ease-in-out infinite;
  }
  @keyframes relGlowPulse{ 0%,100%{ opacity:0.16; } 50%{ opacity:0.5; } }

  .log-panel{ min-width:230px; flex:1; display:flex; flex-direction:column; gap:16px; }
  .stat-readout{ display:flex; gap:18px; flex-wrap:wrap; }
  .stat-box{ display:flex; flex-direction:column; }
  .stat-num{ font-family:'Teko',sans-serif; font-size:38px; line-height:1; color:var(--field-dark); }
  .stat-lbl{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.1em; color:var(--ink-faint); }
  .pitch-log{ display:flex; flex-direction:column; gap:5px; max-height:220px; overflow-y:auto; }
  .pitch-log-row{
    display:flex; align-items:center; justify-content:space-between; font-size:12.5px;
    padding:7px 10px; background:var(--surface); border-radius:5px;
  }
  .pitch-log-row .mono{ color:var(--ink-dim); }
  .plr-dot{ width:8px; height:8px; border-radius:2px; display:inline-block; margin-right:7px; transform:rotate(45deg); }
  .undo-btn{ background:none; border:none; color:var(--ink-faint); font-size:11px; text-decoration:underline; }
