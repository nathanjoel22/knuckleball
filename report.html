<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Fix (Sept 30 2026): the report is now shown IN this page, not in a
     sandboxed iframe (see renderReport), so this policy is what keeps any
     script out of it: only this page's own inline script (by hash -- see
     the note above that script) and the two script files it loads may
     run. Inline handlers (onclick=...), javascript: URLs, <object> and
     <base href> are all refused, so nothing inside a report can execute
     even if the sanitizer below ever missed something. -->
<meta http-equiv="Content-Security-Policy" content="script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/ 'sha256-1d1xsDiJxO+8b1YP6MFOixOwKyyboaG+nLItY+cVybQ='; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bullpen Session Report — Knuckleball</title>
<style>
  :root{
    /* Same token values as bullpen-tracker.html's light theme -- this page
       is a small independent shell, not part of the charting app, but
       should still look like the same product. */
    --page-bg:        #F7FAF8;
    --surface-border: #CFE6D7;
    --field-dark:     #0F241B;
    --ink-dim:        #2E4A40;
    --ink-faint:      #527065;
    --chalk:          #F1ECDD;
    --chalk-dim:      #B7C2B4;
    --amber:          #E8A83D;
    --red:            #C0453B;
    --border-on-dark: rgba(241,236,221,0.16);
  }
  *{ box-sizing:border-box; }
  /* The report's own stylesheet is added after this one and styles body,
     h1-h3, svg, etc. -- so everything the shell draws uses kb- classes
     with its fonts set explicitly, and never relies on inherited body
     styles. The page scrolls normally (no inner scroller), which is what
     lets every browser's print, including iPhone Safari's, paginate it. */
  body{ margin:0; background:var(--page-bg); }
  .kb-bar{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
    background:var(--field-dark); border-bottom:1px solid var(--border-on-dark);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.2;
  }
  .kb-mark{ color:var(--amber); font-weight:700; font-size:14px; letter-spacing:0.04em; }
  .kb-actions{ display:flex; gap:8px; }
  .kb-btn{
    font:inherit; font-size:13px; font-weight:600; padding:7px 14px; border-radius:6px;
    border:1px solid var(--border-on-dark); background:transparent; color:var(--chalk-dim); cursor:pointer;
  }
  .kb-btn:hover{ border-color:var(--chalk-dim); color:var(--chalk); }
  .kb-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  #kb-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:80px 24px; color:var(--ink-dim);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.4;
  }
  #kb-state.hidden{ display:none; }
  #kb-state h1{ color:var(--field-dark); font-family:inherit; font-size:18px; margin:0 0 8px; border:0; padding:0; }
  #kb-state p{ font-size:14px; color:var(--ink-faint); max-width:40ch; margin:0; }
  #kb-state.is-error h1{ color:var(--red); }
  /* S3: the live "Coaches notes" section (styled by the report's own h2 /
     .section / .caption rules, which carry the sport theme). */
  .kb-note{ margin:12px 0; break-inside:avoid; page-break-inside:avoid; }
  .kb-note .caption{ margin:0; }
  .kb-note-body{ margin:4px 0 0; font-size:14px; line-height:1.45; white-space:pre-wrap; overflow-wrap:anywhere; }
</style>
<!-- U10 (7) print rules, now for this page itself (the report is part of
     it). Breaks fall between sections; a section taller than a page may
     continue, but never through a chart, a table row, a tile row, or an
     at-bat log line. .table-scroll's horizontal scroller would otherwise
     clip wide tables at the right edge of the paper. The bar never prints. -->
<style media="print">
  @page{ margin:12mm; }
  .kb-bar, #kb-state{ display:none !important; }
  html,body{ height:auto !important; overflow:visible !important; }
  .table-scroll{ overflow:visible !important; }
  h2,h3{ break-after:avoid; page-break-after:avoid; }
  svg,.grid-row>div,.tiles,.side-block,.trend-grid>*,tr,.ab-row,.legend{ break-inside:avoid; page-break-inside:avoid; }
</style>
</head>
<body>
  <div class="kb-bar">
    <div class="kb-mark">KNUCKLEBALL</div>
    <div class="kb-actions">
      <button class="kb-btn" id="btn-download" disabled>Download</button>
      <button class="kb-btn" id="btn-print" disabled>Print</button>
    </div>
  </div>
  <!-- Visible from the start, so if the script ever can't run (e.g. the
       CSP hash above wasn't updated after an edit) the page says so. -->
  <div id="kb-state">
    <h1 id="kb-state-title">Loading report…</h1>
    <p id="kb-state-message"></p>
  </div>
  <div id="kb-report"></div>

<!-- Loaded only for the SUPABASE_URL constant (same config-swap file used
     for local/staging testing, per DEPLOY.md) -- this page makes no other
     use of the Supabase client the CDN script sets up. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<!-- CSP: the inline script below runs only because its exact SHA-256 is
     listed in the Content-Security-Policy at the top of this file. After
     ANY edit to it (even whitespace), recompute and paste the new hash:
       python3 -c "import re,hashlib,base64;s=open('report.html').read();print(base64.b64encode(hashlib.sha256(re.findall(r'<script>(\n// U4.*?)</script>',s,re.S)[0].encode()).digest()).decode())"
     Forgetting shows up at once: the page stays on "Loading report…". -->
<script>
// U4 Amendment 1 (Sept 10 2026) -- report.html is the shell page that makes
// self-contained reports viewable despite Supabase forcing text/html to
// serve as text/plain on *.supabase.co. It fetches the frozen report as
// TEXT (a fetch is unaffected by that override -- only browser navigation
// cares about Content-Type) and shows it.
//
// Fix (Sept 30 2026): the report is shown IN this page, not in an iframe.
// iPhone/iPad Safari prints the top-level page (Share > Print as well as
// the Print button), and an iframe never paginates -- so every iOS print
// came out as one page. Now the page IS the report, and prints like any
// long page, on every browser, by any route. The stored file is never
// changed: Download still hands over the exact stored bytes, and the copy
// shown here is rebuilt from it on every load.
//
// What used to be the iframe sandbox's job -- no script ever runs from a
// report -- is now done by two locks:
//  1. inertReport() parses the report with DOMParser (which never runs
//     scripts) and strips anything that could execute or navigate on its
//     own: script/iframe/object/embed/form/meta/base/link elements, every
//     on* attribute, and javascript: URLs.
//  2. This page's Content-Security-Policy (top of <head>) refuses every
//     script except this page's own, so even a missed handler can't run.
// Only the report's <style> elements and its <body> content are taken.

// Must match randomReportToken() in send-session-report/index.ts EXACTLY.
// This is the only thing standing between a crafted ?r= value and this
// page becoming a fetch-anything proxy for the reports bucket -- the check
// must run, and fail closed, BEFORE any URL is built or any fetch happens.
var TOKEN_RE = /^[0-9a-f]{64}\.html$/;

var reportText = null;

function showState(title, message, isError){
  var el = document.getElementById('kb-state');
  el.classList.remove('hidden');
  el.classList.toggle('is-error', !!isError);
  document.getElementById('kb-state-title').textContent = title;
  document.getElementById('kb-state-message').textContent = message || '';
}

var DROP_ELEMENTS = 'script,iframe,frame,frameset,object,embed,applet,form,meta,base,link,noscript,template';
var URL_ATTRS = ['href', 'xlink:href', 'src', 'action', 'formaction', 'data'];

function inertReport(html){
  var doc = new DOMParser().parseFromString(html, 'text/html');
  var drop = doc.querySelectorAll(DROP_ELEMENTS);
  for(var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
  var all = doc.getElementsByTagName('*');
  for(var j = 0; j < all.length; j++){
    var el = all[j];
    for(var k = el.attributes.length - 1; k >= 0; k--){
      var name = el.attributes[k].name.toLowerCase();
      var value = el.attributes[k].value.replace(/[\s\u0000-\u001f]/g, '').toLowerCase();
      if(name.indexOf('on') === 0 ||
         (URL_ATTRS.indexOf(name) >= 0 && /^(javascript|vbscript|data):/.test(value))){
        el.removeAttribute(el.attributes[k].name);
      }
    }
  }
  return doc;
}

function renderReport(html){
  var doc = inertReport(html);
  var styles = doc.head ? doc.head.querySelectorAll('style') : [];
  for(var i = 0; i < styles.length; i++){
    document.head.appendChild(document.importNode(styles[i], true));
  }
  var root = document.getElementById('kb-report');
  var kids = doc.body ? doc.body.childNodes : [];
  for(var j = 0; j < kids.length; j++){
    root.appendChild(document.importNode(kids[j], true));
  }
  if(doc.title) document.title = doc.title;
}

// S3 (Joel, Oct 1, option A): the stored report is frozen, so coaches' notes
// are shown LIVE on this page instead -- fetched by this report's own token
// (get_report_notes, which returns only this session's notes) and drawn with
// textContent only, never as HTML. Any failure (offline, old link) just
// means no notes section; the report itself is never affected.
async function addCoachNotes(token){
  var rows;
  try{
    var res = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_report_notes', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
      body: JSON.stringify({ p_token: token })
    });
    if(!res.ok) return;
    rows = await res.json();
  } catch(e){ return; }
  if(!Array.isArray(rows) || !rows.length) return;
  var sec = document.createElement('section');
  sec.className = 'section kb-notes';
  var h = document.createElement('h2');
  h.textContent = 'Coaches notes';
  sec.appendChild(h);
  for(var i = 0; i < rows.length; i++){
    var r = rows[i] || {};
    var item = document.createElement('div');
    item.className = 'kb-note';
    var meta = document.createElement('p');
    meta.className = 'caption';
    var when = r.created_at ? new Date(r.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
    meta.textContent = String(r.author_name || 'Coach') + (when ? ' \u00b7 ' + when : '');
    var body = document.createElement('p');
    body.className = 'kb-note-body';
    body.textContent = String(r.body || '');
    item.appendChild(meta);
    item.appendChild(body);
    sec.appendChild(item);
  }
  var root = document.getElementById('kb-report');
  var footer = root.querySelector('.report-footer');
  if(footer && footer.parentNode) footer.parentNode.insertBefore(sec, footer);
  else root.appendChild(sec);
}

function downloadReport(){
  if(!reportText) return;
  var blob = new Blob([reportText], { type: 'text/html' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'bullpen-report.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function printReport(){
  if(!reportText) return;
  window.print();
}

async function init(){
  var params = new URLSearchParams(window.location.search);
  var token = params.get('r') || '';

  if(!TOKEN_RE.test(token)){
    showState('Report link incomplete', 'This link is missing or malformed. Ask for the report to be re-sent.', true);
    return;
  }

  var res;
  try{
    res = await fetch(SUPABASE_URL + '/storage/v1/object/public/reports/' + token);
  } catch(e){
    showState('Could not load report', 'Check your connection and try again.', true);
    return;
  }

  if(!res.ok){
    // Covers both a bad/guessed token and a deleted session's report
    // object -- from a viewer's side these look identical, and both should
    // read as "the report is gone," not as an app error.
    showState('Report not available', 'This report may have been removed, or the link is incorrect.', true);
    return;
  }

  try{
    reportText = await res.text();
  } catch(e){
    showState('Could not load report', 'The report could not be read. Try again in a moment.', true);
    return;
  }

  renderReport(reportText);
  document.getElementById('kb-state').classList.add('hidden');
  document.getElementById('btn-download').disabled = false;
  document.getElementById('btn-print').disabled = false;
  addCoachNotes(token);
}

document.getElementById('btn-download').addEventListener('click', downloadReport);
document.getElementById('btn-print').addEventListener('click', printReport);

init();
</script>
</body>
</html>
