<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knuckleball</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="report-config.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --field-dark:#0F241B;
    --field-panel:#183527;
    --field-panel-2:#1F4230;
    --chalk:#F1ECDD;
    --chalk-dim:#B7C2B4;
    --chalk-faint:#7C8C82;
    --clay:#C17A45;
    --clay-dim:#8A5732;
    --amber:#E8A83D;
    --amber-bright:#F5C365;
    --red:#C0453B;
    --border:rgba(241,236,221,0.12);
    --border-strong:rgba(241,236,221,0.22);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--field-dark);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(232,168,61,0.06), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(193,122,69,0.06), transparent 45%);
    color:var(--chalk);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  ::selection{ background:var(--amber); color:var(--field-dark); }
  button{ font-family:inherit; cursor:pointer; }
  input, select{ font-family:inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--amber-bright);
    outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  .display{ font-family:'Teko', sans-serif; font-weight:600; letter-spacing:0.01em; }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  #app{ display:flex; min-height:100vh; max-width:1320px; margin:0 auto; }

  /* SIDEBAR */
  .sidebar{
    width:280px; flex-shrink:0;
    background:var(--field-panel);
    border-right:1px solid var(--border);
    padding:22px 18px;
    display:flex; flex-direction:column; gap:16px;
  }
  .brand-block{
    display:flex; flex-direction:column; gap:4px; padding-bottom:14px;
    border-bottom:1px solid var(--border);
  }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand-mark{
    width:10px; height:10px; border-radius:2px; background:var(--amber);
    transform:rotate(45deg); flex-shrink:0; margin-bottom:3px;
  }
  .brand h1{ font-size:30px; line-height:1; margin:0; letter-spacing:0.02em; }
  .brand span{ color:var(--amber); }
  .tagline{ font-size:10px; text-transform:uppercase; letter-spacing:0.14em; color:var(--chalk-faint); }

  .role-badge{
    align-self:flex-start; font-size:10px; text-transform:uppercase; letter-spacing:0.1em;
    color:var(--amber-bright); background:rgba(232,168,61,0.12);
    border:1px solid rgba(232,168,61,0.3); padding:3px 9px; border-radius:20px; margin-top:2px;
  }

  .team-select-wrap{ display:flex; flex-direction:column; gap:5px; }
  .team-select{
    background:var(--field-dark); border:1px solid var(--border-strong); border-radius:6px;
    color:var(--chalk); padding:9px 10px; font-size:13.5px; width:100%;
  }

  .roster-label{
    font-size:11px; text-transform:uppercase; letter-spacing:0.12em;
    color:var(--chalk-faint); margin:4px 0 -4px;
  }
  .roster-list{ display:flex; flex-direction:column; gap:6px; overflow-y:auto; }
  .roster-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:transparent; border:1px solid transparent; border-radius:6px;
    padding:10px 10px; text-align:left; color:var(--chalk); cursor:pointer; width:100%;
  }
  .roster-item:hover{ background:var(--field-panel-2); }
  .roster-item.active{ background:var(--field-panel-2); border-color:var(--border-strong); }
  .roster-item.active .roster-item-num{ color:var(--amber); }
  .roster-item-main{ display:flex; flex-direction:column; gap:2px; min-width:0; flex:1; }
  .roster-item-name{ font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .roster-item-types{ font-size:11px; color:var(--chalk-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .roster-item-num{ font-family:'Teko',sans-serif; font-size:20px; color:var(--chalk-faint); flex-shrink:0; }

  .invite-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    background:transparent; border:1px dashed var(--border-strong);
    color:var(--chalk-dim); border-radius:6px; padding:10px; font-size:13px; font-weight:600;
  }
  .invite-btn:hover{ border-color:var(--amber); color:var(--amber); }

  .sign-out-btn{
    margin-top:auto; background:transparent; border:1px solid var(--border);
    color:var(--chalk-faint); border-radius:6px; padding:9px; font-size:12.5px;
    font-weight:600; text-align:center;
  }
  .sign-out-btn:hover{ border-color:var(--red); color:var(--red); }

  .invite-form{
    background:var(--field-panel-2); border:1px solid var(--border-strong);
    border-radius:8px; padding:14px; display:flex; flex-direction:column; gap:10px;
  }
  .field-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--chalk-faint); }
  .text-input{
    background:var(--field-dark); border:1px solid var(--border-strong); border-radius:5px;
    color:var(--chalk); padding:8px 10px; font-size:14px; width:100%;
  }
  .text-input::placeholder{ color:var(--chalk-faint); }
  .form-row-buttons{ display:flex; gap:8px; margin-top:2px; }
  .btn{ border-radius:6px; padding:9px 14px; font-size:13px; font-weight:600; border:1px solid transparent; }
  .btn-primary{ background:var(--amber); color:var(--field-dark); }
  .btn-primary:hover{ background:var(--amber-bright); }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-ghost{ background:transparent; border-color:var(--border-strong); color:var(--chalk-dim); }
  .btn-ghost:hover{ border-color:var(--chalk-dim); color:var(--chalk); }
  .invite-status{ font-size:12px; margin:0; }
  .invite-status-sending{ color:var(--chalk-faint); }
  .invite-status-sent{ color:#6FA287; }
  .invite-status-error{ color:var(--red); }

  /* MAIN */
  .main{ flex:1; min-width:0; padding:26px 32px; display:flex; flex-direction:column; gap:20px; }
  .empty-state{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:10px; color:var(--chalk-faint); padding:60px 20px;
  }
  .empty-state .display{ font-size:42px; color:var(--chalk-dim); }

  .pitcher-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .pitcher-header h2{ font-family:'Teko',sans-serif; font-size:44px; font-weight:600; margin:0; line-height:1; }
  .pitcher-sub{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .pitch-chip{
    font-size:11px; font-weight:600; padding:4px 9px; border-radius:20px; letter-spacing:0.02em;
    border:1px solid var(--border-strong); color:var(--field-dark);
  }
  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); }
  .tab-btn{
    background:none; border:none; color:var(--chalk-faint); font-size:13px; font-weight:600;
    padding:10px 4px; margin-right:18px; border-bottom:2px solid transparent; text-transform:uppercase; letter-spacing:0.06em;
  }
  .tab-btn:hover{ color:var(--chalk); }
  .tab-btn.active{ color:var(--amber); border-bottom-color:var(--amber); }

  /* SESSION VIEW */
  .session-grid-layout{ display:flex; gap:26px; flex-wrap:wrap; align-items:flex-start; }
  .panel{ background:var(--field-panel); border:1px solid var(--border); border-radius:10px; padding:18px; }
  .controls-panel{ display:flex; flex-direction:column; gap:14px; min-width:260px; flex:1; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .type-chip{
    padding:7px 13px; border-radius:20px; font-size:13px; font-weight:600; border:1.5px solid var(--border-strong);
    background:transparent; color:var(--chalk-dim);
  }
  .type-chip.selected{ color:var(--field-dark); border-color:transparent; }
  .add-type-inline{ display:flex; gap:6px; align-items:center; }
  .add-type-inline input{ flex:1; padding:6px 8px; font-size:12.5px; }
  .add-type-inline button{ background:none; border:1px solid var(--border-strong); color:var(--chalk-dim); border-radius:5px; padding:6px 10px; font-size:12px; }
  .add-type-inline button:hover{ color:var(--amber); border-color:var(--amber); }

  .velo-toggle-row{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--chalk-dim); }
  .velo-toggle-row input[type="checkbox"]{ width:16px; height:16px; accent-color:var(--amber); cursor:pointer; }
  .velo-slider-row{ display:flex; align-items:center; gap:14px; }
  .velo-slider-row.disabled{ opacity:0.4; }
  .velo-slider-row input[type="range"]{
    flex:1; -webkit-appearance:none; appearance:none; height:6px; border-radius:3px;
    background:linear-gradient(90deg, var(--amber) 0%, var(--amber) var(--fill,50%), var(--field-dark) var(--fill,50%), var(--field-dark) 100%);
    outline-offset:4px;
  }
  .velo-slider-row input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; width:20px; height:20px; border-radius:50%;
    background:var(--amber-bright); border:2px solid var(--field-dark); cursor:pointer;
    box-shadow:0 0 0 1px var(--border-strong);
  }
  .velo-slider-row input[type="range"]::-moz-range-thumb{
    width:20px; height:20px; border-radius:50%; background:var(--amber-bright);
    border:2px solid var(--field-dark); cursor:pointer;
  }
  .velo-slider-row input[type="range"]:disabled{ cursor:not-allowed; }
  .velo-readout{ font-size:22px; color:var(--amber-bright); min-width:70px; text-align:right; }

  .hint-msg{ font-size:12px; color:var(--clay); min-height:16px; }

  .zone-wrap{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  .zone-grid{
    display:grid; grid-template-columns:repeat(5, 52px); grid-template-rows:repeat(5, 52px);
    gap:3px; background:var(--border); padding:3px; border-radius:6px;
  }
  .zone-cell{
    background:var(--field-dark); border-radius:3px; position:relative; border:1px solid transparent;
    transition:background-color 0.3s ease;
  }
  .zone-cell.in-zone{ background:#152B21; border-color:var(--border-strong); }
  .zone-cell.clickable{ cursor:pointer; }
  .zone-cell.clickable:hover{ outline:2px solid var(--amber); outline-offset:-2px; }
  .zone-caption{ font-size:11px; color:var(--chalk-faint); text-transform:uppercase; letter-spacing:0.1em; }

  .zone-cell-flash{ --flash-fg:#F1ECDD; animation:cellFlash 1.4s ease forwards; }
  .zone-cell-flash.flash-strike{ --flash-bg:#2E8B57; }
  .zone-cell-flash.flash-ball{ --flash-bg:#C0453B; }
  @keyframes cellFlash{
    0%{ background-color:var(--flash-bg); }
    55%{ background-color:var(--flash-bg); }
    100%{ background-color:transparent; }
  }
  .flash-letter{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Teko',sans-serif; font-size:26px; font-weight:700; color:var(--flash-fg);
    animation:letterFade 1.4s ease forwards;
  }
  @keyframes letterFade{ 0%{ opacity:1; } 55%{ opacity:1; } 100%{ opacity:0; } }

  .zone-number{
    position:absolute; top:3px; left:5px; font-family:'IBM Plex Mono',monospace;
    font-size:9.5px; color:rgba(241,236,221,0.4); pointer-events:none; line-height:1;
  }
  .zone-number-heat{ color:rgba(15,36,27,0.55); font-weight:600; }
  .zone-count{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; color:#0F241B;
  }
  .zone-cell-target{ outline:2px solid var(--amber); outline-offset:-2px; background:rgba(232,168,61,0.16); }
  .target-dot{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .target-dot-core{
    width:12px; height:12px; border-radius:50%; background:var(--amber);
    box-shadow:0 0 0 4px rgba(232,168,61,0.28); animation:targetPulse 1.1s ease-in-out infinite;
  }
  @keyframes targetPulse{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.15); opacity:0.75; } }

  .log-panel{ min-width:230px; flex:1; display:flex; flex-direction:column; gap:12px; }
  .stat-readout{ display:flex; gap:18px; flex-wrap:wrap; }
  .stat-box{ display:flex; flex-direction:column; }
  .stat-num{ font-family:'Teko',sans-serif; font-size:38px; line-height:1; color:var(--amber-bright); }
  .stat-lbl{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.1em; color:var(--chalk-faint); }
  .pitch-log{ display:flex; flex-direction:column; gap:5px; max-height:220px; overflow-y:auto; }
  .pitch-log-row{
    display:flex; align-items:center; justify-content:space-between; font-size:12.5px;
    padding:6px 9px; background:var(--field-panel-2); border-radius:5px;
  }
  .pitch-log-row .mono{ color:var(--chalk-dim); }
  .plr-dot{ width:8px; height:8px; border-radius:2px; display:inline-block; margin-right:7px; transform:rotate(45deg); }
  .undo-btn{ background:none; border:none; color:var(--chalk-faint); font-size:11px; text-decoration:underline; }
  .undo-btn:hover{ color:var(--red); }
  .end-session-btn{ align-self:flex-start; }
  .end-session-btn:disabled{ opacity:0.6; cursor:not-allowed; }

  .draft-banner{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    background:var(--field-panel-2); border:1px solid var(--clay-dim); border-radius:8px; padding:12px 16px;
  }
  .draft-banner p{ margin:0; font-size:13px; color:var(--chalk-dim); }

  /* HISTORY */
  .session-card{ background:var(--field-panel); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .session-card-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; gap:14px; flex-wrap:wrap; cursor:pointer; }
  .session-card-head:hover{ background:var(--field-panel-2); }
  .session-date{ font-weight:600; font-size:14px; }
  .coach-logged-tag{
    font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--amber-bright); background:rgba(232,168,61,0.12); border:1px solid rgba(232,168,61,0.3);
    padding:2px 7px; border-radius:20px; margin-left:6px; vertical-align:middle;
  }
  .session-meta{ display:flex; gap:16px; flex-wrap:wrap; }
  .meta-item{ display:flex; flex-direction:column; align-items:flex-end; }
  .meta-num{ font-family:'Teko',sans-serif; font-size:24px; color:var(--amber-bright); line-height:1; }
  .meta-lbl{ font-size:10px; text-transform:uppercase; color:var(--chalk-faint); letter-spacing:0.08em; }
  .session-card-body{ padding:0 18px 18px; border-top:1px solid var(--border); display:flex; gap:24px; flex-wrap:wrap; }
  .breakdown-table{ width:100%; border-collapse:collapse; font-size:12.5px; margin-top:14px; }
  .breakdown-table th{ text-align:left; color:var(--chalk-faint); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; padding:4px 8px 6px 0; border-bottom:1px solid var(--border); }
  .breakdown-table td{ padding:6px 8px 6px 0; border-bottom:1px solid var(--border); }

  .empty-hist{ text-align:center; color:var(--chalk-faint); padding:40px 20px; font-size:13.5px; }

  .contacts-panel{
    display:flex; gap:14px; flex-wrap:wrap; background:var(--field-panel); border:1px solid var(--border);
    border-radius:10px; padding:16px; margin-top:-8px;
  }
  .contacts-panel .field{ flex:1; min-width:200px; }
  .contacts-save-row{ flex-basis:100%; display:flex; align-items:center; gap:12px; margin-top:2px; }
  .contacts-saved-msg{ font-size:12.5px; color:#6FA287; font-weight:600; }

  .report-panel{
    margin-top:16px; padding-top:14px; border-top:1px solid var(--border);
    display:flex; flex-direction:column; gap:8px; align-items:flex-start;
  }
  .report-recipients{ margin:0; font-size:12px; color:var(--chalk-faint); }
  .report-status{ margin:0; font-size:12px; }
  .report-status-sending{ color:var(--chalk-faint); }
  .report-status-sent{ color:#6FA287; }
  .report-status-error{ color:var(--red); }

  /* TRENDS */
  .trend-panel{ display:flex; flex-direction:column; gap:6px; }
  .trend-title{ font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--chalk-faint); }

  @media (max-width: 860px){
    #app{ flex-direction:column; }
    .sidebar{ width:100%; border-right:none; border-bottom:1px solid var(--border); max-height:none; }
    .roster-list{ max-height:220px; }
    .main{ padding:20px 16px; }
    .zone-grid{ grid-template-columns:repeat(5, 15vw); grid-template-rows:repeat(5, 15vw); max-width:320px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- CONSTANTS ---------- */
const TYPE_PALETTE = ['#E8A83D','#6FA287','#C17A45','#C0453B','#7C9CBF','#B98CCB','#D4C15B','#4FA8A8'];
const GRID_SIZE = 5;

/* ---------- LOCAL DRAFT SAFETY NET ----------
   Only used as an in-progress-session cache on this device, so a page
   refresh mid-bullpen doesn't lose pitches already tapped in. The
   permanent record of a finished session always lives in Supabase. */
async function storGet(key){
  try{ const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function storSet(key, val){
  try{ await window.storage.set(key, JSON.stringify(val), false); }
  catch(e){ console.error('storage set failed', key, e); }
}
async function storDelete(key){
  try{ await window.storage.delete(key, false); } catch(e){}
}

/* ---------- STATE ---------- */
let state = {
  session: null,
  profile: null,          // raw row: id, role, full_name, pitch_types, contact_emails
  teams: [],               // [{id, name}]
  currentTeamId: null,
  roster: [],               // (coach view) mapped pitcher objects on current team
  currentPitcherId: null,
  sessions: [],
  view: 'session',          // session | history | trends
  activeSession: null,
  selectedType: null,
  velo: 65,
  recordVelocity: true,
  flashCell: null,
  pendingTarget: null,
  expandedSessionId: null,
  hint: '',
  draftAvailable: false,
  pendingDraft: null,
  contactsOpen: false,
  contactsSavedAt: null,
  inviteOpen: false,
  inviteStatus: null,
  saving: false,
  loaded: false
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function mapProfile(row){
  return { id: row.id, name: row.full_name, pitchTypes: row.pitch_types || [], contactEmails: row.contact_emails || {} };
}
function isCoach(){ return state.profile && state.profile.role === 'coach'; }
function colorForType(pitcher, type){
  const idx = pitcher.pitchTypes.indexOf(type);
  return TYPE_PALETTE[idx >= 0 ? idx % TYPE_PALETTE.length : 0];
}
function currentPitcher(){
  if(!isCoach()) return mapProfile(state.profile);
  return state.roster.find(p => p.id === state.currentPitcherId) || null;
}
function isStrikeCell(row, col){ return row >= 1 && row <= 3 && col >= 1 && col <= 3; }
function zoneNumber(row, col){
  if(!isStrikeCell(row, col)) return null;
  return (row - 1) * 3 + (col - 1) + 1; // 1 (top-left) ... 9 (bottom-right), standard baseball numbering
}
function isAccurate(pitch){
  return pitch.targetRow === pitch.actualRow && pitch.targetCol === pitch.actualCol;
}

/* ---------- INIT / AUTH GUARD ---------- */
async function init(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(!session){ window.location.href = 'login.html'; return; }
  state.session = session;

  let { data: profile, error: profErr } = await supabaseClient
    .from('profiles').select('*').eq('id', session.user.id).single();

  // If a profile row doesn't exist yet, it's most likely because email
  // confirmation delayed the account past the moment signup normally
  // creates it. Self-heal using the metadata captured at signup time.
  if(!profile && profErr && profErr.code === 'PGRST116'){
    const meta = session.user.user_metadata || {};
    if(meta.intended_role === 'coach' && meta.full_name){
      const { data: newProfile, error: insertErr } = await supabaseClient
        .from('profiles').insert({ id: session.user.id, role: 'coach', full_name: meta.full_name })
        .select().single();
      if(!insertErr && newProfile){
        profile = newProfile;
        if(meta.team_name){
          await supabaseClient.from('teams').insert({ coach_id: session.user.id, name: meta.team_name });
        }
      }
    }
  }

  if(!profile){
    alert('Could not load your account profile. Please try logging in again, or contact support if this keeps happening.');
    await supabaseClient.auth.signOut();
    window.location.href = 'login.html';
    return;
  }
  state.profile = profile;

  await loadTeams();
  if(state.teams.length){
    await onTeamChange(state.teams[0].id, true);
  }
  state.loaded = true;
  render();
}

async function loadTeams(){
  if(isCoach()){
    const { data } = await supabaseClient.from('teams').select('id, name').eq('coach_id', state.profile.id).order('created_at');
    state.teams = data || [];
  } else {

function draftKey(){ return 'draft:' + state.currentPitcherId + ':' + state.currentTeamId; }
async function refreshDraftState(){

  if(draft && draft.pitches && draft.pitches.length){

    state.pendingDraft = draft;

  } else {
    state.draftAvailable = false;
    state.pendingDraft = null;

window.discardDraft = async function(){

  state.activeSession = { pitches: [], startedAt: Date.now() };

window.onVeloSlide = function(val){
  state.velo = parseInt(val);
  const readout = document.getElementById('velo-readout');
  if(readout) readout.textContent = state.velo + ' mph';
  const slider = document.getElementById('velo-slider');
  if(slider) slider.style.setProperty('--fill', ((state.velo/110)*100) + '%');
};
function attachVeloSliderHandlers(){
  const slider = document.getElementById('velo-slider');
  if(!slider) return;
  slider.style.setProperty('--fill', ((state.velo/110)*100) + '%');
  slider.addEventListener('keydown', function(e){
    if(e.key === 'Tab'){
      e.preventDefault();
      let v = parseInt(this.value) || 0;
      v = e.shiftKey ? Math.max(0, v - 10) : Math.min(110, v + 10);
      this.value = v;
      window.onVeloSlide(v);
    }
  });
}

window.handleZoneTap = async function(row, col){
  if(!state.selectedType){ state.hint = 'Select a pitch type first'; render(); return; }
  state.hint = '';

  if(!state.pendingTarget){
    state.pendingTarget = { row, col };
    render();
    return;
  }

  const target = state.pendingTarget;
  const veloVal = state.recordVelocity ? state.velo : null;
  const strike = isStrikeCell(row, col);
  state.activeSession.pitches.push({
    type: state.selectedType, velo: veloVal,
    targetRow: target.row, targetCol: target.col,
    actualRow: row, actualCol: col,
    ts: Date.now()
  });
  state.pendingTarget = null;
  await storSet(draftKey(), state.activeSession);
  const flashKey = uid();
  state.flashCell = { row, col, strike, key: flashKey };
  render();
  setTimeout(() => {
    if(state.flashCell && state.flashCell.key === flashKey){
      state.flashCell = null;
      render();
    }
  }, 1400);
};
window.resetTarget = function(){
  state.pendingTarget = null;
  render();
};
window.undoLastPitch = async function(){
  state.activeSession.pitches.pop();
  state.pendingTarget = null;
  await storSet(draftKey(), state.activeSession);
  render();
};

window.endSession = async function(){
  if(!state.activeSession.pitches.length){ state.hint = 'Log at least one pitch before ending the session'; render(); return; }
  state.saving = true;
  render();

  const { data: sessionRow, error: sessErr } = await supabaseClient.from('sessions').insert({
    pitcher_id: state.currentPitcherId,
    team_id: state.currentTeamId,
    logged_by: state.profile.id,
    started_at: new Date(state.activeSession.startedAt).toISOString(),
    ended_at: new Date().toISOString()
  }).select().single();

  if(sessErr || !sessionRow){
    state.hint = 'Could not save session: ' + (sessErr ? sessErr.message : 'unknown error');
    state.saving = false; render(); return;
  }

  const pitchRows = state.activeSession.pitches.map(p => ({
    session_id: sessionRow.id, type: p.type, velo: p.velo,
    target_row: p.targetRow, target_col: p.targetCol,
    actual_row: p.actualRow, actual_col: p.actualCol,
    ts: new Date(p.ts).toISOString()
  }));
  const { error: pitchErr } = await supabaseClient.from('pitches').insert(pitchRows);
  if(pitchErr){
    state.hint = 'Session saved, but pitches failed to save: ' + pitchErr.message;
    state.saving = false; render(); return;
  }

  await storDelete(draftKey());
  state.activeSession = { pitches: [], startedAt: Date.now() };
  state.selectedType = null;
  state.pendingTarget = null;
  state.saving = false;
  await loadSessionsForCurrentSelection();
  state.view = 'history';
  state.expandedSessionId = sessionRow.id;
  render();
};

async function loadSessionsForCurrentSelection(){
  const pitcherId = state.currentPitcherId;

/* ---------- STATS HELPERS ---------- */
function sessionStats(pitches){
  const total = pitches.length;
  const strikes = pitches.filter(p => isStrikeCell(p.actualRow, p.actualCol)).length;
  const accurate = pitches.filter(isAccurate).length;
  const velos = pitches.map(p => p.velo).filter(v => v !== null && v !== undefined);
  const hasVelo = velos.length > 0;
  const avgVelo = hasVelo ? Math.round(velos.reduce((a,b)=>a+b,0) / velos.length) : null;
  const minVelo = hasVelo ? Math.min(...velos) : null;
  const maxVelo = hasVelo ? Math.max(...velos) : null;
  const byType = {};
  pitches.forEach(p => {
    if(!byType[p.type]) byType[p.type] = { count:0, velos:[], strikes:0, accurate:0 };
    byType[p.type].count++;
    if(p.velo !== null && p.velo !== undefined) byType[p.type].velos.push(p.velo);
    if(isStrikeCell(p.actualRow, p.actualCol)) byType[p.type].strikes++;
    if(isAccurate(p)) byType[p.type].accurate++;
  });
  Object.values(byType).forEach(t => {
    t.hasVelo = t.velos.length > 0;
    t.avgVelo = t.hasVelo ? Math.round(t.velos.reduce((a,b)=>a+b,0) / t.velos.length) : null;
    t.minVelo = t.hasVelo ? Math.min(...t.velos) : null;
    t.maxVelo = t.hasVelo ? Math.max(...t.velos) : null;
    t.strikePct = Math.round((t.strikes / t.count) * 100);
    t.accuracyPct = Math.round((t.accurate / t.count) * 100);
  });
  return {
    total, strikes, strikePct: total ? Math.round((strikes/total)*100) : 0,
    accurate, accuracyPct: total ? Math.round((accurate/total)*100) : 0,
    hasVelo, avgVelo, minVelo, maxVelo, byType
  };
}
function heatCounts(pitches){
  const grid = {};
  pitches.forEach(p => { const k = p.actualRow + '-' + p.actualCol; grid[k] = (grid[k] || 0) + 1; });
  return grid;
}
function heatColor(intensity){
  const from = { r:142, g:197, b:232 };
  const to = { r:208, g:60, b:60 };
  const r = Math.round(from.r + (to.r - from.r) * intensity);
  const g = Math.round(from.g + (to.g - from.g) * intensity);
  const b = Math.round(from.b + (to.b - from.b) * intensity);
  return `rgb(${r},${g},${b})`;
}

/* ---------- RENDER: ZONE GRID ---------- */
function renderZoneGrid(pitches, clickable, flashCell, pendingTarget){
  let cells = '';
  if(clickable){
    for(let row=0; row<GRID_SIZE; row++){
      for(let col=0; col<GRID_SIZE; col++){
        const inZone = isStrikeCell(row,col);
        const num = zoneNumber(row,col);
        const isTarget = pendingTarget && pendingTarget.row === row && pendingTarget.col === col;
        const isFlash = flashCell && flashCell.row === row && flashCell.col === col;
        let cls = 'zone-cell' + (inZone ? ' in-zone' : '') + ' clickable';
        let inner = num !== null ? `<span class="zone-number">${num}</span>` : '';
        if(isTarget){ cls += ' zone-cell-target'; inner += `<span class="target-dot"><span class="target-dot-core"></span></span>`; }
        if(isFlash){
          cls += flashCell.strike ? ' zone-cell-flash flash-strike' : ' zone-cell-flash flash-ball';
          inner += `<span class="flash-letter">${flashCell.strike ? 'K' : 'B'}</span>`;
        }
        cells += `<div class="${cls}" onclick="handleZoneTap(${row},${col})">${inner}</div>`;
      }
    }
  } else {
    const heat = heatCounts(pitches);
    const maxCount = Math.max(1, ...Object.values(heat));
    for(let row=0; row<GRID_SIZE; row++){
      for(let col=0; col<GRID_SIZE; col++){
        const key = row+'-'+col;
        const count = heat[key] || 0;
        const inZone = isStrikeCell(row,col);
        const num = zoneNumber(row,col);
        const intensity = count / maxCount;
        const bg = `background:${heatColor(intensity)};opacity:${0.4 + 0.5*intensity};`;
        const cls = 'zone-cell' + (inZone ? ' in-zone' : '');
        const numLabel = num !== null ? `<span class="zone-number zone-number-heat">${num}</span>` : '';
        const countLabel = count > 0 ? `<span class="zone-count">${count}</span>` : '';
        cells += `<div class="${cls}" style="${bg}">${numLabel}${countLabel}</div>`;
      }
    }
  }
  return `<div class="zone-grid">${cells}</div>`;
}

              ${state.recordVelocity ? '' : 'disabled'} oninput="onVeloSlide(this.value)">

/* ---------- RENDER: TRENDS VIEW ---------- */
function renderTrendsView(){
  const p = currentPitcher();
  if(!p || state.sessions.length < 2){
    return `<div class="empty-hist">Log at least 2 sessions${p ? ' for ' + p.name : ''} to see trends over time.</div>`;
  }
  const ordered = state.sessions.slice().sort((a,b) => a.date - b.date);
  const points = ordered.map(s => ({ date: s.date, stats: sessionStats(s.pitches) }));
  const anyVelo = points.some(pt => pt.stats.hasVelo);

  function barChart(title, valueFn, unit, maxHint){
    const vals = points.map(valueFn);
    const max = Math.max(maxHint || 0, ...vals) * 1.15;
    const w = 640, h = 140;
    const barW = Math.min(56, (w - 20) / points.length - 10);
    const bars = points.map((pt, i) => {
      const x = 10 + i * ((w-20)/points.length);
      const val = valueFn(pt);
      const barH = max ? (val/max) * (h-30) : 0;
      const y = h - 20 - barH;
      const d = new Date(pt.date).toLocaleDateString(undefined,{month:'numeric',day:'numeric'});
      return `<g>
        <rect x="${x}" y="${y}" width="${barW}" height="${barH}" fill="var(--amber)" rx="3"></rect>
        <text x="${x+barW/2}" y="${y-6}" text-anchor="middle" fill="#F1ECDD" font-family="IBM Plex Mono" font-size="12">${val}${unit}</text>
        <text x="${x+barW/2}" y="${h-4}" text-anchor="middle" fill="#7C8C82" font-family="IBM Plex Sans" font-size="10">${d}</text>
      </g>`;
    }).join('');
    return `<div class="trend-panel panel"><div class="trend-title">${title}</div>
      <svg width="100%" viewBox="0 0 ${w} ${h}" style="overflow:visible;"><line x1="0" y1="${h-20}" x2="${w}" y2="${h-20}" stroke="#F1ECDD" stroke-opacity="0.15"></line>${bars}</svg>
    </div>`;
  }

  return `
    <div style="display:flex;flex-direction:column;gap:20px;">
      ${barChart('Strike % by session', pt => pt.stats.strikePct, '%', 100)}
      ${barChart('Accuracy % by session', pt => pt.stats.accuracyPct, '%', 100)}
      ${anyVelo ? barChart('Average velocity by session', pt => pt.stats.hasVelo ? pt.stats.avgVelo : 0, ' mph', 0) : `<div class="empty-hist">No velocity data recorded across these sessions.</div>`}
    </div>`;
}

/* ---------- EMAIL REPORT ---------- */
window.sendSessionReport = async function(sessionId){
  const p = currentPitcher();
  const session = state.sessions.find(s => s.id === sessionId);
  if(!session || !p) return;
  const contacts = p.contactEmails || {};
  const emails = [contacts.coach, contacts.pitchingCoach, contacts.pitcher].map(e => (e||'').trim()).filter(Boolean);
  if(!emails.length) return;

  state.reportStatus = { sessionId, status: 'sending', message: 'Sending…' };
  render();

  const stats = sessionStats(session.pitches);
  try{
    if(typeof SEND_REPORT_URL === 'undefined' || SEND_REPORT_URL.indexOf('YOUR_') === 0){
      throw new Error('not configured');
    }
    const res = await fetch(SEND_REPORT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-report-key': typeof REPORT_API_KEY !== 'undefined' ? REPORT_API_KEY : '' },
      body: JSON.stringify({
        emails, pitcherName: p.name, date: session.date,
        stats: { total: stats.total, strikePct: stats.strikePct, accuracyPct: stats.accuracyPct, avgVelo: stats.avgVelo }
      })
    });
    if(!res.ok) throw new Error('server responded ' + res.status);
    state.reportStatus = { sessionId, status: 'sent', message: 'Report sent to ' + emails.length + ' recipient(s).' };
  } catch(err){
    state.reportStatus = { sessionId, status: 'error', message: 'Could not send — email backend may not be deployed yet. See SETUP.md.' };
  }
  render();
};

/* ---------- MAIN RENDER ---------- */
function render(){
  const app = document.getElementById('app');
  if(!state.loaded){
    app.innerHTML = `<div class="empty-state"><div class="display">Loading…</div></div>`;
    return;
  }

  if(!state.teams.length){
    const msg = isCoach()
      ? `<p>You don't have a team yet — something may have gone wrong during signup.</p>`
      : `<p>You haven't joined a team yet. Ask your coach to send you an invite email.</p>`;
    app.innerHTML = `
      <div class="sidebar">
        <div class="brand-block"><div class="brand"><span class="brand-mark"></span><h1 class="display">Knuckleball<span>.</span></h1></div><span class="tagline">Always a Step Ahead</span></div>
        <button class="sign-out-btn" onclick="signOut()">Sign out</button>
      </div>
      <div class="main"><div class="empty-state"><div class="display">No team yet</div>${msg}</div></div>`;
    return;
  }

  const teamOptions = state.teams.map(t => `<option value="${t.id}" ${t.id===state.currentTeamId?'selected':''}>${t.name}</option>`).join('');
  const teamSelector = state.teams.length > 1
    ? `<div class="team-select-wrap"><span class="roster-label">Team</span><select class="team-select" onchange="onTeamChange(this.value)">${teamOptions}</select></div>`
    : `<div class="team-select-wrap"><span class="roster-label">Team</span><div style="font-size:14px;font-weight:600;">${state.teams[0].name}</div></div>`;

  let sidebarBody;
  if(isCoach()){
    const rosterItems = state.roster.map((p, i) => `
      <button class="roster-item${p.id===state.currentPitcherId?' active':''}" onclick="selectPitcher('${p.id}')">
        <div class="roster-item-main">
          <span class="roster-item-name">${p.name}</span>
          <span class="roster-item-types">${p.pitchTypes.join(' · ') || 'No pitches set yet'}</span>
        </div>
        <span class="roster-item-num">${String(i+1).padStart(2,'0')}</span>
      </button>`).join('');

    const inviteForm = state.inviteOpen ? `
      <div class="invite-form">
        <div>
          <div class="field-label">Pitcher's email</div>
          <input id="invite-email" class="text-input" placeholder="pitcher@example.com" style="margin-top:5px;">
        </div>
        <div class="form-row-buttons">
          <button class="btn btn-primary" onclick="sendInvite()">Send invite</button>
          <button class="btn btn-ghost" onclick="toggleInvitePanel()">Cancel</button>
        </div>
        ${state.inviteStatus === 'sending' ? '<p class="invite-status invite-status-sending">Sending…</p>' : ''}
        ${state.inviteStatus === 'sent' ? '<p class="invite-status invite-status-sent">Invite sent.</p>' : ''}
        ${state.inviteStatus && state.inviteStatus.indexOf('error') === 0 ? `<p class="invite-status invite-status-error">Could not send invite (${state.inviteStatus.slice(6)}).</p>` : ''}
      </div>` : `<button class="invite-btn" onclick="toggleInvitePanel()">+ Invite pitcher</button>`;

    sidebarBody = `
      ${teamSelector}
      <div class="roster-label">Roster</div>
      <div class="roster-list">${rosterItems || '<p style="color:var(--chalk-faint);font-size:12.5px;">No pitchers on this team yet.</p>'}</div>
      ${inviteForm}`;
  } else {
    sidebarBody = `
      ${teamSelector}
      <div class="roster-label">Signed in as</div>
      <div style="font-size:14px;font-weight:600;">${state.profile.full_name}</div>`;
  }

  const sidebar = `
    <div class="sidebar">
      <div class="brand-block">
        <div class="brand"><span class="brand-mark"></span><h1 class="display">Knuckleball<span>.</span></h1></div>
        <span class="tagline">Always a Step Ahead</span>
        <span class="role-badge">${isCoach() ? 'Coach' : 'Pitcher'}</span>
      </div>
      ${sidebarBody}
      <button class="sign-out-btn" onclick="signOut()">Sign out</button>
    </div>`;

  const p = currentPitcher();
  let main;
  if(!p){
    main = `<div class="empty-state"><div class="display">No pitcher selected</div><p>Invite a pitcher to this team to get started.</p></div>`;
  } else {
    const arsenalChips = p.pitchTypes.map(t => {
      const c = colorForType(p, t);
      const removable = !isCoach();
      return `<span class="pitch-chip" style="background:${c};">${t}${removable ? ` <span onclick="removePitchType('${t.replace(/'/g,"\\'")}')" style="cursor:pointer;margin-left:4px;">✕</span>` : ''}</span>`;
    }).join('') || `<span style="color:var(--chalk-faint);font-size:12.5px;">No pitches set yet</span>`;

    const contacts = p.contactEmails || {};
    const contactsPanel = (!isCoach() && state.contactsOpen) ? `
      <div class="contacts-panel">
        <div class="field"><span class="field-label">Coach email</span><input class="text-input" id="contact-coach" value="${contacts.coach||''}" placeholder="coach@example.com"></div>
        <div class="field"><span class="field-label">Pitching coach email</span><input class="text-input" id="contact-pitching-coach" value="${contacts.pitchingCoach||''}" placeholder="pitchingcoach@example.com"></div>
        <div class="field"><span class="field-label">Pitcher email</span><input class="text-input" id="contact-pitcher" value="${contacts.pitcher||''}" placeholder="pitcher@example.com"></div>
        <div class="contacts-save-row">
          <button class="btn btn-primary" onclick="saveContactEmails()">Save</button>
          ${state.contactsSavedAt ? '<span class="contacts-saved-msg">Saved</span>' : ''}
        </div>
      </div>` : '';

    const tabs = `<div class="tabs">
           <button class="tab-btn${state.view==='session'?' active':''}" onclick="setView('session')">New session</button>
           <button class="tab-btn${state.view==='history'?' active':''}" onclick="setView('history')">History</button>
           <button class="tab-btn${state.view==='trends'?' active':''}" onclick="setView('trends')">Trends</button>
         </div>`;

    main = `
      <div class="pitcher-header">
        <div>
          <h2 class="display">${p.name}</h2>
          <div class="pitcher-sub">${arsenalChips}</div>
        </div>
        ${!isCoach() ? `<button class="btn btn-ghost" onclick="toggleContactsPanel()">${state.contactsOpen ? 'Hide' : ''} Contacts</button>` : ''}
      </div>
      ${contactsPanel}
      ${tabs}
      ${state.view==='session' ? renderSessionView() : state.view==='trends' ? renderTrendsView() : renderHistoryView()}
    `;
  }

  app.innerHTML = sidebar + `<div class="main">${main}</div>`;
  attachVeloSliderHandlers();
}

init();
</script>
</body>
</html>
