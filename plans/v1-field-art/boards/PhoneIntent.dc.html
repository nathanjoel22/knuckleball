class Component extends DCLogic {
renderVals() {
const sb = (this.props.sport ?? 'Baseball') === 'Softball';
const accent = sb ? '#FF4F9A' : '#F2B741';
const cells = [];
for (let r = 0; r < 5; r++) {
for (let c = 0; c < 5; c++) {
const zone = r >= 1 && r <= 3 && c >= 1 && c <= 3;
const picked = r === 3 && c === 4;
let style;
if (picked) {
style = 'background: rgba(255,255,255,0.72); border: 2.5px solid ' + accent;
} else if (zone) {
style = 'background: rgba(236,238,234,0.66); border: 1px solid #FFFFFF';
} else {
