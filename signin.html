<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Knuckleball</title>
<script>
  // R7 (Joel, Nov 19 2026): there's one sign-in now (login.html), and no "Which sport?" / "Who are you?" cards. This
  // address is in emails already sent, bookmarks, the app shells and the landing page's old links, so it stays -- as a
  // forward. A password-reset link still goes to the reset page first; a signed-in device still goes to the app.
  (function(){
    var search = location.search || '', hash = location.hash || '';
    if(/(^#|&)type=recovery(&|$)/.test(hash)){ location.replace('reset-password.html' + search + hash); return; }
    try{
      for(var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if(!k || !/^sb-.+-auth-token$/.test(k)) continue;
        var s = JSON.parse(localStorage.getItem(k) || 'null');
        if(s && s.access_token && s.user && s.user.id){ location.replace('bullpen-tracker.html'); return; }
      }
    }catch(e){}
    // #signup (the landing page's Join buttons) opens New account; ?sport= is kept (it preselects the sport there)
    var q = new URLSearchParams(search), sp = q.get('sport'), keep = new URLSearchParams();
    if(sp === 'baseball' || sp === 'softball') keep.set('sport', sp);
    var qs = keep.toString();
    location.replace('login.html' + (qs ? '?' + qs : '') + (hash === '#signup' ? '#new' : (/access_token|error_description|token_hash/.test(hash) ? hash : '')));
  })();
</script>
</head>
<body>
  <p><a href="login.html">Continue to Knuckleball</a></p>
</body>
</html>
