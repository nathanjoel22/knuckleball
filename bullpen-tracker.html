/* ---------- ADV RUNNERS (Joel, Oct 1) ----------
   Bottom-right box (see ggAdvEnabled for when it's live). Runner -> base he
   reached -> why: SB, or On Last Play. Recorded at once as a runner event
   (stolen_base, or 'other' for On Last Play -- the game record has no
   separate type for it, and reports don't list runner events), after the
   pitch it happened on. During a ball in play the play itself is the why:
   it sets where that runner ended up on the play (what "Fix runners" did)
   and skips the reason. Back undoes one ADV step, or the last ADV move of
   this entry. */
window.gridAdvOpen = async function(){
  const s = state.activeSession;
  if(s.gridAdv){ s.gridAdv = null; return ggSave(); }   // tap again to close
  if(!ggAdvEnabled()) return;
  s.gridAdv = { step: 'runner', runner: null, dest: null };
  return ggSave();
};
window.gridAdvRunner = async function(base){
  const a = state.activeSession.gridAdv;
  if(!a) return;
  a.runner = base; a.step = 'dest';
  return ggSave();
};
window.gridAdvDest = async function(dest){
  const s = state.activeSession, a = s.gridAdv;
  if(!a || !a.runner) return;
  if(s.fieldPlay){ s.gridAdv = null; return setFieldEnding(a.runner, dest); }
  a.dest = dest; a.step = 'reason';
  return ggSave();
};
window.gridAdvReason = async function(reason){
  const s = state.activeSession, a = s.gridAdv;
  if(!a || !a.runner || !a.dest) return;
  s.gridAdv = null;
  const deliveryBefore = s.delivery;
  s.adjustRunners = { step: 'reason', runner: a.runner, destination: a.dest };
  const count = s.events.length;
  await commitAdjustEvent(reason === 'sb' ? 'stolen_base' : 'other');
  if(s.events.length === count) return ggSave();   // refused (e.g. base taken) -- nothing recorded
  const ev = s.events[s.events.length - 1];
  ev.deliveryBefore = deliveryBefore;               // client-only, for Back
  (s.ggAdvIds = s.ggAdvIds || []).push(ev.id);
  return ggSave();
};
// Undo the last ADV move made during this entry, keeping the grid open.
function ggUndoAdvEvent(){
  const s = state.activeSession;
  const ids = s.ggAdvIds || [];
  const last = s.events[s.events.length - 1];
  const lastPitch = s.pitches[s.pitches.length - 1];
  if(!ids.length || !last || last.id !== ids[ids.length - 1]) return false;
  if(lastPitch && lastPitch.seq > last.seq) return false;
  s.events.pop(); ids.pop();
  s.inning = last.inningBefore; s.outs = last.outsBeforeCount;
  s.balls = last.ballsBefore; s.strikes = last.strikesBefore; s.atBatIndex = last.atBatIndexBefore;
  s.runners = runnersFromBitmask(last.runnersBefore);
  if(last.deliveryBefore !== undefined) s.delivery = last.deliveryBefore;
  return true;
}

// Back: one level per tap. At the first level it cancels the location tap
// (nothing was created). On the velocity step after a direct-record result,
// that pitch already exists, so Back undoes exactly it (decision A) and
// puts the same location back as pending.
window.gridBack = async function(){
  const s = state.activeSession;
  const step = gridStep();
  const fp = s.fieldPlay;
  if(step === 'adv'){
    const a = s.gridAdv;
    if(a.step === 'reason'){ a.step = 'dest'; a.dest = null; }
    else if(a.step === 'dest'){ a.step = 'runner'; a.runner = null; }
    else s.gridAdv = null;
    return ggSave();
  }
  if(ggUndoAdvEvent()) return ggSave();   // last tap was an ADV move: undo just that
  switch(step){
    case 'first': s.gameDot = null; return resetGamePendingPitch();
    case 'more': case 'foulBunt': return cancelResultMenu();
    case 'droppedThird': case 'bi': return backResultMenu('plus');
    case 'biRunnerBase': return backResultMenu('bi');
    case 'fix': fp.fixOpen = false; fp.editing = null; return ggSave();
    case 'inplay': return cancelFieldFlow();
    case 'hitType': fp.entry = null; fp.dp = false; fp.endings = {}; return ggSave();
    case 'bbType':
      if(fp.entry === 'H'){ fp.hitType = null; fp.endings = {}; }
      else { fp.entry = null; fp.dp = false; fp.endings = {}; }
      return ggSave();
    case 'position':
      if(fp.positionSeq.length && !ggMultiFielder(fp)){ fp.positionSeq = []; fp.positionsDone = false; return ggSave(); }
      fp.bbType = null; fp.positionSeq = []; fp.positionsDone = false;
      return ggSave();
    case 'velo':
    case 'ready':
      if(fp){
        if(ggMultiFielder(fp)) fp.positionsDone = false; else fp.positionSeq = [];
        return ggSave();
      } else {
        const dot = s.gameDot;
        await undoLastGameAction();
        if(dot){
          s.gamePendingPitch = { row: dot.row, col: dot.col, velo: null };
          s.gameDot = dot;
          s.panelOpen = true;
        }
        s.gameVeloIdx = null;
        return ggSave();
      }
  }
};

function ggVeloRow(step){
  if(step !== 'velo') return '';
  return `<div class="gg-velo" style="grid-row:3;grid-column:1/6;">${renderGameVeloStrip()}</div>`;

// Slide-to-select. Only a real touch/drag/wheel counts -- the strip's own
// centering on each render also fires scroll events, and those must never
// pick a speed ("nothing is selected until the charter swipes or taps").
// Selection waits for the scroll to settle (debounced, no scrollend: older
// iOS WebKit lacks it), then records the centered speed once.
function attachGameVeloSlide(){
  const strip = document.querySelector('.gg-velo .velo-strip');
  if(!strip) return;
  let userMoved = false, timer = null;
  const mark = () => { userMoved = true; };
  strip.addEventListener('touchstart', mark, { passive: true });
  strip.addEventListener('pointerdown', mark, { passive: true });
  strip.addEventListener('wheel', mark, { passive: true });
  strip.addEventListener('scroll', () => {
    if(!userMoved) return;
    clearTimeout(timer);
    timer = setTimeout(() => {
      const r = strip.getBoundingClientRect(), cx = r.left + r.width / 2;
      const cell = [...strip.querySelectorAll('.velo-cell')].find(c => { const b = c.getBoundingClientRect(); return b.left <= cx && b.right >= cx; });
      const t = gameVeloTarget();
      if(!cell || !t) return;
      const v = parseInt(cell.textContent, 10);
      if(t.obj.velo !== v) recordGameVelo(v);
    }, 160);
  }, { passive: true });
}

function renderGameFieldGrid(){
  const step = gridStep();
  // Rows 1-2 (behind the boxes): light grass. Rows 3-5: transparent cells
  // over the drawn field; each cell's 3px ring repaints the gap in the grid's
  // own color, so the field reads as one drawing seen through a grid. Cells
  // are placed explicitly so the field can share their tracks. No onclick:
  // the field never takes a tap.
  let cells = currentSport() === 'softball' ? GG_FIELD_SVG_SOFTBALL : GG_FIELD_SVG;
  for(let r = 0; r < 5; r++){
    for(let c = 0; c < 5; c++){
      cells += `<div class="zone-cell gg-cell ${r <= 1 ? 'gg-grass' : 'gg-clear'}" style="grid-row:${r + 1};grid-column:${c + 1};"></div>`;
    }
  }
  // Joel, Sept 30: the dot is REMEMBERED (gameDot, on the draft -- Back,
  // Undo and Resume use it to put the location back) but not drawn once the
  // grid has turned into the field.
  return `<div class="zone-grid gg-field" data-step="${step}">
    ${cells}
    <div class="gg-overlay">${ggScorebookBox(step)}${ggChoices(step)}${ggRow3(step)}${ggVeloRow(step)}${step === 'tiebreak' ? '' : ggBackBox()}${ggAdvBox()}</div>
  </div>`;
}
function ggCaption(step){
  if(step === 'adv'){
    const a = state.activeSession.gridAdv;
    return a.step === 'runner' ? 'Which runner moved?' : a.step === 'dest' ? 'Where did he go?' : 'Why did he move?';
  }
  if(step === 'velo') return 'Swipe or tap the speed (Reset clears it) — then Next Pitch';
  if(step === 'ready') return 'Next Pitch when you’re ready';
  if(step === 'tiebreak') return 'Extra inning — answer before the first pitch';
  const reason = (step === 'position' || step === 'velo') ? null : null;
  return reason || 'Choose what happened';
}

function renderGameSessionView(p){
  const s = state.activeSession;

  const typeChips = pitchTypesFor(p).map(t => {
    const color = colorForType(p, t);
    const selected = state.selectedType === t;
    return `<button class="type-chip${selected?' selected':''}" style="${selected ? `background:${color};border-color:${color};color:${readableTextOn(color)};` : `color:${color};border-color:${color}55;`}" onclick="selectType(${escHtml(JSON.stringify(t))})">${pitchLabel(t)}</button>`;
  }).join('');

  // G1b-r decision 10: pitches and events merged by seq -- the ONE ordered
  // log, so a no-pitch event (IBB/auto ball/auto strike/balk, or any Adjust
  // Runners event) shows up in between the pitches around it, in the order
  // it actually happened, not off in a separate list.
  const combinedLog = [
    ...pitches.map(pt => ({ seq: pt.seq, pt })),
    ...(s.events || []).filter(ev => !ev.illegalPitchBall).map(ev => ({ seq: ev.seq, ev }))   // S2: an illegal pitch's ball rides on its one log line
  ].sort((a, b) => b.seq - a.seq).slice(0, 12);
  const logRows = combinedLog.map(entry => {
    if(entry.pt){
      const pt = entry.pt;
      const color = colorForType(p, pt.type);
      const veloText = (pt.velo !== null && pt.velo !== undefined) ? `${pt.velo} mph · ` : '';

  // G1b-r3: the drop-down panel (r2/r2a) and the velocity strip below the

        <div class="field-label">Recent pitches</div>
        <div class="pitch-log">${logRows}</div>
        <button class="btn btn-primary end-session-btn" ${state.saving ? 'disabled' : ''} onclick="endSession()">${state.saving ? 'Saving…' : 'End session & save'}</button>
      </div>
    </div>`;
  }

  // G1b-r6 option B (Joel, Oct 1): iPad portrait (<=860px) keeps the
  // stacked layout exactly as before; two columns only above 860px.
  if(!isWideSession()) return `
    <div class="session-grid-layout">
      <div class="panel controls-panel">

            ? `${escHtml(p.name)} hasn't added any pitches yet. Add them in their profile to start charting.`

        <div style="display:flex;flex-wrap:wrap;gap:8px;">

        </div>
        <div style="margin:12px 0 8px;">
          <div class="field-label" style="margin-bottom:4px;">Opponent (optional)</div>
          <input class="text-input" placeholder="e.g. Eastern" maxlength="60"
            value="${escHtml(s.opponent || '')}" oninput="onGameOpponentInput(this.value)">
        </div>
        ${renderEndSessionRow()}
      </div>
    </div>`;
  return `
    <div class="session-grid-layout">
      <div class="panel controls-panel">
        <div class="game-panel-header">
          ${renderGameStatusBar()}
        </div>
        ${renderAdjustRunnersFlow()}
        <div class="wide-cols wide-game">
          <div class="wide-left">
            ${renderPerspectiveToggle()}
            <div>
              <div class="field-label" style="margin-bottom:8px;">Pitch type</div>
              <div class="chip-row pt-two">${typeChips}</div>
              ${(p.pitchTypes && p.pitchTypes.length) ? '' : `<p class="mix-prompt">${isCoach()
                ? `${escHtml(p.name)} hasn't added any pitches yet. Add them in their profile to start charting.`
                : 'Add your pitches in Profile to start charting.'}</p>
              <button class="btn btn-ghost" onclick="${isCoach() ? 'openPitcherProfile()' : "setView('profile')"}">${isCoach() ? 'Open pitcher profile' : 'Open Profile'}</button>`}

          <div class="wide-right">
            <div class="gridwrap">
              <div class="zone-wrap">
                ${gridStepNow ? renderGameFieldGrid() : renderZoneGrid(pitches, true, state.flashCell, null, chartingPerspective, currentBatterSide, 'handleGameZoneTap')}
                <div class="zone-caption">${renderWideCaption(zoneCaption)}</div>
              </div>
            </div>
          </div>
          <div class="wide-bl">${sportCfg().hasTimeToPlate ? renderTimeToPlateBtn() : ''}</div>

/* ---------- G1b-r5: PHONE SESSION LAYOUT (Joel, Oct 1) ----------
   Phones only (<= 500px, isPhoneWidth); iPad and laptop take the exact same
   code paths as before. While a session is in progress the team line, the
   player header and the tabs give way to one session header
   (‹ team · photo name #num · ⋯); the ⋯ sheet holds perspective, opponent,
   End session & save, and Discard. Then a one-line status bar, one row with
   a Set/Windup button, ⏱ and a swipeable pitch strip, the grid, the batter
   pill under it, (Live Game) Undo / New batter / New inning, (pen) a slim
   velocity strip. Live Game velocity stays in the grid (Joel, 3a); ADV stays
   in the grid and IBB / auto ball / auto strike / balk stay under + More
   (Joel, 2a). Reference: docs/game-phone-layout-reference.html,
   docs/pen-phone-layout-reference.html. */
function phoneSessionMode(p){
  return isPhoneWidth() && !!p && state.view === 'session' && !state.draftAvailable
    && !!(state.activeSession && state.activeSession.kind);
}
function renderSessionHeader(p){
  const team = state.teams.find(t => t.id === state.currentTeamId);
  const num = jerseyNumberOf(p);
  const last = String(p.name || '').trim().split(/\s+/).pop();
  return `<div class="sess-head">
    <button type="button" class="sess-back" onclick="sessionLeave()" aria-label="Back to the roster (this session is kept)">‹ <span class="sess-team">${escHtml(team ? team.name : '')}</span></button>
    <span class="sess-who">${renderHeadshot(p)}<span class="sess-name">${escHtml(last)}</span>${(num === null || num === undefined) ? '' : `<span class="sess-num">#${escHtml(String(num))}</span>`}</span>
    ${isOnline() ? '' : '<span class="sess-offline" title="Offline -- saved on this device" aria-label="Offline, saved on this device"></span>'}
    <button type="button" class="sess-more" onclick="openSessionSheet()" aria-label="Session options"><span class="dots9" aria-hidden="true">${'<i></i>'.repeat(9)}</span></button>
  </div>`;
}
// ‹ team (Joel, Oct 1): never the session sheet -- that box is only behind
// the 9 dots. The session is kept exactly as it stands (it's already the
// on-device draft; written once more here to be sure), the roster list opens,
// and this pitcher's page shows "Unfinished session found -- Resume" (the
// same prompt picking him again from the roster gives). Nothing recorded yet:
// there's no draft to offer, so it lands on Bullpen / Live Game as before.
window.sessionLeave = async function(){
  const s = state.activeSession;
  if(s && s.kind) await storSet(draftKey(), s);
  ttpReset();
  state.pendingTarget = null; state.veloTargetIdx = null; state.hint = '';
  state.sessionSheetOpen = false; state.sessionDiscardArmed = false;
  await refreshDraftState();
  state.rosterCollapsed = false;
  render();
  try{ window.scrollTo(0, 0); }catch(e){}
};
window.openSessionSheet = function(){ state.sessionSheetOpen = true; state.sessionDiscardArmed = false; render(); };
window.closeSessionSheet = function(){ state.sessionSheetOpen = false; state.sessionDiscardArmed = false; render(); };
window.armDiscardSession = function(){ state.sessionDiscardArmed = true; render(); };
window.discardActiveSession = async function(){
  ttpReset();
  await storDelete(draftKey());
  state.activeSession = await freshActiveSession();
  state.pendingTarget = null; state.veloTargetIdx = null; state.hint = '';
  state.sessionSheetOpen = false; state.sessionDiscardArmed = false;
  await refreshDraftState();
  render();
};
// Joel, Oct 1: iPad and laptop get Discard beside End session & save (the
// phone has it in the 9-dot sheet). Same two-step confirm and the same
// discardActiveSession as the phone.
function renderEndSessionRow(){
  const s = state.activeSession, game = s.kind === 'game', n = s.pitches.length;
  const what = `${n} pitch${n === 1 ? '' : 'es'}`;
  if(state.sessionDiscardArmed) return `<div>
      <p class="delete-warn">Discard this ${game ? 'game' : 'pen'}? ${n ? `The ${what} charted so far are deleted from this device.` : ''} This can't be undone.</p>
      <div class="delete-row">
        <button class="btn btn-primary" style="background:var(--red-bg);color:var(--chalk);" onclick="discardActiveSession()">Discard</button>
        <button class="btn btn-ghost" onclick="closeSessionSheet()">Keep charting</button>
      </div>
    </div>`;
  return `<div class="delete-row">
      <button class="btn btn-primary end-session-btn" ${state.saving ? 'disabled' : ''} onclick="endSession()">${state.saving ? 'Saving…' : 'End session & save'}</button>
      <button class="btn btn-ghost" ${state.saving ? 'disabled' : ''} onclick="armDiscardSession()">Discard session</button>
    </div>`;
}
function renderSessionSheet(){
  if(!state.sessionSheetOpen || !state.activeSession || !state.activeSession.kind) return '';
  const s = state.activeSession, game = s.kind === 'game', n = s.pitches.length;
  const what = `${n} pitch${n === 1 ? '' : 'es'}`;
  return `<div class="modal-overlay sheet-overlay" onclick="if(event.target===this) closeSessionSheet();">
    <div class="sess-sheet" role="dialog" aria-label="Session options">
      <div class="sess-sheet-title">${game ? 'Live Game' : 'Bullpen'} · ${what}</div>
      ${renderPerspectiveToggle(true)}
      ${game ? `<div><div class="field-label" style="margin-bottom:4px;">Opponent (optional)</div>
        <input class="text-input" placeholder="e.g. Eastern" maxlength="60" value="${escHtml(s.opponent || '')}" oninput="onGameOpponentInput(this.value)"></div>` : ''}
      <button class="btn btn-primary end-session-btn" ${state.saving ? 'disabled' : ''} onclick="closeSessionSheet();endSession()">${state.saving ? 'Saving…' : 'End session & save'}</button>
      ${state.sessionDiscardArmed ? `
        <p class="delete-warn">Discard this ${game ? 'game' : 'pen'}? ${n ? `The ${what} charted so far are deleted from this device.` : ''} This can't be undone.</p>
        <div class="delete-row">
          <button class="btn btn-primary" style="background:var(--red-bg);color:var(--chalk);" onclick="discardActiveSession()">Discard</button>
          <button class="btn btn-ghost" onclick="closeSessionSheet()">Keep charting</button>
        </div>` : `<button class="btn btn-ghost" onclick="armDiscardSession()">Discard</button>`}
      <button class="btn btn-ghost" onclick="closeSessionSheet()">Close</button>
    </div>
  </div>`;
}
// Set / Windup as ONE button that flips (same auto-set rules as before).
function renderDeliveryOne(){
  const set = state.activeSession.delivery === 'set';
  return `<button type="button" class="deliv-one${set ? ' on' : ''}" onclick="setGameDelivery('${set ? 'windup' : 'set'}')">${set ? 'Set' : 'Windup'}</button>`;
}
// The pitch types as a strip like the velocity bar: five across at 390px,
// four below that; swipe, or ‹ › one chip; arrows grey at the ends.
function renderPitchStrip(p){
  const chips = pitchTypesFor(p).map(t => {
    const color = colorForType(p, t);
    const sel = state.selectedType === t;
    // Joel, Oct 1: each pitch keeps its own color; selected = filled with it.
    return `<button type="button" class="pstrip-chip${sel ? ' selected' : ''}" style="${sel ? `background:${color};border-color:${color};color:${readableTextOn(color)};` : `color:${color};border-color:${color}77;`}" onclick="selectType(${escHtml(JSON.stringify(t))})">${pitchLabel(t)}</button>`;
  }).join('');
  return `<div class="pstrip-wrap">
    <button type="button" class="pstrip-arrow" id="pstrip-prev" onclick="pitchStripStep(-1)" aria-label="Earlier pitch types">‹</button>
    <div class="pstrip" id="pitch-strip">${chips}</div>
    <button type="button" class="pstrip-arrow" id="pstrip-next" onclick="pitchStripStep(1)" aria-label="More pitch types">›</button>
  </div>`;
}
window.pitchStripStep = function(dir){
  const st = document.getElementById('pitch-strip');
  if(!st) return;
  const chip = st.querySelector('.pstrip-chip');
  st.scrollBy({ left: dir * (chip ? chip.getBoundingClientRect().width + 4 : st.clientWidth / 5), behavior: 'smooth' });
  setTimeout(updatePitchStripArrows, 400);   // after the smooth scroll, even if no scroll event arrives
};
// Grey ‹ at the start and › at the end; remember where the strip is.
function updatePitchStripArrows(){
  const st = document.getElementById('pitch-strip');
  if(!st) return;
  const prev = document.getElementById('pstrip-prev'), next = document.getElementById('pstrip-next');
  state.pitchStripScroll = st.scrollLeft;
  if(prev) prev.disabled = st.scrollLeft <= 1;
  if(next) next.disabled = st.scrollLeft + st.clientWidth >= st.scrollWidth - 1;
}
// After each render: keep the strip where it was (or bring the selected
// chip into view the first time), and grey the arrows at the ends.
// WIDE-SIZE-START
/* G1b-r6 (Joel, Oct 1): iPad and laptop session layout, pen and Live Game.
   Above 860px only (iPad landscape, laptops; Joel chose option B -- iPad
   portrait stays stacked). Two columns under the status bar: perspective / pitch type / delivery
   (pen: + batter, pitch count) on the left, the grid on the right with what
   was under it still under it. The grid is a square sized to the screen:
   as big as the right column allows -- leaving room for the batter
   silhouette on both sides, so the grid never moves when the batter flips --
   but never so tall its bottom (plus caption and 24px) leaves the viewport,
   and never over 560px. Joel, Oct 1 (r6b/r6c): the batter is 80% of the
   grid's height (was 112%) so the grid gets the width; it no longer rises
   above the grid. Live Game: pitch types two to a row, a narrower left
   column, and a bottom row -- Time under the left column, Undo / New batter
   / New inning centered under the grid -- counted in the height budget.
   If the column is too narrow for 44px cells with the full-size silhouette,
   the grid keeps 44px cells and the silhouette shrinks to fit. Phones never
   get .wide-right (their own layout, G1b-r5). Display only. */
// Joel, Oct 1 (r6c): no hint line under the left column on iPad/laptop --
// a hint ("Select a pitch type first", etc.) takes the grid caption's line
// instead, so a tap that does nothing still says why.
function renderWideCaption(caption){
  return state.hint ? `<span class="wide-hint">${escHtml(state.hint)}</span>` : caption;

// Rotating an iPad crosses 860px without any tap: re-render so the session
// switches between the stacked and two-column markup.
let lastWideSession = window.matchMedia('(min-width:861px)').matches;
function onWideResize(){
  const wide = isWideSession();
  if(lastWideSession !== null && wide !== lastWideSession && state.view === 'session' && state.activeSession && state.activeSession.kind) render();
  else sizeWideGrid();
  lastWideSession = wide;
}
function sizeWideGrid(){
  const right = document.querySelector('.wide-right');
  if(!right || !isWideSession()) return;
  const wrap = right.querySelector('.zone-wrap');
  if(!wrap) return;
  const A = 167 / 504, H0 = 0.8, MIN = 238, CAP = 560;    // MIN = 5 x 44px cells + gaps; H0 = batter height / grid
  const colW = wrap.clientWidth;
  const cap = wrap.querySelector('.zone-caption');
  const capH = cap ? cap.offsetHeight + 10 : 0;            // + .zone-wrap's gap
  const top = right.getBoundingClientRect().top + (window.pageYOffset || 0);
  const cols = right.closest('.wide-cols');
  const roomAll = window.innerHeight - top - capH - 24;
  // Joel, Oct 2: Undo / New batter / New inning always sit side by side,
  // centered under the grid. Their row isn't counted in the height budget:
  // in a short window (Safari's toolbars) the grid keeps its full size and
  // the row sits just below the fold, a short scroll away.
  const below = 0;
  const room = roomAll - below;
  let h = H0;
  let side = Math.min(CAP, (colW - 12) / (1 + 2 * A * H0), room / Math.max(1, H0));
  if(side < MIN){
    side = MIN;
    h = Math.max(0.6, Math.min(H0, ((colW - side) / 2 - 6) / (A * side)));
  }
  side = Math.floor(side);
  right.style.setProperty('--zg', side + 'px');
  right.style.setProperty('--kbh', (h * 100).toFixed(1) + '%');
  right.style.setProperty('--kbo', Math.max(0, Math.ceil((h - 1) * side)) + 'px');
}

  const p = currentPitcher();
  if(!p){ return `<div class="empty-hist">No pitcher selected.</div>`; }
  const tombstones = state.deletedSessions.map(s => ({ ...s, tombstone: true }));
  let combined = pendingSessionsForCurrentSelection()
    .concat(state.sessions).concat(tombstones)
    .sort((a,b) => b.date - a.date);
  // G1: a tombstone (deleted session) never carried a `kind` before this
  // shipped either, and its own record doesn't need one to render (no
  // stats are computed for it) -- only filter the ones that declare one.
  if(state.historyFilter !== 'all'){
    combined = combined.filter(s => (s.kind || 'bullpen') === state.historyFilter);
  }
  if(!combined.length){
    return `${renderHistoryFilter()}<div class="empty-hist">No saved sessions yet for ${escHtml(p.name)}${isCoach() ? '' : ' — finish a bullpen session to see it here'}.</div>`;
  }
  // P1-15 (d): a tombstone older than 90 days collapses into one summary
  // line at the bottom of History rather than sitting in the normal
  // chronological list forever. Rows stay in the DB either way -- this is
  // purely a rendering choice, computed fresh on every render() so it
  // needs no state beyond the one expand/collapse toggle.
  const OLD_TOMBSTONE_MS = 90 * 24 * 60 * 60 * 1000;
  const now = Date.now();
  const isOldTombstone = s => s.tombstone && s.deletedAt && (now - s.deletedAt) > OLD_TOMBSTONE_MS;
  const oldTombstoneCount = combined.filter(isOldTombstone).length;
  const visible = state.oldTombstonesExpanded ? combined : combined.filter(s => !isOldTombstone(s));
  const oldSummaryHtml = oldTombstoneCount ? `
    <div class="deleted-summary-row">
      <button class="undo-btn" onclick="toggleOldTombstones()">${state.oldTombstonesExpanded ? 'Hide' : ''} ${oldTombstoneCount} deleted session${oldTombstoneCount === 1 ? '' : 's'}</button>
    </div>` : '';
  return renderHistoryFilter() + visible.map(s => {
    // G1/G2: a game session gets its own, much simpler card -- innings,
    // pitches, K/BB/H, strike% (gameStats -- the same function the live
    // charting screen uses; History's OWN display, unlike the report,
    // still reads this rather than compute_game_summary -- a pre-existing
    // gap, not introduced by G2). Never sessionStats: that computes target-
    // vs-actual accuracy, which has no meaning for a session with no
    // targets. G2 approach (g): Send/View report now work exactly like a
    // bullpen's (same gate, same messages, same recipients cap -- decision
    // 10 -- the renderer doesn't know about kinds when gating), reusing the
    // identical eligibility logic verbatim rather than a second copy.
    if(!s.tombstone && (s.kind || 'bullpen') === 'game'){
      const dateStr = new Date(s.date).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
      const oppLabel = s.opponent ? `vs ${escHtml(s.opponent)} · ${dateStr}` : `Game · ${dateStr}`;
      const stats = gameStats(s.pitches);
      const expanded = state.expandedSessionId === s.id;
      const pendingTag = s.pending ? ` <span class="coach-logged-tag pending-tag">Pending sync${s.lastError ? ' · retrying' : ''}</span>` : '';

      const contacts = p.contactEmails || {};
      const pVerified = currentPitcherVerified(p);
      const pOnTeam = currentPitcherOnTeam(p);
      const callerVerified = currentCallerVerified();
      const pConsent = currentPitcherConsent(p);   /* P1-10 */ const pEligible = pVerified && pOnTeam && callerVerified && pConsent;
      const emailList = pEligible
        ? [contacts.coach, contacts.pitchingCoach, contacts.pitcher].map(e => (e||'').trim()).filter(Boolean)
        : [];
      const rs = state.reportStatus && state.reportStatus.sessionId === s.id ? state.reportStatus : null;
      const viewControl = s.reportPath
        ? `<a class="btn btn-ghost" href="report.html?r=${encodeURIComponent(s.reportPath)}" target="_blank" rel="noopener">View report</a>`
        : (pEligible ? `<button class="btn btn-ghost" onclick="viewSessionReport('${s.id}')">View report</button>` : '');
      const reportPanel = s.pending ? `
        <div class="report-panel">
          <div class="field-label">Email this report</div>
          <p class="report-recipients">Available once this session has synced.</p>
          <button class="btn btn-primary" disabled>Send report</button>
        </div>` : `
        <div class="report-panel">
          <div class="field-label">Email this report</div>
          ${!pEligible
            ? `<p class="report-recipients" style="color:var(--clay);">${!pVerified
                ? `No report can be sent until ${escHtml(p.name)} verifies their email.`
                : !pConsent ? consentBlockMessage(p)
                : !pOnTeam
                  ? `No report can be sent until ${escHtml(p.name)} is on a team.`
                  : `No report can be sent until you verify your own account email.`}</p>`
            : emailList.length
              ? `<p class="report-recipients">To: ${escHtml(emailList.join(', '))}</p>`
              : `<p class="report-recipients">No contact emails set for ${escHtml(p.name)} yet${isCoach() ? '' : ' — add them under Contacts above'}.</p>`}
          <div class="report-actions">
            <button class="btn btn-primary" ${emailList.length ? '' : 'disabled'} onclick="sendSessionReport('${s.id}')">Send report</button>
            ${viewControl}
          </div>
          ${rs ? `<p class="report-status report-status-${rs.status}">${rs.message}</p>` : ''}
        </div>`;

      const deleteZone = (s.pending || !canDeleteSessions()) ? '' : (!isOnline() ? `
        <div class="delete-zone"><button class="undo-btn" disabled title="Deleting requires a connection">Connect to delete</button></div>` : (state.deletingSessionId === s.id ? `
        <div class="delete-zone">
          <p class="delete-warn">This permanently removes the ${stats.total} pitch${stats.total === 1 ? '' : 'es'} from the ${dateStr} session. A "deleted" marker stays in history. This can't be undone.</p>
          ${state.deleteError ? `<p class="report-status report-status-error" style="margin:0 0 8px;">${state.deleteError}</p>` : ''}
          <div class="delete-row">
            <input id="delete-confirm-input" class="text-input" style="max-width:150px;" placeholder="Type DELETE"
              value="${String(state.deleteConfirmText).replace(/"/g,'&quot;')}" oninput="onDeleteConfirmInput(this.value)">
            <button class="btn btn-primary" style="background:var(--red-bg);color:var(--chalk);" ${state.deleteBusy ? 'disabled' : ''} onclick="confirmDeleteSession()">${state.deleteBusy ? 'Deleting…' : 'Delete session'}</button>
            <button class="btn btn-ghost" ${state.deleteBusy ? 'disabled' : ''} onclick="cancelDeleteSession()">Cancel</button>
          </div>
        </div>` : `
        <div class="delete-zone"><button class="undo-btn" onclick="startDeleteSession('${s.id}')">Delete this session</button></div>`));
      return `
        <div class="session-card">
          <div class="session-card-head" onclick="toggleSessionExpand('${s.id}')">
            <div class="session-date">${isNewHistoryRow(s) ? '<span class="session-dot" aria-label="New"></span>' : ''}${oppLabel} <span class="coach-logged-tag">Live Game</span>${s.loggedByCoach ? ' <span class="coach-logged-tag logged-by-tag">Logged by coach</span>' : ''}${pendingTag}</div>
            <div class="session-meta">
              <div class="meta-item"><span class="meta-num mono">${stats.innings}</span><span class="meta-lbl">Innings</span></div>
              <div class="meta-item"><span class="meta-num mono">${stats.total}</span><span class="meta-lbl">Pitches</span></div>
              <div class="meta-item"><span class="meta-num mono">${stats.k}</span><span class="meta-lbl">K</span></div>
              <div class="meta-item"><span class="meta-num mono">${stats.bb}</span><span class="meta-lbl">BB</span></div>
              <div class="meta-item"><span class="meta-num mono">${stats.h}</span><span class="meta-lbl">H</span></div>
              <div class="meta-item"><span class="meta-num mono">${stats.strikePct}%</span><span class="meta-lbl">Strikes</span></div>
              ${avgTimeToPlateMeta(s.pitches)}
            </div>
          </div>
          ${expanded ? `
          <div class="session-card-body">
            <div style="flex:1;min-width:220px;">
              ${renderSessionNotes(s)}${reportPanel}
              ${deleteZone}
            </div>
          </div>` : ''}
        </div>`;
    }
    const dateStr = new Date(s.date).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });

    // P1-15: a deleted session is a tombstone -- not expandable, no stats,
    // no report. It only records that an outing happened and was removed.
    if(s.tombstone){
      const viewerId = null;   // S4: compared via isMine() below
      // deleted_by_name is a snapshot taken at delete time (P1-15) --
      // needed because sessions has no FK to profiles to embed through
      // (deleted_by, like pitcher_id and logged_by, points at auth.users),
      // and a pitcher has no RLS grant to read a coach's profile row
      // directly. The pitcher-deleted branch doesn't need the snapshot --
      // p.name (the pitcher currently being viewed) is already right there.
      let by;
      if(s.deletedBy && isMine(s.deletedBy)){
        by = 'Deleted by you';
      } else if(s.deletedByRole === 'coach'){
        by = 'Deleted by ' + (s.deletedByName ? escHtml(s.deletedByName) : 'the coach') + ' (head coach)';
      } else {
        by = 'Deleted by ' + escHtml(p.name);
      }
      const kindLabel = (s.kind || 'bullpen') === 'game' ? 'Game' : 'Bullpen';
      const delDate = s.deletedAt ? new Date(s.deletedAt).toLocaleDateString(undefined, { month:'short', day:'numeric' }) : '';
      return `
        <div class="session-card session-card-deleted">
          <div class="session-card-head" style="cursor:default;">
            <div class="session-date">${dateStr} <span class="deleted-tag">Deleted</span></div>
            <div class="deleted-meta">${kindLabel} · ${s.pitchCount != null ? s.pitchCount : '—'} pitch${s.pitchCount === 1 ? '' : 'es'} · ${by}${delDate ? ' · ' + delDate : ''}</div>
          </div>
        </div>`;
    }

    const stats = sessionStats(s.pitches);
    const expanded = state.expandedSessionId === s.id;
    const typeRows = Object.entries(stats.byType).map(([type, t]) => {
      const color = colorForType(p, type);
      return `<tr><td><span class="plr-dot" style="background:${color}"></span>${escHtml(type)}</td><td class="mono">${t.count}</td><td class="mono">${t.hasVelo ? t.avgVelo+' mph' : '—'}</td><td class="mono">${t.hasVelo ? t.minVelo+'–'+t.maxVelo : '—'}</td><td class="mono">${t.strikePct}%</td><td class="mono">${t.accuracyPct}%</td><td class="mono">${stats.hasZone ? (t.hasZone ? t.zoneAccuracyPct + '% (' + t.zoneTotal + ')' : '—') : t.relativeAccuracyPct + '%'}</td></tr>`;
    }).join('');

    const contacts = p.contactEmails || {};
    // R0 item (g), revised after check 8 on staging, extended U4b Phase 2:
    // the block is on the WHOLE send, not just the pitcher's own address --
    // a report for an ineligible pitcher's session doesn't go to a coach or
    // pitching-coach address either, since the data's provenance isn't
    // trustworthy until the identity behind it is verified, AND (new) this
    // is a deliberate temporary restriction to team-affiliated pitchers
    // only, until solo accounts are supported. This is the UI half only;
    // the real enforcement is server-side in send-session-report, gated on
    // is_pitcher_report_eligible (a client can't bypass it by
    // hand-crafting a payload -- see that function).
    const pVerified = currentPitcherVerified(p);
    const pOnTeam = currentPitcherOnTeam(p);
    const callerVerified = currentCallerVerified();
    const pConsent = currentPitcherConsent(p);   /* P1-10 */ const pEligible = pVerified && pOnTeam && callerVerified && pConsent;
    const emailList = pEligible
      ? [contacts.coach, contacts.pitchingCoach, contacts.pitcher].map(e => (e||'').trim()).filter(Boolean)
      : [];
    const rs = state.reportStatus && state.reportStatus.sessionId === s.id ? state.reportStatus : null;
    // U4b follow-up: viewing doesn't need any contact emails set (only
    // sending does) -- once a report exists it's a plain link; before that,
    // it's a button that generates one (gated on the same eligibility as
    // sending, since generating is the same server call either way).
    const viewControl = s.reportPath
      ? `<a class="btn btn-ghost" href="report.html?r=${encodeURIComponent(s.reportPath)}" target="_blank" rel="noopener">View report</a>`
      : (pEligible ? `<button class="btn btn-ghost" onclick="viewSessionReport('${s.id}')">View report</button>` : '');
    const reportPanel = s.pending ? `
      <div class="report-panel">
        <div class="field-label">Email this report</div>
        <p class="report-recipients">Available once this session has synced.</p>
        <button class="btn btn-primary" disabled>Send report</button>
      </div>` : `
      <div class="report-panel">
        <div class="field-label">Email this report</div>
        ${!pEligible
          ? `<p class="report-recipients" style="color:var(--clay);">${!pVerified
              ? `No report can be sent until ${escHtml(p.name)} verifies their email.`
              : !pConsent ? consentBlockMessage(p)
              : !pOnTeam
                ? `No report can be sent until ${escHtml(p.name)} is on a team.`
                : `No report can be sent until you verify your own account email.`}</p>`
          : emailList.length
            ? `<p class="report-recipients">To: ${escHtml(emailList.join(', '))}</p>`
            : `<p class="report-recipients">No contact emails set for ${escHtml(p.name)} yet${isCoach() ? '' : ' — add them under Contacts above'}.</p>`}
        <div class="report-actions">
          <button class="btn btn-primary" ${emailList.length ? '' : 'disabled'} onclick="sendSessionReport('${s.id}')">Send report</button>
          ${viewControl}
        </div>
        ${rs ? `<p class="report-status report-status-${rs.status}">${rs.message}</p>` : ''}
      </div>`;

    const pendingTag = s.pending
      ? ` <span class="coach-logged-tag pending-tag">Pending sync${s.lastError ? ' · retrying' : ''}</span>`
      : '';

    // P1-15: delete a saved (synced) session. Pending sessions are left to
    // P1-01. No pitch editing anywhere -- delete is the only post-save action.
    const deleteZone = (s.pending || !canDeleteSessions()) ? '' : (!isOnline() ? `
      <div class="delete-zone"><button class="undo-btn" disabled title="Deleting requires a connection">Connect to delete</button></div>` : (state.deletingSessionId === s.id ? `
      <div class="delete-zone">
        <p class="delete-warn">This permanently removes the ${stats.total} pitch${stats.total === 1 ? '' : 'es'} from the ${dateStr} session. A "deleted" marker stays in history. This can't be undone.</p>
        ${state.deleteError ? `<p class="report-status report-status-error" style="margin:0 0 8px;">${state.deleteError}</p>` : ''}
        <div class="delete-row">
          <input id="delete-confirm-input" class="text-input" style="max-width:150px;" placeholder="Type DELETE"
            value="${String(state.deleteConfirmText).replace(/"/g,'&quot;')}" oninput="onDeleteConfirmInput(this.value)">
          <button class="btn btn-primary" style="background:var(--red-bg);color:var(--chalk);" ${state.deleteBusy ? 'disabled' : ''} onclick="confirmDeleteSession()">${state.deleteBusy ? 'Deleting…' : 'Delete session'}</button>
          <button class="btn btn-ghost" ${state.deleteBusy ? 'disabled' : ''} onclick="cancelDeleteSession()">Cancel</button>
        </div>
      </div>` : `
      <div class="delete-zone"><button class="undo-btn" onclick="startDeleteSession('${s.id}')">Delete this session</button></div>`));

    return `
      <div class="session-card">
        <div class="session-card-head" onclick="toggleSessionExpand('${s.id}')">
          <div class="session-date">${isNewHistoryRow(s) ? '<span class="session-dot" aria-label="New"></span>' : ''}${dateStr}${s.loggedByCoach ? ' <span class="coach-logged-tag logged-by-tag">Logged by coach</span>' : ''}${pendingTag}</div>
          <div class="session-meta">
            <div class="meta-item"><span class="meta-num mono">${stats.total}</span><span class="meta-lbl">Pitches</span></div>
            <div class="meta-item"><span class="meta-num mono">${stats.strikePct}%</span><span class="meta-lbl">Strikes</span></div>
            ${stats.hasZone
              ? `<div class="meta-item"><span class="meta-num mono">${stats.zoneAccuracyPct}%</span><span class="meta-lbl">Relative Acc. (${stats.zoneTotal})</span></div>
                 <div class="meta-item"><span class="meta-num mono">${stats.accuracyPct}%</span><span class="meta-lbl">Exact hit</span></div>`
              : `<div class="meta-item"><span class="meta-num mono">${stats.accuracyPct}%</span><span class="meta-lbl">Accuracy</span></div>`}
            <div class="meta-item"><span class="meta-num mono">${stats.hasVelo ? stats.avgVelo : '—'}</span><span class="meta-lbl">Avg mph</span></div>
            ${avgTimeToPlateMeta(s.pitches)}
          </div>
        </div>
        ${expanded ? `
        <div class="session-card-body">
          <div class="zone-wrap">${renderZoneGrid(s.pitches, false)}<div class="zone-caption">Location heat map · Catcher's view${sportCfg().zoneNote ? ' · ' + sportCfg().zoneNote : ''}</div></div>
          <div style="flex:1;min-width:220px;">
            <table class="breakdown-table">
              <thead><tr><th>Type</th><th>Count</th><th>Avg</th><th>Range</th><th>Strike%</th><th>Accuracy%</th><th>Relative Acc%</th></tr></thead>
              <tbody>${typeRows}</tbody>
            </table>
            ${renderSessionNotes(s)}${reportPanel}
            ${deleteZone}
          </div>
        </div>` : ''}
      </div>`;
  }).join('') + oldSummaryHtml;
}
window.toggleOldTombstones = function(){
  state.oldTombstonesExpanded = !state.oldTombstonesExpanded;
  render();
};

/* ---------- ACCURACY ZONE PAINTER (Profile) ---------- */
window.setRelativeAccuracy = async function(on){
  const p = currentPitcher();
  if(!p) return;
  let ok = false;
  if(isCoach()){
    const { error } = await supabaseClient.rpc('coach_set_relative_accuracy', { p_pitcher_id: p.id, p_enabled: !!on });
    ok = !error;
    if(ok) p.relativeAccuracy = !!on;
  } else {
    const { error } = await supabaseClient.from('profiles').update({ relative_accuracy_enabled: !!on }).eq('id', state.profile.id);
    ok = !error;
    if(ok) state.profile.relative_accuracy_enabled = !!on;
  }
  state.profileMsg = ok ? '' : 'Could not save. Check your connection and try again.';
  if(!on) state.zonePaint = null;
  if(ok) await saveLastKnownContext();
  render();
};
window.openZonePaint = function(type){
  const p = currentPitcher();
  if(!p) return;
  state.zonePaint = { pitcherId: p.id, type, side: 'R', cells: (zoneCellsFor(p.id, type, 'R') || []).slice() };
  state.zoneMsg = '';
  render();
};
window.zonePaintSide = function(side){
  const zp = state.zonePaint;
  if(!zp || zp.side === side) return;
  zp.side = side;
  zp.cells = (zoneCellsFor(zp.pitcherId, zp.type, side) || []).slice();
  state.zoneMsg = '';
  render();
};
window.zonePaintFlipSide = function(){
  const zp = state.zonePaint;
  if(zp) window.zonePaintSide(zp.side === 'R' ? 'L' : 'R');
};
window.paintZoneCell = function(row, col){
  const zp = state.zonePaint;
  if(!zp) return;
  const k = row + '-' + col;
  const i = zp.cells.indexOf(k);
  if(i >= 0) zp.cells.splice(i, 1); else zp.cells.push(k);
  render();
};
window.cancelZonePaint = function(){ state.zonePaint = null; state.zoneMsg = ''; render(); };
function setLocalZone(pitcherId, type, side, cells){
  const byType = (state.zones[pitcherId] = state.zones[pitcherId] || {});
  const bySide = (byType[type] = byType[type] || {});
  if(cells) bySide[side] = cells; else delete bySide[side];
}
window.saveZonePaint = async function(){
  const zp = state.zonePaint;
  if(!zp) return;
  if(!zp.cells.length){ state.zoneMsg = 'Tap at least one cell, or use Clear to remove this zone.'; render(); return; }
  const { error } = await supabaseClient.from('accuracy_zones').upsert(
    { pitcher_id: zp.pitcherId, pitch_type: zp.type, batter_side: zp.side, cells: zp.cells },
    { onConflict: 'pitcher_id,pitch_type,batter_side' });
  if(error){ state.zoneMsg = 'Could not save. Check your connection and try again.'; render(); return; }
  setLocalZone(zp.pitcherId, zp.type, zp.side, zp.cells.slice());
  state.zoneMsg = 'Saved.';
  await saveLastKnownContext();   // charting reads zones offline from this snapshot
  render();
};
window.clearZonePaint = async function(){
  const zp = state.zonePaint;
  if(!zp) return;
  const { error } = await supabaseClient.from('accuracy_zones').delete()
    .eq('pitcher_id', zp.pitcherId).eq('pitch_type', zp.type).eq('batter_side', zp.side);
  if(error){ state.zoneMsg = 'Could not clear. Check your connection and try again.'; render(); return; }
  setLocalZone(zp.pitcherId, zp.type, zp.side, null);
  zp.cells = [];
  state.zoneMsg = 'Cleared.';
  await saveLastKnownContext();
  render();
};
function renderZonePainter(){
  const zp = state.zonePaint;
  let cells = '';
  for(let row = 0; row < GRID_SIZE; row++){
    for(let col = 0; col < GRID_SIZE; col++){
      const num = zoneNumberFor(row, col, zp.side);
      const painted = zp.cells.indexOf(row + '-' + col) >= 0;
      const cls = 'zone-cell' + (isStrikeCell(row, col) ? ' in-zone' : '') + ' clickable' + (painted ? ' zone-painted' : '');
      cells += `<div class="${cls}" onclick="paintZoneCell(${row},${col})">${num !== null ? `<span class="zone-number">${num}</span>` : ''}</div>`;
    }
  }
  // Catcher's view: a RHB stands on the LEFT, a LHB on the right (D8).
  const onLeft = insideColumnOnScreenLeft('behind_catcher', zp.side);
  const grid = `<div class="zone-grid">${cells}${renderHomePlate('behind_catcher')}${renderBatterSilhouette(zp.side, onLeft, 'zonePaintFlipSide()')}</div>`;
  const saved = zoneCellsFor(zp.pitcherId, zp.type, zp.side);
  return `<div class="zone-paint">
    <div class="profile-row">
      <button class="throws-btn${zp.side === 'R' ? ' selected' : ''}" onclick="zonePaintSide('R')">vs RHB</button>
      <button class="throws-btn${zp.side === 'L' ? ' selected' : ''}" onclick="zonePaintSide('L')">vs LHB</button>
    </div>
    <div class="zone-wrap">${grid}<div class="zone-caption">Catcher's view · tap the cells that count as accurate</div></div>
    <div class="profile-row">
      <button class="btn btn-primary" onclick="saveZonePaint()">Save zone</button>
      <button class="btn btn-ghost" onclick="clearZonePaint()" ${saved ? '' : 'disabled'}>Clear</button>
      <button class="btn btn-ghost" onclick="cancelZonePaint()">Close</button>
    </div>
    ${state.zoneMsg ? `<p class="profile-note">${state.zoneMsg}</p>` : ''}
  </div>`;
}
function renderRelAccuracySection(p){
  const on = !!p.relativeAccuracy;
  let zones = '';
  if(on){
    zones = (p.pitchTypes || []).map(t => {
      const r = zoneCellsFor(p.id, t, 'R'), l = zoneCellsFor(p.id, t, 'L');
      const stat = (label, c) => `${label}: ${c ? c.length + ' cell' + (c.length === 1 ? '' : 's') : 'Not set (exact accuracy will be used)'}`;
      const open = state.zonePaint && state.zonePaint.pitcherId === p.id && state.zonePaint.type === t;
      return `<div class="zone-row">
        <div class="profile-row"><strong>${pitchLabel(t)}</strong>
          <button class="btn btn-ghost" onclick="${open ? 'cancelZonePaint()' : `openZonePaint(${escHtml(JSON.stringify(t))})`}">${open ? 'Close' : 'Edit zones'}</button></div>
        <p class="profile-note">${stat('vs RHB', r)} · ${stat('vs LHB', l)}</p>
        ${open ? renderZonePainter() : ''}
      </div>`;
    }).join('') || '<p class="profile-note">Add pitches to your pitch mix first, then paint their zones.</p>';
  }
  return `<div class="profile-section"><h3>Relative accuracy</h3>
    <label class="profile-row" style="gap:10px;font-size:14px;">
      <input type="checkbox" ${on ? 'checked' : ''} onchange="setRelativeAccuracy(this.checked)"> ${on ? 'On' : 'Off'}
    </label>
    <p class="profile-note">Off: a pitch is accurate only if it lands on the exact target cell. On: paint the zone that counts for each pitch, separately against right- and left-handed hitters.</p>
    ${zones}
  </div>`;
}

/* ---------- LEADERBOARD (U8) ----------
   One server call, get_team_leaderboard(team, window), returns per-pitcher aggregates only
   (the function checks membership; nothing here widens what a pitcher can read). The last
   board loaded is cached on-device per team and window, so offline it still shows, labelled
   "as of". None of this ever runs on the charting path. */
const LB_WINDOWS = [['week', 'Week'], ['month', 'Month'], ['all', 'All-time']];
const LB_CATS = [['velocity', 'Velocity'], ['accuracy', 'Accuracy'], ['strike', 'Strike %']];
function hasLeaderboard(){ return state.teams.length > 0 && sportCfg().hasLeaderboard; }   // cached membership: works offline; never for softball (S1)
function escHtml(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function lbUserKey(){ return state.session ? state.session.user.id : ''; }
function lbCacheKey(teamId, win){ return 'lb:' + lbUserKey() + ':' + teamId + ':' + win; }
async function lbActiveTeamId(){
  const ids = state.teams.map(t => t.id);
  if(state.lbTeamId && ids.includes(state.lbTeamId)) return state.lbTeamId;
  let remembered = null;
  try{ remembered = await storGet('lbTeam:' + lbUserKey()); }catch(e){}
  if(remembered && ids.includes(remembered)) return remembered;

}
async function loadLeaderboard(){
  if(!hasLeaderboard() || !state.session) return;
  const teamId = await lbActiveTeamId();
  if(!teamId) return;
  state.lbTeamId = teamId;
  const win = state.lbWindow;
  let cached = null;
  try{ cached = await storGet(lbCacheKey(teamId, win)); }catch(e){}
  state.lb = { teamId, win, data: cached ? cached.data : null, fetchedAt: cached ? cached.fetchedAt : null, status: isOnline() ? 'loading' : 'offline', error: '' };
  render();
  if(!isOnline()) return;                       // offline: show the cached board, "as of"
  const fresh = (extra) => Object.assign({}, state.lb, extra);
  const still = () => state.lb && state.lb.teamId === teamId && state.lb.win === win;
  try{
    const { data, error } = await supabaseClient.rpc('get_team_leaderboard', { p_team_id: teamId, p_window: win });
    if(error) throw error;
    const rec = { data, fetchedAt: Date.now() };
    await storSet(lbCacheKey(teamId, win), rec);
    if(still()){ state.lb = fresh({ data, fetchedAt: rec.fetchedAt, status: 'ok' }); render(); }
  }catch(e){
    const refused = e && /not allowed|not authenticated/i.test(e.message || '');
    if(still()){ state.lb = fresh({ status: refused ? 'refused' : (state.lb.data ? 'stale' : 'error'), error: (e && e.message) || '' }); render(); }
  }
}

// Inline SVG stars (no images, no icon library): gold, silver, bronze for ranks 1-3.
// Lockstep with :root's --gold/--silver/--bronze (an SVG presentation attribute can't
// read a CSS custom property reliably across browsers, so the values are duplicated
// here, same pattern as TYPE_PALETTE/TYPE_PALETTE_HEX above). Gold reuses the accent
// yellow itself (the visual refresh's "leaderboard gold" is the same color as every
// other yellow accent, not a separate literal); silver/bronze are darkened from their
// original values (#A8A9AD, #CD7F32), which read at 2.3:1 and 3.1:1 against the new
// white card background -- these clear 3.4:1 and 3.6:1.
function lbStar(rank){
  const fill = rank === 1 ? '#E8A83D' : rank === 2 ? '#7C8B85' : rank === 3 ? '#A8621F' : null;
  if(!fill) return '<span class="lb-star-gap"></span>';
  const label = rank === 1 ? 'First place' : rank === 2 ? 'Second place' : 'Third place';
  return `<svg class="lb-star" viewBox="0 0 24 24" role="img" aria-label="${label}"><path fill="${fill}" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>`;
}
function lbWhen(ms){
  return new Date(ms).toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
}
function lbDate(iso){
  return new Date(iso).toLocaleDateString('en-US', { timeZone:'America/New_York', month:'short', day:'numeric', year:'numeric' });
}
// R6: `isHead`, not `isCoach` -- the exclude control edits what the whole
// team sees, so it's head-only now (packet approach g), even though any
// coach can still VIEW the board (data.is_coach, used elsewhere in
// renderLeaderboardView -- unaffected by this rename).
function lbRow(r, unit, minimum, isHead, cat){
  const unq = r.qualified === false;
  const rank = (r.rank === undefined || r.rank === null) ? '' : r.rank;
  const num = (r.number === undefined || r.number === null) ? '' : ` <span class="lb-num">#${escHtml(r.number)}</span>`;
  let val;
  if(unq){
    val = `<span class="lb-val lb-unq-note">not enough pitches (${r.pitch_count} of ${minimum})</span>`;
  } else if(cat === 'velocity' && isHead && rank === 1 && r.peak_pitch_id){
    val = `<button class="lb-val lb-val-btn" onclick="openLbExclude('${escHtml(r.peak_pitch_id)}')" title="Review this reading">${escHtml(r.value)}${unit}</button>`;
  } else {
    val = `<span class="lb-val">${escHtml(r.value)}${unit}</span>`;
  }
  let extra = '';
  if(cat === 'velocity' && isHead && state.lbExcludeOpen && state.lbExcludeOpen === r.peak_pitch_id){
    extra = `<div class="lb-exclude-panel">
      <span>Peak reading: <strong>${escHtml(r.value)} mph</strong> on ${escHtml(lbDate(r.peak_pitch_ts))}.</span>
      <span class="lb-exclude-actions">
        <button class="btn btn-primary" style="background:var(--red-bg);color:var(--chalk);" ${state.lbBusy ? 'disabled' : ''} onclick="excludeLbReading('${escHtml(r.peak_pitch_id)}')">${state.lbBusy ? 'Excluding…' : 'Exclude this reading'}</button>
        <button class="btn btn-ghost" onclick="openLbExclude(null)">Cancel</button>
      </span>
      <span class="lb-exclude-note">The pitch itself is not changed in History or reports. The next-highest reading takes over.</span>
    </div>`;
  }
  return `<div class="lb-row${r.is_me ? ' me' : ''}${unq ? ' unq' : ''}">
    <span class="lb-rank">${rank}</span><span class="lb-star-cell">${unq ? '' : lbStar(rank)}</span>
    <span class="lb-name">${escHtml(r.name)}${num}</span>${val}
    <span class="lb-n">${unq ? '' : `${r.pitch_count} pitch${r.pitch_count === 1 ? '' : 'es'}`}</span>
    ${extra}
  </div>`;
}
function lbSection(title, rows, unit, minimum, isHead, cat, emptyMsg){
  return `<div class="panel lb-section">${title ? `<h3 class="lb-title">${title}</h3>` : ''}
    ${rows.length ? rows.map(r => lbRow(r, unit, minimum, isHead, cat)).join('') : `<p class="lb-empty">${emptyMsg}</p>`}
  </div>`;
}
function renderLeaderboardView(){
  if(!hasLeaderboard()) return `<div class="empty-hist">Join a team to see its leaderboard.</div>`;
  const lb = state.lb;
  const teams = state.teams;
  const teamId = (lb && lb.teamId) || state.lbTeamId || state.currentTeamId || (teams[0] && teams[0].id);
  const picker = teams.length > 1
    ? `<select class="team-select lb-team-select" onchange="setLbTeam(this.value)">${teams.map(t => `<option value="${escHtml(t.id)}" ${t.id === teamId ? 'selected' : ''}>${escHtml(t.name)}</option>`).join('')}</select>`
    : '';
  const toggle = `<div class="lb-toggle">${LB_WINDOWS.map(([k, label]) => `<button class="throws-btn${state.lbWindow === k ? ' selected' : ''}" onclick="setLbWindow('${k}')">${label}</button>`).join('')}</div>`;
  const catToggle = `<div class="lb-toggle lb-cats">${LB_CATS.map(([k, label]) => `<button class="throws-btn${state.lbCat === k ? ' selected' : ''}" onclick="setLbCat('${k}')">${label}</button>`).join('')}</div>`;
  let body;
  const data = lb && lb.data;
  if(!lb || (!data && (lb.status === 'loading'))){
    body = `<p class="lb-empty">Loading the leaderboard…</p>`;
  } else if(lb.status === 'refused'){
    body = `<p class="lb-empty">The leaderboard isn't available for this team.</p>`;
  } else if(!data){
    body = `<p class="lb-empty">${lb.status === 'offline' ? "You're offline, and this board hasn't been loaded on this device yet." : "Couldn't load the leaderboard. Try again in a moment."}</p>`;
  } else {
    const min = data.minimum;
    // U10 (2): spell out the rules the board already applies (see
    // get_team_leaderboard), so a coach can tell why a pen isn't on it:
    // calendar week/month in Eastern time (not a rolling 7 days), and
    // bullpens only (live games never count).
    const windowLabel = (data.window === 'week' ? 'This week (Mon–Sun)' : data.window === 'month' ? 'This month' : 'All time') + ' · bullpens only';
    const stamp = data.generated_at ? new Date(data.generated_at).getTime() : lb.fetchedAt;
    const stale = lb.status === 'offline' || lb.status === 'stale';
    const cat = state.lbCat;
    const listRows = cat === 'accuracy' ? (data.accuracy || []) : cat === 'strike' ? (data.strike || []) : (data.velocity || []);
    const unit = cat === 'velocity' ? ' mph' : '%';
    const emptyMsg = cat === 'velocity' ? 'No velocity readings yet.' : 'No pitches charted yet.';
    // R6: the exclude/restore ACTIONS are head-only (isHead); the excluded
    // list itself stays visible to any coach (data.is_coach, unchanged) --
    // it's informational, same as everything else assistants can view.
    const isHead = isHeadOfTeam(teamId);
    body = `
      <p class="lb-sub">${windowLabel}${cat === 'velocity' ? ' · highest recorded velocity' : ` · needs ${min} pitches to be ranked`}</p>
      ${stale ? `<p class="lb-asof">${lb.status === 'offline' ? "You're offline. " : "Couldn't refresh. "}Showing the last board, as of ${escHtml(lbWhen(stamp))}.</p>` : ''}
      ${lbSection('', listRows, unit, min, isHead, cat, emptyMsg)}
      ${cat === 'velocity' && data.is_coach && (data.excluded || []).length ? `<div class="panel lb-section"><h3 class="lb-title">Excluded readings</h3>
        ${(data.excluded).map(e => `<div class="lb-row"><span class="lb-name">${escHtml(e.name)}</span>
          <span class="lb-val">${escHtml(e.value)} mph</span><span class="lb-n">${escHtml(lbDate(e.pitch_ts))}</span>
          ${isHead ? `<button class="btn btn-ghost lb-undo" ${state.lbBusy ? 'disabled' : ''} onclick="restoreLbReading('${escHtml(e.pitch_id)}')">Undo</button>` : ''}</div>`).join('')}
      </div>` : ''}`;
  }
  return `<div class="lb-page">
    <div class="lb-controls">${picker}${toggle}</div>
    ${catToggle}
    ${lb && lb.error && lb.status !== 'refused' && lb.status !== 'stale' && lb.status !== 'error' ? `<p class="profile-msg">${escHtml(lb.error)}</p>` : ''}
    ${body}
  </div>`;
}
