<script type="text/x-dc" data-dc-script data-props='{"sport":{"editor":"enum","options":["Baseball","Softball"],"default":"Baseball"},"$preview":{"width":440,"height":912}}'>
class Component extends DCLogic {
renderVals() {
const sb = (this.props.sport ?? 'Baseball') === 'Softball';
const accent = sb ? '#FF4F9A' : '#F2B741';
const cells = [];
for (let r = 0; r < 5; r++) {
for (let c = 0; c < 5; c++) {
const zone = r >= 1 && r <= 3 && c >= 1 && c <= 3;
const picked = r === 3 && c === 0;
let style;
if (picked) {
style = 'background: rgba(255,255,255,0.3); border: 2.5px solid ' + accent;
} else if (zone) {
style = 'background: rgba(10,26,20,0.34); border: 1px solid rgba(255,255,255,0.9)';
} else {
style = 'background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.6)';
}
cells.push({ n: zone ? String((r - 1) * 3 + (4 - c)) : '', style: style });
}
}
return {
cells: cells, isSB: sb, isBB: !sb, accent: accent,
hdr: sb ? '#0B2540' : '#0A1A14', bar: sb ? '#071A2E' : '#050D09',
wall: sb ? '#16385C' : '#1F4D3A', stands: sb ? '#3A4656' : '#39483F',
p1: sb ? 'FB' : '4SFB', p2: sb ? 'RISE' : 'SL', p3: 'CH', p4: sb ? 'DROP' : 'CU'
};
}
}
</script>
