/* ---------- STATS HELPERS ---------- */
// U11 (7): History shows the average time to home when any pitch was timed.
function avgTimeToPlateMeta(pitches){
  const ts = (pitches || []).map(p => p.timeToPlate).filter(v => typeof v === 'number');
  if(!ts.length) return '';
  const avg = ts.reduce((a, b) => a + b, 0) / ts.length;
  return `<div class="meta-item"><span class="meta-num mono">${avg.toFixed(2)}</span><span class="meta-lbl">Time to home (${ts.length})</span></div>`;
}
function sessionStats(pitches){
  const total = pitches.length;
  const strikes = pitches.filter(p => isStrikeCell(p.actualRow, p.actualCol)).length;
  const accurate = pitches.filter(isAccurate).length;
  const relativeAccurate = pitches.filter(isRelativelyAccurate).length;
  const usesRelativeMode = pitches.some(p => p.accuracyMode);
  // U7B: relative accuracy (zone-based) reads the STORED result (never recomputed from today's zones), and only
  // over pitches that had a zone -- so the denominator is shown alongside the percentage.
  const zonePitches = pitches.filter(p => p.inAccuracyZone === true || p.inAccuracyZone === false);
  const zoneTotal = zonePitches.length;
  const zoneHits = zonePitches.filter(p => p.inAccuracyZone === true).length;
  const velos = pitches.filter(p => !isDefaultVeloReading(p)).map(p => p.velo).filter(v => v !== null && v !== undefined);
  const hasVelo = velos.length > 0;
  const avgVelo = hasVelo ? Math.round(velos.reduce((a,b)=>a+b,0) / velos.length) : null;
  const minVelo = hasVelo ? Math.min(...velos) : null;
  const maxVelo = hasVelo ? Math.max(...velos) : null;
  const byType = {};
  pitches.forEach(p => {
    if(!byType[p.type]) byType[p.type] = { count:0, velos:[], strikes:0, accurate:0, relativeAccurate:0, zoneTotal:0, zoneHits:0 };
    if(p.inAccuracyZone === true || p.inAccuracyZone === false){ byType[p.type].zoneTotal++; if(p.inAccuracyZone) byType[p.type].zoneHits++; }
    byType[p.type].count++;
    if(p.velo !== null && p.velo !== undefined && !isDefaultVeloReading(p)) byType[p.type].velos.push(p.velo);
    if(isStrikeCell(p.actualRow, p.actualCol)) byType[p.type].strikes++;
    if(isAccurate(p)) byType[p.type].accurate++;
    if(isRelativelyAccurate(p)) byType[p.type].relativeAccurate++;
  });
  Object.values(byType).forEach(t => {
    t.hasVelo = t.velos.length > 0;
    t.avgVelo = t.hasVelo ? Math.round(t.velos.reduce((a,b)=>a+b,0) / t.velos.length) : null;
    t.minVelo = t.hasVelo ? Math.min(...t.velos) : null;
    t.maxVelo = t.hasVelo ? Math.max(...t.velos) : null;
    t.strikePct = Math.round((t.strikes / t.count) * 100);
    t.accuracyPct = Math.round((t.accurate / t.count) * 100);
    t.relativeAccuracyPct = Math.round((t.relativeAccurate / t.count) * 100);
    t.hasZone = t.zoneTotal > 0;
    t.zoneAccuracyPct = t.hasZone ? Math.round((t.zoneHits / t.zoneTotal) * 100) : null;
  });
  return {
    total, strikes, strikePct: total ? Math.round((strikes/total)*100) : 0,
    accurate, accuracyPct: total ? Math.round((accurate/total)*100) : 0,
    relativeAccurate, relativeAccuracyPct: total ? Math.round((relativeAccurate/total)*100) : 0,
    usesRelativeMode,
    hasZone: zoneTotal > 0, zoneTotal, zoneHits, zoneAccuracyPct: zoneTotal ? Math.round((zoneHits / zoneTotal) * 100) : null,
    hasVelo, avgVelo, minVelo, maxVelo, byType
  };
}
function heatCounts(pitches){
  const grid = {};
  pitches.forEach(p => { const k = p.actualRow + '-' + p.actualCol; grid[k] = (grid[k] || 0) + 1; });
  return grid;
}
function heatColor(intensity){
  const from = { r:142, g:197, b:232 };
  const to = { r:208, g:60, b:60 };
  const r = Math.round(from.r + (to.r - from.r) * intensity);
  const g = Math.round(from.g + (to.g - from.g) * intensity);
  const b = Math.round(from.b + (to.b - from.b) * intensity);
  return `rgb(${r},${g},${b})`;
}

/* ---------- RENDER: ZONE GRID ---------- */
function renderZoneGrid(pitches, clickable, flashCell, pendingTarget, chartingPerspective, batterSide, tapFnName){
  tapFnName = tapFnName || 'handleZoneTap';
  // G1: a game pitch has no target, so the U7B "relative accuracy zone"
  // glow -- which shows where THIS pitch type's target zone is -- is a
  // bullpen-only concept. Any tap handler other than the default one is,
  // today, the game-mode handler; skip the glow computation for it rather
  // than adding a second boolean the two call sites would have to keep in
  // sync with tapFnName themselves.
  const isBullpenTap = tapFnName === 'handleZoneTap';
  let cells = '';
  if(clickable){
    // U7B: on tap 1, light the pitcher's zone for (this pitch type, current batter side).
    // Zones are stored in catcher frame; the grid is drawn in the charter's screen frame.
    const gp = currentPitcher();
    const zoneNow = (isBullpenTap && pendingTarget && state.selectedType && gp && gp.relativeAccuracy)
      ? zoneCellsFor(state.currentPitcherId, state.selectedType, batterSide) : null;
    const glowCells = zoneNow
      ? new Set(zoneNow.map(k => { const [zr, zc] = k.split('-').map(Number); return zr + '-' + perspectiveCol(zc, chartingPerspective); }))
      : null;
    for(let row=0; row<GRID_SIZE; row++){
      for(let col=0; col<GRID_SIZE; col++){
        const inZone = isStrikeCell(row,col);
        // D8: the label at this SCREEN cell is whatever number its
        // catcher-frame equivalent would get -- the same perspectiveCol
        // conversion used at capture, so the number shown here is always
        // exactly the number that will end up in the pitch log for a tap
        // here (see the pitch-log comment below). Live batterSide, since
        // this is "what would the NEXT tap here be labeled right now."
        const num = zoneNumberFor(row, perspectiveCol(col, chartingPerspective), batterSide);
        const isTarget = pendingTarget && pendingTarget.row === row && pendingTarget.col === col;
        const isFlash = flashCell && flashCell.row === row && flashCell.col === col;
        const isGlow = glowCells && glowCells.has(row+'-'+col);
        let cls = 'zone-cell' + (inZone ? ' in-zone' : '') + ' clickable';
        let inner = num !== null ? `<span class="zone-number">${num}</span>` : '';
        if(isGlow) inner += `<span class="rel-glow-overlay"></span>`;
        if(isTarget){ cls += ' zone-cell-target'; inner += `<span class="target-dot"><span class="target-dot-core"></span></span>`; }
        if(isFlash){
          cls += flashCell.strike ? ' zone-cell-flash flash-strike' : ' zone-cell-flash flash-ball';
          inner += `<span class="flash-letter">${flashCell.strike ? 'K' : 'B'}</span>`;
        }
        cells += `<div class="${cls}" onclick="${tapFnName}(${row},${col})">${inner}</div>`;
      }
    }
  } else {
    const heat = heatCounts(pitches);
    const maxCount = Math.max(1, ...Object.values(heat));
    for(let row=0; row<GRID_SIZE; row++){
      for(let col=0; col<GRID_SIZE; col++){
        const key = row+'-'+col;
        const count = heat[key] || 0;
        const inZone = isStrikeCell(row,col);
        // D8: history/heat-map rows ARE stored (catcher-frame) coordinates
        // already -- no transform, always "Catcher's view" (see caption).
        const num = zoneNumberFor(row, col);
        const intensity = count / maxCount;
        const bg = `background:${heatColor(intensity)};opacity:${0.4 + 0.5*intensity};`;
        const cls = 'zone-cell' + (inZone ? ' in-zone' : '');
        const numLabel = num !== null ? `<span class="zone-number zone-number-heat">${num}</span>` : '';
        const countLabel = count > 0 ? `<span class="zone-count">${count}</span>` : '';
        cells += `<div class="${cls}" style="${bg}">${numLabel}${countLabel}</div>`;
      }
    }
  }
  const plate = renderHomePlate(chartingPerspective);
  // U2a: the silhouette is ALWAYS an absolutely-positioned child inside
  // .zone-grid (never a layout sibling -- that shipped once and pushed the
  // home plate out of position), only for the live/clickable grid. History
  // never passes a batterSide, so this is '' there, unchanged from before.
  const silhouette = clickable
    ? renderBatterSilhouette(batterSide, insideColumnOnScreenLeft(chartingPerspective, batterSide))
    : '';
  // Both live perspectives now draw the plate INSIDE .zone-grid (an extra
  // absolutely-positioned child, overlaying the cells) -- anchored to the
  // grid element itself, never to .zone-wrap (which carries the phone-only
  // margin-bottom reserving the batter-side pill's band; a percentage-
  // positioned plate against THAT would drift on phone widths). History
  // never passes a chartingPerspective, so it always falls through to the
  // unchanged, below-grid, non-translucent markup.
  return chartingPerspective
    ? `<div class="zone-grid">${cells}${plate}${silhouette}</div>`
    : `<div class="zone-grid">${cells}${silhouette}</div>${plate}`;
}

/* One pentagon shape for the live grid, in both perspectives -- CSS
   modifier classes (.behind-pitcher / .behind-catcher, see their own
   comments) reposition/rotate it, never a second hand-authored polygon.
   History/heat-map (chartingPerspective falsy) instead gets the original,
   unchanged, opaque below-grid plate -- that view always shows canonical,
   unmirrored data (see mirrorCol's comment), independent of any session's
   own perspective, so its plate stays independent of perspective too. */
function renderHomePlate(chartingPerspective){
  if(!chartingPerspective){
    return `<div class="home-plate-wrap"><svg class="home-plate" viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Home plate">
      <polygon points="4,4 96,4 96,32 50,56 4,32"></polygon>
    </svg></div>`;
  }
  const modeClass = chartingPerspective === 'behind_pitcher' ? 'behind-pitcher' : 'behind-catcher';
  const sideLabel = chartingPerspective === 'behind_pitcher' ? 'behind pitcher' : 'behind catcher';
  return `<svg class="home-plate-overlay ${modeClass}" viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Home plate (${sideLabel})">
    <polygon points="4,4 96,4 96,32 50,56 4,32"></polygon>
  </svg>`;
}

/* ---------- RENDER: SESSION VIEW (pitcher only) ---------- */
// U5: session-start "prompt" is a persistent, always-visible toggle (this
// codebase has no modal/dialog pattern anywhere) rather than a one-shot
// dismissible dialog -- pre-filled from the device's remembered last
// choice, locked once the first pitch is logged so the tap->storage mirror
// never has more than its one capture-time call site to worry about.
function renderPerspectiveToggle(forceFull){
  const current = sessionPerspective(state.activeSession);
  const locked = state.activeSession.pitches.length > 0;
  const opts = [
    { key: 'behind_catcher', label: 'Behind the catcher' },
    { key: 'behind_pitcher', label: 'Behind the pitcher' }
  ];
  const chips = opts.map(o => {
    const selected = current === o.key;
    // Unselected reads as plain, neutral chrome (dark ink text, not yellow -- yellow text
    // on the new light card background would fail the "accent only" rule); selected still
    // uses the amber fill with dark ink text, an allowed accent use.
    const style = selected ? `background:var(--amber);border-color:var(--amber);` : `color:var(--ink-faint);border-color:var(--border-strong);`;
    return `<button class="type-chip${selected?' selected':''}" style="${style}" ${locked?'disabled':''} onclick="selectPerspective('${o.key}')">${o.label}</button>`;
  }).join('');
  const lockedNote = locked ? `<p style="color:var(--ink-faint);font-size:11.5px;margin:6px 0 0;">Locked after the first pitch.</p>` : '';
  // Joel, Oct 1: on phones it's a drop-down -- open at the start of a
  // session, rolled up to one line once a perspective is picked (and always
  // once the first pitch locks it). Tap the line to open it again.
  if(isPhoneWidth() && !forceFull){
    const label = (opts.find(o => o.key === current) || opts[0]).label;
    const rolled = locked || state.perspectiveRolledUp;
    const head = `<button type="button" class="persp-rollup" onclick="togglePerspectiveRoll()" ${locked ? 'disabled' : ''} aria-expanded="${rolled ? 'false' : 'true'}">
        <span class="field-label" style="margin:0;">Charting perspective</span>
        ${rolled ? `<span class="persp-current">${label}${locked ? ' · locked' : ''}</span>` : ''}
        ${locked ? '' : `<span class="roster-chevron${rolled ? '' : ' open'}">▾</span>`}
      </button>`;
    return rolled ? `<div>${head}</div>` : `<div>${head}<div class="chip-row" style="margin-top:8px;">${chips}</div></div>`;
  }
  return `<div><div class="field-label" style="margin-bottom:8px;">Charting perspective</div><div class="chip-row">${chips}</div>${lockedNote}</div>`;
}

// U2a (D8): box "1" is always the inside column. Asking zoneNumberFor

function insideColumnOnScreenLeft(chartingPerspective, batterSide){

// G1: the mode chooser. A bullpen measures intent -> outcome (target vs
// actual); a game can't know intent, so it measures outcome -> result
// (where it landed, what happened) -- different enough measurements that
// mixing them corrupts both, hence asking up front rather than inferring.
function renderSessionKindChooser(){
  return `<div class="kind-chooser">
    <h2 class="display" style="margin:0 0 20px;text-align:center;">What will we be charting today?</h2>
    <div class="kind-chooser-buttons">
      <button class="kind-choice-btn" onclick="chooseSessionKind('bullpen')">Bullpen</button>
      ${sportCfg().hasLiveGame ? `<button class="kind-choice-btn" onclick="chooseSessionKind('game')">Live Game</button>` : ''}
    </div>
  </div>`;
}
// U10 (1): "‹ Back" to the chooser, only while nothing has been recorded.
// For a game that ends at the first zone tap, not the first finished pitch:
// gamePendingPitch (and field-play / adjust-runners state, or a no-pitch
// event) already counts as progress for the draft (see refreshDraftState),
// so Back must not be able to throw it away. A bullpen's tap 1 (the
// target) is never saved anywhere, so it doesn't hide Back. After this,
// leaving is only through Save or Discard.
function canGoBackToChooser(){
  const s = state.activeSession;
  return !!(s && s.kind && s.pitches.length === 0 && !s.gamePendingPitch && !s.fieldPlay
    && !s.adjustRunners && !(s.events && s.events.length));
}
// Placed so it takes NO height (Joel, Sept 29 2026: as its own row above
// the charting view it pushed the grid ~40px down until the first pitch).
// Two spots, one per width, never both visible (.hide-phone/.show-phone):
//  - above phone width: the pitcher header's action row, right of the name
//    beside Contacts / the coach's Profile, which has room to spare;
//  - phones: that row would wrap (measured +60px at 390/320), so instead
//    it overlays the right end of the dark brand strip at the top, which
//    is already taller than the button and empty on the right.
// The charting views themselves are untouched by item 1.
function showBackToChooser(){
  return state.view === 'session' && !state.draftAvailable && canGoBackToChooser();
}
function renderBackToChooserBtn(){
  return showBackToChooser()
    ? `<button type="button" class="btn btn-ghost back-to-chooser hide-phone" onclick="backToChooser()">‹ Back</button>`
    : '';
}
function renderBackToChooserBrandBtn(){
  return showBackToChooser()
    ? `<button type="button" class="back-to-chooser-brand show-phone" onclick="backToChooser()">‹ Back</button>`
    : '';
}
window.backToChooser = async function(){
  if(!canGoBackToChooser()) return;   // re-checked live: nothing recorded, nothing to lose
  await storDelete(draftKey());
  state.activeSession = await freshActiveSession();
  state.pendingTarget = null;
  state.hint = '';
  render();
};
window.chooseSessionKind = async function(kind){
  state.activeSession.kind = kind;
  state.perspectiveRolledUp = false;   // every new session starts with the perspective open
  state.pitchStripScroll = null;
  if(kind === 'bullpen'){
    // U11 (5)/(6): a new pen starts with no hitter standing in, from the windup.
    state.activeSession.batterMode = 'none';
    state.activeSession.currentBatterSide = 'R';
    state.activeSession.delivery = sportCfg().hasDelivery ? 'windup' : null;   // S1: softball has no Set/Windup
  }
  if(kind === 'game'){
    // Fresh game state. Bases start empty, so the delivery starts at Windup
    // (Joel, Oct 1 -- replaces G1's "first pitch must ask").
    state.activeSession.inning = 1;
    state.activeSession.outs = 0;
    state.activeSession.balls = 0;
    state.activeSession.strikes = 0;
    state.activeSession.atBatIndex = 1;
    state.activeSession.delivery = sportCfg().hasDelivery ? 'windup' : null;   // S2: softball has no Set/Windup
    // G3: fixed when the game starts (works offline; a mid-game level change
    // doesn't move the goalposts).
    state.activeSession.extraStart = extraInningStart((state.teams.find(t => t.id === state.currentTeamId) || {}).level);
    state.activeSession.tiebreakNo = [];
    // G2 approach (b): optional, editable up to save -- null renders as
    // "Game · <date>" in History/the report; set renders as
    // "vs <opponent> · <date>" (matches sessions.opponent's own column
    // comment in the migration). Never touched for a bullpen session.
    state.activeSession.opponent = null;
    // G1b: base state. Cleared here at game start, at 3 outs, and at a
    // manual New inning (see applyGameResultProgression and gameNewInning) --
    // never anywhere else, so a mid-inning walk/hit doesn't wipe runners who
    // are still on base.
    state.activeSession.runners = { 1: false, 2: false, 3: false };
    // G1b (f)/(h): events[] is pitches[]'s sibling -- runner corrections
    // with no pitch of their own (Adjust Runners). nextSeq orders BOTH
    // collections together so "undo the last action" (undoLastGameAction,
    // below) knows which of the two actually happened most recently,
    // regardless of which array it lives in.
    state.activeSession.events = [];
    state.activeSession.nextSeq = 1;
    // Games are usually charted from behind the plate (Joel) -- override
    // whatever the last BULLPEN charted from, since that's a different
    // remembered habit. Still just the default; the toggle still shows
    // and can be changed before the first pitch, same as a bullpen's.
    state.activeSession.chartingPerspective = 'behind_catcher';
    // G1b-r2a: whether the drop-down panel covers the grid. Not derivable
    // from gamePendingPitch/fieldPlay alone -- after a direct-record glyph
    // (B/K/ꓘ/F/etc.) both go back to null but the panel stays open for a
    // velocity-only edit until Next Pitch, so this needs its own flag. Part
    // of activeSession -> autosaved for free, same as everything else here.
    state.activeSession.panelOpen = false;
  }
  await storSet(draftKey(), state.activeSession);
  render();
};

/* ---------- LIVE GAME CHARTING (G1) ----------

// G1b (g): chooseInPlayOutcome/chooseHitType/chooseFielder deleted here --
// In Play now opens the field flow (openFieldFlow, below), which replaces
// this entire drill-down.
// G1b: base-state bitmask, matching pitches.runners_before exactly (1st=1,
// 2nd=2, 3rd=4). A pure encode/decode pair, independent of when or how
// runners actually get placed on base (that's decision 3's automatic
// advances and the field flow's runner-tap step, neither built yet in this
// slice) -- this only has to be correct for whatever s.runners currently
// holds, empty or not. Undo (below) is what proves the decode side; the
// encode side is exercised on every single game pitch already.
function runnersBitmask(runners){

function runnersFromBitmask(mask){

  return { 1: !!(mask & 1), 2: !!(mask & 2), 3: !!(mask & 4) };

// G1b decision 8/9's shared mechanism: given an explicit list of runner

// (same 0/4 convention), applies them to the live base state and reports
// how many outs/runs resulted. This is the ONE place that turns "a list of
// moves" into outs/runs/base-state -- decision 3's forced-walk chain
// (forcedWalkAdvances, right below) computes such a list for a walk/HBP/
// interference/dropped-third-reached; the field flow's hit-type prefill
// (decision 4, approach e) will compute a different list for a single/
// double/error/FC, but both call this same function to apply it. Neither
// can drift from the other on what "an out" or "a run" means here.
// Clears every FROM base before setting any TO base so multi-runner plays
// (e.g. runners on 1st AND 3rd both moving) don't depend on array order.
function applyRunnerAdvances(s, advances, batterTo){
  let outsOnPlay = 0, runsScored = 0;
  for(const mv of advances){
    if(mv.from >= 1 && mv.from <= 3) s.runners[mv.from] = false;

      // the one way a foul ever becomes strike three.

      // inPlayOutcome as exactly 'out' or 'reached'. An out here is a real

        // other branch) is the standard case.

    // place.

    sacrifice: null

  const pushedPitch = s.pitches[s.pitches.length - 1];
  const playResult = applyGameResultProgression(result, extra);
  pushedPitch.batterTo = playResult.batterTo;
  pushedPitch.runnerAdvances = playResult.runnerAdvances;
  pushedPitch.outsOnPlay = playResult.outsOnPlay;
  pushedPitch.runsScored = playResult.runsScored;
  state.activeSession.gamePendingPitch = null;
  state.activeSession.gameResultMenu = null;
  state.activeSession.gamePendingOutcome = null;
  state.activeSession.gamePendingHitType = null;
  // Same post-hoc velocity pattern as a bullpen's tap 2: the strip lights
  // up for the pitch just recorded until the next one starts. The G1
  // packet's own step order put velocity before result (4, then 5) --
  // built the other way around instead, and Joel confirmed after review
  // that's actually right: in real charting he's asking "what was that"
  // after the play resolves nine times out of ten, not off the gun in the
  // moment. Recorded here since it overrides the packet's literal order.
  state.veloTargetIdx = s.pitches.length - 1;
  await storSet(draftKey(), s);
  render();
};
// G1b (f)/(h): "undo the last action," pitch or event, whichever has the
// higher seq -- the one, shared undo the packet asks for instead of two
// separate undo buttons that could disagree about what "last" means.
// Restores from that action's OWN stored "before" snapshot, same pattern
// pitches already used before events existed.
window.undoLastGameAction = async function(){
  const s = state.activeSession;
  // G3 item 5: a "No" to the extra-inning question is the last thing done
  // when nothing has happened in that inning since -- Undo asks again.
  if((s.tiebreakNo || []).includes(s.inning) && !s.pitches.some(p => p.inning === s.inning) && !(s.events || []).some(e => e.inningBefore === s.inning)){
    s.tiebreakNo = s.tiebreakNo.filter(i => i !== s.inning);
    await storSet(draftKey(), s);
    render();
    return;
  }
  const lastPitch = s.pitches[s.pitches.length - 1];
  const lastEvent = s.events[s.events.length - 1];
  if(!lastPitch && !lastEvent) return;
  const undoingEvent = lastEvent && (!lastPitch || lastEvent.seq > lastPitch.seq);
  if(undoingEvent){
    let undone = s.events.pop();
    // S2: an illegal pitch is two rows (balk, then its ball) -- one Undo takes both.
    if(undone.illegalPitchBall && s.events.length && s.events[s.events.length - 1].illegalPitch) undone = s.events.pop();
    s.inning = undone.inningBefore;
    s.outs = undone.outsBeforeCount;
    s.balls = undone.ballsBefore;
    s.strikes = undone.strikesBefore;
    s.atBatIndex = undone.atBatIndexBefore;
    s.runners = runnersFromBitmask(undone.runnersBefore);
  } else {
    const last = lastPitch;
    s.pitches.pop();
    s.inning = last.inning;
    s.outs = last.outsBefore;
    s.balls = last.ballsBefore;
    s.strikes = last.strikesBefore;
    s.atBatIndex = last.atBatIndex;
    s.delivery = last.delivery;
    // runnersFromBitmask(undefined) decodes to empty bases for a pitch
    // that predates this column, not a crash.
    s.runners = runnersFromBitmask(last.runnersBefore);
  }
  s.gamePendingPitch = null;
  s.gameResultMenu = null;
  s.gamePendingOutcome = null;
  s.gamePendingHitType = null;
  s.fieldPlay = null;
  s.adjustRunners = null;
  // G1b-r2a: nothing left pending to hold the panel open for.
  s.panelOpen = false;
  state.veloTargetIdx = null;
  await storSet(draftKey(), s);
  render();
};
// Manual corrections for game state the pitch stream can't infer on its
// own (a mid-at-bat pitcher change, an inning that needs to move on with
// no more pitches thrown in it). gameBumpOuts() is REMOVED here (approach
// f) -- a caught-stealing/pickoff out now has a truthful path through
// Adjust Runners instead of a manual counter bump with no record of why.
window.gameNewBatter = async function(){
  const s = state.activeSession;
  s.atBatIndex++;
  s.balls = 0;
  s.strikes = 0;
  defaultGameDelivery(s);
  await storSet(draftKey(), s);
  render();
};
window.gameNewInning = async function(){
  const s = state.activeSession;
  s.inning++;
  s.outs = 0;
  s.balls = 0;
  s.strikes = 0;
  s.atBatIndex++;
  // G1b: bases clear at a manual New inning the same as they do at 3 outs
  // (packet: "Cleared at three outs and at New inning").
  s.runners = { 1: false, 2: false, 3: false };
  defaultGameDelivery(s);   // empty bases -> Windup
  await storSet(draftKey(), s);
  render();
};

/* ---------- G1b (f): ADJUST RUNNERS ----------
   From the status-bar diamond, any time between pitches: pick the runner,
   pick where he went, pick the reason. Writes a game_events row (never a
   pitch), applies outs/runs/bases, Undo-able as the last action (see
   undoLastGameAction above). Also the only way left to record a caught-
   stealing or pickoff out. */
const ADJUST_REASONS = [
  ['stolen_base', 'Stolen base'], ['caught_stealing', 'Caught stealing'], ['pickoff', 'Pickoff'],
  ['wild_pitch', 'Wild pitch'], ['passed_ball', 'Passed ball'], ['balk', 'Balk'], ['other', 'Other']
];
window.openAdjustRunners = async function(){
  const s = state.activeSession;
  // Only between pitches -- not mid pitch-capture, not mid field-flow.
  if(s.gamePendingPitch || s.fieldPlay) return;
  if(!s.runners[1] && !s.runners[2] && !s.runners[3]) return; // nothing to adjust
  s.adjustRunners = { step: 'runner', runner: null, destination: null };
  await storSet(draftKey(), s);
  render();
};
window.cancelAdjustRunners = async function(){
  state.activeSession.adjustRunners = null;
  await storSet(draftKey(), state.activeSession);
  render();
};
window.backAdjustRunners = async function(){
  const ar = state.activeSession.adjustRunners;
  if(!ar) return;
  ar.step = ar.step === 'reason' ? 'destination' : 'runner';
  await storSet(draftKey(), state.activeSession);
  render();
};
window.chooseAdjustRunner = async function(base){
  const ar = state.activeSession.adjustRunners;
  if(!ar) return;
  ar.runner = base;
  ar.step = 'destination';
  await storSet(draftKey(), state.activeSession);
  render();
};
window.chooseAdjustDestination = async function(dest){
  const ar = state.activeSession.adjustRunners;
  if(!ar) return;
  ar.destination = dest;
  ar.step = 'reason';
  await storSet(draftKey(), state.activeSession);
  render();
};
// A single-runner move can still collide with an existing occupant of the
// destination base (stealing 2nd when 2nd is already taken) -- decision
// 8's collision rule, scoped to Adjust Runners' one-move-at-a-time shape.
function adjustRunnersDisabledReason(ar, s){
  if(!ar) return 'No adjustment in progress';
  if(!ar.runner) return 'Choose a runner';
  if(!ar.destination) return 'Choose where he went';
  if(['1', '2', '3'].includes(ar.destination)){
    const destBase = Number(ar.destination);
    if(destBase !== ar.runner && s.runners[destBase]) return 'That base is already occupied';
  }
  return null;
}
window.commitAdjustEvent = async function(reason){
  const s = state.activeSession;
  const ar = s.adjustRunners;
  if(!ar || adjustRunnersDisabledReason(ar, s)) return;
  const before = {
    inning: s.inning, outs: s.outs, balls: s.balls, strikes: s.strikes,
    atBatIndex: s.atBatIndex, runnersBefore: runnersBitmask(s.runners)
  };
  const toNum = ar.destination === 'out' ? 0 : ar.destination === 'home' ? 4 : Number(ar.destination);
  const advances = [{ from: ar.runner, to: toNum }];
  const hadRunnersBefore = gameHasRunners(s);
  const { outsOnPlay, runsScored } = applyRunnerAdvances(s, advances, null);
  s.outs += outsOnPlay;
  if(s.outs >= 3){ s.inning++; s.outs = 0; s.runners = { 1: false, 2: false, 3: false }; }
  if(hadRunnersBefore !== gameHasRunners(s)) defaultGameDelivery(s);   // Joel, Oct 1
  s.events.push({
    id: genUUID(), seq: s.nextSeq++,
    eventType: reason,
    atBatIndex: before.atBatIndex,
    afterPitchId: s.pitches.length ? s.pitches[s.pitches.length - 1].id : null,
    runnersBefore: before.runnersBefore, runnerAdvances: advances,
    outsOnPlay, runsScored,
    // Client-only undo snapshot -- game_events has no column for these
    // (only runners_before is schema'd); the outbox mapper doesn't
    // whitelist them, so they never reach the DB. Undo only ever needs to
    // reach back into the CURRENT session's own in-memory history, so
    // nothing is lost by keeping them client-side only.
    inningBefore: before.inning, outsBeforeCount: before.outs,
    ballsBefore: before.balls, strikesBefore: before.strikes, atBatIndexBefore: before.atBatIndex
  });
  s.adjustRunners = null;
  await storSet(draftKey(), s);
  render();
};

/* ---------- G1b-r decision 10: NO-PITCH game_events ----------
   IBB, an automatic ball, an automatic strike, and the fast-path Balk (+
   grid) -- none is a pitch, none counts toward strike %, each is its own
   line in the at-bat log. Distinct from commitAdjustEvent above (which
   never touches balls/strikes/atBatIndex, since a stolen base/pickoff/etc.
   happens strictly BETWEEN pitches): these four can end an at-bat (IBB
   always; auto ball/strike when they complete a walk/strikeout) and so
   share applyGameResultProgression's own count-then-check shape, just
   against s directly rather than through a pushed pitch row. */
window.commitNoPitchEvent = async function(eventType, extra, noRender){
  const s = state.activeSession;
  // G1b-r2c: the old "only between pitches" guard (gamePendingPitch must be
  // null) made these four permanently unreachable once the drop-down panel
  // shipped -- the + button they're reached through only exists ON the
  // result row, which itself only renders once gamePendingPitch is already
  // set (the location tap is what opens the panel at all now). Still guard
  // against mid-field-flow (fieldPlay never actually reaches here today,
  // since + isn't shown then either, but kept defensively). The location
  // tap that opened the panel is discarded below -- none of these four is a
  // real pitch, so there's nothing to attach it to.
  if(s.fieldPlay) return;
  const before = {
    inning: s.inning, outs: s.outs, balls: s.balls, strikes: s.strikes,
    atBatIndex: s.atBatIndex, runnersBefore: runnersBitmask(s.runners)
  };
  const hadRunnersBefore = gameHasRunners(s);   // Joel, Oct 1: delivery default follows the bases
  let advances = [], batterTo = null, outsOnPlay = 0, runsScored = 0, outsBumped = 0, endsAtBat = false;
  if(eventType === 'intentional_walk'){
    // Packet: "IBB -> batter to 1st, forced runners advance, new batter."
    batterTo = 1;
    advances = forcedWalkAdvances(s);
    ({ outsOnPlay, runsScored } = applyRunnerAdvances(s, advances, batterTo));
    endsAtBat = true;
  } else if(eventType === 'auto_ball'){
    // Packet: "auto ball -> balls +1 (4 = walk via the same forced-advance
    // function)."
    s.balls++;
    if(s.balls >= 4){
      batterTo = 1;
      advances = forcedWalkAdvances(s);
      ({ outsOnPlay, runsScored } = applyRunnerAdvances(s, advances, batterTo));
      endsAtBat = true;
    }
  } else if(eventType === 'auto_strike'){
    // Packet: "auto strike -> strikes +1 (3 = K looking)."
    s.strikes++;
    if(s.strikes >= 3){
      outsBumped = 1; outsOnPlay = 1; batterTo = 0;
      endsAtBat = true;
    }
  } else if(eventType === 'illegal_pitch'){
    if(extra && extra.illegalAdv){
      advances = [1, 2, 3].filter(b => s.runners[b]).map(b => ({ from: b, to: b === 3 ? 4 : b + 1 }));
      ({ outsOnPlay, runsScored } = applyRunnerAdvances(s, advances, null));
    }
  } else if(eventType === 'balk'){
    // Standard rule (distinct from Adjust Runners' own 'balk' reason, which
    // moves exactly one chosen runner): every occupied base advances one,
    // forced or not, no picking needed -- "no location... tap + directly."
    advances = [1, 2, 3].filter(b => s.runners[b]).map(b => ({ from: b, to: b === 3 ? 4 : b + 1 }));
    ({ outsOnPlay, runsScored } = applyRunnerAdvances(s, advances, null));
  }
  outsBumped = outsBumped || outsOnPlay;
  if(outsBumped) s.outs += outsBumped;
  if(s.outs >= 3){ s.inning++; s.outs = 0; s.runners = { 1: false, 2: false, 3: false }; }
  if(endsAtBat){ s.atBatIndex++; s.balls = 0; s.strikes = 0; defaultGameDelivery(s); }
  else if(hadRunnersBefore !== gameHasRunners(s)) defaultGameDelivery(s);   // e.g. a pickoff empties the bases
  s.events.push({
    id: genUUID(), seq: s.nextSeq++,
    eventType,
    atBatIndex: before.atBatIndex,
    afterPitchId: s.pitches.length ? s.pitches[s.pitches.length - 1].id : null,
    runnersBefore: before.runnersBefore, runnerAdvances: advances.length ? advances : null,
    outsOnPlay, runsScored,
    inningBefore: before.inning, outsBeforeCount: before.outs,
    ballsBefore: before.balls, strikesBefore: before.strikes, atBatIndexBefore: before.atBatIndex,
    ...(extra || {})
  });
  // G1b-r2c: none of these four is a pitch -- the location tap that opened
  // the panel is discarded, and the panel closes (there's no walkthrough or
  // velocity to review for a no-pitch event).
  s.gamePendingPitch = null;
  s.gameResultMenu = null;
  s.panelOpen = false;
  await storSet(draftKey(), s);
  if(!noRender) render();
};
// S2 (Joel, Oct 1, option B): softball has no balk -- its "Illegal pitch"
// moves every runner up one base AND adds a ball to the count (ball 4 =
// walk). Saved as the two event rows the app already has, a balk then an
// auto ball, flagged so the log shows one "Illegal pitch" line and one Undo
// removes both. No new event type, no database change.
// G3 item 4 (Joel, Oct 2): two kinds -- ADV (runners up one base) or Ball
// (no ADV). Both add the ball, silently. Stored as 'illegal_pitch' (with
// runner advances only for ADV) then its auto_ball; one Undo removes both.
window.commitIllegalPitch = async function(adv){
  await commitNoPitchEvent('illegal_pitch', { illegalPitch: true, illegalAdv: !!adv }, true);
  await commitNoPitchEvent('auto_ball', { illegalPitchBall: true });
};
window.gridIllegal = function(adv){ return ggAfter(() => commitIllegalPitch(adv)); };

// G1b-r2a: lives inside the status bar, which is now always on a dark

      ${reason
        ? `<p class="walkthrough-disabled-reason">${escHtml(reason)}</p>`
        : `<div class="chip-row">${ADJUST_REASONS.map(([k, l]) => `<button class="type-chip" style="${neutral}" onclick="commitAdjustEvent('${k}')">${l}</button>`).join('')}</div>`}
      <button class="btn btn-ghost" onclick="backAdjustRunners()">Back</button>
    </div>`;
  }
  return '';

const GAME_RESULT_LABELS = {
  ball: 'Ball', strike_looking: 'Strike (looking)', strike_swinging: 'Strike (swinging)',
  foul: 'Foul', in_play: 'In play', hbp: 'HBP', sac_bunt: 'Sac bunt', sac_fly: 'Sac fly',
  dropped_third: 'Dropped 3rd', interference: "Catcher's interference", other: 'Other',
  // G1b-r decision 10: batter_interference (BI) is new and distinct from
  // the existing generic interference above, which is CI and unchanged.
  batter_interference: "Batter's interference", foul_tip: 'Foul tip'
};
function gameResultText(pt){
  if(pt.result === 'in_play'){
    const outcomeLabel = { hit: 'Hit', out: 'Out', error: 'Error' }[pt.inPlayOutcome] || 'In play';
    return [outcomeLabel, pt.hitType, pt.fielder ? ('to ' + pt.fielder) : ''].filter(Boolean).join(' ');
  }
  if(pt.result === 'dropped_third'){
    return 'Dropped 3rd' + (pt.inPlayOutcome === 'out' ? ' (batter out)' : pt.inPlayOutcome === 'reached' ? ' (batter reached)' : '');
  }
  if(pt.result === 'batter_interference'){
    // G1b-r decision 10: "Batter out" leaves batterTo=0 and no runner
    // movement; "Runner out -> pick base" leaves batterTo null and exactly
    // one {from,to:0} in runnerAdvances -- see chooseBIOutcome.
    if(pt.batterTo === 0) return "Batter's interference (batter out)";
    const runnerOut = (pt.runnerAdvances || []).find(a => a.to === 0);
    return "Batter's interference" + (runnerOut ? ` (R${runnerOut.from} out)` : '');
  }
  return GAME_RESULT_LABELS[pt.result] || pt.result;
}
// G1b-r decision 10: "each [no-pitch event] is its own line in the at-bat
// log" -- renderGameSessionView's log merges pitches and events by seq (see
// its own combinedLog) so this is reachable at all; also covers Adjust
// Runners' own event types (stolen_base/caught_stealing/pickoff/wild_pitch/
// passed_ball/balk/other), which never had their own log line before this.
const GAME_EVENT_LABELS = {
  stolen_base: 'Stolen base', caught_stealing: 'Caught stealing', pickoff: 'Pickoff',
  wild_pitch: 'Wild pitch', passed_ball: 'Passed ball', balk: 'Balk', other: 'Other event',
  intentional_walk: 'Intentional walk', auto_ball: 'Auto ball', auto_strike: 'Auto strike',
  illegal_pitch: 'Illegal pitch', tiebreak_runner: 'Tiebreak runner on 2B'
};
function gameEventText(ev){
  const label = ev.illegalPitch ? ((ev.eventType === 'balk' || ev.illegalAdv) ? 'Illegal pitch — ADV' : 'Illegal pitch — no ADV') : (GAME_EVENT_LABELS[ev.eventType] || ev.eventType);
  const parts = [label];
  (ev.runnerAdvances || []).forEach(a => {
    const to = a.to === 0 ? 'out' : a.to === 4 ? 'home' : (a.to === 1 ? '1st' : a.to === 2 ? '2nd' : '3rd');
    parts.push(`R${a.from} to ${to}`);
  });
  return parts.join(' · ');
}
// Pitches that reach or pass the strike threshold, for a game's own
// strike% -- distinct from a bullpen's accuracy%, which measures target
// vs. actual and has no meaning here. A dropped third strike and a sac
// are still strikes (the ball was put in play, or the batter swung
// through strike three); a walk/HBP/interference/"other" ending is not.
// G1b-r decision 10: foul_tip (FT) is a strike, same as strike_looking/
// strike_swinging -- it's the only foul that can BE strike three (a plain
// 'foul' below never can, see applyGameResultProgression's foul case).
const GAME_STRIKE_RESULTS = new Set(['strike_looking', 'strike_swinging', 'foul', 'foul_tip', 'in_play', 'sac_bunt', 'sac_fly', 'dropped_third']);
function gameStats(pitches){
  let k = 0, bb = 0, h = 0, strikeCount = 0, maxInning = 1;
  pitches.forEach(pt => {
    if(GAME_STRIKE_RESULTS.has(pt.result)) strikeCount++;
    if(pt.result === 'dropped_third') k++;
    if((pt.result === 'strike_looking' || pt.result === 'strike_swinging' || pt.result === 'foul_tip') && pt.strikesBefore >= 2) k++;
    if(pt.result === 'ball' && pt.ballsBefore >= 3) bb++;
    if(pt.result === 'in_play' && pt.inPlayOutcome === 'hit') h++;
    if(pt.inning > maxInning) maxInning = pt.inning;
  });
  const total = pitches.length;
  return { total, k, bb, h, strikePct: total ? Math.round(100 * strikeCount / total) : 0, innings: maxInning };
}
function renderGameStatusBar(){
  const s = state.activeSession;
  return `<div class="stat-readout">
    <div class="stat-box"><span class="stat-num mono">${s.inning}</span><span class="stat-lbl">Inning</span></div>
    <div class="stat-box"><span class="stat-num mono">${s.outs}</span><span class="stat-lbl">Outs</span></div>
    <div class="stat-box"><span class="stat-num mono">${s.balls}-${s.strikes}</span><span class="stat-lbl">Count</span></div>
    <div class="stat-box"><span class="stat-num mono">${s.atBatIndex}</span><span class="stat-lbl">Batter #</span></div>
    <div class="stat-box">${renderRunnerDiamond()}<span class="stat-lbl">Runners</span></div>
  </div>`;
}

// G1b-r decisions 2/3/10, updated by G1b-r2: six buttons now, not seven --
// H and O fold into one In Play icon button (opens the walkthrough, which
// asks Hit/Out/Error/FC as its own first question -- chooseWalkthroughEntry
// below). The old "more" menu (HBP/Dropped 3rd/Interference/Other) is
// DELETED, not hidden, folded into + (choosePlusCode) instead. Existing
// pitch rows charted through any of the old paths keep their values and
// still read correctly everywhere.
// G1b-r2 update: icons over captions, not letters -- B/K/ꓘ/F no longer
// appear as text on the buttons (they still get written by the scorebook
// cells and the log, both unchanged: scorebookBatterCode/gameResultText
// aren't touched by this). Each PNG is a transparent cut-out used as a CSS
// mask filled with currentColor (ink on the white button, and automatically
// white if the button's own color ever goes light-on-dark, e.g. selected).
// '+' alone stays a real glyph, in .flash-letter's face (.scorebook-btn-glyph).
const SCOREBOOK_GLYPHS = [
  { code: 'B', icon: 'icon-ball.png', caption: 'Ball' },
  { code: 'K', icon: 'icon-swinging.png', caption: 'Swinging' },
  { code: 'KL', icon: 'icon-looking.png', caption: 'Looking' },
  { code: 'F', icon: 'icon-foul.png', caption: 'Foul' },
  { code: 'INPLAY', icon: 'batter-icon.png', caption: 'In Play' },
  { code: 'PLUS', glyph: '+', caption: 'More' }
];
// G1b-r2: E and FC move OUT from under + -- they're the walkthrough's own
// 3rd/4th options after In Play now (chooseWalkthroughEntry), not here.
// G1b-r2f: Foul tip removed per Joel's request -- deleted, not hidden.
// foul_tip stays a valid pitches.result value (an existing row can still
// read correctly everywhere); there's just no way to record a new one.
const PLUS_GRID_PITCHES = [
  ['HBP', 'HBP'], ['D3', 'Dropped 3rd'],
  ['CI', "Catcher's interference"], ['BI', "Batter's interference"]
];
const PLUS_GRID_NO_PITCH = [
  ['IBB', 'Intentional walk'], ['AB', 'Auto ball'], ['AS', 'Auto strike'], ['BLK', 'Balk']
];

// G1b-r2: FIELD_VIEWBOX/FIELD_POSITIONS survive as pure DATA -- the
// bb_x/bb_y anchor lookup G1b-r's decision 5 established (location = the
// tapped position's own coordinate from docs/field-diagram.svg, normalized
// 0-1) is unchanged; only the VISUAL field (fieldSvgMarkup, renderField,
// the ball markers, the mound Pitch button, fieldPct, FIELD_MOUND, and
// every .field-* CSS rule) is removed, not the coordinates themselves.
// Ordered infield-first for the position swipe row below (decision: SS,
// 2B, 1B, 3B, P, C, LF, CF, RF) -- order has no effect on the anchor
// lookup (a plain .find by pos), so one list serves both purposes.
const FIELD_VIEWBOX = { w: 600, h: 520 };
const FIELD_POSITIONS = [
  { pos: 'SS', cx: 248, cy: 300 }, { pos: '2B', cx: 352, cy: 300 },
  { pos: '1B', cx: 405, cy: 358 }, { pos: '3B', cx: 195, cy: 358 },
  { pos: 'P',  cx: 300, cy: 383 }, { pos: 'C',  cx: 300, cy: 498 },
  { pos: 'LF', cx: 150, cy: 195 }, { pos: 'CF', cx: 300, cy: 150 }, { pos: 'RF', cx: 450, cy: 195 }
];

/* ---------- G1b-r2: THE WALK-THROUGH (field picture removed) ----------
   state.activeSession.fieldPlay holds the in-progress play (autosaved like
   everything else on activeSession, unchanged architecture -- Resume
   restores it mid-walkthrough the same way it restores gamePendingPitch).
     { entry: null|'H'|'O'|'E'|'FC', hitType: null|'1B'|'2B'|'3B'|'HR',
       positionSeq: [], bbType: null,
       endings: { batter, 1, 2, 3 -- a runner's own value is 'stay'|'1'|'2'|
                  '3'|'home'|'outAt1'|'outAt2'|'outAt3'|'outAtHome' },
       editing: null, pendingOutFor: null }
   entry starts null now (In Play alone doesn't fix it -- the charter picks
   Hit/Out/Error/FC as its own first question, chooseWalkthroughEntry
   below). G1b-r2f retired Fix/fixOpen, the standalone DP toggle, the
   position-sequence auto-inference, and the manually-tapped DP/DP(Pickoff)/
   DP(FC) reasons (G1b-r2e) -- nothing about WHY a runner is out is ever
   tapped directly any more. "Out" for a runner now asks one follow-up, at
   which base (pendingOutFor gates that second picker), and the whole
   play's own story -- doubled off, fielder's choice, double play, triple
   play -- is DERIVED fresh every render (fieldPlayOutLabel/runnerOutKind)
   from where each runner (and the batter) actually ended up, the same
   "derived, never tapped" precedent sacrifice already uses. "What happened
   to the runners?" (renderFieldFlow) still always shows inline whenever a
   base is occupied, for every entry. Everything else -- fieldBatterResultKey,
   refreshFieldPrefill, prefillRunnerEndings, leadForcedOutEndings (still
   used by the FC entry's own prefill), BATTER_RESULT_TO_BASE,
   applyRunnerAdvances, forcedWalkAdvances -- is REUSED UNCHANGED from
   G1b/G1b-r; only what the charter taps and sees to get there is new. */
// entry fixes the batter's own outcome for O/E/FC immediately (out/error/
// fc); only H needs a further tap (hit type) before it's known. Returns
// null for H before that tap -- callers already handle a null key (no
// prefill yet, Pitch stays disabled with 'Choose the hit type').
function fieldBatterResultKey(fp){
  if(fp.entry === 'H') return fp.hitType;
  if(fp.entry === 'O') return 'out';
  if(fp.entry === 'E') return 'error';
  if(fp.entry === 'FC') return 'fc';
  return null;
}
function baseCodeFromNumber(n){
  return n === 0 ? 'out' : n === 4 ? 'home' : String(n);
}
// Decision 7: recomputes the WHOLE endings object (batter + every occupied
// runner) from scratch, prefilled per decision 3 -- reuses
// prefillRunnerEndings/BATTER_RESULT_TO_BASE verbatim (below), the exact
// same functions G1b's original flow used, so the prefill RULES themselves
// (single: everyone up one, FC: lead runner out, etc.) are untouched by
// this revision, only how they're presented and corrected.
function refreshFieldPrefill(fp){
  const key = fieldBatterResultKey(fp);
  if(!key){ fp.endings = {}; return; }
  const runnerPrefill = prefillRunnerEndings(state.activeSession.runners, key);
  fp.endings = Object.assign({ batter: baseCodeFromNumber(BATTER_RESULT_TO_BASE[key]) }, runnerPrefill);
}
// G1b-r2: In Play alone no longer fixes entry -- it opens the walkthrough
// with entry still null, showing Hit/Out/Error/FC as its own first
// question (chooseWalkthroughEntry). Tap count is exactly one more than
// G1b-r's H/O glyphs (In Play + the category, where G1b-r had one glyph);
// acceptance 31/32 confirm this against the packet's own counts.
window.openFieldFlow = async function(){
  if(!state.activeSession.gamePendingPitch) return; // the pitch's own zone tap must already exist
  state.activeSession.fieldPlay = {
    entry: null, hitType: null, positionSeq: [], bbType: null,
    endings: {}, editing: null, pendingOutFor: null
  };
  await storSet(draftKey(), state.activeSession);
  render();
};
window.cancelFieldFlow = async function(){
  state.activeSession.fieldPlay = null;
  await storSet(draftKey(), state.activeSession);
  render();
};
// Hit/Out/Error/FC -- entry codes are unchanged internally ('H'/'O'/'E'/
// 'FC') from G1b-r, only the CHOICE presentation is new (a walkthrough
// question, not four separate top-row glyphs).
window.chooseWalkthroughEntry = async function(entry){
  const fp = state.activeSession.fieldPlay;
  if(!fp) return;
  fp.entry = entry;
  fp.hitType = null;
  if(entry !== 'H') refreshFieldPrefill(fp); // O/E/FC's batter outcome is fixed already; H waits for a hit-type tap
  else fp.endings = {};
  await storSet(draftKey(), state.activeSession);
  render();
};
window.chooseFieldHitType = async function(hitType){
  const fp = state.activeSession.fieldPlay;
  if(!fp || fp.entry !== 'H') return;
  fp.hitType = hitType;
  refreshFieldPrefill(fp);
  await storSet(draftKey(), state.activeSession);
  render();
};
// Decision 8: one unified list, no separate "correct the primary" control
// like G1b's original chooseFieldFielder/addFieldFielderToSequence --
// tapping a chip not yet in the sequence appends it (the FIRST tap becomes
// the batted-ball location AND the primary `fielder` column at commit,
// per decision 5; anything after is the rest of pitches.fielders, e.g.
// SS then 1B stores as fielder='SS', fielders='1B' -- "6-3"). Tapping a
// chip already in the sequence removes it, per decision 8's own wording.
// Capped at 4, generous headroom above any real play (a triple play is 3).
// G1b-r2f: no longer touches fp.endings -- there's no more position-
// sequence auto-inference to re-run (retired; see this section's own
// header comment). Position is now purely "who fielded it," independent of
// who's out and why, which the runner picker's own "at which base" answers.
window.toggleFieldPosition = async function(pos){
  const fp = state.activeSession.fieldPlay;
  if(!fp) return;
  const idx = fp.positionSeq.indexOf(pos);
  if(idx === -1){
    if(fp.positionSeq.length < 4) fp.positionSeq.push(pos);
  } else {
    fp.positionSeq.splice(idx, 1);
  }
  await storSet(draftKey(), state.activeSession);
  render();
};
window.chooseFieldBBType = async function(type){
  const fp = state.activeSession.fieldPlay;
  if(!fp) return;
  fp.bbType = type;
  await storSet(draftKey(), state.activeSession);
  render();
};
// Decision 7: tapping the B/R1/R2/R3 chip opens (or, tapped again, closes)
// its own destination picker; tapping a destination sets it and closes.
// key is 'batter' or 1/2/3 -- see renderFieldFlow's own chip markup for how
// each is passed.
window.openFieldEndingPicker = async function(key){
  const fp = state.activeSession.fieldPlay;
  if(!fp) return;
  fp.editing = (fp.editing === key) ? null : key;
  // Opening (or re-toggling) the plain destination picker always supersedes
  // any in-progress "at which base were they out" follow-up (see
  // setFieldEnding/setFieldOutAtBase below) -- this is how a charter backs
  // out of that follow-up if they tapped Out by mistake.
  fp.pendingOutFor = null;
  await storSet(draftKey(), state.activeSession);
  render();
};
// G1b-r2f: a runner tapping Out never finalizes an ending by itself --
// Joel's own rule is that doubled-off/fielder's-choice/double-or-triple-play
// are DERIVED, never tapped, purely from comparing WHERE each runner was put
// out to where they started and to how many total outs the play recorded.
// So Out just opens a second, base-specific follow-up (pendingOutFor) --
// see the "at which base?" picker in renderFieldFlow and
// setFieldOutAtBase below, which is what actually writes the ending. The
// batter has no such follow-up: 'out' finalizes immediately for him, same
// as any other destination.
window.setFieldEnding = async function(key, code){
  const fp = state.activeSession.fieldPlay;
  if(!fp) return;
  if(code === 'out' && key !== 'batter'){
    fp.pendingOutFor = key;
    fp.editing = null;
  } else {
    // A runner tapping his OWN current base is the same as "stays" --
    // stored as the existing 'stay' sentinel (not the numeral) so it's
    // excluded from runner_advances at commit exactly like an untouched
    // prefill is, and so the collision check in fieldPlayDisabledReason
    // doesn't see it as a destination at all.
    if(typeof key === 'number' && code === String(key)) code = 'stay';
    fp.endings[key] = code;
    fp.editing = null;
  }
  await storSet(draftKey(), state.activeSession);
  render();
};
// The "at which base" follow-up itself (base is 1/2/3/4, 4 = home).
// Stored as outAt1/outAt2/outAt3/outAtHome -- runnerOutKind and
// fieldPlayOutLabel (both above walkthroughOutNumbers) derive doubled-off/
// force/tag and FC/DP/TP from this plus the rest of the play, every render,
// never tapped directly.
window.setFieldOutAtBase = async function(key, base){
  const fp = state.activeSession.fieldPlay;
  if(!fp) return;
  fp.endings[key] = (base === 4) ? 'outAtHome' : `outAt${base}`;
  fp.pendingOutFor = null;
  fp.editing = null;
  await storSet(draftKey(), state.activeSession);
  render();
};
// Decision 4's prefill, keyed by battertResult, applied to whichever bases
// were actually occupied before this play. 'stay' means exactly that --
// not a placeholder for "no runner" (only occupied bases get an entry at
// all). Unchanged from G1b -- reused verbatim by refreshFieldPrefill above.
const BATTER_RESULT_TO_BASE = { out: 0, '1B': 1, '2B': 2, '3B': 3, HR: 4, error: 1, fc: 1 };
function prefillRunnerEndings(runners, batterResult){
  const endings = {};
  const occupiedBases = [1, 2, 3].filter(b => runners[b]);
  if(!occupiedBases.length) return endings;
  switch(batterResult){
    case 'out':
      // "Out: runners hold."
      occupiedBases.forEach(b => { endings[b] = 'stay'; });
      break;
    case '1B':
    case 'error':
      // "A single: batter to 1st, every runner up one base." / "Error: like a single."
      occupiedBases.forEach(b => { const to = b + 1; endings[b] = to >= 4 ? 'home' : String(to); });
      break;
    case '2B':
      // "Double: two."
      occupiedBases.forEach(b => { const to = b + 2; endings[b] = to >= 4 ? 'home' : String(to); });
      break;
    case '3B':
    case 'HR':
      // "Triple: everyone scores... HR: everyone scores."
      occupiedBases.forEach(b => { endings[b] = 'home'; });
      break;
    case 'fc':
      // "Fielder's choice: batter to 1st, lead runner out." The batter
      // taking 1st still forces the same chain a walk would (decision 3's
      // forcedWalkAdvances) -- FC just means the defense converts the
      // FURTHEST-ALONG forced runner into an out instead of letting the
      // chain advance him. Caught in testing: prefilling every non-lead
      // runner as 'stay' put a trailing runner from 1st on the same base
      // the batter is also taking (a real collision) whenever more than
      // one runner was in the force chain -- e.g. runners on 1st AND 2nd,
      // lead retired at 2nd, but the runner from 1st has nowhere to
      // "stay" once the batter occupies 1st. Reusing the walk's own chain
      // and only converting its lead link to an out fixes this the same
      // way for every occupied-base combination, not just the single-
      // runner case that happened not to expose it.
      Object.assign(endings, leadForcedOutEndings(runners));
      break;
  }
  return endings;
}
// Shared by FC's prefill above (still the only caller after G1b-r2f retired
// the position-sequence double-play auto-inference that used to reuse
// this too): given the walk's own forced-advance chain, converts ONLY its
// lead (highest `from`) link to an out -- encoded as outAtX (G1b-r2f;
// "at the base they were forced to," so runnerOutKind reads it as a real
// force and fieldPlayOutLabel can label it FC on its own, no separate tap
// needed) -- letting every other forced runner advance normally. {} when
// there's no force (1st unoccupied) -- a fielder's choice requires one.
function leadForcedOutEndings(runners){
  const endings = {};
  const chain = forcedWalkAdvances({ runners });
  if(chain.length){
    const lead = chain.reduce((a, b) => (b.from > a.from ? b : a));
    chain.forEach(mv => {
      endings[mv.from] = (mv.from === lead.from)
        ? (lead.to === 4 ? 'outAtHome' : `outAt${lead.to}`)
        : (mv.to === 4 ? 'home' : String(mv.to));
    });
  }
  return endings;
}
// Standard scorebook fielding numbers, for the DP summary line below only
// -- nowhere else in this app uses digit notation (decision 8's own comment
// on addFieldFielderToSequence's predecessor already rejected converting
// positions to numbers for the stored data; this is display-only).
const POSITION_SCOREBOOK_NUMBER = { P: 1, C: 2, '1B': 3, '2B': 4, '3B': 5, SS: 6, LF: 7, CF: 8, RF: 9 };
// G1b-r2: the resulting base state, appended to the summary line -- the
// packet's own Fix example quotes it verbatim ("6-4-3 . 2 out on the play .
// bases empty").
function basesSummaryText(fp){
  const s = state.activeSession;
  const key = fieldBatterResultKey(fp);
  const batterTo = key ? BATTER_RESULT_TO_BASE[key] : null;
  const finalBases = [];
  [1, 2, 3].forEach(b => {
    if(!s.runners[b]) return;
    const ending = fp.endings[b] || 'stay';
    if(ending === 'stay') finalBases.push(b);
    else if(ending === '1' || ending === '2' || ending === '3') finalBases.push(Number(ending));
  });
  if(batterTo === 1 || batterTo === 2 || batterTo === 3) finalBases.push(batterTo);
  if(!finalBases.length) return 'bases empty';
  if(new Set(finalBases).size === 3) return 'bases loaded';
  return [...new Set(finalBases)].sort((a, b) => a - b).map(b => `R${b}`).join(', ');
}
// Decision 7's one-line summary, redrawn on every render from fp.endings --
// batterResultKey may still be null (no entry chosen, or H before hitType).
// G1b-r2f: a DP/TP play gets its own scorebook-notation line instead
// ("6-4-3 . 2 out on the play", quoted verbatim from the packet, singular
// "out" included) -- the label is DERIVED (fieldPlayOutLabel), never
// tapped, from wherever every runner (and the batter) actually ended up.
function fieldPlaySummary(fp){
  const s = state.activeSession;
  const key = fieldBatterResultKey(fp);
  const label = fieldPlayOutLabel(fp);
  const outsThisPlay = [1, 2, 3].filter(b => s.runners[b] && runnerOutKind(b, fp.endings[b]) !== null).length
    + (key === 'out' ? 1 : 0);
  if(label === 'DP' || label === 'TP'){
    const notation = fp.positionSeq.map(pos => POSITION_SCOREBOOK_NUMBER[pos] || pos).join('-');
    return `${notation} · ${outsThisPlay} out on the play · ${basesSummaryText(fp)}`;
  }
  const batterLabel = {
    out: 'Batter out', '1B': 'Batter to 1st', '2B': 'Batter to 2nd', '3B': 'Batter to 3rd',
    HR: 'Batter scores (HR)', error: 'Batter to 1st (error)', fc: 'Batter to 1st (FC)'
  }[key] || (!fp.entry ? 'Choose what happened' : fp.entry === 'H' ? 'Choose the hit type' : '');
  const parts = [batterLabel];
  [1, 2, 3].forEach(b => {
    if(!s.runners[b]) return;
    const ending = fp.endings[b] || 'stay';
    if(ending === 'stay') return;
    const kind = runnerOutKind(b, ending);
    const baseLabel = kind ? (kind === 'doubled_off' ? 'doubled off' : 'out')
      : (ending === 'home' ? 'scores' : 'to ' + (ending === '1' ? '1st' : ending === '2' ? '2nd' : '3rd'));
    parts.push(`R${b} ${baseLabel}`);
  });
  parts.push(`${outsThisPlay} out${outsThisPlay === 1 ? '' : 's'}`);
  if(key) parts.push(basesSummaryText(fp));
  return parts.filter(Boolean).join(' · ');
}
// Decision 9's validation, run fresh on every render (not just at commit)
// so the Pitch button's disabled state and its one-line reason are always
// in sync with whatever's been tapped so far, across every row regardless
// of order.
function fieldPlayDisabledReason(fp){
  if(!fp) return 'No play in progress';
  // G1b-r2: entry itself is no longer fixed the moment the walkthrough
  // opens (In Play alone doesn't say Hit/Out/Error/FC any more).
  if(!fp.entry) return 'Choose Hit, Out, Error, or FC';
  if(fp.entry === 'H' && !fp.hitType) return 'Choose the hit type';
  if(!fp.positionSeq.length) return 'Choose where it was fielded';
  if(!fp.bbType) return 'Choose the batted-ball type';
  const key = fieldBatterResultKey(fp);
  const batterEnding = fp.endings.batter;
  if(!key || !batterEnding) return 'Choose what happened to the batter';
  // G1b-r2f: tapping Out for a runner opens the "at which base" follow-up
  // (setFieldEnding/setFieldOutAtBase) rather than finalizing immediately --
  // the play isn't fully recorded until that follow-up is answered.
  if(fp.pendingOutFor !== null && fp.pendingOutFor !== undefined){
    return 'Choose which base the runner was out at';
  }
  const destinationBases = [1, 2, 3]
    .map(b => (state.activeSession.runners[b] ? fp.endings[b] : null))
    .filter(e => e === '1' || e === '2' || e === '3');
  if(batterEnding === '1' || batterEnding === '2' || batterEnding === '3') destinationBases.push(batterEnding);
  if(new Set(destinationBases).size !== destinationBases.length){
    return "Two runners can't end on the same base";
  }
  const outsThisPlay = [1, 2, 3].filter(b => state.activeSession.runners[b] && runnerOutKind(b, fp.endings[b]) !== null).length
    + (batterEnding === 'out' ? 1 : 0);
  if(state.activeSession.outs + outsThisPlay > 3){
    return "That's more outs than are left in the inning";
  }
  return null;
}
window.commitFieldPlay = async function(){
  const s = state.activeSession;
  const fp = s.fieldPlay;
  const pending = s.gamePendingPitch;
  if(!fp || !pending || fieldPlayDisabledReason(fp)) return;

  const key = fieldBatterResultKey(fp);
  const batterTo = BATTER_RESULT_TO_BASE[key];
  const advances = [];
  for(const b of [1, 2, 3]){
    if(!s.runners[b]) continue;
    const ending = fp.endings[b];
    if(!ending || ending === 'stay') continue;
    const isOut = ending === 'out' || OUT_AT_BASE_CODE[ending] !== undefined;
    advances.push({ from: b, to: isOut ? 0 : ending === 'home' ? 4 : Number(ending) });
  }
  // Decision 13: sacrifice stays derived, never tapped. A run scoring on a
  // fly out is an SF; a runner advancing on a bunt out is a SAC. Only
  // possible when the batter himself is out.
  let sacrifice = null;
  if(batterTo === 0){
    if(fp.bbType === 'fly' && advances.some(a => a.to === 4)) sacrifice = 'SF';
    else if(fp.bbType === 'bunt' && advances.some(a => a.to !== 0)) sacrifice = 'SAC';
  }
  const inPlayOutcome = key === 'out' ? 'out' : key === 'error' ? 'error' : key === 'fc' ? 'fc' : 'hit';
  const hitType = ['1B', '2B', '3B', 'HR'].includes(key) ? key : null;

  const chartingPerspective = sessionPerspective(s);
  const batterSide = sessionBatterSide(s);
  if(s.pitches.length === 0) s.usesRadarGun = sessionUsesRadarGun(s);

  // Decision 5: bb_x/bb_y are the FIRST tapped position's own anchor
  // coordinate (the ball's location), not a precise tap -- bb_from_position
  // is true for every row built through this flow. `fielder` is that same
  // first position; `fielders` is everything tapped after it, dash-joined
  // (e.g. primary 'SS', fielders '1B' for a 6-3), matching pitches.fielders'
  // own documented convention unchanged from G1b.
  const primaryPos = fp.positionSeq[0];
  const posAnchor = FIELD_POSITIONS.find(p => p.pos === primaryPos);
  const bbX = posAnchor ? Math.round((posAnchor.cx / FIELD_VIEWBOX.w) * 10000) / 10000 : null;
  const bbY = posAnchor ? Math.round((posAnchor.cy / FIELD_VIEWBOX.h) * 10000) / 10000 : null;

  s.pitches.push({
    id: genUUID(), seq: s.nextSeq++, kind: 'game',
    // G1b-r addendum (velocity): carries over whatever was entered while
    // this play was being walked through (gamePendingPitch.velo).
    type: state.selectedType, velo: pending.velo,
    timeToPlate: (pending.timeToPlate === undefined) ? null : pending.timeToPlate,   // U11 (7)
    targetRow: null, targetCol: null,
    actualRow: pending.row, actualCol: perspectiveCol(pending.col, chartingPerspective),
    accuracyMode: null, inAccuracyZone: null, accuracyZoneCells: null,
    batterSide, ts: Date.now(),
    result: 'in_play', inPlayOutcome, hitType,
    fielder: primaryPos || null, fielders: fp.positionSeq.length > 1 ? fp.positionSeq.slice(1).join('-') : null,
    delivery: s.delivery,
    inning: s.inning, outsBefore: s.outs, ballsBefore: s.balls, strikesBefore: s.strikes, atBatIndex: s.atBatIndex,
    runnersBefore: runnersBitmask(s.runners),
    bbType: fp.bbType, bbX, bbY, bbFromPosition: true,
    batterTo, runnerAdvances: advances, sacrifice,
    outsOnPlay: 0, runsScored: 0 // filled in immediately below, once applyRunnerAdvances has run
  });
  const pushedPitch = s.pitches[s.pitches.length - 1];
  const { outsOnPlay, runsScored } = applyRunnerAdvances(s, advances, batterTo);
  pushedPitch.outsOnPlay = outsOnPlay;
  pushedPitch.runsScored = runsScored;

  // Decision: "for in_play, bypass [applyGameResultProgression] -- outs and
  // runs come from the runner endings." Same tail bookkeeping that
  // function's switch cases share, applied directly here instead of
  // routing an already-fully-resolved play back through a result-string
  // switch that was never built to know about multi-out plays.
  s.outs += outsOnPlay;
  if(s.outs >= 3){ s.inning++; s.outs = 0; s.runners = { 1: false, 2: false, 3: false }; }
  s.atBatIndex++;
  s.balls = 0;
  s.strikes = 0;
  defaultGameDelivery(s);

  s.gamePendingPitch = null;
  s.gameResultMenu = null;
  s.gamePendingOutcome = null;
  s.gamePendingHitType = null;
  s.fieldPlay = null;
  // G1b-r2a: unlike a direct-record glyph (B/K/ꓘ/F), which leaves the panel

// G1b-r2a: the panel's own shared "Next Pitch" button (screen order 5, its

function nextPitchDisabledReason(){

window.nextPitch = async function(){

/* ---------- G1b-r2: SCOREBOOK CELLS ----------

   drawn in the accent color until Pitch); one small cell per occupied base,

// same mapping G1b-r's addendum already built for the DP summary line.

// WHY is ever tapped directly any more; it's derived from comparing that
// location to the runner's own starting base, exactly like sacrifice is
// derived elsewhere in this file, never tapped.
const OUT_AT_BASE_CODE = { outAt1: 1, outAt2: 2, outAt3: 3, outAtHome: 4 };

// (out at the very next base -- the standard force), or 'tag' (out further
// along than that -- thrown out taking an extra base). null if not an out

function runnerOutKind(startBase, ending){

  return 'tag';

// runner's. Exactly one forced runner and nobody else out = fielder's
// choice; two total outs = double play; three or more = triple play.
// "Total outs" counts any kind (a caught fly plus a runner doubled off is
// still two outs on the same play), but only a FORCE can ever read as
// fielder's choice specifically -- a double play with nobody forced (say,
// two runners independently doubled off) still counts by total, just never
// mislabeled FC.
function fieldPlayOutLabel(fp){
  const s = state.activeSession;
  const key = fieldBatterResultKey(fp);
  const batterOut = key ? BATTER_RESULT_TO_BASE[key] === 0 : false;
  const runnerKinds = [1, 2, 3].filter(b => s.runners[b]).map(b => runnerOutKind(b, fp.endings[b])).filter(Boolean);
  const forcedCount = runnerKinds.filter(k => k === 'force').length;
  const totalOuts = (batterOut ? 1 : 0) + runnerKinds.length;

  if(totalOuts === 2) return 'DP';
  if(totalOuts >= 3) return 'TP';

function walkthroughOutNumbers(fp){
  const s = state.activeSession;
  const numbers = {};
  let next = s.outs + 1;
  [1, 2, 3].forEach(b => { if(s.runners[b] && runnerOutKind(b, fp.endings[b]) !== null) numbers[b] = next++; });

// unassisted (U3) -- shared by the live cell (below) and the historical one
// (scorebookBatterCode) so a routine 1-touch groundout reads the same way
// whether it's still pending or already in the log.
function outNotation(seq, bbType){
  if(seq.length === 1 && (bbType === 'fly' || bbType === 'line' || bbType === 'pop')){
    return { fly: 'F', line: 'L', pop: 'P' }[bbType] + (POSITION_SCOREBOOK_NUMBER[seq[0]] || '');

  if(seq.length === 1 && bbType === 'ground') return 'U' + (POSITION_SCOREBOOK_NUMBER[seq[0]] || '');
  return fielderNotation(seq);
}

// DP/TP: the batter gets the full fielding sequence (fieldPlayOutLabel
// derives the label from every out on the play, not a tapped flag).
function walkthroughBatterCode(fp){
  const key = fieldBatterResultKey(fp);
  if(!key) return '';
  if(key === 'out'){
    const label = fieldPlayOutLabel(fp);
    return (label === 'DP' || label === 'TP') ? fielderNotation(fp.positionSeq) : outNotation(fp.positionSeq, fp.bbType);

  if(key === 'error') return 'E' + (POSITION_SCOREBOOK_NUMBER[fp.positionSeq[0]] || '');
  if(key === 'fc') return 'FC';
  return key; // '1B'/'2B'/'3B'/'HR'
}
// G1b-r2f: a runner's own code comes from HOW they were out (runnerOutKind,
// derived from where the charter said they were out vs. their own starting
// base) -- doubled off shows "DO"; a force shows the play's own label

// else (thrown out taking an extra base) is just a plain out, no special
// label invented for it.
function walkthroughRunnerOutCode(fp, base){
  const kind = runnerOutKind(base, fp.endings[base]);

  if(kind === 'force') return fieldPlayOutLabel(fp) || 'Out';
  if(kind === 'tag') return 'Out';
  return '';
}
function walkthroughBBCode(fp){

  const label = fieldPlayOutLabel(fp);
  return (label === 'DP' || label === 'TP') ? `${bbCode} · ${label}` : bbCode;

    case 'strike_swinging': return pt.batterTo === 0 ? 'K' : '';
    case 'strike_looking': return pt.batterTo === 0 ? 'ꓘ' : '';
    case 'foul_tip': return pt.batterTo === 0 ? 'K' : '';
    case 'hbp': return 'HBP';
    case 'interference': return 'CI';
    case 'batter_interference': return 'BI';
    case 'dropped_third': return pt.inPlayOutcome === 'out' ? 'K' : `D3 ${fielderNotation([pt.fielder])}`;
    case 'in_play': {

      if(pt.inPlayOutcome === 'error') return 'E' + (POSITION_SCOREBOOK_NUMBER[pt.fielder] || '');
      if(pt.inPlayOutcome === 'fc') return 'FC';
      if(pt.sacrifice === 'SF') return 'SF' + (POSITION_SCOREBOOK_NUMBER[pt.fielder] || '');

function deriveRunnerReachCode(base){
  const s = state.activeSession;

    ...s.pitches.map(pt => ({ seq: pt.seq, pt })),
    ...(s.events || []).map(ev => ({ seq: ev.seq, ev }))
  ].sort((a, b) => b.seq - a.seq);

    if(entry.pt && (entry.pt.batterTo === base || (entry.pt.runnerAdvances || []).some(a => a.to === base))){
      return scorebookBatterCode(entry.pt);

    if(entry.ev && (entry.ev.runnerAdvances || []).some(a => a.to === base)){

// Diamond geometry (a 0-100 box, home at bottom): segment i connects base i

// 'out'/'stay'/unset).

// center), matching the reference's own SVG points proportionally --
// staging's original was slightly skewed (home closer to the edge than the
// other three).
const SCOREBOOK_DIAMOND_PTS = { home: [50, 95], 1: [95, 50], 2: [50, 5], 3: [5, 50] };
const SCOREBOOK_SEGMENTS = [['home', 1], [1, 2], [2, 3], [3, 'home']];
function reachedSegmentIndices(base){
  return Array.from({ length: Math.max(0, Math.min(3, base)) }, (_, i) => i);
}
function pendingSegmentIndices(fromBase, toCode){

  for(let i = fromBase; i < toBase; i++) idx.push(i);

// G1b-r2a: matches the reference's own text treatment -- top-left (how the
// batter/runner reached or was retired) is bold and full ink; top-right

  const seg = (i, cls) => `<path class="scorebook-cell-path ${cls}" d="M ${SCOREBOOK_DIAMOND_PTS[SCOREBOOK_SEGMENTS[i][0]].join(' ')} L ${SCOREBOOK_DIAMOND_PTS[SCOREBOOK_SEGMENTS[i][1]].join(' ')}"/>`;
  const outCircle = outNumber ? `<circle class="scorebook-cell-out-circle" cx="50" cy="50" r="14"/><text class="scorebook-cell-out-num" x="50" y="54">${outNumber}</text>` : '';
  const sizeClass = size === SCOREBOOK_CELL_SMALL ? ' small' : '';
  return `<div class="scorebook-cell${sizeClass}"><svg viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-hidden="true">
    <polygon class="scorebook-cell-diamond" points="${diamondPts}"/>
    ${scoredPending ? `<polygon class="scorebook-cell-scored pending" points="${diamondPts}"/>` : ''}
    ${reachedIdx.map(i => seg(i, 'committed')).join('')}
    ${pendingIdx.map(i => seg(i, 'pending')).join('')}
    ${outCircle}
    ${topLeft ? `<text class="scorebook-cell-code strong" x="4" y="12">${escHtml(topLeft)}</text>` : ''}
    ${topRight ? `<text class="scorebook-cell-code muted" x="96" y="12" text-anchor="end">${escHtml(topRight)}</text>` : ''}
    ${bottomLeft ? `<text class="scorebook-cell-code muted" x="4" y="96">${escHtml(bottomLeft)}</text>` : ''}

// G1b-r2a: sizes match the reference exactly (170 big / 80 small, vs the
// original 72/48) -- confirmed via screenshot that both still fit
// comfortably at 320px alongside the walkthrough column.
const SCOREBOOK_CELL_BIG = 170;
const SCOREBOOK_CELL_SMALL = 80;
function renderScorebookCells(fp){
  const s = state.activeSession;
  const key = fieldBatterResultKey(fp);
  const batterTo = key ? BATTER_RESULT_TO_BASE[key] : null;
  const outNumbers = walkthroughOutNumbers(fp);

  const runnerCells = [1, 2, 3].filter(b => s.runners[b]).map(b => {
    const ending = fp.endings[b];
    return `<div>
      <div class="scorebook-cell-label">R${b}</div>
      ${renderScorebookCellSvg({
        size: SCOREBOOK_CELL_SMALL,
        reachedIdx: reachedSegmentIndices(b),
        pendingIdx: pendingSegmentIndices(b, ending),
        scoredPending: ending === 'home',
        outNumber: outNumbers[b] || null,
        topLeft: (runnerOutKind(b, ending) !== null) ? walkthroughRunnerOutCode(fp, b) : deriveRunnerReachCode(b),
        topRight: null, bottomLeft: null

  }).join('');

  const batterCell = `<div>
    <div class="scorebook-cell-label">Batter</div>
    ${renderScorebookCellSvg({
      size: SCOREBOOK_CELL_BIG,
      reachedIdx: [],
      pendingIdx: pendingSegmentIndices(0, batterTo === null ? null : baseCodeFromNumber(batterTo)),
      scoredPending: batterTo === 4,
      outNumber: outNumbers.batter || null,
      topLeft: walkthroughBatterCode(fp),

// G1b-r2a: the panel shows cells whenever it's open, not only mid-
// walkthrough -- when there's no active fieldPlay (still choosing a glyph,
// or reviewing velocity after one already recorded), cells fall back to a
// simpler, committed-only view: runners' own existing reach codes (no
// pending/yellow anything, since there's no in-progress play to preview),
// and the batter's cell showing whatever the LAST pitch in the CURRENT
// at-bat already recorded (blank if the at-bat is fresh, e.g. balls/strikes
// still building with nothing resolved yet).

// G1b-r2 section 6: Hit/Out/Error/FC -> the position swipe row -> batted-
// ball type -> summary line with Fix -> Pitch (full-width, the only
// commit). Unlike G1b-r's decision 9, entry itself is now its own
// sequential question (chooseWalkthroughEntry) -- everything from the
// position row down still appears together once entry (and, for a hit, hit
// type) is known, same stacked-and-always-visible spirit as before, just
// for a narrower slice of the flow.
// G1b-r3: the r2 "What happened to the runners?" chips, unchanged (same
// markup, same openFieldEndingPicker/setFieldEnding/setFieldOutAtBase

function renderRunnerFixPanel(fp){
  if(!fp) return '';

  const neutral = `color:var(--ink-faint);border-color:var(--game-chip-border);`;
  const amber = `background:var(--field-dark);border-color:var(--field-dark);color:var(--surface);`;
  const baseLabel = { '1': '1st', '2': '2nd', '3': '3rd', home: 'Home', out: 'Out' };
  const chipLabel = (key) => {
    if(key === 'batter'){
      const bl = baseLabel[fp.endings.batter];
      return 'B' + (bl ? `: ${bl}` : '');
    }
    if(!s.runners[key]) return null;
    const ending = fp.endings[key];
    const kind = runnerOutKind(key, ending);
    if(kind){
      const label = kind === 'doubled_off' ? 'Doubled off' : (fieldPlayOutLabel(fp) || 'Out');
      return `R${key}: ${label}`;
    }

    return `R${key}: ${bl}`;
  };

    const label = chipLabel(key);

    const active = fp.editing === key || fp.pendingOutFor === key;
    return `<button class="type-chip" style="${active ? amber : neutral}" onclick="openFieldEndingPicker(${keyArg})">${label}</button>`;
  }).join('');
  const destOptions = [['1', '1st'], ['2', '2nd'], ['3', '3rd'], ['home', '⌂ Home'], ['out', '✕ Out']];
  const editingKeyArg = typeof fp.editing === 'string' ? `'${fp.editing}'` : fp.editing;

    </div>` : '';
  // The "at which base" follow-up (Decision: doubled off/FC/DP/TP are
  // derived from this, never tapped). Only bases from the runner's own
  // current base through Home make sense -- a runner can't be put out
  // behind where he started.

    <div class="chip-row" style="margin-top:4px;">
      ${Array.from({ length: 4 - fp.pendingOutFor + 1 }, (_, i) => fp.pendingOutFor + i).map(b =>
        `<button class="type-chip" style="${neutral}" onclick="setFieldOutAtBase(${fp.pendingOutFor},${b})">${OUT_AT_BASE_LABEL[b]}</button>`

  return `<div class="field-label" style="margin-bottom:4px;">What happened to the runners?</div>
    <div class="chip-row">${runnerChips}</div>
    ${editingPicker}
    ${outAtPicker ? `<div class="field-label" style="margin:4px 0 4px;">At which base?</div>${outAtPicker}` : ''}
    <p class="walkthrough-summary">${escHtml(fieldPlaySummary(fp))}</p>`;
}
/* ---------- G1b-r3: IN-GRID PLAY ENTRY ----------

const GG_ENTRY_LABEL = { H: 'Hit', O: 'Out', E: 'Error', FC: 'FC' };

// (G1b-r2c rule kept -- Joel, Sept 30); the last four are no-pitch events.
const GG_MORE = [

function ggDpAvailable(){

function gridStep(){
  const s = state.activeSession;
  if(s && s.kind === 'game' && !s.gamePendingPitch && !s.fieldPlay && tiebreakPending(s)) return 'tiebreak';   // G3 item 5
  if(!s || s.kind !== 'game' || !s.panelOpen) return null;
  if(s.gridAdv) return 'adv';   // Joel, Oct 1: ADV runners (see ggAdvEnabled)
  if(!s.gamePendingPitch) return ggRadarOn() ? 'velo' : 'ready';   // a direct-record pitch is in
  const fp = s.fieldPlay;

    if(fp.fixOpen) return 'fix';

async function ggSave(){ await storSet(draftKey(), state.activeSession); render(); }

async function ggAfter(fn){

  if(!s.panelOpen){ s.gameDot = null; s.gameVeloIdx = null; s.gridAdv = null; s.ggAdvIds = []; }
  await ggSave();
}
