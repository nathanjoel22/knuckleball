};

/* ---------- ACCOUNT SETUP RECOVERY (P1-12) ----------
   Shown when init() reached the server but the account is still incomplete:
   'role' -> no profile and no usable signup metadata (ask coach/pitcher + name);
   'team' -> a coach with a profile but no team. Both submit to the same
   idempotent RPC that the server-side trigger and init() use. */
window.submitAccountSetup = async function(role){
  // Stash typed values so an error re-render doesn't wipe them.
  const nameEl = document.getElementById('setup-name');
  const teamEl = document.getElementById('setup-team');
  if(nameEl) state.setupName = nameEl.value;
  if(teamEl) state.setupTeam = teamEl.value;

  const payload = {};
  if(state.setupNeeded === 'role'){
    const name = state.setupName.trim();
    if(!name){ state.setupError = 'Enter your name.'; render(); return; }
    payload.p_role = role;
    payload.p_full_name = name;
    if(role === 'coach'){
      const team = state.setupTeam.trim();
      if(!team){ state.setupError = 'Enter a team or program name.'; render(); return; }
      payload.p_team_name = team;
    }
  } else {
    const team = state.setupTeam.trim();
    if(!team){ state.setupError = 'Enter a team or program name.'; render(); return; }
    payload.p_team_name = team;
  }

  state.setupBusy = true;
  state.setupError = null;
  render();

  // S4: a second-sport coach profile has no signup metadata -- its first
  // team is created for THAT profile, not the login's primary one.
  const nonPrimaryTeam = state.setupNeeded === 'team' && state.profile && state.profile.is_primary === false;
  const { data, error } = nonPrimaryTeam
    ? await supabaseClient.rpc('create_team', { p_name: payload.p_team_name, p_profile: state.profile.id })
    : await supabaseClient.rpc('ensure_account_setup', payload);
  state.setupBusy = false;
  if(error){
    state.setupError = 'Setup failed: ' + error.message;
    render();
    return;
  }
  if(!nonPrimaryTeam && data && (data.needs_role || data.needs_team)){
    state.setupError = 'That didn’t complete setup — please check the fields and try again.';
    render();
    return;
  }

  // Rows exist now -- re-run init() from the top to load the app normally.
  state.setupNeeded = null;
  state.setupName = '';
  state.setupTeam = '';
  state.loaded = false;
  render();
  await init();
};

/* ---------- PITCH MIX + THROWS (Profile pages; pitcher edits own, coach edits a rostered pitcher) ----------
   A pitcher writes their own row directly (pitch_types / throws are the only
   profile columns clients may update); a coach goes through coach_set_pitch_types /
   coach_set_throws, which only accept a pitcher on one of the coach's own teams. */
async function savePitchMix(types){
  let ok = false;
  if(isCoach()){
    const p = currentPitcher();
    if(!p) return false;
    const { error } = await supabaseClient.rpc('coach_set_pitch_types', { p_pitcher_id: p.id, p_types: types });
    ok = !error;
    if(ok) p.pitchTypes = types;
  } else {
    const { error } = await supabaseClient.from('profiles').update({ pitch_types: types }).eq('id', state.profile.id);
    ok = !error;
    if(ok) state.profile.pitch_types = types;
  }
  state.profileMsg = ok ? '' : 'Could not save. Check your connection and try again.';
  if(ok) await saveLastKnownContext();   // New Session reads the mix offline from this snapshot
  return ok;
}
window.addPitchType = async function(){

/* ---------- UNIFORM NUMBER (pitcher for themself, coach for their roster) ----------
   One value per pitcher per team (pitcher_teams.uniform_number). Once set it
   shows locked with a "Change number" button. Pitcher and coach both write it
   through set_uniform_number(), which refuses a save if the number changed since
   this screen loaded (conflict) and hands back the current value instead.
   U7: edited from the Profile pages, one row per team. */
function uniformTargetFor(teamId, pitcherId){
  if(!teamId || !pitcherId) return null;
  if(isCoach()){
    const p = state.roster.find(x => x.id === pitcherId);
    return (p && teamId === state.currentTeamId)
      ? { teamId, pitcherId, number: p.uniformNumber, apply: n => { p.uniformNumber = n; sortRoster(); } } : null;
  }
  const t = state.teams.find(x => x.id === teamId);
  return t ? { teamId, pitcherId, number: (t.uniform_number === undefined ? null : t.uniform_number), apply: n => { t.uniform_number = n; } } : null;
}
function uniformRowHtml(teamId, pitcherId, label){
  const t = uniformTargetFor(teamId, pitcherId);
  if(!t) return '';
  const key = pitcherId + ':' + teamId;
  const editing = state.uniformEditKey === key;
  const msg = (state.uniformMsgKey === key && state.uniformMsg) ? `<span class="uniform-msg">${state.uniformMsg}</span>` : '';
  if(t.number !== null && !editing){
    return `<div class="uniform-field"><span class="field-label">${escHtml(label)}</span>
      <div class="uniform-locked"><span class="uniform-locked-num">${t.number}</span>
      <button class="btn btn-ghost" onclick="editUniformNumber('${teamId}','${pitcherId}')">Change number</button></div>${msg}</div>`;
  }
  return `<div class="uniform-field"><span class="field-label">${escHtml(label)}</span>
    <div class="uniform-locked"><input id="uniform-input-${teamId}" class="text-input" type="number" inputmode="numeric" min="0" max="99" placeholder="—" value="${t.number === null ? '' : t.number}" onkeydown="if(event.key==='Enter')saveUniformNumber('${teamId}','${pitcherId}')">
    <button class="btn btn-primary" onclick="saveUniformNumber('${teamId}','${pitcherId}')">Save</button>
    ${t.number !== null ? '<button class="btn btn-ghost" onclick="cancelUniformEdit()">Cancel</button>' : ''}</div>${msg}</div>`;
}
window.editUniformNumber = function(teamId, pitcherId){
  state.uniformEditKey = pitcherId + ':' + teamId;
  state.uniformMsg = '';
  render();
};
window.cancelUniformEdit = function(){

  render();

window.saveUniformNumber = async function(teamId, pitcherId){
  const t = uniformTargetFor(teamId, pitcherId);
  const el = document.getElementById('uniform-input-' + teamId);
  if(!t || !el) return;
  const key = pitcherId + ':' + teamId;
  const raw = (el.value || '').trim();
  let val = null;
  if(raw !== ''){
    val = Number(raw);
    if(!Number.isInteger(val) || val < 0 || val > 99){
      state.uniformMsg = 'Enter a uniform number from 0 to 99.'; state.uniformMsgKey = key;
      render();
      return;
    }
  }
  const { data, error } = await supabaseClient.rpc('set_uniform_number', {
    p_team_id: t.teamId, p_pitcher_id: t.pitcherId, p_number: val, p_expected: t.number
  });
  state.uniformMsgKey = key;
  if(error){
    state.uniformMsg = 'Could not save the number. Try again.';
    render();
    return;
  }
  if(data && data.conflict){
    t.apply(data.current === undefined ? null : data.current);
    state.uniformEditKey = null;
    state.uniformMsg = data.current === null || data.current === undefined
      ? 'This number was just cleared by someone else. Showing the latest.'
      : `This number was just changed to ${data.current} by someone else. Showing the latest.`;
    render();
    return;
  }
  t.apply(val);
  state.uniformEditKey = null;
  state.uniformMsg = '';
  await saveLastKnownContext();
  render();
};
// Pull the latest numbers from the server (a coach edit shows up for the
// pitcher and vice versa) without disturbing anything else on screen.
async function refreshUniformNumbers(){
  if(!state.profile || !state.currentTeamId || state.uniformEditKey) return;
  try{
    let changed = false;
    if(isCoach()){
      const { data } = await supabaseClient.from('pitcher_teams').select('pitcher_id, uniform_number').eq('team_id', state.currentTeamId);
      (data || []).forEach(r => {
        const p = state.roster.find(x => x.id === r.pitcher_id);
        const n = r.uniform_number === undefined ? null : r.uniform_number;
        if(p && p.uniformNumber !== n){ p.uniformNumber = n; changed = true; }
      });
      if(changed) sortRoster();
    } else {
      const { data } = await supabaseClient.from('pitcher_teams').select('team_id, uniform_number').eq('pitcher_id', state.profile.id);
      (data || []).forEach(r => {
        const t = state.teams.find(x => x.id === r.team_id);
        const n = r.uniform_number === undefined ? null : r.uniform_number;
        if(t && (t.uniform_number === undefined ? null : t.uniform_number) !== n){ t.uniform_number = n; changed = true; }
      });
    }
    // Don't yank a form out from under someone who is typing in it.
    const ae = document.activeElement;
    const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT' || ae.tagName === 'TEXTAREA');
    if(changed && !typing) render();
  }catch(e){ /* best-effort */ }
}

/* ---------- SESSION LOGGING (pitcher only) ---------- */
function draftKey(){ return 'draft:' + state.currentPitcherId + ':' + state.currentTeamId; }
// U5: one place a fresh session gets constructed, so chartingPerspective's
// default (the device's last choice, remembered per PERSPECTIVE_PREF_KEY)
// is only ever read in one spot rather than duplicated at each call site.
async function freshActiveSession(){
  const lastPerspective = await storGet(PERSPECTIVE_PREF_KEY);
  // U2a: currentBatterSide always starts 'R' -- deliberately NOT remembered
  // across sessions like chartingPerspective is (see sessionBatterSide's
  // comment). U9: usesRadarGun is deliberately NOT set here -- an empty,
  // not-yet-started session always tracks the current live toggle
  // (sessionUsesRadarGun() ignores this field until pitches.length > 0);
  // it only gets written once, in handleZoneTap, at the actual moment the
  // first pitch lands. G1: kind starts null -- the chooser (New Session,
  // not Resume) is what sets it; renderSessionView() shows the chooser
  // instead of any charting UI whenever it's still null. The game-only
  // counters are set by chooseSessionKind() once 'game' is actually
  // picked, not here, so a bullpen session never carries them at all.
  return { kind: null, pitches: [], startedAt: Date.now(), chartingPerspective: lastPerspective || 'behind_catcher', currentBatterSide: 'R' };
}
async function refreshDraftState(){
  if(!state.currentPitcherId){ state.draftAvailable = false; state.activeSession = null; return; }
  const draft = await storGet(draftKey());
  // G1b: a draft is also worth offering even with ZERO committed pitches
  // if it's mid-flow on a field play or an Adjust Runners event -- caught
  // by testing the killed-browser/resume path specifically on a game's
  // FIRST pitch: pre-G1b, a bare pendingTarget/gamePendingPitch with no
  // pitches yet was low-value enough to lose (an "acceptable small loss on
  // a crash," documented elsewhere in this file) and this gate never
  // needed to consider it. The field flow's multi-step state (location,
  // bb_type, batter result, runner endings) represents real charter effort
  // that G1b now deliberately preserves everywhere else -- discarding it
  // here specifically because it happens to be the game's first pitch
  // would silently contradict that.
  const hasMidFlowProgress = draft && (draft.gamePendingPitch || draft.fieldPlay || draft.adjustRunners);
  if(draft && ((draft.pitches && draft.pitches.length) || hasMidFlowProgress)){
    state.draftAvailable = true;
    state.pendingDraft = draft;
    state.activeSession = null;
  } else {
    state.draftAvailable = false;
    state.pendingDraft = null;
    state.activeSession = await freshActiveSession();
  }
  state.selectedType = null;
  state.pendingTarget = null;
  state.veloTargetIdx = null;
  state.flashCell = null;
  state.editDraftRow = null;
  // G1b: gamePendingPitch/gameResultMenu/gamePendingOutcome/gamePendingHitType
  // moved onto state.activeSession (see resumeDraft's comment) -- no longer
  // nulled here. In the "pending draft available" branch above,
  // state.activeSession is null until resumeDraft() actually activates it,
  // so there'd be nothing to null anyway; in the "fresh session" branch, a
  // brand-new activeSession simply doesn't have these keys yet (undefined,
  // same as an explicit null for every falsy check on them).
}
window.resumeDraft = function(){
  state.activeSession = state.pendingDraft;
  // Defensive: a draft persisted before U5/U2a/U9/G1 shipped won't carry
  // these fields. A pre-G1 draft has no `kind` at all -- it can only be a
  // bullpen (the chooser didn't exist yet), so default it rather than
  // leaving it null (which would show the chooser mid-resume).
  state.activeSession.chartingPerspective = sessionPerspective(state.activeSession);
  state.activeSession.currentBatterSide = sessionBatterSide(state.activeSession);
  state.activeSession.usesRadarGun = sessionUsesRadarGun(state.activeSession);
  if(!state.activeSession.kind) state.activeSession.kind = 'bullpen';
  // G1b: same defensive-default pattern as `kind` just above -- a draft
  // saved before this shipped has no `runners` at all. Caught by testing
  // the resume-then-chart-a-new-pitch path directly: without this,
  // runnersBitmask(undefined) throws the moment the very next pitch is
  // recorded, crashing charting entirely for anyone resuming an in-flight
  // game from before this deploy. Empty bases is the only sane default --
  // there is no way to recover what was actually on base from a draft that
  // never tracked it.
  if(state.activeSession.kind === 'game' && !state.activeSession.runners){
    state.activeSession.runners = { 1: false, 2: false, 3: false };
  }
  // G1b-r2a: same defensive-default pattern -- a draft saved before the
  // drop-down panel shipped has no panelOpen at all (undefined, falsy),
  // which would leave a genuinely in-progress pitch/walkthrough invisible
  // (clipped away, since .game-panel-body needs .open) even though the
  // data itself resumed fine. Derive it from whatever's actually pending.
  if(state.activeSession.kind === 'game' && state.activeSession.panelOpen === undefined){
    state.activeSession.panelOpen = !!(state.activeSession.gamePendingPitch || state.activeSession.fieldPlay);
  }
  // G1b-r3: a draft saved on the in-grid velocity step of an already-
  // recorded pitch comes back on that same step (veloTargetIdx itself is
  // in-memory only). An older r2a draft left open with nothing pending gets
  // the last pitch; one with no pitches at all just closes.
  if(state.activeSession.kind === 'game' && state.activeSession.panelOpen && !state.activeSession.gamePendingPitch && !state.activeSession.fieldPlay){
    const pts = state.activeSession.pitches || [];
    const idx = (state.activeSession.gameVeloIdx !== undefined && state.activeSession.gameVeloIdx !== null) ? state.activeSession.gameVeloIdx : pts.length - 1;
    if(pts[idx]) state.veloTargetIdx = idx; else state.activeSession.panelOpen = false;
  }
  // G1b: deliberately NOT nulling gamePendingPitch/gameResultMenu/
  // gamePendingOutcome/gamePendingHitType here anymore -- they live on
  // state.activeSession now (the object just assigned above from
  // state.pendingDraft), so whatever mid-flow state was captured in the
  // last autosave before a crash/close is exactly what should reappear.
  // A pre-G1b draft simply doesn't have these keys on it at all
  // (undefined), which every `if(!state.activeSession.gamePendingPitch)`-
  // style check throughout this file already treats the same as null --
  // additive, resumes exactly as today for an old draft.
  state.draftAvailable = false;
  render();
};

  await storDelete(draftKey());

// U2a: unlike perspective, batter side is NEVER locked -- it varies freely
// within one pen (approach g). Flipping only affects pitches charted AFTER
// this call; already-logged pitches keep whatever batterSide they were
// captured with (see handleZoneTap and isRelativelyAccurate's comments).
/* ---------- U11 (5): BULLPEN "BATTER: NONE / RHB / LHB" ----------
   Joel, Sept 30: most pens have no hitter standing in. batterMode 'none'
   (the default for a NEW bullpen) keeps the familiar right-handed frame --
   grid numbering, zone painting and relative-accuracy scoring all use the
   RHB definitions (sessionBatterSide stays 'R'; isRelativelyAccurate
   already falls back to 'R' for a pitch with no side) -- but stores
   batter_side = NULL on each pitch, so nothing lands in vs-RHB stats, and
   the silhouette flip is hidden. RHB / LHB behave exactly as before and can
   be picked mid-pen when a hitter steps in; each pitch keeps the side it
   was thrown with. A draft/session from before this (no batterMode) is
   treated as sided -- unchanged behavior. */
function sessionBatterMode(s){ return (s && s.batterMode) || 'sided'; }
function isNoBatter(s){ return !!s && s.kind === 'bullpen' && sessionBatterMode(s) === 'none'; }
window.setBatterMode = async function(mode){
  const s = state.activeSession;
  if(mode === 'none'){ s.batterMode = 'none'; s.currentBatterSide = 'R'; }
  else { s.batterMode = 'sided'; s.currentBatterSide = mode; }
  await storSet(draftKey(), s);
  render();
};
function renderBatterModeToggle(){
  const s = state.activeSession;
  const current = isNoBatter(s) ? 'none' : sessionBatterSide(s);
  const opts = [['none', 'None'], ['R', 'RHB'], ['L', 'LHB']];
  const chips = opts.map(([k, l]) => {
    const on = current === k;
    const style = on ? `background:var(--amber);border-color:var(--amber);` : `color:var(--ink-faint);border-color:var(--border-strong);`;
    return `<button class="type-chip${on ? ' selected' : ''}" style="${style}" onclick="setBatterMode('${k}')">${l}</button>`;
  }).join('');
  return `<div><div class="field-label" style="margin-bottom:8px;">Batter</div><div class="chip-row">${chips}</div></div>`;
}

/* ---------- U11 (7): TIME TO HOME (stopwatch) ----------
   Only under Set (a stretch measurement). Tap 1 = the pitcher's first
   move, tap 2 = the catcher's glove; the reading shows on the button and
   attaches to the NEXT pitch recorded (the location tap that follows), then
   clears. Tapping again before that pitch restarts. A reading nobody uses
   within 60 s is discarded. 0.80-3.00 s only -- anything else shows red and
   is never stored (a late start or stop). In-memory on purpose: nothing on
   the charting path waits on it, and it works offline like everything else. */
const TTP_MIN = 0.80, TTP_MAX = 3.00, TTP_KEEP_MS = 60000;
let ttpTicker = null, ttpExpiry = null;
function ttpState(){ return state.ttp || (state.ttp = { phase: 'idle', startedAt: 0, value: null, stoppedAt: 0 }); }
function ttpValid(v){ return v !== null && v >= TTP_MIN && v <= TTP_MAX; }
function ttpReset(){
  state.ttp = { phase: 'idle', startedAt: 0, value: null, stoppedAt: 0 };
  clearInterval(ttpTicker); ttpTicker = null;
  clearTimeout(ttpExpiry); ttpExpiry = null;
}
window.tapTimeToPlate = function(){
  const s = state.activeSession;
  if(!s || s.delivery !== 'set') return;
  const t = ttpState();
  if(t.phase === 'running'){
    t.phase = 'stopped';
    t.stoppedAt = Date.now();
    t.value = Math.round((t.stoppedAt - t.startedAt) / 10) / 100;
    clearInterval(ttpTicker); ttpTicker = null;
    clearTimeout(ttpExpiry);
    ttpExpiry = setTimeout(() => { if(ttpState().phase === 'stopped'){ ttpReset(); render(); } }, TTP_KEEP_MS);
  } else {                                   // idle or stopped: (re)start
    ttpReset();
    const n = ttpState();
    n.phase = 'running';
    n.startedAt = Date.now();
    // Live readout without a full re-render: only the button's text changes.
    ttpTicker = setInterval(() => {
      const b = document.getElementById('ttp-btn');
      if(b) b.textContent = '⏱ ' + ((Date.now() - n.startedAt) / 1000).toFixed(2);
    }, 50);
  }
  render();
};
// The reading for the pitch being recorded right now -- then the stopwatch
// clears, used or not. Only a stopped, in-range, fresh (<= 60 s) reading counts.
function takeTimeToPlate(){
  const t = ttpState();
  const v = (t.phase === 'stopped' && ttpValid(t.value) && Date.now() - t.stoppedAt <= TTP_KEEP_MS) ? t.value : null;
  if(t.phase !== 'idle') ttpReset();
  return v;
}
function renderTimeToPlateBtn(compact){
  const s = state.activeSession;
  const enabled = !!s && s.delivery === 'set';
  const t = ttpState();
  let label = compact ? '⏱' : '⏱ Time', cls = 'ttp-btn' + (compact ? ' ttp-compact' : '');
  if(t.phase === 'running'){ label = '⏱ ' + ((Date.now() - t.startedAt) / 1000).toFixed(2); cls += ' ttp-running'; }
  else if(t.phase === 'stopped'){ label = '⏱ ' + t.value.toFixed(2); cls += ttpValid(t.value) ? ' ttp-ok' : ' ttp-bad'; }
  return `<button type="button" id="ttp-btn" class="${cls}" ${enabled ? '' : 'disabled'} title="${enabled ? 'Time to home: tap at first move, tap again at the glove' : 'Time to home is timed from the stretch: choose Set'}" onclick="tapTimeToPlate()">${label}</button>`;
}

window.toggleBatterSide = async function(){
  state.activeSession.currentBatterSide = sessionBatterSide(state.activeSession) === 'R' ? 'L' : 'R';
  await storSet(draftKey(), state.activeSession);
  render();
};
/* ---------- VELOCITY STRIP (U6) ----------
   Velocity is added AFTER a pitch is recorded: tap 2 (where it landed) records
   the pitch with velocity null, and until the next pitch's first tap the strip
   attaches a tapped value to that last pitch. Not tapping leaves it null (shown
   as a dash). The strip centers on this pitcher's typical velocity for the pitch
   type -- 75 until they have 3 recorded, then an exponential moving average of
   their most recent 100. Nothing is ever pre-selected. */
// S1: VELO_MIN / VELO_MAX / VELO_DEFAULT_CENTER are the active sport's (applySport):
// baseball 40-105, centered at 75; softball 25-85, centered at 50.
let VELO_MIN = 40, VELO_MAX = 105, VELO_DEFAULT_CENTER = 75;
const VELO_MIN_SAMPLES = 3, VELO_RECENT = 100;
// How fast the center follows new pitches (exponential moving average). 0.15 puts
// half the weight on roughly the last 4-5 recorded pitches: quick enough to track
// a pitcher warming up or tiring within a pen, slow enough that one wild pitch
// doesn't yank the strip. Raise for faster, lower for steadier.
const VELO_EMA_ALPHA = 0.15;
// Before U6 the slider recorded an untouched default of 65 into real sessions
// (81% of recorded velocities in production were exactly 65). Those can't be
// told apart from real 65s, so a velocity of exactly 65 on a pitch charted
// before this timestamp is left out of the centering average. Pitches charted
// after it count normally.
const U6_CUTOFF_TS = 1789965601000;
// LOCKSTEP PAIR with public.is_default_velo_reading() in
// supabase/migrations/20260921090000_u8_team_leaderboard.sql (same value, 65, and the same
// cutoff: 1789965601 s = 2026-09-21 04:40:01 UTC). The team leaderboard applies the SQL copy;
// everything in this file uses this one. A velocity of exactly 65 on a pitch charted before
// the cutoff is the old slider's untouched default, i.e. NO reading. Stored pitches are never
// changed -- this only decides what counts. Change both together or a pitcher's numbers will
// differ between the app and the leaderboard.
function isDefaultVeloReading(pt){ return pt.velo === 65 && pt.ts < U6_CUTOFF_TS; }
function veloVisible(){
  // G1b-r3: the Live Game velocity step draws the strip inside the grid's
  // three right-hand columns -- 3 speeds across keeps each a real tap target
  // there (matches .gg-velo's --velo-visible). Bullpen never has .gg-velo.
  if(document.querySelector('.gg-velo')) return 5;
  if(document.querySelector('.velo-slim')) return 3;   // G1b-r5: pen velocity squares match the pitch squares   // row 4 spans the whole grid: 5 across keeps each >= 44px even at 320px
  return window.matchMedia('(max-width:500px)').matches ? 5 : 7;
}
// Exponential moving average of the pitcher's most recent 100 recorded velocities
// for this pitch type (oldest -> newest). Seeded with the plain average of the
// first 3, then every later pitch is folded in as it is recorded, so recent
// pitches count most. Fewer than 3 recorded: the 75 default.
function veloCenter(velos){
  if(velos.length < VELO_MIN_SAMPLES) return VELO_DEFAULT_CENTER;
  const recent = velos.slice(-VELO_RECENT);
  let ema = recent.slice(0, VELO_MIN_SAMPLES).reduce((a, b) => a + b, 0) / VELO_MIN_SAMPLES;
  for(let i = VELO_MIN_SAMPLES; i < recent.length; i++){
    ema += VELO_EMA_ALPHA * (recent[i] - ema);
  }
  return Math.max(VELO_MIN, Math.min(VELO_MAX, Math.round(ema)));
}
function veloHistoryKey(){ return 'veloHistory:' + (state.session ? state.session.user.id : ''); }
async function loadVeloHistory(){
  if(state.veloHistory) return;
  state.veloHistory = (await storGet(veloHistoryKey())) || {};
}
function veloBucketKey(){ return state.currentPitcherId + ':' + state.currentTeamId; }
// Rebuild this pitcher+team's cached velocities from data we just loaded from the
// server plus any sessions still queued to sync. Only ever called after a
// successful server load, so an offline start can't wipe the cache.
async function rebuildVeloHistory(serverSessions){
  await loadVeloHistory();
  const seen = new Set();
  const rows = [];
  const take = (sessionId, pitches) => {
    if(seen.has(sessionId)) return;
    seen.add(sessionId);
    (pitches || []).forEach(pt => {
      if(pt.velo === null || pt.velo === undefined) return;
      if(isDefaultVeloReading(pt)) return;
      rows.push({ type: pt.type, velo: pt.velo, ts: pt.ts });
    });
  };
  (serverSessions || []).forEach(sess => take(sess.id, sess.pitches));
  (state.outbox || []).filter(it => it.pitcherId === state.currentPitcherId && it.teamId === state.currentTeamId)
    .forEach(it => take(it.id, it.pitches));
  rows.sort((a, b) => a.ts - b.ts);
  const byType = {};
  rows.forEach(r => { (byType[r.type] = byType[r.type] || []).push(r.velo); });
  Object.keys(byType).forEach(t => { byType[t] = byType[t].slice(-VELO_RECENT); });
  state.veloHistory[veloBucketKey()] = byType;
  await storSet(veloHistoryKey(), state.veloHistory);
}
// Offline-safe: add a just-ended session's velocities to the cache directly.
async function appendVeloHistory(pitcherId, teamId, pitches){
  await loadVeloHistory();
  const k = pitcherId + ':' + teamId;
  const byType = state.veloHistory[k] || (state.veloHistory[k] = {});
  (pitches || []).slice().sort((a, b) => a.ts - b.ts).forEach(pt => {
    if(pt.velo === null || pt.velo === undefined) return;
    (byType[pt.type] = byType[pt.type] || []).push(pt.velo);
    byType[pt.type] = byType[pt.type].slice(-VELO_RECENT);
  });
  await storSet(veloHistoryKey(), state.veloHistory);
}
function veloCenterFor(type){
  const hist = ((state.veloHistory || {})[veloBucketKey()] || {})[type] || [];
  const live = ((state.activeSession && state.activeSession.pitches) || [])
    .filter(pt => pt.type === type && pt.velo !== null && pt.velo !== undefined)
    .map(pt => pt.velo);
  return veloCenter(hist.concat(live));
}
function veloStripActive(){
  const pitches = state.activeSession && state.activeSession.pitches;
  // G1: gamePendingPitch is the game-mode equivalent of pendingTarget here
  // -- a pitch mid-capture (location tapped, result not chosen yet) has
  // nothing at veloTargetIdx to attach a reading to, same reasoning as
  // pendingTarget for a bullpen's tap 1.
  return state.veloTargetIdx !== null && !!pitches && !!pitches[state.veloTargetIdx]
    && !state.pendingTarget && !(state.activeSession && state.activeSession.gamePendingPitch) && state.editDraftRow === null;
}
window.recordVelo = async function(v){
  if(!veloStripActive()) return;
  state.activeSession.pitches[state.veloTargetIdx].velo = v;
  await storSet(draftKey(), state.activeSession);
  render();
};
// Joel, Oct 1: the in-grid bar's < > arrows step the selected speed by 1
// mph (starting from whatever sits in the center window) and keep it
// centered -- same result as sliding the bar one notch.
window.gameVeloArrow = function(dir){
  const strip = document.querySelector('.gg-velo .velo-strip');
  if(!strip) return veloStripShift(dir);
  const t = gameVeloTarget();
  if(!t) return;
  const visible = veloVisible(), half = Math.floor(visible / 2);
  const cellW = strip.clientWidth / visible;
  const centered = VELO_MIN + Math.round(strip.scrollLeft / cellW) + half;
  const cur = (t.obj.velo === null || t.obj.velo === undefined) ? centered : t.obj.velo;
  const v = Math.max(VELO_MIN, Math.min(VELO_MAX, cur + dir));
  state.veloScrollLeft = (v - VELO_MIN - half) * cellW;   // attachVeloStrip restores this after the render
  recordGameVelo(v);
};
window.veloStripShift = function(dir){
  const strip = document.getElementById('velo-strip');
  if(!strip) return;
  strip.scrollBy({ left: dir * 3 * (strip.clientWidth / veloVisible()), behavior: 'smooth' });
};
function renderVeloStrip(){
  const active = veloStripActive();
  const target = active ? state.activeSession.pitches[state.veloTargetIdx] : null;
  const type = target ? target.type : state.selectedType;
  const center = type ? veloCenterFor(type) : VELO_DEFAULT_CENTER;
  let cells = '';
  for(let v = VELO_MIN; v <= VELO_MAX; v++){
    const cls = 'velo-cell' + (v === center ? ' typical' : '') + (target && target.velo === v ? ' selected' : '');
    cells += `<button class="${cls}" ${active ? '' : 'disabled'} onclick="recordVelo(${v})">${v}</button>`;
  }
  const help = active
    ? `Tap the velocity for pitch ${state.veloTargetIdx + 1}, or skip it — a skipped pitch shows a dash.`
    : (state.pendingTarget ? 'Tap where it landed to finish this pitch, then add its velocity.' : 'Velocity opens after each pitch is recorded.');
  return `
    <div class="velo-strip-wrap${active ? '' : ' disabled'}">
      <button class="velo-arrow" ${active ? '' : 'disabled'} onclick="veloStripShift(-1)" aria-label="Lower speeds">‹</button>
      <div class="velo-strip" id="velo-strip" data-key="${state.veloTargetIdx}|${type}|${center}|${veloVisible()}" data-center="${center}">${cells}</div>
      <button class="velo-arrow" ${active ? '' : 'disabled'} onclick="veloStripShift(1)" aria-label="Higher speeds">›</button>
    </div>
    <div class="velo-help">${help}</div>`;
}
// Runs after each render: center the strip on the typical value, but keep the
// scroll position across re-renders that don't change what it's centered for.
function attachVeloStrip(){
  const strip = document.getElementById('velo-strip');
  if(!strip) return;
  const visible = veloVisible();
  const cellW = strip.clientWidth / visible;
  const key = strip.getAttribute('data-key');
  if(key === state.veloStripKey){
    strip.scrollLeft = state.veloScrollLeft;
  } else {
    const center = parseInt(strip.getAttribute('data-center'), 10);
    strip.scrollLeft = (center - VELO_MIN - Math.floor(visible / 2)) * cellW;
    state.veloStripKey = key;
    state.veloScrollLeft = strip.scrollLeft;
  }
  strip.addEventListener('scroll', () => { state.veloScrollLeft = strip.scrollLeft; }, { passive: true });
}
// G1b-r2b: .game-panel-body is torn down and recreated on every single
// render (the whole #app is replaced via innerHTML -- see render() itself),
// and a freshly created element's scrollTop always starts at 0. Without
// this, ANY tap inside the open panel -- not just velocity, every position/
// bbType/glyph tap -- snapped the panel back to its own top, forcing a
// re-scroll down to reach Next Pitch after every single tap. Same track-
// in-state-then-restore-after-render pattern attachVeloStrip already uses
// for its own horizontal scroll, just for the panel's vertical scroll.
function attachGamePanelScroll(){
  const body = document.querySelector('.game-panel-body');
  if(!body) return;
  body.scrollTop = state.gamePanelScrollTop || 0;
  body.addEventListener('scroll', () => { state.gamePanelScrollTop = body.scrollTop; }, { passive: true });
}

/* ---------- G1b-r addendum: GAME MODE'S OWN VELOCITY STRIP ----------
   Bullpen's veloStripActive/renderVeloStrip/recordVelo (above, UNCHANGED --
   bullpen stays byte-for-byte identical, not just visually) only ever
   target an already-pushed pitch via veloTargetIdx. The packet's
   requirement here is different: game mode's strip has to reach a pitch
   that hasn't been pushed at all yet, while a field play is mid-walkthrough
   -- gamePendingPitch.velo holds it until recordGameResult/commitFieldPlay
   copies it onto the real pitch row. A branch inside the shared functions
   would risk exactly the coupling the "bullpen untouched" requirement is
   there to prevent, so this is a parallel, separate implementation instead
   -- same visual chrome (reuses .velo-strip-wrap/.velo-cell/.velo-arrow and
   the shared veloStripShift/attachVeloStrip, which are purely DOM/id-based
   and were already shared before this), different binding. */
function gameVeloTarget(){
  const s = state.activeSession;
  if(!s) return null;
  // "This pitch": mid-capture, whether the glyph row is still showing or a
  // field play is being walked through -- no pitch row exists yet either
  // way, so gamePendingPitch itself is what a velocity tap has to reach.
  if(s.gamePendingPitch) return { kind: 'pending', obj: s.gamePendingPitch, label: 'this pitch' };
  // "Last pitch": already pushed (a glyph tap, or a field play that just
  // committed) -- editable until the NEXT grid tap replaces gamePendingPitch
  // (handleGameZoneTap resets veloTargetIdx to null in the same breath it
  // creates a fresh one, so the two states never overlap).
  if(state.veloTargetIdx !== null && s.pitches[state.veloTargetIdx]){
    return { kind: 'recorded', obj: s.pitches[state.veloTargetIdx], label: 'last pitch' };
  }
  return null;
}
window.recordGameVelo = async function(v){
  const t = gameVeloTarget();
  if(!t) return;
  t.obj.velo = v;
  await storSet(draftKey(), state.activeSession);
  render();
};
function renderGameVeloStrip(){
  const t = gameVeloTarget();
  const target = t ? t.obj : null;
  const type = (target && target.type) || state.selectedType;
  const center = type ? veloCenterFor(type) : VELO_DEFAULT_CENTER;
  let cells = '';
  for(let v = VELO_MIN; v <= VELO_MAX; v++){
    const cls = 'velo-cell' + (v === center ? ' typical' : '') + (target && target.velo === v ? ' selected' : '');
    cells += `<button class="${cls}" ${t ? '' : 'disabled'} onclick="recordGameVelo(${v})">${v}</button>`;
  }
  const stripKey = `${t ? t.kind : 'none'}|${type}|${center}|${veloVisible()}`;
  const help = t
    ? `Editing <strong>${escHtml(t.label)}</strong> — tap the velocity, or skip it.`
    : 'Velocity opens once a pitch is pending or recorded.';
  // G1b-r2a: .game-velo wraps this instance only -- scopes the reference's
  // dark-selected-cell color to game mode without touching the shared
  // .velo-cell.selected rule bullpen's own renderVeloStrip also uses.
  return `<div class="game-velo">
    <div class="velo-strip-wrap${t ? '' : ' disabled'}">
      <button class="velo-arrow" ${t ? '' : 'disabled'} onclick="gameVeloArrow(-1)" aria-label="Slower">&lt;</button>
      <div class="velo-strip" id="velo-strip" data-key="${stripKey}" data-center="${center}">${cells}</div>
      <button class="velo-arrow" ${t ? '' : 'disabled'} onclick="gameVeloArrow(1)" aria-label="Faster">&gt;</button>
    </div>
    <div class="velo-help">${help}</div>
  </div>`;
}

window.handleZoneTap = async function(row, col){
  if(state.editDraftRow !== null){ state.hint = 'Finish editing that pitch first'; render(); return; }
  if(!state.selectedType){ state.hint = 'Select a pitch type first'; render(); return; }
  state.hint = '';

  if(!state.pendingTarget){
    // Tap 1 of a new pitch: the previous pitch's velocity is now locked as it
    // stands, and the strip stays off until this pitch's tap 2.
    state.pendingTarget = { row, col };
    state.veloTargetIdx = null;
    render();
    return;
  }

  const target = state.pendingTarget;
  const strike = isStrikeCell(row, col);
  // U5: the single normalize-at-capture point. Tapped (screen-frame)
  // columns are converted to the canonical catcher frame right here, once,
  // before anything reaches storage -- see mirrorCol's comment above.
  const chartingPerspective = sessionPerspective(state.activeSession);
  // U2a: batterSide is frozen onto the pitch at the moment of capture, read
  // from whatever the live toggle currently says -- permanently theirs
  // regardless of how many times the toggle flips later in the same
  // session (approach g).
  const batterSide = sessionBatterSide(state.activeSession);
  // U7B: score against the PITCHER's zone for this pitch type and batter side, if their
  // relative-accuracy switch is on and one is painted. Stored on the pitch now (with a copy
  // of the cells) so repainting a zone later never changes a saved session. Zones are in
  // catcher frame, and the tapped column is normalized to it here, like every coordinate.
  const chartPitcher = currentPitcher();
  const zoneCells = (chartPitcher && chartPitcher.relativeAccuracy)
    ? zoneCellsFor(state.currentPitcherId, state.selectedType, batterSide) : null;
  const inAccuracyZone = zoneCells ? zoneCells.includes(row + '-' + perspectiveCol(col, chartingPerspective)) : null;
  // U9: this is the actual freeze point for the radar-gun setting -- right
  // before the FIRST pitch of the pen lands, while sessionUsesRadarGun()
  // still reads live (pitches.length is still 0 here). From this line on,
  // pitches.length > 0 and every later call reads this stored value
  // instead, so a toggle flip mid-pen can't affect it -- but nothing before
  // this moment was ever frozen, so switching to New Session right after
  // changing the toggle in Profile shows the new value immediately, no
  // reload needed.
  if(state.activeSession.pitches.length === 0){
    state.activeSession.usesRadarGun = sessionUsesRadarGun(state.activeSession);
  }
  state.activeSession.pitches.push({
    id: genUUID(),
    type: state.selectedType, velo: null,
    targetRow: target.row, targetCol: perspectiveCol(target.col, chartingPerspective),
    actualRow: row, actualCol: perspectiveCol(col, chartingPerspective),
    accuracyMode: null,   // U7B: the old per-session modes are retired for new pitches; zone result below
    inAccuracyZone,
    accuracyZoneCells: zoneCells ? zoneCells.slice() : null,
    // U11 (5): no hitter standing in -> no side on the pitch (zone scoring
    // above still used the RHB zones via batterSide).
    batterSide: isNoBatter(state.activeSession) ? null : batterSide,
    delivery: state.activeSession.delivery || null,   // U11 (6)
    timeToPlate: takeTimeToPlate(),                   // U11 (7)
    ts: Date.now()
  });
  state.pendingTarget = null;
  state.veloTargetIdx = state.activeSession.pitches.length - 1;
  await storSet(draftKey(), state.activeSession);
  const flashKey = uid();
  state.flashCell = { row, col, strike, key: flashKey };
  render();
  setTimeout(() => {
    if(state.flashCell && state.flashCell.key === flashKey){
      state.flashCell = null;
      render();
    }
  }, 1400);
};
window.resetTarget = function(){
  state.pendingTarget = null;
  render();
};
/* ---------- IN-SESSION PITCH CORRECTION (P1-05, interim) ----------
   Fixes a mis-tap in the moment, on the active draft only -- pure
   localStorage, no network, same persistence path as logging a pitch, so
   P0-03 restore and P1-01 sync still see the corrected pitches. Location
   isn't editable here (you just tapped it -- remove + re-chart); post-hoc
   editing of a saved session covers type/target/actual/velo. */
window.removePitch = async function(realIdx){
  state.activeSession.pitches.splice(realIdx, 1);
  state.pendingTarget = null;
  state.veloTargetIdx = null;
  if(state.editDraftRow === realIdx) state.editDraftRow = null;
  await storSet(draftKey(), state.activeSession);
  render();
};
window.startEditDraftRow = function(realIdx){
  state.editDraftRow = realIdx;
  state.editVeloError = '';
  render();
};
window.cancelEditDraftRow = function(){
  state.editDraftRow = null;
  state.editVeloError = '';
  render();
};
window.saveEditDraftRow = async function(realIdx){
  const pitch = state.activeSession.pitches[realIdx];
  if(!pitch){ state.editDraftRow = null; render(); return; }
  const typeEl = document.getElementById('edit-draft-type');
  const veloEl = document.getElementById('edit-draft-velo');
  if(typeEl && typeEl.value) pitch.type = typeEl.value;
  if(veloEl){
    const raw = veloEl.value.trim();
    if(raw === '' || !Number.isFinite(Number(raw))){
      pitch.velo = null;                       // blank or non-numeric: no reading, never 0
    } else {
      const n = Number(raw);
      if(!Number.isInteger(n) || n < VELO_MIN || n > VELO_MAX){
        state.editVeloError = `Enter a whole number from ${VELO_MIN} to ${VELO_MAX} mph.`;
        state.editVeloDraft = raw;
        render();
        return;                                // rejected: nothing is saved
      }
      pitch.velo = n;
    }
  }
  state.editVeloError = '';
  state.editDraftRow = null;
  await storSet(draftKey(), state.activeSession);
  render();
};
// Back-compat: the newest-row quick action used to be "Undo".
window.undoLastPitch = function(){ return window.removePitch(state.activeSession.pitches.length - 1); };

window.endSession = async function(){
  if(!state.activeSession.pitches.length){ state.hint = 'Log at least one pitch before ending the session'; render(); return; }
  // Setting saving=true and painting it before any await closes the only
  // reentrancy gap a double-tap could hit here (storSet below is async but
  // does no real I/O, so this is mostly belt-and-suspenders).
  state.saving = true;
  state.hint = '';
  render();

  // Ending a session never waits on the network: it moves straight into
  // the offline outbox (queue-and-sync, P1-01) and the UI moves on
  // immediately. A background sync attempt follows, and reconnecting later
  // (or reopening the app, or tapping "Sync now") retries anything still
  // queued -- see syncOutbox().
  const sessionId = genUUID();
  const item = {
    id: sessionId,
    pitcherId: state.currentPitcherId,
    teamId: state.currentTeamId,
    loggedBy: state.profile.id,
    startedAt: state.activeSession.startedAt,
    endedAt: Date.now(),
    pitches: state.activeSession.pitches,
    // G1b (h): events[] nests beside pitches[] in the SAME queued item --
    // one queued item still means one session, per Joel's decision. Empty
    // for a bullpen (events never exist there) and for a game with no
    // Adjust Runners taps.
    events: state.activeSession.events || [],
    // G1: 'bullpen' | 'game', locked at the chooser -- see freshActiveSession
    // and chooseSessionKind. Defensive fallback for a pre-G1 in-flight
    // draft that somehow reached here (resumeDraft already defaults this,
    // but endSession has its own callers to be safe for).
    kind: state.activeSession.kind || 'bullpen',
    chartingPerspective: sessionPerspective(state.activeSession),
    // G2 approach (b): opponent is whatever's in the field right now (never
    // touched for a bullpen -- undefined there, mapped to null in
    // syncOutbox same as every other game-only column). The counters are
    // reconstructed from the session's own live inning/outs -- every
    // COMPLETED prior inning contributed exactly 3 outs (gameNewInning and
    // every outs>=3 rollover both enforce this), and Adjust Runners'
    // manual outs (caught stealing, a pickoff) already flow through the
    // same s.outs/s.inning via applyRunnerAdvances, so this is genuinely
    // the total, not just the pitch-derived subset compute_game_summary's
    // fallback would otherwise have to guess at.
    opponent: (state.activeSession.kind === 'game' && state.activeSession.opponent) ? state.activeSession.opponent : null,
    gameFinalInning: state.activeSession.kind === 'game' ? state.activeSession.inning : null,
    gameOutsRecorded: state.activeSession.kind === 'game' ? ((state.activeSession.inning - 1) * 3 + state.activeSession.outs) : null,
    queuedAt: Date.now(),
    lastError: null,
    lastAttemptAt: null
  };
  await enqueueOutboxItem(state.session.user.id, item);
  await storDelete(draftKey());

  await appendVeloHistory(item.pitcherId, item.teamId, item.pitches);

  state.activeSession = await freshActiveSession();
  state.selectedType = null;
  state.pendingTarget = null;
  state.veloTargetIdx = null;
  state.editDraftRow = null;
  state.activeSession.gamePendingPitch = null;
  state.activeSession.gameResultMenu = null;
  state.activeSession.gamePendingOutcome = null;
  state.activeSession.gamePendingHitType = null;
  state.activeSession.fieldPlay = null;
  state.activeSession.adjustRunners = null;
  state.saving = false;
  await refreshOutboxState();
  state.view = 'history';
  state.expandedSessionId = sessionId;
  state.historyLandingNoClear = state.currentPitcherId;   // U10 (3): the saver keeps his dots
  render();

  triggerSync();
};

/* ---------- DELETE A SAVED SESSION (P1-15) ----------
   Synced sessions only. Soft-deletes the session (a tombstone stays in
   history) and hard-deletes its pitches, atomically, via the
   delete_session RPC -- which re-checks entitlement under the caller's
   own RLS. Pitch data is never editable after save; this is the only
   post-save mutation. A queued/unsynced session isn't in the DB yet, so
   none of this touches the P1-01 outbox. */
window.startDeleteSession = function(sessionId){
  state.deletingSessionId = sessionId;
  state.deleteConfirmText = '';
  state.deleteError = null;
  render();
};
window.cancelDeleteSession = function(){
  clearDeleteState();
  render();
};
window.onDeleteConfirmInput = function(v){ state.deleteConfirmText = v; };
// G2 approach (b): same no-render-on-keystroke pattern as
// onDeleteConfirmInput above -- app.innerHTML is rebuilt wholesale on every
// render(), so an input handler that doesn't need to change anything else
// on screen just updates state directly and lets the browser's own native
// typing show the keystroke. maxlength=60 caps normal typing; sliced here
// too in case a paste exceeds it, matching sessions_opponent_length's own
// cap. Like onDeleteConfirmInput, this value isn't written to the draft
// until some OTHER action saves it -- endSession() below reads it live
// from memory regardless, so this only matters for surviving a reload
// mid-keystroke, same tradeoff that field already accepts.
window.onGameOpponentInput = function(v){
  state.activeSession.opponent = v.slice(0, 60);
};
window.confirmDeleteSession = async function(){
  const el = document.getElementById('delete-confirm-input');
  if(el) state.deleteConfirmText = el.value;
  if(state.deleteConfirmText.trim().toUpperCase() !== 'DELETE'){
    state.deleteError = 'Type DELETE to confirm.';
    render();
    return;
  }
  const id = state.deletingSessionId;
  state.deleteBusy = true;
  state.deleteError = null;
  render();

  const { data, error } = await supabaseClient.rpc('delete_session', { p_session_id: id });
  state.deleteBusy = false;
  if(error || (data && data.error)){
    state.deleteError = 'Could not delete: ' + ((error && error.message) || data.error);
    render();
    return;
  }

  // Best-effort report cleanup: the session is already correctly deleted at
  // this point (the part that matters -- it's gone from every stat, trend,
  // and the leaderboard). If this fails, the old report link outlives the
  // session it describes rather than anything breaking for the user, so it
  // isn't allowed to block or error out the deletion that already
  // succeeded -- just logged for later cleanup.
  if(data && data.report_path){
    try{
      await callSendReportFunction({ action: 'deleteReport', sessionId: id });
    }catch(e){ console.error('report cleanup after delete failed', e); }
  }

  clearDeleteState();
  if(state.expandedSessionId === id) state.expandedSessionId = null;
  await loadSessionsForCurrentSelection();
  render();
};

/* ---------- OFFLINE OUTBOX + SYNC (P1-01) ----------
   A completed session lands here the instant "End session" is tapped, so
   finishing a session never blocks on the network. Each item's id is the
   session's own client-generated UUID and every write below is an upsert
   keyed on that id (pitches keyed on their own ids), so a sync that runs
   twice -- a retry, two triggers overlapping, a reconnect mid-attempt --
   just re-upserts the same rows instead of duplicating them. Scoped per
   signed-in user (not per pitcher/team) so a coach's device can queue
   sessions for several pitchers at once and a shared device switching
   accounts doesn't mix their queues. */
function outboxKey(userId){ return 'outbox:' + userId; }
async function loadOutbox(userId){ return (await storGet(outboxKey(userId))) || []; }
async function enqueueOutboxItem(userId, item){
  const items = await loadOutbox(userId);
  items.push(item);
  await storSet(outboxKey(userId), items);
}
async function updateOutboxItem(userId, updated){
  const items = await loadOutbox(userId);
  const idx = items.findIndex(i => i.id === updated.id);
  if(idx >= 0){ items[idx] = updated; await storSet(outboxKey(userId), items); }
}
async function removeOutboxItem(userId, id){
  const items = await loadOutbox(userId);
  await storSet(outboxKey(userId), items.filter(i => i.id !== id));
}
async function refreshOutboxState(){
  state.outbox = state.session ? await loadOutbox(state.session.user.id) : [];
}
function pendingSessionsForCurrentSelection(){
  return state.outbox
    .filter(item => item.pitcherId === state.currentPitcherId && item.teamId === state.currentTeamId)
    .map(item => ({
      id: item.id,
      date: item.endedAt,
      loggedByCoach: item.loggedBy !== item.pitcherId,
      pitches: item.pitches,
      // G1: a queued-but-not-yet-synced item still needs to render as its
      // own kind of card in History before it's ever reached the server --
      // same defensive fallback as the synced-row mapper in
      // loadSessionsForCurrentSelection.
      kind: item.kind || 'bullpen',
      pending: true,
      lastError: item.lastError
    }));
}

let syncInFlight = null;
window.triggerSync = function(){
  if(!syncInFlight){
    syncInFlight = syncOutbox()
      .catch(err => console.error('syncOutbox failed', err))
      .finally(() => { syncInFlight = null; flushSessionOpened(); loadRosterDots(); });
    flushRosterSeen();   // U10 (3): queued dot clears ride along with every sync trigger
  }
  return syncInFlight;
};

async function syncOutbox(){
  if(!state.session) return;
  // Fail fast instead of hanging on a fetch that has no real network to
  // time out against -- navigator.onLine is only a heuristic (it can say
  // true with no real internet), so this is purely a fast-exit when it's
  // confidently false; a false positive just falls through to the normal
  // attempt-and-fail path below, same as without this check.
  if(typeof navigator !== 'undefined' && navigator.onLine === false) return;
  const userId = state.session.user.id;

  // A device that's been offline long enough for its access token to
  // expire needs a fresh one before Supabase will accept these writes --
  // try that first so a reconnect after a long outage doesn't need an
  // extra manual retry. Harmless no-op if the session is still fresh.
  // Bounded (P1-13): getSession() retries a failed refresh for ~20-30s,
  // and this runs at startup via finishInit() -- don't let it stall the
  // "Syncing…" state on a dead network; the upserts below fail fast enough.
  let liveSession = null, sessionChecked = false;
  try{
    const { data: refreshed } = await netTimeout(supabaseClient.auth.getSession());
    liveSession = refreshed && refreshed.session;
    sessionChecked = true;
  }catch(e){ /* timed out: inconclusive -- keep the current session and let the writes below try */ }
  if(liveSession) state.session = liveSession;
  else if(sessionChecked){
    // supabase-js answered and has no usable session, so every write below
    // would go out as anonymous and be rejected by RLS (see isGenuineSignOut).
    // Don't send them: a genuine sign-out goes to login; otherwise the
    // refresh just couldn't reach the server -- leave the items pending,
    // with no misleading error, for the next trigger.
    if(isGenuineSignOut()) goToLoginAfterSignOut();
    return;
  }

  const items = await loadOutbox(userId);
  if(!items.length) return;

  state.syncing = true;
  render();

  for(const item of items){
    const sessionRow = {
      id: item.id,
      pitcher_id: item.pitcherId,
      team_id: item.teamId,
      logged_by: item.loggedBy,
      started_at: new Date(item.startedAt).toISOString(),
      ended_at: new Date(item.endedAt).toISOString(),
      // Defensive fallback: an outbox item queued before U5 shipped won't
      // carry this field.
      charting_perspective: item.chartingPerspective || 'behind_catcher',
      // G1: defensive fallback for an item queued before this shipped --
      // every such item is, definitionally, a bullpen.
      kind: item.kind || 'bullpen',
      // G2 approach (b): undefined (a bullpen item, or a game item queued
      // before this shipped) becomes null explicitly -- same defensive
      // upsert reasoning as every other nullable column in pitchRows below
      // (an upsert must not leave a column untouched on a retry by omitting
      // the key). sessions_kind_check's own CHECK already enforces these
      // stay NULL for a bullpen; this just makes sure a game row's own
      // first-ever sync actually carries them.
      opponent: (item.opponent === undefined) ? null : item.opponent,
      game_final_inning: (item.gameFinalInning === undefined) ? null : item.gameFinalInning,
      game_outs_recorded: (item.gameOutsRecorded === undefined) ? null : item.gameOutsRecorded
    };
    const pitchRows = item.pitches.map(p => ({
      id: p.id,
      session_id: item.id, type: p.type, velo: p.velo,
      target_row: p.targetRow, target_col: p.targetCol,
      actual_row: p.actualRow, actual_col: p.actualCol,
      accuracy_mode: p.accuracyMode || null,
      in_accuracy_zone: (p.inAccuracyZone === true || p.inAccuracyZone === false) ? p.inAccuracyZone : null,
      accuracy_zone_cells: p.accuracyZoneCells || null,
      // U2a: per-pitch, not per-session (see the migration's comment) --
      // null for a pitch queued before this shipped, same defensive
      // fallback pattern as charting_perspective above.
      batter_side: p.batterSide || null,
      ts: new Date(p.ts).toISOString(),
      // G1: denormalized from the session (see the migration's comment on
      // pitches.kind) -- every pitch in one item shares its session's
      // kind, never mixed.
      kind: item.kind || 'bullpen',
      result: p.result || null,
      in_play_outcome: p.inPlayOutcome || null,
      hit_type: p.hitType || null,
      fielder: p.fielder || null,
      delivery: p.delivery || null,
      time_to_plate: (p.timeToPlate === undefined || p.timeToPlate === null) ? null : p.timeToPlate,   // U11 (7)
      inning: (p.inning === undefined) ? null : p.inning,
      outs_before: (p.outsBefore === undefined) ? null : p.outsBefore,
      balls_before: (p.ballsBefore === undefined) ? null : p.ballsBefore,
      strikes_before: (p.strikesBefore === undefined) ? null : p.strikesBefore,
      at_bat_index: (p.atBatIndex === undefined) ? null : p.atBatIndex,
      // G1b: the field-flow columns. undefined (a pitch queued before this
      // shipped, or any non-in-play result this slice) becomes null
      // explicitly -- same reasoning as every other defensive fallback in
      // this mapping: an upsert must not leave these columns untouched on
      // a retry by omitting the key.
      bb_type: (p.bbType === undefined) ? null : p.bbType,
      bb_x: (p.bbX === undefined) ? null : p.bbX,
      bb_y: (p.bbY === undefined) ? null : p.bbY,
      // G1b-r decision 5: true for every position-derived location (every
      // in-play/E/FC row in this build -- precise tap-to-locate is
      // deferred). undefined (a pre-G1b-r row) becomes null, same
      // defensive fallback as every other field-flow column here.
      bb_from_position: (p.bbFromPosition === undefined) ? null : p.bbFromPosition,
      fielders: (p.fielders === undefined) ? null : p.fielders,
      runners_before: (p.runnersBefore === undefined) ? null : p.runnersBefore,
      batter_to: (p.batterTo === undefined) ? null : p.batterTo,
      runner_advances: (p.runnerAdvances === undefined) ? null : p.runnerAdvances,
      outs_on_play: (p.outsOnPlay === undefined) ? null : p.outsOnPlay,
      runs_scored: (p.runsScored === undefined) ? null : p.runsScored,
      sacrifice: (p.sacrifice === undefined) ? null : p.sacrifice
    }));
    // G1b (h): game_events, pitches' sibling in the same queued item.
    // after_pitch_id relies on pitch ids being client-generated UUIDs
    // (confirmed in the precondition report) -- inserting pitches first
    // guarantees the row it references already exists by the time this
    // runs, every time, including on a retried sync.
    const eventRows = (item.events || []).map(e => ({
      id: e.id,
      session_id: item.id,
      at_bat_index: (e.atBatIndex === undefined) ? null : e.atBatIndex,
      after_pitch_id: e.afterPitchId || null,
      event_type: e.eventType,
      runners_before: (e.runnersBefore === undefined) ? null : e.runnersBefore,
      runner_advances: (e.runnerAdvances === undefined) ? null : e.runnerAdvances,
      outs_on_play: (e.outsOnPlay === undefined) ? null : e.outsOnPlay,
      runs_scored: (e.runsScored === undefined) ? null : e.runsScored,
      // G3: the event's place in the log and the count when it happened
      // (an auto ball with 3 balls before it is a walk in the report).
      seq: (e.seq === undefined) ? null : e.seq,
      inning_before: (e.inningBefore === undefined) ? null : e.inningBefore,
      balls_before: (e.ballsBefore === undefined) ? null : e.ballsBefore,
      strikes_before: (e.strikesBefore === undefined) ? null : e.strikesBefore,
      outs_before: (e.outsBeforeCount === undefined) ? null : e.outsBeforeCount
    }));
    try{
      const { error: sessErr } = await supabaseClient.from('sessions').upsert(sessionRow, { onConflict: 'id' });
      if(sessErr) throw sessErr;
      const { error: pitchErr } = await supabaseClient.from('pitches').upsert(pitchRows, { onConflict: 'id' });
      if(pitchErr) throw pitchErr;
      if(eventRows.length){
        const { error: eventErr } = await supabaseClient.from('game_events').upsert(eventRows, { onConflict: 'id' });
        if(eventErr) throw eventErr;
      }
      await removeOutboxItem(userId, item.id);
    } catch(err){
      // 42501 = RLS rejection. On this user's own rows that only happens
      // when the write went out anonymous -- the session lapsed mid-sync.
      if(err && err.code === '42501' && isGenuineSignOut()){ goToLoginAfterSignOut(); return; }
      await updateOutboxItem(userId, Object.assign({}, item, {
        lastError: (err && err.message) || String(err),
        lastAttemptAt: Date.now()
      }));
    }
  }

  await refreshOutboxState();
  await loadSessionsForCurrentSelection();
  state.syncing = false;
  render();
}

/* ---------- LOAD SESSIONS (works for coach viewing a pitcher, or a pitcher viewing self) ---------- */
/* ---------- S3: COACHES NOTES (Joel, Oct 1) ----------
   A coach of the pitcher's team writes a plain-text note on a saved session,
   any time after it's saved. The pitcher and his coaches read it here; the
   report page shows the current notes live (get_report_notes). Never edited;
   the author can delete their own. Online only -- nothing queues. A new note
   re-dots the session for the pitcher (database trigger). */
const NOTE_MAX = 2000;
function mapSessionNotes(rows){
  return (rows || []).map(n => ({ id: n.id, authorId: n.author_id, authorName: n.author_name || 'Coach', body: n.body, createdAt: new Date(n.created_at).getTime() }))
    .sort((a, b) => a.createdAt - b.createdAt);
}
// S4: "me" is the ACTIVE profile; "mine" is any profile this login owns.
function myUid(){ return state.profile && state.profile.id; }
function myProfileIds(){ return (state.myProfiles || []).map(p => p.id).concat(state.profile ? [state.profile.id] : []); }
function isMine(id){ return !!id && myProfileIds().includes(id); }
function renderSessionNotes(s){
  const notes = s.notes || [];
  const coach = isCoach();
  if(!coach && !notes.length) return '';
  const list = notes.map(n => {
    const when = new Date(n.createdAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    const mine = isMine(n.authorId);
    const armed = state.noteDeleteArmed === n.id;
    return `<div class="note-item">
      <div class="note-meta"><strong>${escHtml(n.authorName)}</strong> · ${escHtml(when)}${mine && !armed ? ` <button type="button" class="note-del" ${isOnline() ? '' : 'disabled'} onclick="armDeleteNote('${n.id}')" aria-label="Delete this note">🗑</button>` : ''}</div>
      <div class="note-body">${escHtml(n.body).replace(/\n/g, '<br>')}</div>
      ${armed ? `<div class="delete-row" style="margin-top:6px;"><span class="delete-warn" style="margin:0;">Delete this note? The pitcher won't see it anymore.</span>
        <button class="btn btn-primary" style="background:var(--red-bg);color:var(--chalk);" onclick="deleteSessionNote('${s.id}','${n.id}')">Delete</button>
        <button class="btn btn-ghost" onclick="armDeleteNote(null)">Keep</button></div>` : ''}
    </div>`;
  }).join('');
  let box = '';
  if(coach){
    const draft = (state.noteDrafts && state.noteDrafts[s.id]) || '';
    const err = state.noteErrors && state.noteErrors[s.id];
    const blocked = s.pending ? 'Notes open once this session syncs.' : (!isOnline() ? 'Notes need a connection.' : '');
    box = `<div class="note-add">
      <textarea id="note-input-${s.id}" class="text-input note-input" maxlength="${NOTE_MAX}" rows="3" placeholder="Add a note for ${escHtml((currentPitcher() || {}).name || 'the pitcher')}…" ${blocked ? 'disabled' : ''} oninput="onNoteInput('${s.id}', this)">${escHtml(draft)}</textarea>
      <div class="note-add-row">
        <span class="note-count" id="note-count-${s.id}">${draft.length} / ${NOTE_MAX}</span>
        <button type="button" class="btn btn-primary" ${blocked || state.noteBusy === s.id ? 'disabled' : ''} onclick="saveSessionNote('${s.id}')">${state.noteBusy === s.id ? 'Saving…' : 'Save note'}</button>
      </div>
      <p class="note-hint">Visible to anyone with this session's report link.</p>
      ${blocked ? `<p class="note-hint">${blocked}</p>` : ''}${err ? `<p class="report-status report-status-error">${escHtml(err)}</p>` : ''}
    </div>`;
  }
  return `<div class="notes-block">
    <div class="field-label">Coaches notes</div>
    ${list || (coach ? '<p class="note-hint">No notes yet.</p>' : '')}
    ${box}
  </div>`;
}
window.onNoteInput = function(sessionId, el){
  state.noteDrafts = state.noteDrafts || {};
  state.noteDrafts[sessionId] = el.value;
  const c = document.getElementById('note-count-' + sessionId);
  if(c) c.textContent = el.value.length + ' / ' + NOTE_MAX;
};
async function reloadSessionNotes(sessionId){
  const { data, error } = await supabaseClient.from('session_notes')
    .select('id, author_id, author_name, body, created_at').eq('session_id', sessionId);
  if(error) throw error;
  const sess = state.sessions.find(x => x.id === sessionId);
  if(sess) sess.notes = mapSessionNotes(data);
}
window.saveSessionNote = async function(sessionId){
  const body = ((state.noteDrafts || {})[sessionId] || '').trim();
  state.noteErrors = state.noteErrors || {};
  if(!body){ state.noteErrors[sessionId] = 'Write something first.'; render(); return; }
  if(!isOnline()){ state.noteErrors[sessionId] = 'Notes need a connection.'; render(); return; }
  state.noteBusy = sessionId; state.noteErrors[sessionId] = null; render();
  try{
    const { error } = await netTimeout(supabaseClient.from('session_notes').insert({ session_id: sessionId, author_id: myUid(), body: body.slice(0, NOTE_MAX) }), 10000);
    if(error) throw error;
    state.noteDrafts[sessionId] = '';
    await reloadSessionNotes(sessionId);
  } catch(e){
    console.error('save note failed', e);
    state.noteErrors[sessionId] = "Couldn't save the note. Check your connection and try again.";
  }
  state.noteBusy = null;
  render();
};
window.armDeleteNote = function(noteId){ state.noteDeleteArmed = noteId; render(); };
window.deleteSessionNote = async function(sessionId, noteId){
  state.noteErrors = state.noteErrors || {};
  try{
    const { error } = await netTimeout(supabaseClient.from('session_notes').delete().eq('id', noteId), 10000);
    if(error) throw error;
    await reloadSessionNotes(sessionId);
  } catch(e){
    console.error('delete note failed', e);
    state.noteErrors[sessionId] = "Couldn't delete the note. Check your connection and try again.";
  }
  state.noteDeleteArmed = null;
  render();
};
async function loadSessionsForCurrentSelection(){
  const pitcherId = state.currentPitcherId;
  const teamId = state.currentTeamId;
  if(!pitcherId || !teamId){ state.sessions = []; state.deletedSessions = []; return; }
  const { data, error } = await supabaseClient
    .from('sessions')
    .select('id, started_at, ended_at, pitcher_id, logged_by, deleted_at, deleted_by, deleted_by_role, deleted_by_name, pitch_count, charting_perspective, report_path, kind, opponent, pitches(type, velo, target_row, target_col, actual_row, actual_col, accuracy_mode, batter_side, in_accuracy_zone, accuracy_zone_cells, ts, result, in_play_outcome, hit_type, fielder, delivery, inning, outs_before, balls_before, strikes_before, at_bat_index, time_to_plate), session_notes(id, author_id, author_name, body, created_at)')
    .eq('pitcher_id', pitcherId)
    .eq('team_id', teamId)
    .order('started_at', { ascending: false });
  if(error){ console.error(error); state.sessions = []; state.deletedSessions = []; return; }
  const all = (data || []).map(s => ({
    id: s.id,
    date: new Date(s.started_at).getTime(),
    endedAt: s.ended_at ? new Date(s.ended_at).getTime() : null,   // U10 (3): History's "new since you last looked" rows
    loggedByCoach: s.logged_by !== s.pitcher_id,
    deletedAt: s.deleted_at ? new Date(s.deleted_at).getTime() : null,
    deletedBy: s.deleted_by || null,
    deletedByRole: s.deleted_by_role || null,
    deletedByName: s.deleted_by_name || null,
    pitchCount: s.pitch_count,
    // Not used to adjust rendering (history/heat-map always shows canonical
    // coordinates unmirrored, see mirrorCol's comment) -- carried through
    // for data fidelity and SQL-verifiability only.
    chartingPerspective: s.charting_perspective,
    // U4b: set the first time a report is generated for this session, never
    // after -- send-session-report reuses the same frozen file on every
    // resend. Non-null means "View report" can open it directly, no email
    // round-trip required.
    reportPath: s.report_path || null,
    // G1: defensive fallback for a row that predates this column --
    // every such row is, definitionally, a bullpen.
    kind: s.kind || 'bullpen',
    // G2 approach (b): null for every bullpen and for a game saved without
    // one -- History/the report both render "Game · <date>" in that case.
    opponent: s.opponent || null,
    notes: mapSessionNotes(s.session_notes),   // S3: coaches' notes (RLS decides who sees them)
    pitches: (s.pitches || []).map(p => ({
      type: p.type, velo: p.velo,
      targetRow: p.target_row, targetCol: p.target_col,
      actualRow: p.actual_row, actualCol: p.actual_col,
      accuracyMode: p.accuracy_mode || null,
      inAccuracyZone: (p.in_accuracy_zone === true || p.in_accuracy_zone === false) ? p.in_accuracy_zone : null,
      accuracyZoneCells: p.accuracy_zone_cells || null,
      // U2a: NULL on legacy pitches, on purpose (no default, no backfill --
      // see the migration). isRelativelyAccurate falls back to 'R' itself
      // when this is absent, so legacy sessions keep reporting exactly as
      // they did before this shipped.
      batterSide: p.batter_side || null,
      ts: new Date(p.ts).getTime(),
      // G1: meaningful only on a game pitch (null on every bullpen pitch,
      // per the migration's shape constraint).
      result: p.result || null,
      inPlayOutcome: p.in_play_outcome || null,
      hitType: p.hit_type || null,
      fielder: p.fielder || null,
      delivery: p.delivery || null,
      timeToPlate: (p.time_to_plate === null || p.time_to_plate === undefined) ? null : Number(p.time_to_plate),   // U11 (7)
      inning: p.inning === null || p.inning === undefined ? null : p.inning,
      outsBefore: p.outs_before === null || p.outs_before === undefined ? null : p.outs_before,
      ballsBefore: p.balls_before === null || p.balls_before === undefined ? null : p.balls_before,
      strikesBefore: p.strikes_before === null || p.strikes_before === undefined ? null : p.strikes_before,
      atBatIndex: p.at_bat_index === null || p.at_bat_index === undefined ? null : p.at_bat_index
    }))
  }));
  // P1-15: soft-deleted sessions never enter state.sessions, so every existing
  // calc (stats, trends, report history) excludes them for free. They render
  // only as tombstones in the history view.
  state.sessions = all.filter(s => !s.deletedAt);
  rebuildVeloHistory(state.sessions).catch(e => console.error('velo history cache failed', e));
  state.deletedSessions = all.filter(s => s.deletedAt);
}

/* ---------- NAV ---------- */
// Drop a half-finished delete confirmation (P1-15) whenever the session
// context changes.
function clearDeleteState(){
  state.deletingSessionId = null;
  state.deleteConfirmText = '';
  state.deleteError = null;
}
window.setView = function(v){
  if(v === 'leaderboard' && !hasLeaderboard()) v = 'session';
  state.historyLandingNoClear = null;   // U10 (3)
  state.view = v; state.profileMsg = ''; state.uniformEditKey = null; state.lbExcludeOpen = null; clearDeleteState(); render();
  if(v === 'leaderboard') loadLeaderboard();

  // head-only, its invite links) fresh every time Profile is opened -- a
  // handoff or removal since the last visit must never show stale data.
  if(v === 'profile' && isCoach()) loadCoachAdminData(state.currentTeamId).then(render);
};
window.toggleSessionExpand = function(id){
