renderVals() {
const sb = (this.props.sport ?? 'Baseball') === 'Softball';
return {
isSB: sb, isBB: !sb, bar: sb ? '#2B4468' : '#334B45', wall: sb ? '#16385C' : '#1F4D3A',
infield: sb ? '#C99C6B' : '#57A353', infield2: sb ? '#C99C6B' : '#63AD5D', moundFill: sb ? '#C99C6B' : '#B98B5B',

};
}
}
