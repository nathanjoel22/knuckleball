  @media (max-width: 860px){
    #app{ flex-direction:column; }
    .sidebar{ width:100%; border-right:none; border-bottom:1px solid var(--border); max-height:none; }
    .roster-list{ max-height:220px; }
    /* Visual refresh: the extra padding/gaps added for "more white space" (session-grid
       gap, controls-panel gap, panel padding) measurably pushed the charting grid and
       the velocity strip further down at this width -- checked in a real browser: ~40px
       lower than before the refresh, on an iPhone-width screen with the roster collapsed.
       Below 860px (iPad portrait and every phone), give the more spacious values back
       to keep the grid/strip exactly as reachable as before; the wider gains still apply
       above 860px, where there's plenty of headroom. */
    .session-grid-layout{ gap:26px; }
    .controls-panel{ gap:14px; }
    .panel{ padding:18px; }
    .sidebar{ gap:16px; }
    .brand-block{ padding:12px 18px; }
    .main{ padding:20px 16px; }
    /* Fixed-length (15vw) tracks previously demanded ~75vw of width while the
       grid's own box was capped at max-width:320px -- on iPad portrait that
       mismatch (~576px of track vs a 320px box) overflowed the grid past its
       container and over the log panel beside it. fr tracks size to the box
       itself, so the box's own width (bounded below) is what's ever drawn. */
    .zone-grid{
      grid-template-columns:repeat(5, minmax(0, 1fr)); grid-template-rows:repeat(5, minmax(0, 1fr));
      width:100%; max-width:320px; aspect-ratio:1/1;
    }
    /* Same 3-of-5-columns proportion as the desktop 162px value, but derived
       from the grid's own responsive width (100% up to 320px) instead of a
       fixed cell size: strike-zone width = 0.6 * gridWidth - 4.8px, where
       0.6 = 3/5 columns and 4.8px accounts for the padding/gap difference
       between 3 cells and 5 (see the desktop comment above for the algebra). */
    .home-plate-wrap{ width:calc(0.6 * min(100%, 320px) - 4.8px); }
  }

  /* U10 (6): iPad portrait (and anything 501-860px wide). Below 860px the
     sidebar stacks ABOVE the page, and at 768x1024 it plus the header, tabs
     and controls pushed the grid's bottom row off-screen (measured: grid
     bottom at 1079px, 5 of its 60px visible; worse still in Safari, whose
     toolbars leave ~920px). Nothing clipped it -- it simply started too low.
     So in this range only, the stacked sidebar becomes one compact wrapped
     row (brand strip, team, sign-out side by side; roster list and outbox
     badge still full width), and the page spacing tightens slightly. Phones
     (<=500px) and >=861px get none of this. */
  @media (min-width:501px) and (max-width:860px){
    .sidebar{ flex-direction:row; flex-wrap:wrap; align-items:center; gap:10px 16px; padding:12px 16px; }
    .brand-block{ flex-direction:row; align-items:center; gap:10px; padding:8px 14px; }
    .brand h1{ font-size:24px; }
    .tagline{ display:none; }
    .role-badge{ margin-top:0; }
    .sidebar .team-select-wrap, .sidebar .team-line{ flex:1 1 180px; min-width:0; }
    .sidebar > .roster-label{ margin:0; }
    .roster-toggle-btn{ flex:1 1 200px; }
    .roster-collapse, .outbox-badge{ flex:1 1 100%; }
    .sign-out-btn{ margin-top:0; margin-left:auto; padding:8px 12px; }
    .main{ padding:14px 16px; gap:14px; }
    .pitcher-header h2{ font-size:36px; }
    .pitcher-sub{ margin-top:6px; }
    .controls-panel{ gap:10px; }
    .panel{ padding:14px; }
    .session-grid-layout{ gap:18px; }
  }

  /* G1b-r6 (Joel, Oct 1): iPad and laptop session layout -- pen and Live
     Game, above 860px (iPad landscape and laptops). Left column: its natural width
     (chips wrap inside 220px); right column: the rest. sizeWideGrid sets
     --zg (grid side), --kbh (silhouette height) and --kbo (room above the
     grid for the silhouette's head); the fallbacks are the old desktop
     values. Phones never render .wide-cols. */
  @media (min-width:861px){
    .wide-cols{ display:flex; align-items:flex-start; gap:20px; }
    .wide-left{ flex:0 0 auto; width:max-content; max-width:220px; display:flex; flex-direction:column; gap:14px; }
    .wide-right{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:14px; }
    .wide-right .zone-wrap{ max-width:none; padding:var(--kbo, 0px) 0 22px; align-self:stretch; }
    .wide-right .zone-grid{
      grid-template-columns:repeat(5, minmax(0, 1fr)); grid-template-rows:repeat(5, minmax(0, 1fr));
      width:var(--zg, 278px); height:var(--zg, 278px); max-width:none; aspect-ratio:auto;
    }
    .wide-right .kb-batter{ --kb-batter-h:var(--kbh, 112%); }
    .wide-right .home-plate-wrap{ width:calc(0.6 * var(--zg, 278px) - 4.8px); }
    .wide-game{ display:grid; grid-template-columns:auto minmax(0, 1fr); column-gap:20px; row-gap:16px; }
    .wide-game .wide-left{ max-width:180px; }
    .wide-bl{ grid-column:1; display:flex; align-items:center; }
    .wide-bl .ttp-btn{ min-height:38px; }
    .wide-br{ grid-column:2; display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
    .pt-two{ display:grid; grid-template-columns:repeat(2, max-content); }   /* never more than two pitch types across */
    .wide-hint{ color:var(--clay); text-transform:none; letter-spacing:0; font-size:12.5px; font-weight:600; }
    /* Joel, Oct 1: pen pitch counter to the right of the perspective chips
       (label above both, "Pitch count" on two lines under the badge). */
    .persp-count{ display:grid; grid-template-columns:minmax(0, 1fr) auto; column-gap:8px; }
    .persp-count .type-chip{ white-space:nowrap; }
    .persp-count > div:first-child{ display:contents; }
    .persp-count > div:first-child > .field-label{ grid-column:1 / -1; }
    .persp-count .chip-row{ grid-column:1; grid-row:2; }
    .persp-count > div:first-child > p{ grid-column:1 / -1; }
    .persp-count .wide-count{ grid-column:2; grid-row:2; align-self:start; flex-direction:column; gap:5px; }
    .persp-count .wide-count .field-label{ width:48px; text-align:center; line-height:1.3; }
  }

  @media (max-width:500px){
    /* Coach on a phone: invite link + Sign out live at the bottom of the page, not the top. */
    .hide-phone{ display:none !important; }
    .phone-footer{ display:flex; flex-direction:column; gap:14px; padding:4px 16px 28px; }
    /* RESERVED BAND for the phone pitch-pill (see .kb-batter's media block
       above). .zone-grid IS the real "grid wrapper" the silhouette is
       positioned against (already position:relative, see its comment) --
       batter-silhouette.html's own .zone-grid-wrap placeholder maps to
       this class in this codebase.
       margin-bottom, NOT padding-bottom: .zone-grid already uses
       aspect-ratio:1/1 (in the rule above) under box-sizing:border-box
       (global *{box-sizing:border-box}), so the square ratio applies to
       the BORDER box. padding-bottom there would keep the border box
       square and eat the new space out of the grid's own CONTENT height
       instead -- squishing the 5 rows shorter, not adding room below them
       (this was tried and visibly broke the grid: rows collapsed to 2px
       each -- acceptance check 4 requires the grid stay the same size).
       margin is outside the box-sizing model entirely, so it reserves
       flow space (pushing .zone-caption and everything after it down)
       with ZERO effect on .zone-grid's own square box -- the grid is
       pixel-identical to before this rule exists; only the space below it
       changes. The pill (an absolutely-positioned child of .zone-grid)
       then reaches into that margin with a negative `bottom` offset (see
       .kb-batter's phone-mode rule above) since margin sits outside the
       padding box that `bottom` normally measures against.
       --kb-pill-h/--kb-pill-clear are declared here (not on .kb-batter)
       because custom properties only inherit DOWNWARD -- .kb-batter is a
       child of .zone-grid, so declaring them on the parent lets both this
       rule and .kb-batter's own phone-mode rule (above) read the same
       values; declaring them on the child would leave this rule unable to
       see them at all. */
    .zone-grid{
      --kb-pill-h:48px; --kb-pill-clear:18px;
      margin-bottom:calc(var(--kb-pill-clear) + var(--kb-pill-h) + 8px);
    }
  }
  /* ---------- G1b-r3: in-grid play entry (docs/game-grid-reference.html) ---------- */
  .gg-field{
    --gg-fence:#B9D1C4; --gg-grass:#C7DCBD;   /* Joel, Oct 1: a shade darker (field art matches) */ --gg-dirt:#C9A97C;
    --gg-ink:#17261D; --gg-border:#9DBBA9; --gg-gold:#C9A227;
    --gg-infield:#B4C8AC; --gg-mound:#B8956A; --gg-muted:#5B6B61; --gg-on-fg:#E8F3EC; --gg-on-cap:#CFE6D7; --gg-line:#0F241B;
  }
  .gg-cell{ cursor:default; border-color:rgba(15,36,27,0.10) !important; }
  .gg-cell.gg-fence{ background:var(--gg-fence) !important; }
  .gg-cell.gg-grass{ background:var(--gg-grass) !important; }
  .gg-cell.gg-dirt{ background:var(--gg-dirt) !important; }
  /* Joel, Oct 1: the drawn field behind rows 3-5 (GG_FIELD_SVG). */
  .gg-fieldart{ position:relative; z-index:0; display:block; width:100%; height:100%; pointer-events:none; }
  .gg-cell.gg-clear{
    background:transparent !important; z-index:1;
    box-shadow:0 0 0 3px var(--surface-border); border-color:rgba(var(--ink-rgb),0.08) !important;
  }
  /* Overlay: the same tracks, gap and inset as .zone-grid itself,
     so every box sits exactly on its cells at every width. */
  .gg-overlay{
    position:absolute; inset:3px; display:grid; gap:3px;
    grid-template-columns:repeat(5, minmax(0, 1fr)); grid-template-rows:repeat(5, minmax(0, 1fr));
  }
  .gg-overlay{ z-index:2; pointer-events:none; }
  .gg-overlay > *{ pointer-events:auto; }
  .gg-btn{
    position:relative; min-width:0; min-height:44px; margin:1px; padding:2px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    background:#fff; color:var(--gg-ink); border:1.5px solid var(--gg-border); border-radius:9px;
    box-shadow:0 2px 6px rgba(var(--ink-rgb),0.15); font:inherit; cursor:pointer;
  }
  .gg-btn.on{ background:var(--field-dark); color:var(--gg-on-fg); border-color:var(--field-dark); }
  .gg-btn.on .gg-cap{ color:var(--gg-on-cap); }
  .gg-btn:disabled{ opacity:0.35; cursor:not-allowed; box-shadow:none; }
  .gg-ic{ width:40px; height:30px; max-width:80%; display:block; background:currentColor; mask-size:contain; -webkit-mask-size:contain; mask-repeat:no-repeat; -webkit-mask-repeat:no-repeat; mask-position:center; -webkit-mask-position:center; }
  .gg-cap{ max-width:100%; padding:0 3px; box-sizing:border-box; font-size:9px; letter-spacing:0.02em; text-transform:uppercase; color:var(--gg-muted); text-align:center; line-height:1.15; }
  /* Narrow phones: captions break only BETWEEN words (never mid-word), and
     the text steps down so two short lines fit inside a ~45px box. */
  .cap-short{ display:none; }
  @media (max-width:360px){
    .cap-long{ display:none; }
    .cap-short{ display:inline; }
    .gg-big{ font-size:16px; }
    .gg-big-long{ font-size:12px; }
    .gg-cap{ font-size:8px; letter-spacing:0; padding:0 2px; }
    .gg-btn{ gap:1px; }
  }
  .gg-big{ font-size:20px; font-weight:800; line-height:1; }
  .gg-big-long{ font-size:15px; letter-spacing:-0.01em; }   /* BUNT: fits inside its box */
  .gg-cap-only{ font-size:10px; font-weight:700; color:var(--gg-ink); line-height:1.2; }
  .gg-seq{ position:absolute; top:-7px; right:-5px; background:var(--gg-gold); color:var(--field-dark); border-radius:10px; font-size:10px; padding:1px 6px; font-weight:800; }
  .gg-done{ font-size:15px; font-weight:800; }
  .gg-next{ background:var(--gg-gold); border-color:var(--gg-gold); font-size:15px; font-weight:800; letter-spacing:0.04em; text-transform:uppercase; }
  .gg-next:disabled{ opacity:0.45; }
  .gg-book{
    position:relative; margin:1px; background:#fff; color:var(--gg-ink);
    border:1.5px solid var(--gg-ink); border-radius:6px; overflow:hidden;
  }
  .gg-book > span{ position:absolute; font-size:11px; font-weight:700; }
  .gg-book-tl{ left:7px; top:5px; }
  .gg-book-ask{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; text-align:center; padding:6px; }
  .gg-book-ask > span{ position:static; }
  .gg-ask{ font-size:14px !important; font-weight:800 !important; line-height:1.2; color:var(--gg-ink); }
  .gg-ask-sub{ font-size:10px !important; font-weight:600 !important; color:var(--gg-muted); text-transform:uppercase; letter-spacing:0.04em; }
  .gg-book-tr{ right:7px; top:5px; color:var(--gg-muted); }
  .gg-book-play{ left:50%; top:20px; transform:translateX(-50%); background:var(--gg-gold); color:var(--field-dark); border-radius:8px; padding:1px 6px; font-size:10px !important; white-space:nowrap; max-width:92%; overflow:hidden; text-overflow:ellipsis; }
  .gg-book-bl{ left:7px; right:7px; bottom:5px; color:var(--gg-muted); font-weight:600 !important; font-size:10px !important; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gg-diamond{ position:absolute; left:25%; top:33%; width:50%; height:42%; }
  .gg-book-back, .gg-book-fix{
    position:absolute; bottom:3px; font:inherit; font-size:10px; font-weight:700; color:var(--field-dark);
    background:#fff; border:1px solid var(--gg-border); border-radius:8px; padding:3px 6px; cursor:pointer;
  }
  .gg-book-back{ right:4px; }
  .gg-book-fix{ right:4px; left:auto; bottom:22px; }
  .gg-velo-readout{
    margin:1px; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    background:#fff; border:1.5px solid var(--gg-border); border-radius:9px; padding:4px;
  }
  .gg-velo-read{ font-size:30px; font-weight:800; color:var(--gg-ink); line-height:1; }
  .gg-velo-unit{ font-size:9px; letter-spacing:0.08em; text-transform:uppercase; color:var(--gg-muted); text-align:center; }
  .gg-noread{ font:inherit; font-size:10px; font-weight:700; color:var(--gg-muted); background:#fff; border:1px solid var(--gg-border); border-radius:8px; padding:4px 10px; cursor:pointer; min-height:28px; white-space:nowrap; }
  /* Row 4: the slider. Full grid width, 5 speeds across, center-snapped; the
     fixed frame marks the center window -- whatever settles in it is picked. */
  .gg-velo{ margin:1px; min-width:0; display:flex; align-items:stretch; background:#fff; border:1.5px solid var(--gg-border); border-radius:9px; padding:2px; }
  .gg-velo .game-velo{ flex:1; min-width:0; background:none; padding:0; }
  .gg-velo .velo-strip-wrap{ position:relative; gap:0; height:100%; }
  .gg-velo .velo-strip-wrap::after{
    /* the center window sits over the middle fifth of the STRIP, between the 22px arrows */
    content:''; position:absolute; top:0; bottom:0; left:calc(22px + (100% - 44px) * 0.4); width:calc((100% - 44px) * 0.2); pointer-events:none;
    border:2px solid var(--gg-gold); border-radius:8px;
  }
  .gg-velo .velo-strip{ --velo-visible:5; }
  /* Joel, Oct 1: small < > arrows on the sides of the full-width bar. */
  .gg-velo .velo-arrow{
    flex:0 0 22px; min-height:0; background:none; border:0; border-radius:0; padding:0;
    color:var(--gg-ink); font-size:18px; font-weight:800; line-height:1; cursor:pointer;
  }
  .gg-velo .velo-arrow:disabled{ opacity:0.35; }
  .gg-velo .velo-help{ display:none; }
  .gg-velo .velo-cell{ min-height:44px; scroll-snap-align:center; }
  .gg-adv .gg-big{ font-size:17px; }
  @media (max-width:360px){ .gg-adv .gg-big{ font-size:14px; } }
  .gg-back{ font-size:13px; font-weight:800; white-space:nowrap; border-color:var(--gg-ink); }   /* dark outline, as in docs/field-option3-reference.html */
  @media (max-width:360px){ .gg-back{ font-size:12px; } }
  .gg-velo .velo-help{ display:none; }
  .gg-velo .velo-cell{ min-height:44px; }
  .gg-velo .velo-strip-wrap{ gap:0; }
  .gg-fix{ margin:1px; background:#fff; border:1.5px solid var(--gg-border); border-radius:9px; padding:6px; overflow:auto; display:flex; flex-direction:column; gap:6px; }

<body>
<div id="app"></div>

<script>
/* ---------- CONSTANTS ---------- */
// The only pitches a pitcher can add. `name` is what gets stored in
// profiles.pitch_types and on each pitch row (unchanged plain strings, so
// reports and history are unaffected); `abbr` is display-only and is what
// the app shows everywhere except the add-a-pitch dropdown. Pitches saved before this list existed (free text) still render
// as typed -- pitchLabel falls back to the raw string.
// `phoneAbbr`, when present, overrides `abbr` at phone width (Joel, Sept
// 25: Vulcan Changeup is long enough at 3 letters that it doesn't fit the
// same spot the other 2-letter abbreviations do on a phone-width chip) --
// same max-width:500px breakpoint the rest of the app already treats as
// "phone" (see veloVisible()). Optional; every other entry is one fixed
// abbreviation on every device, unchanged.
/* ---------- S1 (Track S): one config per sport ----------
   Everything that differs between baseball and softball lives here, keyed
   by sport -- the tracker reads the PROFILE's sport (applySport), never a
   separate client choice. PITCH_CATALOG / TYPE_PALETTE / VELO_* below are
   the active sport's values (reassigned by applySport) so every existing
   use stays as it was. Pitch colors are data, assigned by position in the
   pitcher's own list exactly as before; each sport has its own 8. Must
   match send-session-report's SPORT_PALETTE_HEX in meaning, in order. */
const BASEBALL_PITCH_CATALOG = [
  { abbr:'4SFB', name:'Four Seam Fastball' },
  { abbr:'2SFB', name:'Two Seam Fastball' },
  { abbr:'CU',   name:'Cutter' },
  { abbr:'SK',   name:'Sinker' },
  { abbr:'CH',   name:'Changeup' },
  { abbr:'VCH',  name:'Vulcan Changeup', phoneAbbr:'VC' },
  { abbr:'CB',   name:'Curveball' },
  { abbr:'SL',   name:'Slider' },
  { abbr:'KN',   name:'Knuckleball' },
  { abbr:'SW',   name:'Sweeper' },
  { abbr:'SV',   name:'Slurve' },
  { abbr:'FR',   name:'Forkball' },
  { abbr:'SP',   name:'Splitter' }
];
// Softball (Joel will edit this list -- one line per pitch).
const SOFTBALL_PITCH_CATALOG = [
  { abbr:'FB', name:'Fastball' },
  { abbr:'CH', name:'Change-up' },
  { abbr:'DR', name:'Drop ball' },
  { abbr:'RI', name:'Rise ball' },
  { abbr:'CU', name:'Curveball' },
  { abbr:'SC', name:'Screwball' },
  { abbr:'DC', name:'Drop curve' },
  { abbr:'OS', name:'Off-speed' }
];
const SPORTS = {
  baseball: {
    catalog: BASEBALL_PITCH_CATALOG,
    palette: ['#E8A83D','#6FA287','#C17A45','#C0453B','#7C9CBF','#B98CCB','#D4C15B','#4FA8A8'],
    veloMin: 40, veloMax: 105, veloCenter: 75,
    hasDelivery: true, hasTimeToPlate: true, hasLeaderboard: true, hasLiveGame: true,
    zoneNote: ''
  },
  softball: {
    catalog: SOFTBALL_PITCH_CATALOG,
    palette: ['#E27BA2','#7FB8E0','#6C5B7B','#F6B26B','#4FA3A5','#9B8ADB','#B36B5E','#8C8C8C'],
    veloMin: 25, veloMax: 85, veloCenter: 50,
    hasDelivery: false, hasTimeToPlate: false, hasLeaderboard: false, hasLiveGame: true,   // S2 (Joel, Oct 1): Live Game, no delivery
    zoneNote: 'Zone: armpits to top of knees'
  }
};
function currentSport(){ return (state.profile && state.profile.sport === 'softball') ? 'softball' : 'baseball'; }
function sportCfg(){ return SPORTS[currentSport()]; }
let PITCH_CATALOG = BASEBALL_PITCH_CATALOG;
// Called wherever state.profile is set: the active sport's tables + theme.
function applySport(){
  const cfg = sportCfg();
  PITCH_CATALOG = cfg.catalog;
  TYPE_PALETTE = cfg.palette;
  VELO_MIN = cfg.veloMin; VELO_MAX = cfg.veloMax; VELO_DEFAULT_CENTER = cfg.veloCenter;
  document.documentElement.setAttribute('data-sport', currentSport());
  try{ localStorage.setItem('kb:sport', currentSport()); }catch(e){}
}
function pitchLabel(name){
  const c = PITCH_CATALOG.find(x => x.name === name);
  if(!c) return escHtml(String(name).toUpperCase());   // unknown (legacy free-text) names are user input; shown in capitals (Joel, Oct 1)
  if(c.phoneAbbr && window.matchMedia('(max-width:500px)').matches) return c.phoneAbbr;
  return c.abbr;
}
let TYPE_PALETTE = SPORTS.baseball.palette;   // the active sport's (applySport)
const GRID_SIZE = 5;

/* ---------- LOCAL DRAFT SAFETY NET ----------
   Only used as an in-progress-session cache on this device, so a page
   refresh mid-bullpen doesn't lose pitches already tapped in. The
   permanent record of a finished session always lives in Supabase. */
async function storGet(key){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
async function storSet(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }
  catch(e){ console.error('storage set failed', key, e); }
}
async function storDelete(key){
  try{ localStorage.removeItem(key); } catch(e){}
}

/* ---------- STATE ---------- */
let state = {
  session: null,
  profile: null,          // raw row: id, role, full_name, pitch_types, contact_emails
  teams: [],               // [{id, name}]
  currentTeamId: null,
  roster: [],               // (coach view) mapped pitcher objects on current team
  currentPitcherId: null,
  myVerification: { email: null, emailConfirmed: false },   // R0: fail closed until my_verification_status() says otherwise
  changeEmailOpen: false,
  changeEmailStatus: null,
  verifyResendStatus: null,
  inviteCopyStatus: null,
  regenerateArmed: false,
  regenerateBusy: false,
  removeArmedPitcherId: null,
  removeBusy: false,
  // R6: team admin section (coach Profile tab). teamInviteLinks/
  // teamCoachesList are fetched on demand for the active team, never
  // cached across a team switch -- see loadCoachAdminData().
  teamInviteLinks: null,       // {invite_token, invite_token_rotated_at, coach_invite_token, coach_invite_token_rotated_at} | null
  teamCoachesList: null,       // [{coach_id, full_name, role}] for the active team, any coach can see this
  coachInviteCopyStatus: null,
  coachRegenerateArmed: false,
  coachRegenerateBusy: false,
  removeCoachArmedId: null,
  removeCoachBusy: false,
  handoffTargetId: '',
  handoffArmed: false,
  handoffBusy: false,
  renameTeamOpen: false,
  renameTeamDraft: '',
  renameTeamBusy: false,
  renameTeamError: null,
  createTeamOpen: false,
  createTeamDraft: '',
  createTeamBusy: false,
  createTeamError: null,
  sessions: [],
  view: 'session',          // session | history | profile | pitcherProfile (coach editing the selected pitcher)
  activeSession: null,
  selectedType: null,
  veloTargetIdx: null,      // U6: index of the last recorded pitch that may still take a velocity (null = locked)
  veloHistory: null,        // U6: on-device { 'pitcherId:teamId': { pitchType: [recent velos, oldest->newest] } }
  veloStripKey: null,       // U6: what the strip was last centered for, so re-renders keep its scroll position
  veloScrollLeft: 0,
  flashCell: null,
  pendingTarget: null,
  headshots: {},             // U10 (8): pitcherId -> data: URL of his current photo (this device's cache)
  headshotBusy: false,
  headshotMsg: '',
  // U10 (3) revised: the roster red dot (see ROSTER RED DOT).
  rosterDotLatest: {},        // 'teamId:pitcherId' -> ms of his latest saved session on that team
  rosterDotSeen: {},          // pitcherId -> ms this viewer last had his History on screen
  rosterDotsReady: false,     // no dots until both maps have come from the server (or this device's cache)
  unopenedSessions: {},       // sessionId -> pitcherId: this viewer's unopened sessions on the current team (server)
  openedLocal: {},            // sessionId -> true: tapped open on this device (may not have reached the server yet)
  historyLandingNoClear: null,// pitcherId: the automatic History landing after a save doesn't clear his dot
  // G1: game-mode equivalents of pendingTarget/veloTargetIdx above -- same
  // "not part of the saved draft" precedent (an uncommitted tap is an
  // acceptable small loss if the app dies mid-tap, same as a bullpen's
  // pending target today). gamePendingPitch holds {row,col,velo} for a
  // pitch whose location (and optionally velocity) is set but has no
  // RESULT yet -- never pushed into activeSession.pitches until one is
  // chosen (a game pitch is never recorded without a result).
  gamePendingPitch: null,
  // Which result sub-menu is open: null (the scorebook glyph row, G1b-r) |
  // 'plus' (the + grid) | 'droppedThird' | 'bi' | 'biRunnerBase' | 'foulBunt'.
  gameResultMenu: null,
  gamePendingOutcome: null,  // 'hit' | 'out' | 'error', while drilling into In Play
  gamePendingHitType: null,  // '1B'|'2B'|'3B'|'HR', while drilling into a Hit
  expandedSessionId: null,
  // G1: which kind of session History shows -- 'all' | 'bullpen' | 'game'.
  // Purely a display filter; never affects what's loaded or synced.
  historyFilter: 'all',
  // G1: the profile-setup modal's own visibility, separate from
  // state.view -- it now overlays whatever view is underneath rather
  // than replacing it (see finishInit's comment on where this gets set
  // true, and renderSetupModal). Never persisted: "not shown again that
  // session" falls out naturally from init() only ever setting this once
  // per page load.
  showSetupModal: false,
  hint: '',
  draftAvailable: false,
  pendingDraft: null,
  contactsOpen: false,
  lbTeamId: null,           // U8: which team's board is showing (remembered per device)
  lbWindow: 'week',         // U8: week | month | all
  lbCat: 'velocity',        // U8: velocity | accuracy | strike -- which ranked list is showing
  lb: null,                 // U8: { teamId, win, data, fetchedAt, status: loading|ok|offline|error, error }
  lbExcludeOpen: null,      // U8 (coach): pitch id whose 'Exclude this reading' panel is open
  lbBusy: false,
  rosterCollapsed: false,
  perspectiveRolledUp: false, // phones: the perspective drop-down is rolled up (UI only, not saved)
  sessionSheetOpen: false,    // G1b-r5 phones: the session header's ⋯ sheet
  sessionDiscardArmed: false, // ...and its Discard confirm
  pitchStripScroll: null,     // phones: the pitch strip's scroll position across renders   // coach only: roster list rolled up once a pitcher is selected
  editVeloError: '',        // (g) inline message when the edit-pitch velocity is rejected
  editVeloDraft: '',
  uniformEditKey: null,     // 'pitcherId:teamId' while the uniform-number editor is open
  uniformMsg: '',           // one-line notice, e.g. after a conflict
  uniformMsgKey: null,      // which 'pitcherId:teamId' row the notice belongs to
  profileMsg: '',           // U7: one-line notice on the Profile pages
  nameEditOpen: false,      // U9: name-change form open, on whichever profile is showing
  nameStatus: null,         // U9: null | 'saving' | 'saved' | 'error:<msg>'
  setupReminderDismissed: false,   // U9: per-session only, never persisted -- resets on reload
  zones: {},                // U7B: { pitcherId: { pitchType: { R: ['row-col', ...], L: [...] } } }, catcher frame
  zonePaint: null,          // U7B: the zone being painted { pitcherId, type, side, cells }
  zoneMsg: '',
  passwordStatus: null,     // U7: null | 'sending' | 'saved' | 'error:<msg>'
  contactsSavedAt: null,
  inviteOpen: false,
  inviteStatus: null,
  saving: false,
  loaded: false,
  outbox: [],        // completed sessions not yet synced to Supabase (P1-01)
  syncing: false,
  setupNeeded: null, // null | 'role' | 'team' -- account-setup recovery UI (P1-12)
  bootError: null,   // null | 'offline-no-context' | 'load-failed' -- boot-screen dead ends (P1-13)
  setupBusy: false,
  setupError: null,
  setupName: '',
  setupTeam: '',
  editDraftRow: null,       // index into activeSession.pitches being edited in-session (P1-05)
  deletedSessions: [],      // soft-deleted sessions for the current selection -- tombstones only (P1-15)
  deletingSessionId: null,  // session with an open typed-confirm delete form (P1-15)
  deleteConfirmText: '',
  deleteBusy: false,
  deleteError: null,
  oldTombstonesExpanded: false  // (P1-15) show tombstones older than 90 days
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
// crypto.randomUUID() needs a newer WebKit than some field devices have
// (e.g. older iPhones running Chrome, which is WebKit under the hood on
// iOS) -- this has no such dependency and produces the same valid-uuid
// format Postgres uuid columns require.
function genUUID(){
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
    const r = Math.random() * 16 | 0;
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}
function mapProfile(row){
  // U9: usesRadarGun is the PITCHER's own setting -- read here once, same as
  // pitchTypes/throws, so it flows into saveLastKnownContext()'s offline
  // snapshot for free and never gets re-read mid-session (an already-open
  // charting page keeps whatever it read at load, so a toggle change can
  // never affect the current pen).
  return { id: row.id, name: row.full_name, pitchTypes: row.pitch_types || [], contactEmails: row.contact_emails || {}, throws: row.throws || null, relativeAccuracy: !!row.relative_accuracy_enabled, usesRadarGun: !!row.uses_radar_gun, setupDismissedAt: row.setup_dismissed_at || null, uniformNumber: null, headshotUpdatedAt: row.headshot_updated_at || null };
}
function isCoach(){ return state.profile && state.profile.role === 'coach'; }
// R6: UI-side mirror of is_team_head -- every admin control also hides
// itself for an assistant (packet approach f: "the helper is the gate;
// the UI is not" -- meaning the SERVER never trusts this, but a hidden
// button is still better UX than a click that always fails). Reads
// myRole off the team_coaches-backed rows loadTeams() now returns.
function isHeadOfTeam(teamId){
  if(!isCoach()) return false;
  const team = state.teams.find(t => t.id === teamId);
  return !!team && team.myRole === 'head';
}
function isHeadOfCurrentTeam(){ return isHeadOfTeam(state.currentTeamId); }
// The pitch types New Session offers: exactly the pitcher's own mix. A pitcher who
// hasn't added any pitches yet has none to chart until they do (Joel, Sept 21: no
// fallback list) -- New Session shows a prompt pointing at Profile instead.
function pitchTypesFor(p){

    case 'nothingUp': return pitch.actualRow >= 3;       // bottom two rows only

// P1-13: nothing on the path to first paint may await the network.
// supabase-js's auth.getSession() retries a failed token refresh with
// exponential backoff for ~20-30s (and forever on a black-holed
// network) before returning, and until this task init() awaited it
// before painting anything -- so an offline cold launch showed a blank
// screen for that whole time. Now:
//   1. the session is read from localStorage only (no network refresh)
//   2. with a cached context we paint the real charting UI immediately
//      and reconcile with the server in the background
//   3. every startup network call that survives is wrapped in a short
//      timeout so a connected-but-dead network can't stall startup either
const STARTUP_NET_TIMEOUT_MS = 3000;

function isOnline(){ return !(typeof navigator !== 'undefined' && navigator.onLine === false); }

// Race a promise (or supabase thenable) against a timeout. The underlying
// request keeps running -- we just stop waiting on it.
function netTimeout(thenable, ms){
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error('startup network timeout')), ms || STARTUP_NET_TIMEOUT_MS);
  });
  return Promise.race([Promise.resolve(thenable), timeout]).finally(() => clearTimeout(timer));
}

async function init(){

  // leaves it in place. So a stored session here means "logged in, maybe
  // offline" -- trust it, and never block on a network refresh to confirm.
  const urlHasToken = typeof window !== 'undefined' && /[#&]access_token=/.test(window.location.hash || '');
  let session = readPersistedSessionRaw();
  if(!session && (isOnline() || urlHasToken)){
    // Nothing stored -- e.g. a fresh redirect back from an auth link.
    // Give supabase-js one bounded chance to produce a session.
    try{
      const { data } = await netTimeout(supabaseClient.auth.getSession());
      session = data && data.session;
    }catch(e){ /* timed out or threw -> treat as logged out */ }
  }
  if(!session){
    // Genuinely logged out (or a real rejection wiped storage). Signing in
    // needs the network anyway and there's no local charting state for an
    // unknown user. .replace() so Back doesn't land on a torn-down tracker.
    window.location.replace(loginUrl());

  await loadVeloHistory();   // U6: on-device velocity history, so the strip can center with no network
  const cached = await storGet(lastKnownKey(session.user.id));
  const online = isOnline();

  if(cached && cached.profile){
    // ---- Fast path: paint the real charting UI from the last context we
    //      saw online. No network awaited before charting is usable. ----
    applyCachedContext(cached);
    state.sessions = [];        // server history isn't reachable offline; queued sessions still show via the outbox
    state.deletedSessions = []; // (P1-15) tombstones come from the server too

  // inconclusive and must not bounce a charter.
  let fresh;
  try{
    const { data } = await netTimeout(supabaseClient.auth.getSession());
    fresh = data && data.session;
  }catch(e){
    if(alreadyPainted) return;            // keep the cached view
    state.bootError = 'load-failed';
    renderBoot();
    return;
  }
  if(!fresh){
    if(isOnline() && !readPersistedSessionRaw()){
      // Genuine revocation. Any in-progress charting is already in the
      // localStorage draft, so nothing is lost by redirecting now.
      try{ await supabaseClient.auth.signOut(); }catch(e){}
      window.location.replace(loginUrl());
      return;
    }
    if(alreadyPainted) return;
    window.location.replace(loginUrl());
    return;
  }
  state.session = fresh;
  await loadFullContextOnline(alreadyPainted);
}

// The full online load: profile -> server-side setup check (P1-12) ->
// teams -> first team's roster/sessions. Runs only after resolveOnline()
// has a confirmed session. `alreadyPainted` true = the cached charting UI
// is already up, so a failure here is silent and keeps the cache; false =
// nothing painted yet, so a hard failure shows a clear boot message.
async function loadFullContextOnline(alreadyPainted){
  const session = state.session;
  const giveUp = () => {
    if(alreadyPainted) return true;       // keep the cached UI already shown
    state.bootError = 'load-failed';
    renderBoot();
    return true;
  };

  let profile;
  try{
    ({ data: profile } = await netTimeout(
      supabaseClient.from('profiles').select(PROFILE_COLS).eq('id', session.user.id).single()));
  }catch(e){ if(giveUp()) return; }

  // Account setup is guaranteed server-side (P1-12): the auth.users trigger
  // covers coach signups; ensure_account_setup() -- idempotent, a safe
  // no-op for a healthy account -- covers invited pitchers and older
  // accounts. Only call it when the profile is actually missing.
  let setupRes = null;
  if(!profile){
    try{
      const { data } = await netTimeout(supabaseClient.rpc('ensure_account_setup'));
      setupRes = data || null;
      ({ data: profile } = await netTimeout(
        supabaseClient.from('profiles').select(PROFILE_COLS).eq('id', session.user.id).single()));
    }catch(e){ if(giveUp()) return; }
  }

  if(!profile && setupRes && setupRes.needs_role){
    state.setupNeeded = 'role';
    state.loaded = true;
    finishInit();
    return;
  }
  if(!profile){
    if(alreadyPainted) return;   // keep the cached view rather than sign out mid-bullpen
    alert('Could not load your account profile. Please try logging in again, or contact support if this keeps happening.');
    await supabaseClient.auth.signOut();
    window.location.href = loginUrl();
    return;
  }
  // S4: every profile this login owns; the ACTIVE one runs the app.
  let mine = [profile];
  try{
    const { data: owned } = await netTimeout(supabaseClient.from('profiles').select(PROFILE_COLS).eq('account_id', session.user.id));
    if(owned && owned.length) mine = owned;
  }catch(e){ /* keep the primary alone */ }
  state.myProfiles = mine;
  state.profile = pickActiveProfile(mine, session.user.id);
  applySport();
  // P1-10: an existing login that never answered the age question gets the
  // one-time box -- decided HERE, on the online load only, so it can never
  // appear offline or stand between anyone and charting.
  state.attestNeeded = !(myAccountProfile() || {}).age_attestation;

  // R0: best-effort, matches profile/teams/roster's own "cached fast path
  // shows stale, this reconcile pass refreshes it" treatment -- a failure
  // here just leaves whatever was cached (fail closed: still unverified
  // until proven otherwise, never the other way).
  try{
    const { data: verRows } = await netTimeout(supabaseClient.rpc('my_verification_status'));
    if(verRows && verRows.length){
      state.myVerification = { email: verRows[0].email, emailConfirmed: verRows[0].email_confirmed };
    }
  }catch(e){ /* keep whatever was cached */ }

  // S4 B2: a parent login with no players yet has nothing to chart -- it adds one.
  if(state.profile.role === 'parent'){
    state.teams = []; state.roster = [];
    state.setupNeeded = null;
    state.loaded = true;
    await saveLastKnownContext();
    finishInit();
    return;
  }

  try{ await netTimeout(loadTeams()); }
  catch(e){ if(giveUp()) return; }

  // A coach with a profile but no team: try to finish setup from signup
  // metadata, then fall back to the create-team form.
  if(isCoach() && !state.teams.length){
    try{
      if(state.profile.is_primary !== false) await netTimeout(supabaseClient.rpc('ensure_account_setup'));
      await netTimeout(loadTeams());
    }catch(e){ /* fall through to the setup form */ }
    if(!state.teams.length){
      state.setupNeeded = 'team';
      state.loaded = true;
      finishInit();
      return;
    }
  }

  if(state.teams.length){
    try{ await netTimeout(onTeamChange(state.teams[0].id, true)); }
    catch(e){ if(giveUp()) return; }
  }

  // U9: land a brand-new pitcher on the setup page once (setup_dismissed_at
  // is null only for a profile created after this shipped -- every
  // pre-existing profile was backfilled non-null by the migration, so no
  // returning user is ever surprised by this). Never interrupts an
  // in-progress pen: refreshDraftState() (inside onTeamChange, just above)
  // has already populated draftAvailable by this point, so a pitcher
  // reloading mid-charting resumes their draft exactly as before instead
  // of landing here.
  // G1: was `state.view = 'setup'` (a full page, replacing whatever the
  // pitcher would otherwise land on). Now an overlay instead -- the
  // Bullpen/Live Game chooser needs to be reachable underneath it on a
  // brand-new pitcher's very first New Session too, which a full-page
  // takeover would have blocked.
  if(!isCoach() && state.profile && !state.profile.setup_dismissed_at && !state.draftAvailable){
    state.showSetupModal = true;
  }
  // Joel, Oct 1 (both sports): a brand-new coach -- head of a team with no
  // pitchers yet, welcome never dismissed -- lands on the coach welcome with
  // the pitcher invite link at the top, so the first thing to do is obvious.
  if(isCoach() && state.profile && !state.profile.setup_dismissed_at && isHeadOfCurrentTeam() && !state.roster.length){
    openCoachWelcome();
  }

  state.setupNeeded = null;
  state.loaded = true;
  await saveLastKnownContext();   // so the next cold start has a fresh cache to paint from
  warmOtherProfiles();            // S4: every other profile gets an offline snapshot too (background)
  loadGuardianStatus().then(() => { if(state.guardianStatus) render(); });   // P1-10
  finishInit();
}

// Instant boot screen -- shown before auth resolves, and for the two
// dead-end cases where there's nothing to paint.
function renderBoot(){
  const app = document.getElementById('app');
  if(!app) return;
  let msg;
  if(state.bootError === 'offline-no-context'){
    msg = `<p class="boot-msg boot-offline">You're offline and this device has no saved bullpen yet.<br>Connect to the internet once to finish signing in.</p>`;
  } else if(state.bootError === 'load-failed'){
    msg = `<p class="boot-msg">Couldn't load your account. Check your connection and reload.</p>`;
  } else if(!isOnline()){
    msg = `<p class="boot-msg boot-offline">Offline — opening your saved bullpen…</p>`;
  } else {
    msg = `<p class="boot-msg">Loading…</p>`;
  }
  app.innerHTML = `<div class="boot-screen">
    <div class="brand"><span class="brand-mark"></span><h1 class="display">Knuckleball<span>.</span></h1></div>
    ${msg}
  </div>`;
}

// Common tail for every init() path: paint the app, then wire up the passive
// sync triggers (reconnect, and "we just finished loading") -- manual "Sync
// now" is wired separately, on the button itself. Guarded so re-running init()
// (e.g. after the account-setup form completes) doesn't stack listeners.
let syncTriggersWired = false;
/* ---------- ROSTER RED DOT (U10 item 3, revised Sept 30) ----------
   Replaces the coach notices. A red dot by a pitcher's name when he has a
   saved session newer than the last time THIS viewer had his History on
   screen -- every viewer (each coach, and the pitcher himself on his History
   tab) has his own seen time in roster_seen, so one person looking never
   clears anyone else's dot. No time limit. Latest-session times come from
   get_roster_latest (caller's own RLS -- nothing History couldn't show),
   plus this device's own not-yet-synced sessions so a pen charted offline
   lights the dot at once. Offline: both maps are cached with the roster
   (saveLastKnownContext); clearing is queued on the device and sent later.
   Nothing here is ever awaited by charting.
   Session dots (Joel, Sept 30, revised): every session in History also
   carries a dot for each viewer until THAT viewer taps it open -- a
   permanent per-viewer record (session_opened, via get_unopened_sessions).
   Whoever saved the session gets the dots too: the automatic landing on
   History after "End session & save" (and its auto-expanded session)
   clears nothing -- only the viewer's own taps do. Tapping a dotted name
   opens his History (clearing the name dot); any other name opens New
   Session. */
function rosterLatestFor(pid){
  let t = state.rosterDotLatest[state.currentTeamId + ':' + pid] || 0;
  (state.outbox || []).forEach(i => {
    if(i.pitcherId === pid && i.teamId === state.currentTeamId && i.endedAt > t) t = i.endedAt;
  });
  return t;
}
function hasRosterDot(pid){
  if(!state.rosterDotsReady || !pid) return false;
  const latest = rosterLatestFor(pid);
  if(!latest) return false;
  const seen = state.rosterDotSeen[pid];
  return !seen || latest > seen;
}
function rosterSeenPendingKey(userId){ return 'rosterSeenPending:' + userId; }
let rosterDotsInFlight = false;
async function loadRosterDots(){
  const uid = state.profile && state.profile.id;   // S4: the viewer is the active profile
  const teamId = state.currentTeamId;
  if(rosterDotsInFlight || !uid || !teamId || !isOnline()) return;
  rosterDotsInFlight = true;
  try{
    const [latestRes, seenRes, unopenedRes] = await Promise.all([
      netTimeout(supabaseClient.rpc('get_roster_latest', { p_team_id: teamId }), 8000),
      netTimeout(supabaseClient.from('roster_seen').select('pitcher_id, seen_at').eq('viewer_id', uid), 8000),
      netTimeout(supabaseClient.rpc('get_unopened_sessions', { p_team_id: teamId, p_viewer: uid }), 8000)
    ]);
    if(latestRes.error || seenRes.error || unopenedRes.error || teamId !== state.currentTeamId) return;
    const unopened = {};
    (unopenedRes.data || []).forEach(r => { unopened[r.session_id] = r.pitcher_id; });
    // Forget local "opened" marks the server now agrees with; keep the rest
    // (still queued, or this answer was fetched before the mark landed).
    const openedLocal = {};
    Object.keys(state.openedLocal).forEach(id => { if(unopened[id]) openedLocal[id] = true; });
    ((await storGet(sessionOpenedPendingKey(uid))) || []).forEach(id => { openedLocal[id] = true; });
    const latest = Object.assign({}, state.rosterDotLatest);
    Object.keys(latest).forEach(k => { if(k.indexOf(teamId + ':') === 0) delete latest[k]; });
    (latestRes.data || []).forEach(r => { latest[teamId + ':' + r.pitcher_id] = new Date(r.latest_ended_at).getTime(); });
    const seen = {};
    (seenRes.data || []).forEach(r => { seen[r.pitcher_id] = new Date(r.seen_at).getTime(); });
    // A clear that hasn't reached the server yet (queued, or made while this
    // was in flight) wins over the server's older time.
    const pending = (await storGet(rosterSeenPendingKey(uid))) || {};
    [pending, state.rosterDotSeen].forEach(m => Object.keys(m).forEach(pid => {
      if(m[pid] > (seen[pid] || 0)) seen[pid] = m[pid];
    }));
    state.rosterDotLatest = latest;
    state.rosterDotSeen = seen;
    state.unopenedSessions = unopened;
    state.openedLocal = openedLocal;
    state.rosterDotsReady = true;
    saveLastKnownContext();
    render();
  }catch(e){ /* offline / timed out: keep the cached dots */ }
  finally{ rosterDotsInFlight = false; }
}
// Called at the top of every render: whenever a pitcher's History is
// actually on screen, this viewer's dot for him clears.
function noteHistoryOnScreen(){
  const pid = state.currentPitcherId;
  if(state.view !== 'history' || !pid || !hasRosterDot(pid)) return;
  if(state.historyLandingNoClear === pid) return;   // the post-save landing isn't a look
  // Never earlier than the session that lit it, so a phone clock running
  // behind can't leave the dot stuck on.
  const at = Math.max(Date.now(), rosterLatestFor(pid));
  state.rosterDotSeen[pid] = at;
  queueRosterSeen(pid, at);
}
// A History row's dot: unopened by this viewer (server list), or saved on
// this device and not yet synced -- until this viewer taps it.
function isNewHistoryRow(s){
  if(!state.rosterDotsReady || state.openedLocal[s.id]) return false;
  return !!(s.pending || state.unopenedSessions[s.id]);
}
function sessionOpenedPendingKey(userId){ return 'sessionOpenedPending:' + userId; }
async function markSessionOpened(id){
  if(!isNewHistoryRow({ id, pending: state.outbox.some(i => i.id === id) })) return;
  state.openedLocal[id] = true;
  const uid = state.profile && state.profile.id;   // S4: the viewer is the active profile
  if(!uid) return;
  try{
    const q = (await storGet(sessionOpenedPendingKey(uid))) || [];
    if(q.indexOf(id) < 0) q.push(id);
    await storSet(sessionOpenedPendingKey(uid), q);
  }catch(e){ return; }
  saveLastKnownContext();
  flushSessionOpened();
}
let sessionOpenedFlushing = false;
async function flushSessionOpened(){
  const uid = state.profile && state.profile.id;   // S4: the viewer is the active profile
  if(sessionOpenedFlushing || !uid || !isOnline()) return;
  sessionOpenedFlushing = true;
  try{
    const q = (await storGet(sessionOpenedPendingKey(uid))) || [];
    // A session still in the outbox isn't on the server yet -- its mark waits.
    const ready = q.filter(id => !state.outbox.some(i => i.id === id));
    if(!ready.length) return;
    const done = [];
    const row = id => ({ viewer_id: uid, session_id: id });
    const { error } = await netTimeout(supabaseClient.from('session_opened')
      .upsert(ready.map(row), { onConflict: 'viewer_id,session_id', ignoreDuplicates: true }), 8000);
    if(!error) done.push(...ready);
    else if(error.code === '23503'){
      // One of them no longer exists (deleted): send one by one, drop the dead ones.
      for(const id of ready){
        const r = await netTimeout(supabaseClient.from('session_opened')
          .upsert([row(id)], { onConflict: 'viewer_id,session_id', ignoreDuplicates: true }), 8000);
        if(!r.error || r.error.code === '23503') done.push(id);
      }
    }
    if(!done.length) return;
    const now = (await storGet(sessionOpenedPendingKey(uid))) || [];
    await storSet(sessionOpenedPendingKey(uid), now.filter(id => done.indexOf(id) < 0));
  }catch(e){ /* offline / timed out: stays queued */ }
  finally{ sessionOpenedFlushing = false; }
}
async function queueRosterSeen(pid, at){
  const uid = state.profile && state.profile.id;   // S4: the viewer is the active profile
  if(!uid) return;
  try{
    const pending = (await storGet(rosterSeenPendingKey(uid))) || {};
    pending[pid] = Math.max(at, pending[pid] || 0);
    await storSet(rosterSeenPendingKey(uid), pending);
  }catch(e){ return; }
  saveLastKnownContext();
  flushRosterSeen();
}
let rosterSeenFlushing = false;
async function flushRosterSeen(){
  const uid = state.profile && state.profile.id;   // S4: the viewer is the active profile
  if(rosterSeenFlushing || !uid || !isOnline()) return;
  rosterSeenFlushing = true;
  try{
    const pending = (await storGet(rosterSeenPendingKey(uid))) || {};
    const ids = Object.keys(pending);
    if(!ids.length) return;
    const { error } = await netTimeout(supabaseClient.from('roster_seen').upsert(
      ids.map(pid => ({ viewer_id: uid, pitcher_id: pid, seen_at: new Date(pending[pid]).toISOString() })),
      { onConflict: 'viewer_id,pitcher_id' }), 8000);
    if(error) return;   // stays queued for the next trigger
    const now = (await storGet(rosterSeenPendingKey(uid))) || {};
    ids.forEach(pid => { if(now[pid] === pending[pid]) delete now[pid]; });   // keep anything re-marked meanwhile
    await storSet(rosterSeenPendingKey(uid), now);
  }catch(e){ /* offline / timed out: stays queued */ }
  finally{ rosterSeenFlushing = false; }
}

/* ---------- HEADSHOTS (U10 item 8) ----------
   The player's own photo, private bucket `headshots`, object {id}.jpg.
   Readable only by the player and his coaches (storage policies, see the
   migration). Each device keeps a copy of the current version in
   localStorage (headshot:{id} -> { v: headshot_updated_at, data }), so a
   photo shows offline once it has been seen online, and a missing photo is
   just initials -- nothing here is ever awaited by charting. */
function headshotKey(id){ return 'headshot:' + id; }
function headshotSubjects(){
  if(isCoach()) return state.roster || [];
  return state.profile ? [mapProfile(state.profile)] : [];
}
function blobToDataUrl(blob){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
}
async function refreshHeadshots(){
  let changed = false;
  for(const p of headshotSubjects()){
    const key = headshotKey(p.id);
    if(!p.headshotUpdatedAt){
      if(state.headshots[p.id]){ delete state.headshots[p.id]; changed = true; }
      storDelete(key);
      continue;
    }
    const cached = await storGet(key);
    if(cached && cached.v === p.headshotUpdatedAt){
      if(state.headshots[p.id] !== cached.data){ state.headshots[p.id] = cached.data; changed = true; }
      continue;
    }
    if(!isOnline()) continue;   // offline and not cached yet: initials for now
    try{
      const { data: blob, error } = await netTimeout(supabaseClient.storage.from('headshots').download(p.id + '.jpg'), 8000);
      if(error || !blob) continue;
      const dataUrl = await blobToDataUrl(blob);
      await storSet(key, { v: p.headshotUpdatedAt, data: dataUrl });
      state.headshots[p.id] = dataUrl;
      changed = true;
    }catch(e){ /* timed out / offline: try again next time */ }
  }
  if(changed) render();
}
function initialsOf(name){
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '?';
  return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
}
function renderHeadshot(p){
  const src = p && state.headshots[p.id];
  return src
    ? `<img class="headshot" src="${src}" alt="">`
    : `<span class="headshot headshot-initials" aria-hidden="true">${escHtml(initialsOf(p && p.name))}</span>`;
}
function jerseyNumberOf(p){
  if(isCoach()) return p.uniformNumber;
  const t = state.teams.find(x => x.id === state.currentTeamId);
  return t ? t.uniform_number : null;
}
// Photo + name + "#12". Used by the page header (coach after tapping a
// player; the player on his own pages) and at the top of his Profile.
function renderPlayerIdent(p, withChips, chipsHtml){
  const num = jerseyNumberOf(p);
  return `<div class="pitcher-ident">
      ${renderHeadshot(p)}
      <div class="pitcher-ident-text">
        <h2 class="display">${escHtml(p.name)}${(num === null || num === undefined) ? '' : `<span class="pitcher-num">#${escHtml(String(num))}</span>`}</h2>
        ${withChips ? `<div class="pitcher-sub">${chipsHtml}</div>` : ''}
      </div>
    </div>`;
}
// Center crop to a square, resize to 256x256, re-encode as JPEG. Drawing to
// a canvas and re-encoding keeps only pixels -- EXIF (incl. GPS) is gone;
// the original file never leaves the device. <img> + canvas.toBlob only
// (no createImageBitmap/OffscreenCanvas): these work on older iOS WebKit.
function makeHeadshotJpeg(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try{
        const w = img.naturalWidth, h = img.naturalHeight, side = Math.min(w, h);
        const c = document.createElement('canvas');
        c.width = 256; c.height = 256;
        const ctx = c.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, (w - side) / 2, (h - side) / 2, side, side, 0, 0, 256, 256);
        c.toBlob(b => { URL.revokeObjectURL(url); b ? resolve(b) : reject(new Error('Could not process that photo.')); }, 'image/jpeg', 0.85);
      }catch(e){ URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("That file isn't a photo this device can read.")); };
    img.src = url;
  });
}
// 'library' = photo library / file picker; 'camera' = open the camera
// directly (capture="user": front camera, selfie-style -- the camera UI can
// still switch). Either way the file goes through makeHeadshotJpeg.
window.pickHeadshot = function(mode){
  const input = document.getElementById(mode === 'camera' ? 'headshot-camera' : 'headshot-input');
  if(input) input.click();   // straight from the tap -- iOS requires a user gesture
};
window.onHeadshotPicked = async function(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  if(!isOnline()){ state.headshotMsg = 'Connect to the internet to change your photo.'; render(); return; }
  state.headshotBusy = true; state.headshotMsg = ''; render();
  try{
    const blob = await makeHeadshotJpeg(file);
    const id = state.profile.id;
    const { error: upErr } = await supabaseClient.storage.from('headshots')
      .upload(id + '.jpg', blob, { upsert: true, contentType: 'image/jpeg', cacheControl: '60' });
    if(upErr) throw upErr;
    const ts = new Date().toISOString();
    const { error: pErr } = await supabaseClient.from('profiles').update({ headshot_updated_at: ts }).eq('id', id);
    if(pErr) throw pErr;
    state.profile.headshot_updated_at = ts;
    const dataUrl = await blobToDataUrl(blob);
    await storSet(headshotKey(id), { v: ts, data: dataUrl });
    state.headshots[id] = dataUrl;
    state.headshotMsg = 'Photo saved.';
    saveLastKnownContext();
  }catch(e){
    state.headshotMsg = "Couldn't save your photo: " + ((e && e.message) || 'unknown error');
  }
  state.headshotBusy = false;
  render();
};
window.removeHeadshot = async function(){
  if(!isOnline()){ state.headshotMsg = 'Connect to the internet to change your photo.'; render(); return; }
  state.headshotBusy = true; state.headshotMsg = ''; render();
  try{
    const id = state.profile.id;
    const { error: rmErr } = await supabaseClient.storage.from('headshots').remove([id + '.jpg']);
    if(rmErr) throw rmErr;
    const { error: pErr } = await supabaseClient.from('profiles').update({ headshot_updated_at: null }).eq('id', id);
    if(pErr) throw pErr;
    state.profile.headshot_updated_at = null;
    delete state.headshots[id];
    storDelete(headshotKey(id));
    state.headshotMsg = 'Photo removed.';
    saveLastKnownContext();
  }catch(e){
    state.headshotMsg = "Couldn't remove your photo: " + ((e && e.message) || 'unknown error');
  }
  state.headshotBusy = false;
  render();
};
// Profile: the player header (photo, name, #) with the buttons under it.
function renderHeadshotControls(p){
  return `<div class="profile-section headshot-section">
      ${renderPlayerIdent(p, false)}
      ${renderHeadshotButtons(p)}
    </div>`;
}
// New-player setup box: just the photo and the buttons -- the welcome line
// above it already says his name.
function renderSetupHeadshot(p){
  return `<div class="profile-section headshot-section"><h3>Photo</h3>
      <div class="headshot-setup-row">${renderHeadshot(p)}<div>${renderHeadshotButtons(p)}</div></div>
    </div>`;
}
function renderHeadshotButtons(p){
  const has = !!p.headshotUpdatedAt;
  const busy = state.headshotBusy;
  return `<div class="profile-row" style="margin-top:12px;">
        <button class="btn btn-ghost" ${busy ? 'disabled' : ''} onclick="pickHeadshot('library')">${busy ? 'Saving…' : has ? 'Upload new photo' : 'Upload photo'}</button>
        <button class="btn btn-ghost touch-only" ${busy ? 'disabled' : ''} onclick="pickHeadshot('camera')">Take photo</button>
        ${has ? `<button class="btn btn-ghost" ${busy ? 'disabled' : ''} onclick="removeHeadshot()">Remove photo</button>` : ''}

function finishInit(){
  render();
  if(!syncTriggersWired){
    syncTriggersWired = true;
    // Reconnecting: re-render (drop the offline indicator) and flush the outbox.
    window.addEventListener('online', () => { render(); triggerSync(); });
    // Going offline: re-render so the offline indicator appears right away.
    window.addEventListener('offline', () => render());
    // U11 (8): an iPad rotating across 860px switches the roster between
    // "rolls up" and "always open" -- re-render so it follows.
    const rosterMq = window.matchMedia('(max-width:860px)');
    if(rosterMq.addEventListener) rosterMq.addEventListener('change', () => render());
    else if(rosterMq.addListener) rosterMq.addListener(() => render());   // older iOS WebKit
    // Stuck-sync fix: follow supabase-js's own session changes instead of
    // trusting the one read at startup. SIGNED_OUT also arrives from other
    // tabs (supabase-js relays it over a BroadcastChannel). No awaits in
    // here -- supabase-js runs this callback inside its auth lock.
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if(event === 'TOKEN_REFRESHED' && session) state.session = session;
      else if(event === 'SIGNED_OUT' && isGenuineSignOut()) goToLoginAfterSignOut();
    });
  }
  triggerSync();
  loadRosterDots();     // U10 (3): background, never awaited -- charting never waits on it
  refreshHeadshots();   // U10 (8): same -- cached photos show offline, missing ones never block
}

// supabase-js (no custom storageKey configured -- see supabase-config.js)
// persists the session under `sb-<project-ref>-auth-token`, with `user`
// embedded directly in that same object. Recomputed here from SUPABASE_URL
// rather than hard-coded so it can't drift from whatever project this page
// is actually pointed at (production vs. staging).
function authStorageKey(){
  return 'sb-' + new URL(SUPABASE_URL).hostname.split('.')[0] + '-auth-token';
}
function readPersistedSessionRaw(){
  try{
    const raw = localStorage.getItem(authStorageKey());
    if(!raw) return null;
    const sess = JSON.parse(raw);
    if(sess && sess.access_token && sess.user && sess.user.id) return sess;
    return null;
  } catch(e){ return null; }
}

// Stuck-sync fix (Sept 2026): supabase-js never fails a request for lack of
// a session -- when getSession() has none (expired token + failed refresh)
// it sends the public anon key instead, so an outbox write reaches Postgres
// as anonymous and RLS rejects it ("new row violates row-level security
// policy"). That read as a data error and sat on "Pending sync · retrying"
// forever with no way back to a login. The design principle's two cases:
// a GENUINE online sign-out -- supabase-js removes the stored session only
// on a real credential rejection -- goes to login (the outbox and the
// in-progress draft live under storage keys signing in never touches, so
// nothing queued is lost; signing back in syncs it). Anything else --
// offline, or a refresh that merely couldn't reach the server, which leaves
// the stored session in place -- never bounces a charter.
function isGenuineSignOut(){ return isOnline() && !readPersistedSessionRaw(); }

function loginUrl(){ return 'login.html?sport=' + (document.documentElement.getAttribute('data-sport') === 'softball' ? 'softball' : 'baseball'); }

   One is active at a time and runs everything: sport, theme, tabs, every
   query. Switching saves this profile's offline snapshot, puts the target's

// "Who's charting?" picker when there are several, or the last profile plus
// an "Add <sport>" banner when there are none. Otherwise: the last active.
function pickActiveProfile(list, uid){
  const signinSport = lsGet('kb:signinSport'), signinRole = lsGet('kb:signinRole');
  lsDel('kb:signinSport'); lsDel('kb:signinRole');
  const stored = lsGet(activeProfileKey(uid));
  // S4 B2: a parent profile never charts -- only picked when the login has nothing else.
  const chartable = list.filter(p => p.role !== 'parent');
  const fallback = chartable.find(p => p.id === stored) || chartable.find(p => p.is_primary) || chartable[0]
    || list.find(p => p.id === stored) || list[0];
  let pick = fallback;
  if(signinSport){
    const ofSport = list.filter(p => p.role !== 'parent' && p.sport === signinSport);
    const byRole = signinRole ? ofSport.filter(p => p.role === signinRole) : [];
    const pool = byRole.length ? byRole : ofSport;
    if(pool.length === 1) pick = pool[0];
    else if(pool.length > 1){ state.whoPicker = pool.map(p => p.id); pick = pool.find(p => p.id === stored) || pool[0]; }
    else state.addSportBanner = signinSport;

window.switchProfile = async function(id){
  state.acctOpen = false;

  const target = (state.myProfiles || []).find(p => p.id === id);
  if(!target) return;
  const uid = state.session.user.id;
  const snap = await storGet(lastKnownKey(uid) + ':' + id);
  if(!snap && !isOnline()){
    // Kept visible (the menu stays open) -- a silent no-op read as "switching
    // is broken" on the first offline test (Joel, Oct 2).
    state.acctOpen = true;
    state.acctMsg = (SPORT_NAME[target.sport] || 'That profile') + " hasn't been opened on this device yet. Connect once and it will switch offline after that.";
    render();
    return;
  }
  await saveLastKnownContext();
  const next = snap ? Object.assign({}, snap, { myProfiles: state.myProfiles }) : {
    profile: target, myProfiles: state.myProfiles, teams: [], roster: [], myVerification: state.myVerification
  };
  await storSet(lastKnownKey(uid), next);
  lsSet(activeProfileKey(uid), id);

  // only works where the offline shell (service worker) is installed, and
  // it can't be on a plain-http address -- so a reload made offline
  // switching depend on something it shouldn't. Same steps as a cold start
  // from the cache, then the usual background refresh when online.
  state.whoPicker = null; state.addSportBanner = null; state.acctMsg = '';
  state.expandedSessionId = null; state.sessionSheetOpen = false; state.sessionDiscardArmed = false;
  state.showSetupModal = false; state.setupNeeded = null; state.pendingTarget = null; state.hint = '';

// Offline switching needs every profile's snapshot on the device, not just
// the ones opened here before. While online, build the missing ones in the
// background from the same queries the app runs -- WITHOUT touching the
// live state the screen is drawing from.
async function fetchTeamsFor(prof){
  if(prof.role === 'coach'){
    const { data } = await supabaseClient.from('team_coaches').select('role, teams(id, name, level)').eq('coach_id', prof.id).order('team_id');
    return (data || []).filter(r => r.teams).map(r => ({ ...r.teams, myRole: r.role }));
  }
  const { data } = await supabaseClient.from('pitcher_teams').select('team_id, uniform_number, teams(id, name, level)').eq('pitcher_id', prof.id);
  return (data || []).filter(r => r.teams).map(r => ({ ...r.teams, uniform_number: r.uniform_number }));
}
async function fetchRosterFor(teamId){
  const { data, error } = await supabaseClient.from('pitcher_teams')
    .select('uniform_number, profiles(id, full_name, pitch_types, contact_emails, throws, relative_accuracy_enabled, uses_radar_gun, headshot_updated_at)')
    .eq('team_id', teamId);
  if(error) return [];
  const roster = (data || []).filter(r => r.profiles).map(r => {
    const p = mapProfile(r.profiles);
    p.uniformNumber = (r.uniform_number === null || r.uniform_number === undefined) ? null : r.uniform_number;
    return p;
  });
  const { data: verRows } = await supabaseClient.rpc('get_roster_verification', { p_team_id: teamId });
  const ver = {}; (verRows || []).forEach(v => { ver[v.pitcher_id] = v; });
  roster.forEach(p => { const v = ver[p.id]; p.accountEmail = v ? v.email : null; p.emailConfirmed = v ? v.email_confirmed : false; p.guardianPending = !!(v && v.guardian_pending); p.ageAnswered = !!(v && v.age_answered); p.managed = !!(v && v.managed); });
  roster.sort((a, b) => {
    const an = a.uniformNumber, bn = b.uniformNumber;
    if(an !== null && bn !== null && an !== bn) return an - bn;
    if(an !== null && bn === null) return -1;
    if(an === null && bn !== null) return 1;
    return String(a.name).localeCompare(String(b.name));
  });
  return roster;
}
async function warmOtherProfiles(){
  if(!state.session || !isOnline()) return;
  const uid = state.session.user.id;
  for(const prof of (state.myProfiles || [])){
    if(!state.profile || prof.id === state.profile.id || prof.role === 'parent') continue;
    try{
      const key = lastKnownKey(uid) + ':' + prof.id;
      if(await storGet(key)) continue;
      const teams = await fetchTeamsFor(prof);
      const team = teams[0] || null;
      const roster = (prof.role === 'coach' && team) ? await fetchRosterFor(team.id) : [];
      const ids = prof.role === 'coach' ? roster.map(r => r.id) : [prof.id];
      const zones = {};
      if(ids.length){
        const { data } = await supabaseClient.from('accuracy_zones').select('pitcher_id, pitch_type, batter_side, cells').in('pitcher_id', ids);
        ids.forEach(id => { zones[id] = {}; });
        (data || []).forEach(r => { ((zones[r.pitcher_id] = zones[r.pitcher_id] || {})[r.pitch_type] = (zones[r.pitcher_id][r.pitch_type] || {}))[r.batter_side] = r.cells || []; });
      }
      await storSet(key, {
        profile: prof, myProfiles: state.myProfiles, teams, roster, zones,
        rosterDotLatest: {}, rosterDotSeen: {}, unopenedSessions: {}, openedLocal: {},
        currentTeamId: team ? team.id : null,
        currentPitcherId: prof.role === 'coach' ? (roster[0] ? roster[0].id : null) : prof.id,
        myVerification: state.myVerification

    }catch(e){ console.error('warm profile snapshot failed', prof.id, e); }
  }
}

// On-device only (localStorage, no network): if the coach has an unfinished draft
// for a rostered pitcher on this team, select that pitcher so launch opens into it.
function adoptDraftPitcher(){
  if(!isCoach() || !state.currentTeamId) return;
  const has = id => { try{ const d = JSON.parse(localStorage.getItem('draft:' + id + ':' + state.currentTeamId)); return !!(d && d.pitches && d.pitches.length); }catch(e){ return false; } };

/* ---------- ACCURACY ZONES (U7 Phase B) ----------
   Per pitcher, per pitch type, per batter side: the catcher-frame cells ('row-col')
   that count as accurate. The pitcher's relative-accuracy switch and zones apply no
   matter who is charting. Cached with the roster snapshot so charting reads them
   with no network. */
function zoneCellsFor(pitcherId, type, side){
  const z = state.zones[pitcherId];
  const c = z && z[type] && z[type][side];
  return (c && c.length) ? c : null;
}
async function loadZones(){
  try{
    const ids = isCoach() ? state.roster.map(r => r.id) : (state.profile ? [state.profile.id] : []);
    if(!ids.length) return;
    const { data, error } = await supabaseClient.from('accuracy_zones').select('pitcher_id, pitch_type, batter_side, cells').in('pitcher_id', ids);
    if(error || !data) return;                    // offline / failed: keep the cached zones
    const fresh = {};
    ids.forEach(id => { fresh[id] = {}; });
    data.forEach(r => {
      const byType = fresh[r.pitcher_id] || (fresh[r.pitcher_id] = {});
      (byType[r.pitch_type] = byType[r.pitch_type] || {})[r.batter_side] = r.cells || [];
    });
    state.zones = Object.assign({}, state.zones, fresh);
  }catch(e){ /* best-effort */ }
}

// Numerical order by uniform number; pitchers who haven't set one yet go last
// (alphabetical among themselves) so the list stays stable.
function sortRoster(){
  state.roster.sort((a, b) => {
    const an = a.uniformNumber, bn = b.uniformNumber;
    if(an !== null && bn !== null && an !== bn) return an - bn;
    if(an !== null && bn === null) return -1;
    if(an === null && bn !== null) return 1;
    return String(a.name).localeCompare(String(b.name));
  });
}

async function loadRosterForTeam(teamId){
  const { data, error } = await supabaseClient
    .from('pitcher_teams')
    .select('uniform_number, profiles(id, full_name, pitch_types, contact_emails, throws, relative_accuracy_enabled, uses_radar_gun, headshot_updated_at)')
    .eq('team_id', teamId);
  if(error){ console.error('loadRosterForTeam failed', error); state.roster = []; return; }
  state.roster = (data || []).filter(r => r.profiles).map(r => {
    const p = mapProfile(r.profiles);
    p.uniformNumber = (r.uniform_number === null || r.uniform_number === undefined) ? null : r.uniform_number;
    return p;
  });
  sortRoster();
  refreshHeadshots();   // U10 (8): background -- never awaited, never blocks the roster

  // R0: verification status per pitcher, via the one sanctioned read path
  // (get_roster_verification -- auth.users itself is never exposed to
  // PostgREST/RLS). Best-effort: a failure here shouldn't block the
  // roster from rendering, just leaves emailConfirmed undefined, which
  // the UI treats the same as "unverified" (fail closed, never show a
  // report-recipient as usable when its status is unknown).
  const { data: verRows } = await supabaseClient.rpc('get_roster_verification', { p_team_id: teamId });
  const verByPitcher = {};
  (verRows || []).forEach(v => { verByPitcher[v.pitcher_id] = v; });
  state.roster.forEach(p => {
    const v = verByPitcher[p.id];
    p.accountEmail = v ? v.email : null;
    p.emailConfirmed = v ? v.email_confirmed : false;
    p.guardianPending = !!(v && v.guardian_pending);   // P1-10
    p.managed = !!(v && v.managed);                     // S4 B9
    p.ageAnswered = !!(v && v.age_answered);
  });
}

// R6: the coach Profile tab's team-admin section, for the ACTIVE team.
// teamCoachesList (the read-only-for-assistants coaches list) is fetched
// for any coach; teamInviteLinks (both tokens) only for the head --
// get_team_invite_links itself would refuse an assistant anyway, but
// there's no reason to even ask when the section won't show the links to
// them. Called whenever the Profile view renders for a coach and the
// active team has changed since the last fetch (renderProfileView),
// never cached longer than that -- a switch, a handoff, or a removal all
// need this to be current the next time Profile is opened.
async function loadCoachAdminData(teamId){
  if(!teamId) { state.teamInviteLinks = null; state.teamCoachesList = null; return; }

  // team_coaches has TWO foreign keys into profiles (coach_id AND
  // invited_by), so a bare `profiles(...)` embed is ambiguous to PostgREST
  // (PGRST201, caught live against real staging -- the mock harness this
  // was first built against doesn't model embed disambiguation, so this
  // only surfaced once a real coach with real staff loaded the page).
  // Naming the FK explicitly resolves it.
  const { data: staffRows } = await supabaseClient
    .from('team_coaches')
    .select('coach_id, role, profiles!team_coaches_coach_id_fkey(full_name)')
    .eq('team_id', teamId);
  state.teamCoachesList = (staffRows || [])
    .filter(r => r.profiles)
    .map(r => ({ coachId: r.coach_id, role: r.role, name: r.profiles.full_name }))
    .sort((a, b) => (a.role === b.role ? a.name.localeCompare(b.name) : (a.role === 'head' ? -1 : 1)));

  if(isHeadOfTeam(teamId)){
    const { data, error } = await supabaseClient.rpc('get_team_invite_links', { p_team_id: teamId });
    state.teamInviteLinks = error ? null : data;
  } else {
    state.teamInviteLinks = null;
  }
}

// navigator.clipboard is unavailable or rejected in some contexts (non-HTTPS,
// certain in-app browsers / PWA modes), so fall back to a selected textarea +
// execCommand('copy'), which needs no permission but must run synchronously
// inside the click.
function copyTextFallback(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px;';
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, text.length);
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
  document.body.removeChild(ta);
  return ok;
}
async function copyLinkGeneric(link, statusField){
  let ok = false;
  try{
    await navigator.clipboard.writeText(link);
    ok = true;
  }catch(e){
    ok = copyTextFallback(link);
  }
  state[statusField] = ok ? 'copied' : 'error';
  render();
  setTimeout(() => { state[statusField] = null; render(); }, ok ? 2000 : 4000);
}

/* ---------- DEFERRED VERIFICATION (R0) ----------
   Banner state + actions for a pitcher whose account email isn't
   confirmed yet. Resend uses the same signup-confirmation email Supabase
   already sends; Change Email is the actual point of this packet (item f)
   -- one tap, self-service, no coach or support needed. */
window.resendVerification = async function(){
  if(!state.myVerification.email) return;
  state.verifyResendStatus = 'sending';
  render();
  // R0 follow-up: this used to call supabaseClient.auth.resend({type:'signup'}),
  // Supabase's OWN confirmation resend -- with "Confirm email" off, Supabase
  // never sent that email in the first place, so that call would silently
  // no-op forever. Verification is ours now; resend goes through our own
  // send-verification-email function, same auth pattern as sendSessionReport.
  try{
    if(typeof VERIFY_EMAIL_URL === 'undefined' || VERIFY_EMAIL_URL.indexOf('YOUR_') === 0){
      throw new Error('not configured');
    }
    const res = await fetch(VERIFY_EMAIL_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.session.access_token }
    });
    if(!res.ok) throw new Error('send failed');
    state.verifyResendStatus = 'sent';
  }catch(e){
    state.verifyResendStatus = 'error';
  }
  render();
};
window.toggleChangeEmail = function(){

};
window.submitChangeEmail = async function(){
  const input = document.getElementById('change-email-input');
  const email = (input && input.value || '').trim();
  if(!email) return;
  state.changeEmailStatus = 'sending';
  render();
  const { error } = await supabaseClient.auth.updateUser({ email });
  if(error){
    state.changeEmailStatus = 'error:' + error.message;
    render();
    return;
  }
  // Change Email's own explicit invalidation step (not a side effect
  // generate_email_verify_token applies to every caller anymore -- that
  // version silently un-verified two real pitchers who'd just legitimately
  // verified and then hit a stale Resend button on an already-open tab;
  // see 20260925040000). Not swallowed on failure: if this doesn't
  // succeed, the account would keep showing verified for an address
  // nobody has confirmed, which is the exact bug being fixed here -- so a
  // failure here is reported the same way a failed updateUser() is,
  // rather than pressing on to send a verification email regardless.
  const { error: invalidateErr } = await supabaseClient.rpc('invalidate_my_email_verification');
  if(invalidateErr){
    state.changeEmailStatus = 'error:Your email changed, but we could not clear the old verification. Please try again or contact support.';
    render();
    return;
  }
  // Safe to fire our own verification email right away only because
  // staging has "Secure email change" off, so updateUser() above already
  // applied auth.users.email synchronously -- with that setting on, this
  // would fire to the address being REPLACED, not the new one (confirmed
  // empirically during the staging walkthrough). Never re-enable that
  // setting without revisiting this.
  try{
    if(typeof VERIFY_EMAIL_URL !== 'undefined' && VERIFY_EMAIL_URL.indexOf('YOUR_') !== 0){
      await fetch(VERIFY_EMAIL_URL, {
        method: 'POST',

      });
    }
  }catch(e){ /* recoverable via the Resend button */ }
  state.changeEmailStatus = 'sent';
  // Reflect the change immediately rather than waiting for the next
  // background reconcile -- the banner should show the new (unverified)
  // address right away, matching invalidate_my_email_verification just did.
  state.myVerification = { email, emailConfirmed: false };
