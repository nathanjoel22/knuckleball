<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bullpen Session Report — Knuckleball</title>
<style>
  :root{
    /* Same token values as bullpen-tracker.html's light theme -- this page
       is a small independent shell, not part of the charting app, but
       should still look like the same product. */
    --page-bg:        #F7FAF8;
    --surface-border: #CFE6D7;
    --field-dark:     #0F241B;
    --ink-dim:        #2E4A40;
    --ink-faint:      #527065;
    --chalk:          #F1ECDD;
    --chalk-dim:      #B7C2B4;
    --amber:          #E8A83D;
    --red:            #C0453B;
    --border-on-dark: rgba(241,236,221,0.16);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--page-bg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  body{ display:flex; flex-direction:column; }
  .kb-bar{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
    background:var(--field-dark); border-bottom:1px solid var(--border-on-dark);
  }
  .kb-mark{ color:var(--amber); font-weight:700; font-size:14px; letter-spacing:0.04em; }
  .kb-actions{ display:flex; gap:8px; }
  .kb-btn{
    font:inherit; font-size:13px; font-weight:600; padding:7px 14px; border-radius:6px;
    border:1px solid var(--border-on-dark); background:transparent; color:var(--chalk-dim); cursor:pointer;
  }
  .kb-btn:hover{ border-color:var(--chalk-dim); color:var(--chalk); }
  .kb-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  #frame-wrap{ flex:1 1 auto; min-height:0; }
  #report-frame{ width:100%; height:100%; border:none; display:block; background:var(--page-bg); }
  #state{
    flex:1 1 auto; display:none; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:40px 24px; color:var(--ink-dim);
  }
  #state.visible{ display:flex; }
  #state h1{ color:var(--field-dark); font-size:18px; margin:0 0 8px; }
  #state p{ font-size:14px; color:var(--ink-faint); max-width:40ch; margin:0; }
  #state.is-error h1{ color:var(--red); }
</style>
</head>
<body>
  <div class="kb-bar">
    <div class="kb-mark">KNUCKLEBALL</div>
    <div class="kb-actions">
      <button class="kb-btn" id="btn-download" disabled onclick="downloadReport()">Download</button>
      <button class="kb-btn" id="btn-print" disabled onclick="printReport()">Print</button>
    </div>
  </div>
  <div id="frame-wrap"></div>
  <div id="state">
    <h1 id="state-title">Loading report…</h1>
    <p id="state-message"></p>
  </div>

<!-- Loaded only for the SUPABASE_URL constant (same config-swap file used
     for local/staging testing, per DEPLOY.md) -- this page makes no other
     use of the Supabase client the CDN script sets up. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
// U4 Amendment 1 (Sept 10 2026) -- report.html is the shell page that makes
// self-contained reports viewable despite Supabase forcing text/html to
// serve as text/plain on *.supabase.co. It fetches the frozen report as
// TEXT (a fetch is unaffected by that override -- only browser navigation
// cares about Content-Type) and renders it into a fully sandboxed iframe.
// This page itself is a normal part of the site (may use JS, may change
// over time); the FETCHED report content remains the frozen, self-contained,
// script-free artifact the renderer produced -- this page never modifies it.

// Must match randomReportToken() in send-session-report/index.ts EXACTLY.
// This is the only thing standing between a crafted ?r= value and this
// page becoming a fetch-anything proxy for the reports bucket -- the check
// must run, and fail closed, BEFORE any URL is built or any fetch happens.
var TOKEN_RE = /^[0-9a-f]{64}\.html$/;

var reportText = null;

function showState(title, message, isError){
  document.getElementById('frame-wrap').style.display = 'none';
  var el = document.getElementById('state');
  el.classList.add('visible');
  el.classList.toggle('is-error', !!isError);
  document.getElementById('state-title').textContent = title;
  document.getElementById('state-message').textContent = message || '';
}

function downloadReport(){
  if(!reportText) return;
  var blob = new Blob([reportText], { type: 'text/html' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'bullpen-report.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function printReport(){
  var frame = document.getElementById('report-frame');
  // contentWindow.print() is one of the handful of cross-origin-safe window
  // methods (like postMessage/close/focus) -- it works from this
  // (unsandboxed) parent page even though the iframe itself has an opaque
  // origin and cannot run any script of its own.
  if(frame && frame.contentWindow){
    try { frame.contentWindow.print(); } catch(e){ window.print(); }
  }
}

async function init(){
  var params = new URLSearchParams(window.location.search);
  var token = params.get('r') || '';

  if(!TOKEN_RE.test(token)){
    showState('Report link incomplete', 'This link is missing or malformed. Ask for the report to be re-sent.', true);
    return;
  }

  var res;
  try{
    res = await fetch(SUPABASE_URL + '/storage/v1/object/public/reports/' + token);
  } catch(e){
    showState('Could not load report', 'Check your connection and try again.', true);
    return;
  }

  if(!res.ok){
    // Covers both a bad/guessed token and a deleted session's report
    // object -- from a viewer's side these look identical, and both should
    // read as "the report is gone," not as an app error.
    showState('Report not available', 'This report may have been removed, or the link is incorrect.', true);
    return;
  }

  try{
    reportText = await res.text();
  } catch(e){
    showState('Could not load report', 'The report could not be read. Try again in a moment.', true);
    return;
  }

  var frame = document.createElement('iframe');
  frame.id = 'report-frame';
  // Deliberately empty: no allow-scripts, no allow-same-origin, no tokens
  // at all. An opaque origin with zero script execution is the entire
  // point -- this is what makes the escaping rules in the renderer a
  // second line of defense rather than the only one.
  frame.setAttribute('sandbox', '');
  frame.srcdoc = reportText;
  document.getElementById('frame-wrap').appendChild(frame);
  document.getElementById('btn-download').disabled = false;
  document.getElementById('btn-print').disabled = false;
}

init();
</script>
</body>
</html>
