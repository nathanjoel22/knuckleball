<script>
  // W1 (Oct 15 2026): inside the Knuckleball iOS / Android app (Capacitor), same-site pages that aren't the app itself
  // -- privacy, terms, reports, the account-deletion page -- open in the phone's own browser sheet (Done / close button),
  // so the app never navigates away from itself. In a browser, or a home-screen install, this does nothing.
  (function(){
    var cap = window.Capacitor;
    if(!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return;
    document.documentElement.classList.add('kb-native');
    document.addEventListener('click', function(e){
      var a = e.target && e.target.closest && e.target.closest('a[href]');
      if(!a) return;
      var u; try{ u = new URL(a.getAttribute('href'), location.href); }catch(x){ return; }
      if(u.origin !== location.origin || !/\/(report|privacy|terms|delete-account)\.html$/.test(u.pathname)) return;
      var B = cap.Plugins && cap.Plugins.Browser;
      if(!B || !B.open) return;
      e.preventDefault();
      B.open({ url: u.href });
    }, true);
  })();
</script>

<title>Log in · Knuckleball</title>
<script>
  // Already signed in on this device? Skip the form and go to the tracker.
  // A logged-in charter who lands here with no network would otherwise be
  // stuck: the form can't submit offline (P1-01). Purely a local read of
  // the stored Supabase session -- bullpen-tracker.html's init() stays the
  // single authority on the online/offline auth decision, and this
  // validity check mirrors its readPersistedSessionRaw() so a malformed
  // stored blob can't cause a redirect loop.
  (function(){
    try{
      for(var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if(!k || !/^sb-.+-auth-token$/.test(k)) continue;
        var raw = localStorage.getItem(k);
        if(!raw) continue;
        var s = JSON.parse(raw);
        if(s && s.access_token && s.user && s.user.id){
          window.location.replace('bullpen-tracker.html');
          return;
        }
      }
    } catch(e){ /* storage blocked / bad JSON -> just show the form */ }
  })();
</script>
<script src="vendor/supabase.js"></script>
<script>
  // Offline app shell (P0-06) -- lets this page load with no network.
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW registration failed', err));
    });
  }
</script>
<script>
  // S1: theme before first paint. A ?sport= on the URL wins (every link to
  // sign-in / signup carries one) and is remembered; otherwise this device's
  // remembered choice. Join pages re-theme from the team's sport.
  (function(){
    var sp = null;
    try{
      var q = new URLSearchParams(location.search).get('sport');
      if(q === 'baseball' || q === 'softball'){ sp = q; localStorage.setItem('kb:sport', q); }
      else sp = localStorage.getItem('kb:sport');
    }catch(e){}
    window.KB_SPORT_KNOWN = (sp === 'baseball' || sp === 'softball');
    // Sign-in is always one sport's (Joel, Oct 1). Sport unknown -> choose it first.
    if(!window.KB_SPORT_KNOWN){ location.replace('index.html?choose=1'); return; }
    window.KB_SPORT = sp === 'softball' ? 'softball' : 'baseball';
    document.documentElement.setAttribute('data-sport', window.KB_SPORT);
  })();
</script>

<body class="signin">
  <form class="card" id="login-form" autocomplete="off">
    <header class="signin-head"><div class="brand-block">
      <div class="brand"><h1 class="display brand-word">KNUCKLEBALL</h1></div>
      <span class="tagline">Always a Step Ahead</span>
    </div>

    <div>
      <span class="role-tag slant-tag" id="role-tag">Sign in</span>
      <h2 class="display">Welcome <span class="last">back</span></h2>
    </div></header>

    <div class="field">
      <label class="field-label" for="email">Email</label>
      <input class="text-input" id="email" name="email" type="email" placeholder="you@example.com" autofocus autocomplete="email">
    </div>
    <div class="field">
      <label class="field-label" for="password">Password</label>
      <input class="text-input" id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password">
      <a href="reset-password.html" class="forgot-link">Forgot password?</a>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>

    <div class="foot-row">
      <a href="index.html?choose=1">&larr; Back</a>
      <a href="coach-signup.html" id="coach-signup-link">New coach? Create an account</a>
      <a href="pitcher-signup.html" id="pitcher-signup-link">New pitcher? Create an account</a>
    </div>
    <a href="parent-signup.html" id="parent-signup-link" style="text-align:center;">Parent or guardian? Set up your player</a>
  </form>

<script src="supabase-config.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const role = params.get('role');
  const roleTag = document.getElementById('role-tag');
  const sportName = (window.KB_SPORT === 'softball') ? 'Softball' : 'Baseball';
  if(role === 'coach'){ roleTag.textContent = sportName + ' · Coach sign in'; }
  else if(role === 'pitcher'){ roleTag.textContent = sportName + ' · Pitcher sign in'; }
  else { roleTag.textContent = sportName + ' sign in'; }

  const form = document.getElementById('login-form');
  const errorEl = document.getElementById('error-msg');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    errorEl.textContent = '';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if(!email || !password){
      errorEl.textContent = 'Enter both email and password.';
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in…';

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if(error){
      // Tell a connectivity failure apart from a real credential rejection
      // so an offline user isn't told their password is wrong.
      const looksOffline = (typeof navigator !== 'undefined' && navigator.onLine === false)
        || /failed to fetch|network|load failed|fetch/i.test(error.message || '');
      errorEl.textContent = looksOffline
        ? "Can't reach the server — check your connection and try again."
        : error.message;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in';
      return;
    }

    // S4 A8 (Joel, Oct 2): one login can own a baseball AND a softball
    // profile, so sign-in never refuses for sport or role any more. It just
    // tells the app which side the person came in on; the app opens the
    // matching profile, asks "Who's charting?" when there are several, or
    // offers "Add <sport>" when there are none.
    try{
      const chosen = localStorage.getItem('kb:sport');
      if(chosen === 'baseball' || chosen === 'softball') localStorage.setItem('kb:signinSport', chosen);
      if(role === 'coach' || role === 'pitcher') localStorage.setItem('kb:signinRole', role); else localStorage.removeItem('kb:signinRole');
    }catch(e){}

    window.location.href = 'bullpen-tracker.html';
  });
</script>
<script>
  // S1: every link to sign-in or signup goes to THIS sport's page.
  (function(){
    var sp = window.KB_SPORT || 'baseball';
    document.querySelectorAll('a[href="login.html"], a[href="coach-signup.html"], a[href="pitcher-signup.html"], a[href="parent-signup.html"]').forEach(function(a){
      a.setAttribute('href', a.getAttribute('href') + '?sport=' + sp);
    });
  })();
</script>
<script>
  // P1-10: show the signup link for the side this sign-in page is for.
  (function(){ var r = new URLSearchParams(location.search).get('role');
    if(r === 'coach'){ var x = document.getElementById('pitcher-signup-link'); if(x) x.style.display = 'none'; var z = document.getElementById('parent-signup-link'); if(z) z.style.display = 'none'; }
    if(r === 'pitcher'){ var y = document.getElementById('coach-signup-link'); if(y) y.style.display = 'none'; } })();
</script>
<p class="site-footer">Knuckleball LLC 2026 &middot; <a href="privacy.html">Privacy</a> &middot; <a href="terms.html">Terms</a></p>
<script>
  // P1-10: the policy pages theme themselves from the link's #sport.
  (function(){ var sp = window.KB_SPORT === 'softball' ? 'softball' : 'baseball';
    document.querySelectorAll('.site-footer a[href^="privacy.html"], .site-footer a[href^="terms.html"]').forEach(function(a){ a.setAttribute('href', a.getAttribute('href').split('#')[0] + '#' + sp); }); })();
