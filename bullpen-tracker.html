/* ---------- EMAIL REPORT ---------- */
// Shared by sendSessionReport and viewSessionReport -- both hit the same
// endpoint with the same session payload, differing only in whether
// `emails` is non-empty. Kept as ONE function so the two call sites can't
// drift (the U6-nulling / history-shape rules only need stating once).
function buildReportPayload(session, p){
  const team = state.teams.find(t => t.id === state.currentTeamId);

  // U4b: the renderer computes everything itself from raw pitches -- no
  // more precomputed stats/per-type history. isDefaultVeloReading is
  // applied here, once, client-side, exactly as U6 designed: the renderer
  // trusts velo as given and never carries its own copy of the cutoff.
  const pitchesForReport = session.pitches.map(pt =>
    isDefaultVeloReading(pt) ? { ...pt, velo: null } : pt
  );

  // Prior BULLPEN sessions only (never the one being reported, and never a
  // game -- found live in production while working G2: this filter was
  // missing, so a pitcher who'd logged both kinds already had their games'
  // pitches silently pulled into sessionStats() here, which computes
  // target-vs-actual accuracy that has no meaning for a game pitch,
  // corrupting this pen's own trend section with a meaningless 0%-accuracy
  // entry. Matches the renderer's own "3+ PRIOR sessions or omit" trend
  // rule. Just the per-session aggregates the Trends section actually
  // reads, not the old per-type breakdown the PDF's trend charts used.
  const history = state.sessions
    .filter(s => s.id !== session.id && (s.kind || 'bullpen') === 'bullpen')
    .slice().sort((a,b) => a.date - b.date)
    .map(s => {
      const sStats = sessionStats(s.pitches);
      return {
        date: s.date,
        dateLabel: new Date(s.date).toLocaleDateString(undefined, { month:'numeric', day:'numeric' }),
        total: sStats.total,
        strikePct: sStats.strikePct,
        commandPct: sStats.hasZone ? sStats.zoneAccuracyPct : sStats.accuracyPct,
        hasVelo: sStats.hasVelo,
        avgVelo: sStats.avgVelo
      };
    });

  return {
    sessionId: session.id,
    pitcherId: p.id,
    pitcherName: p.name,
    // A pitcher viewing their own profile never gets uniformNumber from
    // mapProfile() (always null there) -- it lives on their OWN team
    // membership row instead (state.teams[].uniform_number). A coach's
    // roster-sourced p.uniformNumber already has the real value.
    uniformNumber: (p.uniformNumber != null) ? p.uniformNumber : (team && team.uniform_number != null ? team.uniform_number : null),
    date: session.date,
    teamName: team ? team.name : '',
    chartingPerspective: session.chartingPerspective,
    loggedByCoach: session.loggedByCoach,
    pitchTypes: p.pitchTypes,
    pitches: pitchesForReport,
    history
  };
}

// ---------- G2 approach (e): recent bullpens, pooled for real ----------
// Pools raw pitches from the pitcher's last 5 BULLPEN sessions charted
// strictly before the game's own date (decision 8: "pens only, never
// games") into one row per pitch type. Deliberately reuses the exact same
// per-pitch predicates sessionStats() already uses for a single pen's own
// strikePct/command% (isStrikeCell, inAccuracyZone, isAccurate) rather than
// inventing a second definition -- this just applies them over pooled raw
// pitches from several sessions at once, which is genuinely a new number
// (there's no existing "5-session" aggregate anywhere to disagree with),
// not a recomputation of any session's OWN already-shown number.
// undefined below the 3-pen minimum (content spec section 10) -- the
// renderer already treats a missing recentPens as "omit the section."
function buildRecentPensForGame(gameDateMs){
  const priorPens = state.sessions
    .filter(s => !s.deletedAt && (s.kind || 'bullpen') === 'bullpen' && s.date < gameDateMs)
    .slice().sort((a, b) => b.date - a.date)
    .slice(0, 5);
  if(priorPens.length < 3) return undefined;

  const pooled = {};
  priorPens.forEach(s => {
    s.pitches.forEach(p => {
      if(!pooled[p.type]) pooled[p.type] = { count: 0, strikes: 0, zoneTotal: 0, zoneHits: 0, exact: 0 };
      const t = pooled[p.type];
      t.count++;
      if(isStrikeCell(p.actualRow, p.actualCol)) t.strikes++;
      if(p.inAccuracyZone === true || p.inAccuracyZone === false){
        t.zoneTotal++;
        if(p.inAccuracyZone) t.zoneHits++;
      }
      if(isAccurate(p)) t.exact++;
    });
  });
  const totalPitches = Object.values(pooled).reduce((sum, t) => sum + t.count, 0);
  if(!totalPitches) return undefined;

  return Object.keys(pooled).map(type => {
    const t = pooled[type];
    // Command % prefers zone-accuracy (U7B) when any pooled pitch of this
    // type has one, same "which mode wins" rule sessionStats already
    // applies per session -- falls back to exact-hit only when NONE of the
    // pooled pitches ever had a zone recorded for this type.
    const commandPct = t.zoneTotal
      ? Math.round((t.zoneHits / t.zoneTotal) * 100)
      : Math.round((t.exact / t.count) * 100);
    return {
      type,
      usagePct: Math.round((t.count / totalPitches) * 100),
      strikePct: Math.round((t.strikes / t.count) * 100),
      commandPct,
      commandLabel: t.zoneTotal ? 'zone' : 'exact'
    };
  });
}

// ---------- G2 approach (f): game trends, calling the one definition ----------
// "Last 6 games including this one, minimum 3" (content spec section 11).
// Per drafting decision 1, the shared numbers (strike %, first-pitch
// strike %, K/BB/H) come from compute_game_summary -- the SAME RPC the
// server calls for this session's own header/tiles -- never recomputed via
// gameStats() here, so a trend point can never quietly disagree with what
// that same game's own History row or report header say. avgVelo/hasVelo
// aren't part of that function's return shape (it has no velocity numbers
// at all), so those two are computed directly from each session's own
// already-loaded raw pitches, same isDefaultVeloReading-filtered average
// every other velocity display in this app uses.
async function buildGameTrendEntries(gameSessions){
  const entries = [];
  for(const s of gameSessions){
    const { data, error } = await supabaseClient.rpc('compute_game_summary', { p_session_id: s.id });
    if(error || !data || data.error) continue; // skip a session RLS/RPC can't resolve rather than fail the whole trend
    const velos = s.pitches.filter(p => !isDefaultVeloReading(p)).map(p => p.velo).filter(v => v !== null && v !== undefined);
    entries.push({
      date: s.date,
      dateLabel: new Date(s.date).toLocaleDateString(undefined, { month: 'numeric', day: 'numeric' }),
      strikePct: data.strike_pct,
      firstPitchStrikePct: data.first_pitch_strike_pct,
      k: data.k, bb: data.bb, h: data.h,
      hasVelo: velos.length > 0,
      avgVelo: velos.length ? Math.round(velos.reduce((a, b) => a + b, 0) / velos.length) : null,
      pitches: data.pitches
    });
  }
  return entries;
}

// The game-session sibling of buildReportPayload above. async (unlike its
// bullpen counterpart) because building gameTrend means RPC calls.
async function buildGameReportPayload(session, p){
  const team = state.teams.find(t => t.id === state.currentTeamId);
  const pitchesForReport = session.pitches.map(pt =>
    isDefaultVeloReading(pt) ? { ...pt, velo: null } : pt
  );

  const priorGames = state.sessions
    .filter(s => s.id !== session.id && !s.deletedAt && (s.kind || 'bullpen') === 'game')
    .slice().sort((a, b) => b.date - a.date)
    .slice(0, 5);
  // Chronological order (oldest first), THIS game last -- matches the
  // packet's own "including this one" framing and how renderGameTrends
  // reads the array (a plain left-to-right line chart).
  const trendSessions = priorGames.slice().reverse().concat([session]);
  const gameTrend = await buildGameTrendEntries(trendSessions);

  return {
    sessionId: session.id,
    pitcherId: p.id,
    pitcherName: p.name,
    uniformNumber: (p.uniformNumber != null) ? p.uniformNumber : (team && team.uniform_number != null ? team.uniform_number : null),
    date: session.date,
    teamName: team ? team.name : null,
    opponent: session.opponent || null,
    chartingPerspective: session.chartingPerspective,
    loggedByCoach: session.loggedByCoach,
    pitchTypes: p.pitchTypes,
    pitches: pitchesForReport,
    recentPens: buildRecentPensForGame(session.date),
    gameTrend
  };
}

async function callSendReportFunction(payload){
  if(typeof SEND_REPORT_URL === 'undefined' || SEND_REPORT_URL.indexOf('YOUR_') === 0){
    throw new Error('not configured');
  }
  const res = await fetch(SEND_REPORT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.session.access_token },
    body: JSON.stringify(payload)
  });
  const body = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(body.error || ('server responded ' + res.status));
  return body;
}

window.sendSessionReport = async function(sessionId){
  const p = currentPitcher();
  const session = state.sessions.find(s => s.id === sessionId);
  if(!session || !p) return;
  const contacts = p.contactEmails || {};
  // R0 item (g), revised after check 8 on staging, extended U4b Phase 2 and
  // its coach-gate follow-up: matches renderHistoryView's own filter -- an
  // ineligible pitcher (unverified email, OR not currently on a team) OR
  // an unverified CALLING COACH blocks the WHOLE send client-side, not
  // just the pitcher's own address. The server-side checks (pitcherId
  // below, gated on is_pitcher_report_eligible, plus the caller's own
  // my_verification_status check) are what actually can't be bypassed;
  // this just keeps normal usage from ever hitting that path.
  const pEligible = currentPitcherVerified(p) && currentPitcherOnTeam(p) && currentCallerVerified();
  const emails = pEligible
    ? [contacts.coach, contacts.pitchingCoach, contacts.pitcher].map(e => (e||'').trim()).filter(Boolean)
    : [];
  if(!emails.length) return;

  state.reportStatus = { sessionId, status: 'sending', message: 'Sending…' };
  render();
  try{
    // G2 approach (g): a game session builds the game-shaped payload
    // (approach e/f's recentPens/gameTrend included); a bullpen keeps
    // using buildReportPayload exactly as before -- untouched, so a
    // bullpen report stays byte-for-byte identical (acceptance 14).
    const payload = (session.kind === 'game') ? await buildGameReportPayload(session, p) : buildReportPayload(session, p);
    const body = await callSendReportFunction(Object.assign({ emails }, payload));
    if(body.reportPath) session.reportPath = body.reportPath;
    state.reportStatus = { sessionId, status: 'sent', message: 'Report sent to ' + emails.length + ' recipient(s).' };
  } catch(err){
    state.reportStatus = { sessionId, status: 'error', message: err.message || 'Could not send — email backend may not be deployed yet. See SETUP.md.' };
  }
  render();
};

// U4b follow-up (Joel, Sept 2026): "View report" shouldn't require sending
// an email first -- generation and sending were always two separate steps
// server-side, just never split at the API level until now. This calls the
// SAME function with an empty emails array (generate/store, skip Resend
// entirely -- see index.ts), then the panel's own re-render turns this
// same control into the real report.html link once session.reportPath is
// set. No popup-blocker games (opening a tab after an await is unreliable
// on iOS Safari) -- one extra click on first view is a fine trade for that.
window.viewSessionReport = async function(sessionId){
  const session = state.sessions.find(s => s.id === sessionId);
  if(!session || session.reportPath) return; // already rendered as a real link -- nothing to do
  const p = currentPitcher();
  if(!p) return;

  state.reportStatus = { sessionId, status: 'sending', message: 'Generating report…' };
  render();
  try{
    const payload = (session.kind === 'game') ? await buildGameReportPayload(session, p) : buildReportPayload(session, p);
    const body = await callSendReportFunction(Object.assign({ emails: [] }, payload));
    if(body.reportPath) session.reportPath = body.reportPath;
    state.reportStatus = null;
  } catch(err){
    state.reportStatus = { sessionId, status: 'error', message: err.message || 'Could not generate report.' };
  }
  render();
};

/* ---------- MAIN RENDER ---------- */
function render(){
  noteHistoryOnScreen();   // U10 (3): History on screen clears this viewer's dot
  const app = document.getElementById('app');
  // G1b-r2b: capture .game-panel-body's CURRENT scroll position synchronously,
  // before it's torn down and replaced by the innerHTML rewrite below --
  // more reliable than a passive 'scroll' listener (attachGamePanelScroll's
  // first attempt), whose event can lag behind a tap that fires a render
  // right after a scroll, losing the position anyway.
  const existingPanelBody = app.querySelector && app.querySelector('.game-panel-body');
  if(existingPanelBody) state.gamePanelScrollTop = existingPanelBody.scrollTop;
  if(!state.loaded){
    renderBoot();
    return;
  }

  if(state.attestNeeded && state.session && !state.attestUnderlay){
    // Joel, Oct 2: the box floats dead-center over the (shaded) app.
    state.attestUnderlay = true;
    try{ render(); } finally { state.attestUnderlay = false; }
    app.insertAdjacentHTML('beforeend', renderAttestScreen());
    return;
  }
  if(state.whoPicker && state.whoPicker.length > 1){
    app.innerHTML = renderWhoPicker();
    return;
  }
  if(state.setupNeeded){
    app.innerHTML = renderAccountSetupScreen();
    return;
  }
  if(state.addPlayerOpen || (state.profile && state.profile.role === 'parent')){
    app.innerHTML = renderAddPlayerScreen();   // S4 B2
    return;
  }

  if(!state.teams.length){
    const msg = isCoach()
      ? `<p>You don't have a team yet — something may have gone wrong during signup.</p>`
      : (state.profile && state.profile.managed_by)
        ? `<p>${escHtml(state.profile.full_name)} isn't on a team yet. Open the coach's team invite link while signed in, then choose ${escHtml(state.profile.full_name)}.</p>`
        : `<p>You haven't joined a team yet. Ask your coach for their team's invite link.</p>`;
    app.innerHTML = `
      <div class="sidebar">
        <div class="brand-block"><div class="brand"><span class="brand-mark"></span><h1 class="display">Knuckleball<span>.</span></h1></div><span class="tagline">Always a Step Ahead</span>${renderOfflinePill()}</div>
        ${renderOutboxBadge()}
        <button class="sign-out-btn" onclick="signOut()">Sign out</button>
      </div>
      <div class="main"><div class="acct-row">${renderAccountButton()}</div><div class="empty-state"><div class="display">No team yet</div>${msg}</div></div>`;
    return;
  }

  const teamOptions = state.teams.map(t => `<option value="${escHtml(t.id)}" ${t.id===state.currentTeamId?'selected':''}>${escHtml(t.name)}</option>`).join('');
  const teamSelector = state.teams.length > 1
    ? `<div class="team-select-wrap"><span class="roster-label">Team</span><select class="team-select" onchange="onTeamChange(this.value)">${teamOptions}</select></div>`
    : `<div class="team-select-wrap"><span class="roster-label">Team</span><div style="font-size:14px;font-weight:600;">${escHtml(state.teams[0].name)}</div></div>`;

  let sidebarBody;
  let phoneFooter = '';   // phones only: the coach's invite link + sign out, rendered below the page content
  if(isCoach()){
    // R6: removing a pitcher is head-only now -- the ✕ itself is gone for
    // an assistant (the server would refuse it anyway; see is_team_head),
    // never just disabled, so there's nothing there to explain.
    const canRemovePitcher = isHeadOfCurrentTeam();
    const rosterItems = state.roster.map((p, i) => `
      <div class="roster-item-wrap">
        <div class="roster-item${p.id===state.currentPitcherId?' active':''}" style="display:flex;">
          ${hasRosterDot(p.id) ? '<span class="roster-dot" aria-label="New session"></span>' : ''}
          <button style="all:unset;flex:1;min-width:0;display:flex;align-items:center;cursor:pointer;" onclick="selectPitcher('${p.id}')">
            <div class="roster-item-main">
              <span class="roster-item-name">${escHtml(p.name)}${p.throws ? `<span class="throws-tag">${p.throws}HP</span>` : ''}</span>
              <span class="roster-item-types">${p.pitchTypes.map(pitchLabel).join(' · ') || 'No pitches set yet'}</span>
              ${p.emailConfirmed ? '' : '<span class="verify-badge roster-verify-badge">Unverified</span>'}${p.guardianPending ? '<span class="verify-badge roster-verify-badge">Guardian pending</span>' : ''}${p.managed ? '<span class="verify-badge roster-verify-badge parent-badge">Parent account</span>' : ''}
            </div>
            <span class="roster-item-num">${p.uniformNumber === null ? '—' : p.uniformNumber}</span>
          </button>
          ${canRemovePitcher ? `<button class="roster-item-remove" title="Remove ${escHtml(p.name)} from this team" onclick="event.stopPropagation();armRemoveRosterPitcher('${p.id}')">✕</button>` : ''}
        </div>
        ${(canRemovePitcher && state.removeArmedPitcherId === p.id) ? `
          <div class="invite-regen-warn" style="padding:0 4px 8px;">Removes ${escHtml(p.name)} from this team's roster and emails them to let them know. Their sessions and stats aren't deleted -- only this team's view of them.</div>
          <div class="invite-regen-confirm-row" style="padding:0 4px 8px;">
            <button class="btn btn-primary" style="background:var(--red-bg);color:var(--chalk);" ${state.removeBusy ? 'disabled' : ''} onclick="confirmRemoveRosterPitcher('${p.id}')">${state.removeBusy ? 'Removing…' : 'Remove now'}</button>
            <button class="btn btn-ghost" ${state.removeBusy ? 'disabled' : ''} onclick="cancelRemoveRosterPitcher()">Cancel</button>
          </div>` : ''}
      </div>`).join('');

    // R6: the pitcher invite link (and the new coach invite link) moved
    // off the main page entirely, into the coach Profile tab's admin
    // section (renderCoachTeamAdmin) -- head-only there too. Nothing
    // replaces this panel here.
    // Collapsing roster: once a pitcher is picked, the list rolls up and the Roster
    // button itself shows who's selected, so a coach always sees who he's charting
    // without the list taking up space. Pure UI state (state.rosterCollapsed) --
    // no network call, and selectPitcher's own behavior is unchanged.
    const canCollapse = rosterCanCollapse();
    const collapsed = canCollapse && state.rosterCollapsed;
    const selectedForLabel = state.roster.find(x => x.id === state.currentPitcherId);
    const dottedCount = state.roster.filter(x => hasRosterDot(x.id)).length;   // U10 (3)
    const rosterLabel = collapsed && selectedForLabel ? `Roster · ${escHtml(selectedForLabel.name)}` : 'Roster';
    sidebarBody = `
      <div class="team-line">${teamSelector}<button class="btn btn-ghost show-phone coach-profile-link" onclick="setView('profile')">Profile</button></div>
      ${canCollapse ? `<button class="roster-toggle-btn" onclick="toggleRosterCollapsed()" aria-expanded="${collapsed ? 'false' : 'true'}">
        <span style="display:flex;align-items:center;min-width:0;"><span class="roster-label" style="margin:0;">${rosterLabel}</span>${collapsed && dottedCount ? `<span class="roster-dot-count" aria-label="${dottedCount} with new sessions">${dottedCount}</span>` : ''}</span>
        <span class="roster-chevron${collapsed ? '' : ' open'}">▾</span>
      </button>` : `<div class="roster-label" style="margin:0;">Roster</div>`}
      <div class="roster-collapse${collapsed ? ' collapsed' : ''}">
        <div class="roster-list">${rosterItems || '<p style="color:var(--ink-faint);font-size:12.5px;">No pitchers on this team yet.</p>'}</div>
      </div>`;
    phoneFooter = `<div class="phone-footer"><button class="sign-out-btn" onclick="signOut()">Sign out</button></div>`;
  } else {
    sidebarBody = `
      ${teamSelector}
      <div class="roster-label">Signed in as</div>
      <div style="font-size:14px;font-weight:600;">${escHtml(state.profile.full_name)}</div>`;
  }

  const sidebar = `
    <div class="sidebar">
      <div class="brand-block">
        <div class="brand"><span class="brand-mark"></span><h1 class="display">Knuckleball<span>.</span></h1></div>
        <span class="tagline">Always a Step Ahead</span>
        <span class="role-badge">${isCoach() ? 'Coach' : 'Pitcher'}</span>
        ${renderOfflinePill()}
        ${renderBackToChooserBrandBtn()}
      </div>
      ${sidebarBody}
      ${renderOutboxBadge()}
      <button class="sign-out-btn${isCoach() ? ' hide-phone' : ''}" onclick="signOut()">Sign out</button>
    </div>`;

  const p = currentPitcher();
  const phoneSession = phoneSessionMode(p);   // G1b-r5
  let main;
  if(phoneSession){
    main = renderSessionHeader(p) + renderSessionView();
  } else if(!p){
    // U9: 'pitcherProfile' with no pitcher selected has its own message
    // ("Select a pitcher to see his profile," not this generic one) --
    // renderPitcherProfileView() already handles p === null itself.
    main = `<div class="acct-row">${renderAccountButton()}</div>` + renderAddSportBanner() + renderTabs() + (state.view === 'profile'
      ? renderProfileView()
      : state.view === 'leaderboard' ? renderLeaderboardView()
      : state.view === 'pitcherProfile' ? renderPitcherProfileView()
      : `<div class="empty-state"><div class="display">No pitcher selected</div><p>Invite a pitcher to this team to get started.</p>${
          isHeadOfCurrentTeam() ? `<button class="btn btn-primary" style="margin-top:12px;" onclick="openCoachWelcome()">Get the invite link</button>`
                                : '<p class="profile-note">Ask your head coach for the pitcher invite link.</p>'}</div>`);
  } else {
    const arsenalChips = p.pitchTypes.map(t => {
      const c = colorForType(p, t);
      return `<span class="pitch-chip" style="background:${c};">${pitchLabel(t)}</span>`;
    }).join('') || `<span style="color:var(--ink-faint);font-size:12.5px;">No pitches set yet</span>`;

    const contacts = p.contactEmails || {};
    const coachFieldValue = contacts.coach || '';
    // R0: "your email" is no longer free-text -- it's always this account's
    // real email, so the report-recipient gate in send-session-report
    // (item g) is checking something a client can't just type around.
    // Read-only here; the ONLY way to change it is the verify banner's
    // Change Email action above, which is the actual account email change.
    const myEmail = state.myVerification.email || '';
    const contactsPanel = (!isCoach() && state.contactsOpen) ? `
      <div class="contacts-panel">
        <div class="field"><span class="field-label">Coach email</span><input class="text-input" id="contact-coach" value="${escHtml(coachFieldValue)}" placeholder="coach@example.com"></div>
        <div class="field"><span class="field-label">Additional contact (optional)</span><input class="text-input" id="contact-pitching-coach" value="${escHtml(contacts.pitchingCoach||'')}" placeholder="e.g. pitching coach"></div>
        <div class="field">
          <span class="field-label">${state.profile && state.profile.managed_by ? 'Parent email (reports go here)' : 'Your email'}</span>

        </div>
      </div>` : '';

    const tabs = renderTabs();

    // R0 item (e): persistent banner, never a blocking modal -- a pitcher

    const verifyBanner = (!isCoach() && !state.myVerification.emailConfirmed) ? `

        <div class="verify-banner-actions">

          <button class="btn btn-ghost" onclick="goToProfileEmail()">Wrong email? Change it in Profile</button>
        </div>
      </div>` : '';

    // U9 acceptance 7: verification wins if both would apply -- a stacked
    // wall of banners is worse than picking one, and an unverified email
    // is the more urgent of the two.
    const setupReminderBanner = verifyBanner ? '' : renderSetupReminderBanner();

    const headerHtml = `
      <div class="pitcher-header">

            ? `<button class="btn btn-ghost hide-phone" onclick="setView('profile')">Profile</button>`

        </div>

    main = `

        : renderHistoryView()}

  }

  // G1: the setup modal overlays whatever view is underneath (see
  // showSetupModal's comment) -- re-check both guards live, since either
  // can change after showSetupModal was first set true (a coach can't

  const setupModalHtml = (state.showSetupModal && (isCoach() ? isHeadOfCurrentTeam() : !state.draftAvailable)) ? renderSetupModal() : '';

  const policyFoot = phoneSession ? '' : `<div class="policy-foot">Knuckleball LLC 2026 &middot; <a href="${policyHref('privacy.html')}">Privacy</a> &middot; <a href="${policyHref('terms.html')}">Terms</a></div>`;   // P1-10
  app.innerHTML = (phoneSession ? '' : sidebar) + `<div class="main${phoneSession ? ' ph-main' : ''}">${main}${policyFoot}</div>` + (phoneSession ? '' : phoneFooter) + setupModalHtml + renderSessionSheet();
  attachPitchStrip();   // G1b-r5: no-op unless the phone pitch strip is on screen
  sizeWideGrid();       // G1b-r6: no-op unless the iPad/laptop session grid is on screen
  attachVeloStrip();
  attachGameVeloSlide();   // G1b-r3: no-op unless the Live Game velocity row is on screen
  attachGamePanelScroll();
}
