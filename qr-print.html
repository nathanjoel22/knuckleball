<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<!-- P2-05: installable app (manifest, icons, iOS home-screen tags); css/standalone.css handles safe areas -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#061A12">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Knuckleball">
<link rel="stylesheet" href="css/standalone.css">
<title>Join codes · Knuckleball</title>
<script src="vendor/supabase.js"></script>
<script src="vendor/qrcodegen.js"></script>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<style>
  /* F1-B (Joel, Oct 31 2026): the printable join codes -- black and white only, one letter page per coach, with the
     Knuckleball wordmark and the coach's name. Signed-in coaches print their own; the facility manager, every code. */
  :root{ color-scheme: light; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#eee; color:#000; font-family:'Archivo', system-ui, sans-serif; }
  .bar{ position:sticky; top:0; display:flex; gap:12px; align-items:center; justify-content:space-between; padding:12px 16px; background:#fff; border-bottom:1px solid #ccc; }
  .bar p{ margin:0; font-size:14px; }
  .bar button{ font:inherit; font-weight:700; padding:10px 18px; border-radius:10px; border:2px solid #000; background:#000; color:#fff; cursor:pointer; }
  .msg{ max-width:560px; margin:40px auto; padding:0 16px; font-size:16px; }
  .sheet{ width:8.5in; min-height:11in; margin:16px auto; background:#fff; padding:0.75in 0.6in; display:flex; flex-direction:column; align-items:center; text-align:center; gap:0.18in; }
  .brand{ font-family:'Black Ops One', sans-serif; font-size:44px; letter-spacing:.04em; margin:0; }
  .tag{ margin:0; font-size:14px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; }
  .rule{ width:100%; border:0; border-top:3px solid #000; margin:0.08in 0; }
  .scan{ margin:0; font-size:22px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
  .coach{ margin:0; font-family:'Black Ops One', sans-serif; font-size:52px; line-height:1.05; }
  .facility{ margin:0; font-size:22px; }
  .qr svg{ width:4.6in; height:4.6in; display:block; }
  .how{ margin:0; font-size:16px; max-width:6in; }
  .url{ margin:0; font-size:12px; word-break:break-all; max-width:6.5in; }
  @page{ size:letter; margin:0; }
  @media print{
    body{ background:#fff; }
    .bar, .msg{ display:none; }
    .sheet{ margin:0; break-after:page; page-break-after:always; }
    .sheet:last-child{ break-after:auto; page-break-after:auto; }
  }
  @media screen and (max-width:8.6in){ .sheet{ width:100%; min-height:0; padding:24px 16px; } .qr svg{ width:min(80vw, 4.6in); height:auto; } .coach{ font-size:40px; } }
</style>
</head>
<body>
  <div class="bar"><p id="bar-text">Loading…</p><button type="button" id="print-btn" onclick="window.print()" disabled>Print</button></div>
  <div id="out"></div>
<script src="supabase-config.js"></script>
<script>
  var params = new URLSearchParams(location.search), one = params.get('g'), side = params.get('side');
  var SPORT = { baseball: 'Baseball', softball: 'Softball' };
  function esc(t){ var d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
  function message(t){ document.getElementById('bar-text').textContent = ''; document.getElementById('out').innerHTML = '<p class="msg">' + esc(t) + '</p>'; }
  (async function(){
    var s = null; try{ s = (await supabaseClient.auth.getSession()).data.session; }catch(e){}
    if(!s){ message('Sign in to Knuckleball on this device first, then print your join codes from the roster.'); return; }
    var r; try{ r = await supabaseClient.rpc('my_group_codes'); }catch(e){ r = { error: e }; }
    if(r.error || !Array.isArray(r.data)){ message("Can't reach Knuckleball. Check your connection and reload this page."); return; }
    var codes = r.data.filter(function(c){ return one ? c.group_id === one : side ? c.team_id === side : true; });
    if(!codes.length){ message('No join codes to print here.'); return; }
    document.getElementById('out').innerHTML = codes.map(function(c){
      var url = new URL('join.html?c=' + encodeURIComponent(c.token), location.href).href;
      var svg = qrcodegen.QrCode.encodeText(url, qrcodegen.QrCode.Ecc.MEDIUM).toSvgString(4);
      return '<section class="sheet">'
        + '<p class="brand">KNUCKLEBALL</p><p class="tag">Always a Step Ahead</p><hr class="rule">'
        + '<p class="scan">Scan to join</p>'
        + '<h1 class="coach">' + esc(c.coach_name) + '</h1>'
        + '<p class="facility">' + esc(c.facility_name) + ' &middot; ' + esc(SPORT[c.sport] || '') + '</p>'
        + '<div class="qr">' + svg + '</div>'
        + '<p class="how">Parents: scan with your phone camera, make your parent account (or sign in), and add your player. Pitchers 18 or older can join themselves.</p>'
        + '<p class="url">' + esc(url) + '</p>'
        + '</section>';
    }).join('');
    document.getElementById('bar-text').textContent = codes.length === 1 ? '1 page, black and white, letter size.' : codes.length + ' pages (one per coach), black and white, letter size.';
    document.getElementById('print-btn').disabled = false;
  })();
</script>
</body>
</html>
