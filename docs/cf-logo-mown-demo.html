<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#F3F5F2;padding:60px}</style></head><body><svg viewBox="0 0 253 253" width="253" height="253" style="transform:rotate(-45deg);display:block;margin:40px auto">
<defs>
  <clipPath id="fair"><rect x="51.8" y="0" width="253" height="201.2"/></clipPath>
  <!-- mower stripes: bands perpendicular to the home→CF line -->
  <pattern id="stripes" patternUnits="userSpaceOnUse" width="24" height="24" patternTransform="rotate(45 51.8 201.2)">
    <rect width="24" height="12" fill="#8CBA5A"/><rect y="12" width="24" height="12" fill="#6FA548"/>
  </pattern>
  <!-- cross-cut stripes for the logo: same two greens, turned 90°, tighter -->
  <pattern id="stripesX" patternUnits="userSpaceOnUse" width="14" height="14" patternTransform="rotate(135 51.8 201.2)">
    <rect width="14" height="7" fill="#8CBA5A"/><rect y="7" width="14" height="7" fill="#6FA548"/>
  </pattern>
  <!-- the mark, design #2, in field units -->
  <path id="kGlyph" d="M0 0H442V1327H0Z M510 1139V494L820 0H1280Z M823 1327L673 1018L935 625L1301 1327Z"/>
  <!-- design #1: home plate (17-inch proportions) with the scorebook K; the mown version cuts the plate as a band and the K inside it -->
  <symbol id="kb-spot" viewBox="0 0 100 100">
    <path fill-rule="evenodd" d="M2 2H98V50L50 98L2 50Z M9 9H91V47L50 88L9 47Z"/>
    <use href="#kGlyph" transform="translate(22 14) scale(0.034)"/>
  </symbol>
  <symbol id="kb-spot-lit" viewBox="0 0 100 100"><circle cx="65" cy="36" r="6"/></symbol>
  <mask id="logoMask"><rect width="253" height="253" fill="#000"/>
    <use href="#kb-spot" x="120.1" y="48.4" width="84.5" height="84.5" fill="#fff" transform="rotate(45 162.4 90.6)"/></mask>
</defs>
<rect width="253" height="253" fill="#548A35"/>
<g clip-path="url(#fair)">
  <rect width="253" height="253" fill="url(#stripes)"/>
  <circle cx="51.8" cy="201.2" r="211.3" fill="none" stroke="#B9D1C4" stroke-width="5"/>
  <!-- the mown logo: cross-cut stripes through the mask, then a soft shadow edge so it reads as cut grass, not paint -->
  <g mask="url(#logoMask)">
    <rect width="253" height="253" fill="url(#stripesX)"/>
    <rect width="253" height="253" fill="rgba(0,0,0,.05)"/>
  </g>
  <use href="#kb-spot" x="120.1" y="48.4" width="84.5" height="84.5" transform="rotate(45 162.4 90.6)" fill="none" stroke="rgba(0,0,0,.10)" stroke-width="1"/>
  <!-- the lit pocket: mown shorter, so a touch lighter -->
  <use href="#kb-spot-lit" x="120.1" y="48.4" width="84.5" height="84.5" transform="rotate(45 162.4 90.6)" fill="rgba(255,255,255,.22)"/>
</g>
<!-- infield for context -->
<circle cx="71" cy="182" r="82" fill="#C9A97C" clip-path="url(#fair)"/>
<rect x="64" y="139" width="49" height="49" fill="#B4C8AC"/>
<line x1="51.8" y1="201.2" x2="253" y2="201.2" stroke="#fff" stroke-width="3"/><line x1="51.8" y1="201.2" x2="51.8" y2="0" stroke="#fff" stroke-width="3"/>
</svg></body></html>
